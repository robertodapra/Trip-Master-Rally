    (cfg.tcfolders||[]).forEach(f=>{
      const n=cfg.tcards.filter(t=>t.folder===f.id).length;
      h+='<div class="tdm-row folderrow"><div class="tdm-name" data-openf="'+esc(f.id)+'">\uD83D\uDCC1 '+esc(f.name||'')+'<small>'+n+' '+t('tcTablesN')+'</small></div>'
        +'<button class="del" data-delf="'+esc(f.id)+'">\uD83D\uDDD1</button></div>';
    });
    const loose=[]; cfg.tcards.forEach((e,i)=>{ if(!e.folder || !folderById(e.folder)) loose.push(tableRow(e,i)); });
    h+=loose.join('');
    if(!(cfg.tcfolders||[]).length && !loose.length){
      h='<div class="tdm-empty">'+t('tcEmptyLib')+'</div>';
    }
    list.innerHTML=h;
  }

  function newFolder(){ askName('', function(name){ if(!Array.isArray(cfg.tcfolders)) cfg.tcfolders=[]; cfg.tcfolders.push({ id:'f'+Date.now(), name:name }); saveCfg(); renderLib(); }, 'askFolderName'); }

  function deleteFolder(id){
    const f=folderById(id); if(!f) return;
    showConfirm(t('tcDelFolder')+' \u201C'+(f.name||'')+'\u201D? '+t('tcDelFolderNote'), function(){
      cfg.tcards.forEach(t=>{ if(t.folder===id) t.folder=null; });
      cfg.tcfolders=cfg.tcfolders.filter(x=>x.id!==id);
      if(curFolder===id) curFolder=null;
      saveCfg(); renderLib();
    });
  }

  function moveTable(i){
    const e=cfg.tcards[i]; if(!e) return;
    const ov=document.createElement('div'); ov.className='tc-emodal';
    let opts='<button class="tc-mvopt" data-f="">'+t('tcMoveLoose')+'</button>';
    (cfg.tcfolders||[]).forEach(f=>{ opts+='<button class="tc-mvopt" data-f="'+esc(f.id)+'">\uD83D\uDCC1 '+esc(f.name||'')+'</button>'; });
    opts+='<button class="tc-mvopt newf" data-f="__new">'+t('tcMoveNew')+'</button>';
    ov.innerHTML='<div class="tc-ebox"><div class="tc-etitle">'+t('tcMove')+' \u201C'+esc(e.name||'')+'\u201D</div><div class="tc-mvlist">'+opts+'</div><div class="tc-ebtns"><button class="tc-ecancel">'+t('tcCancel')+'</button></div></div>';
    document.body.appendChild(ov);
    function close(){ try{ document.body.removeChild(ov); }catch(_){} }
    ov.addEventListener('click', ev=>{ if(ev.target===ov) close(); });
    ov.querySelector('.tc-ecancel').addEventListener('click', close);
    ov.querySelectorAll('.tc-mvopt').forEach(btn=> btn.addEventListener('click', ()=>{
      const f=btn.getAttribute('data-f');
      if(f==='__new'){ close(); askName('', function(name){ if(!Array.isArray(cfg.tcfolders)) cfg.tcfolders=[]; const id='f'+Date.now(); cfg.tcfolders.push({id:id,name:name}); e.folder=id; saveCfg(); renderLib(); }, 'askFolderName'); return; }
      e.folder = f||null; saveCfg(); close(); renderLib();
    }));
  }

  function newCard(){
    askName('', function(name){
      cfg.tcards.push({ name:name, card:{rally:'',section:'',date:'',legs:[]}, vals:{}, alarms:{}, min:5, off:3 });
      saveCfg();
      openCard(cfg.tcards.length-1);
      setTxt(t('tcScanFirst'));
    });
  }

  function openCard(idx){
    const e=cfg.tcards[idx]; if(!e) return;
    curIdx=idx;
    if(!e.card||typeof e.card!=='object') e.card={rally:'',section:'',date:'',legs:[]};
    if(!Array.isArray(e.card.legs)) e.card.legs=[];
    for(const k in manualVals) delete manualVals[k];
    for(const k in alarmOn) delete alarmOn[k];
    Object.assign(manualVals, e.vals||{});
    Object.assign(alarmOn, e.alarms||{});
    tcMin=e.min||5; tcOff=(e.off==null?3:e.off);
    editMode=false;
    lastCard=e.card;
    const nmEl=$('tc_name'); if(nmEl) nmEl.value=e.name||'';
    setTxt('');
    showEditor();
    render(lastCard);
  }

  function deleteCur(){
    if(curIdx==null) return;
    const nm=(cfg.tcards[curIdx]&&cfg.tcards[curIdx].name)||'';
    showConfirm(t('tcDelTable')+' \u201C'+nm+'\u201D?', function(){ cfg.tcards.splice(curIdx,1); saveCfg(); showLib(); });
  }

  function persist(){
    if(curIdx==null) return; const e=cfg.tcards[curIdx]; if(!e) return;
    e.card=lastCard||e.card; e.vals=Object.assign({},manualVals); e.alarms=Object.assign({},alarmOn); e.min=tcMin; e.off=tcOff;
    saveCfg();
  }
  function persistSoon(){ clearTimeout(persistTimer); persistTimer=setTimeout(persist, 350); }

  function sig(L){ return (L.from||'')+'|'+(L.to||'')+'|'+(L.target||'')+'|'+(L.ss||''); }
  function mergeCard(nc){
    if(!lastCard) lastCard={rally:'',section:'',date:'',legs:[]};
    if(!Array.isArray(lastCard.legs)) lastCard.legs=[];
    if(!lastCard.rally && nc.rally) lastCard.rally=nc.rally;
    if(!lastCard.section && nc.section) lastCard.section=nc.section;
    if(!lastCard.date && nc.date) lastCard.date=nc.date;
    const have={}; lastCard.legs.forEach(L=>{ have[sig(L)]=1; });
    let added=0;
    (Array.isArray(nc.legs)?nc.legs:[]).forEach(L=>{ const s=sig(L); if(!have[s]){ lastCard.legs.push(L); have[s]=1; added++; } });
    return added;
  }
  $('tc_file').addEventListener('change', async e=>{ const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return; setTxt('\u23F3 Carico la foto\u2026'); try{ const src=await loadImage(f); await scan(src); }catch(err){ setTxt('\u26A0\uFE0F Foto non leggibile: '+err); } });
  root().querySelectorAll('.tc-mbtn').forEach(b=> b.addEventListener('click', ()=>{ INPUT_MODE=b.dataset.mode; root().querySelectorAll('.tc-mbtn').forEach(x=>x.classList.toggle('on', x.dataset.mode===INPUT_MODE)); if(lastCard) render(lastCard); }));

  async function loadImage(f){ if(window.createImageBitmap){ try{ return await createImageBitmap(f); }catch(e){} } return await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej('decodifica'); im.src=r.result; }; r.onerror=()=>rej('lettura'); r.readAsDataURL(f); }); }
  function toB64(src,max){ const w=src.width,h=src.height,s=Math.min(1,max/Math.max(w,h)); const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w*s)); c.height=Math.max(1,Math.round(h*s)); const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(src,0,0,c.width,c.height); return c.toDataURL('image/jpeg',0.72).split(',')[1]; }

  async function scan(src){
    if(curIdx==null) return;
    setTxt(t('tcReading'));
    try{
      const b64=toB64(src,1800);
      if(window.__scanBusy) window.__scanBusy(true);
      let res; try{ res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','X-App-Key':window.__rallyAuth.key},body:JSON.stringify({image:b64,mode:'timecard',device:window.__rallyAuth.device})}); } finally { if(window.__scanBusy) window.__scanBusy(false); }
      const data=await res.json();
      if(data.error){ setTxt('\u26A0\uFE0F '+data.error); return; }
      if(!data.card){ setTxt(t('tcNoData')); return; }
      const added=mergeCard(data.card);
      persist();
      const tot=(lastCard.legs&&lastCard.legs.length)||0;
      setTxt(t('tcPageRead')+' +'+added+' TC ('+t('tcTot')+' '+tot+').');
      render(lastCard);
    }catch(err){ setTxt(t('tcConnErr')+err); }
  }

  function opts(max){ let o='<option value=""></option>'; for(let x=0;x<=max;x++){ o+='<option value="'+x+'">'+(x<10?'0':'')+x+'</option>'; } return o; }
  const OPT_H=opts(23),OPT_M=opts(59),OPT_S=opts(59),OPT_T=opts(9);
  function optsFor(k){ return k==='h'?OPT_H : k==='t'?OPT_T : k==='s'?OPT_S : OPT_M; }
  function field(role,k){ const max=(k==='t')?1:2; if(INPUT_MODE==='keyboard'){ return '<input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="'+max+'" data-max="'+max+'" data-role="'+role+'" data-part="'+k+'">'; } return '<select data-role="'+role+'" data-part="'+k+'">'+optsFor(k)+'</select>'; }
  function selBox(role,parts){ let h='<span class="boxes">'; parts.forEach((p,idx)=>{ if(idx)h+='<span class="sep"></span>'; h+=field(role,p.k); }); return h+'</span>'; }
  function autoBox(role,n){ let h='<span class="boxes auto">'; for(let i=0;i<n;i++){ if(i)h+='<span class="sep"></span>'; h+='<b data-role="'+role+'" data-part="'+(i===0?'h':'m')+'">--</b>'; } return h+'</span>'; }
  function tgtBox(v,band){ const p=String(v||'').split(':'); return '<span class="boxes tgt" data-tgt="'+band+'"><b>'+esc(p[0]||'--')+'</b><span class="sep"></span><b>'+esc(p[1]||'--')+'</b></span>'; }
  const HM=[{k:'h'},{k:'m'}], HMST=[{k:'h'},{k:'m'},{k:'s'},{k:'t'}], MST=[{k:'m'},{k:'s'},{k:'t'}];
  function cell(lab,inner,sub){ return '<div class="cell"><span class="lab">'+esc(lab)+'</span>'+inner+(sub?'<span class="sub">'+esc(sub)+'</span>':'')+'</div>'; }
  function arrow(){ return '<span class="arrow">\u25B6</span>'; }

  function toggleEdit(){ editMode=!editMode; const o=$('tc_out'); if(o) o.classList.toggle('tcedit', editMode); const b=document.getElementById('tc_editbtn'); if(b) b.classList.toggle('on', editMode); }

  function normTarget(s){
    s=String(s||'').replace(/[^0-9]/g,'');
    if(!s.length) return null;
    let hh,mm;
    if(s.length<=2){ hh=0; mm=parseInt(s,10); }
    else { mm=parseInt(s.slice(-2),10); hh=parseInt(s.slice(0,-2),10); }
    if(isNaN(hh)||isNaN(mm)||mm>59||hh>23) return null;
    return (hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
  }

  function editTarget(band){
    if(!lastCard || !Array.isArray(lastCard.legs)) return;
    const leg=lastCard.legs[band-1]; if(!leg) return;
    const code=(BANDS[band]&&BANDS[band].code)||'';
    const cur=leg.target||'';
    const ov=document.createElement('div'); ov.className='tc-emodal';
    ov.innerHTML='<div class="tc-ebox">'
      +'<div class="tc-etitle">'+t('tcCorrectTitle')+'</div>'
      +'<div class="tc-esub">'+esc(code)+' \u00b7 '+t('tcCorrectRead')+' <b>'+esc(cur||'--:--')+'</b></div>'
      +'<input class="tc-einput" inputmode="numeric" placeholder="hh:mm" value="'+esc(cur)+'">'
      +'<div class="tc-ehint">'+t('tcCorrectHint')+'</div>'
      +'<div class="tc-ebtns"><button class="tc-ecancel">'+t('tcCancel')+'</button><button class="tc-eok">'+t('tcConfirm')+'</button></div>'
      +'</div>';
    document.body.appendChild(ov);
    const inp=ov.querySelector('.tc-einput');
    try{ inp.focus(); inp.select(); }catch(_){}
    function close(){ try{ document.body.removeChild(ov); }catch(_){} }
    ov.addEventListener('click', e=>{ if(e.target===ov) close(); });
    ov.querySelector('.tc-ecancel').addEventListener('click', close);
    ov.querySelector('.tc-eok').addEventListener('click', ()=>{
      const nv=normTarget(inp.value);
      if(nv==null){ inp.style.borderColor='#ff5555'; return; }
      if(nv!==cur){ leg.target=nv; persist(); render(lastCard); }
      close();
    });
  }

  function render(card){
    lastCard=card;
    const legs=Array.isArray(card.legs)?card.legs:[];
    if(!legs.length){
      const mr=$('tc_modeRow'); if(mr) mr.style.display='none';
      const hd=$('tc_head'); if(hd) hd.textContent='';
      const ou=$('tc_out'); if(ou) ou.innerHTML='<div class="tdm-empty">'+t('tcEmptyCard')+'</div>';
      return;
    }
    const mr=$('tc_modeRow'); if(mr) mr.style.display='flex';
    const hd0=$('tc_head'); if(hd0) hd0.innerHTML='Rally: <b>'+esc(card.rally||'?')+'</b> \u00b7 Sezione: <b>'+esc(card.section||'?')+'</b> \u00b7 Data: <b>'+esc(card.date||'?')+'</b>';
    function descOf(code){ const L=legs.find(x=>x.from===code); return (L && !L.ss)?(L.desc||''):''; }
    const controls=[];
    if(legs.length){
      controls.push({code:legs[0].from, kind:'start', title:(descOf(legs[0].from)||'Partenza sezione')});
      legs.forEach(L=>{ controls.push({code:L.to, kind:(L.ss?'ss':'ctrl'), target:L.target, ss:L.ss, km:L.km, title:(L.ss? L.ss : descOf(L.to))}); });
    }
    BANDS=controls;

    let minOpts=''; for(let m=1;m<=30;m++){ minOpts+='<option value="'+m+'"'+(m===tcMin?' selected':'')+'>'+m+'</option>'; }
    let offOpts=''; for(let m=0;m<=20;m++){ offOpts+='<option value="'+m+'"'+(m===tcOff?' selected':'')+'>'+m+'</option>'; }
    let h='<div class="tc-set">'+'<div class="tc-setrow">\uD83D\uDD14 '+t('tcAlarm')+' <select id="tc_minSel">'+minOpts+'</select> '+t('tcMinBefore')+'</div>'+'<div class="tc-setrow">'+t('tcStartSs')+' <select id="tc_offSel">'+offOpts+'</select> '+t('tcMinU')+'</div>'+'</div>'+'<button id="tc_editbtn" class="tc-editbtn'+(editMode?' on':'')+'">'+t('tcEdit')+'</button>';
    h+='<div class="card">';
    controls.forEach((b,i)=>{
      h+='<div class="blk" data-band="'+i+'"><div class="blkhead"><span class="tcc">'+esc(b.code||'\u2014')+'</span>'
        +'<span class="blktitle">'+esc(b.title||b.code||'')+'</span>'
        +(b.km?'<span class="blksub">'+esc(b.km)+'</span>':'')
        +(i>0?'<label class="bell">\uD83D\uDD14<input type="checkbox" class="tc-alarm" data-band="'+i+'"></label>':'')
        +'</div>';
      if(b.kind==='start'){
        h+='<div class="cellrow">'+cell('Due start',selBox('dueStart',HM))+arrow()+cell('Actual start',selBox('actualStart',HM),b.code)+'</div>';
      } else if(b.kind==='ss'){
        h+='<div class="cellrow">'+cell('Finish time',selBox('finish',HMST))+'</div>';
        h+='<div class="cellrow">'+cell('Provisional start',autoBox('provStart',2))+arrow()+cell('Actual start',selBox('ssStart',HM))+'</div>';
        h+='<div class="cellrow">'+cell('Target time',tgtBox(b.target,i))+cell('Due time',autoBox('dueTime',2),b.code)+'</div>';
        h+='<div class="cellrow">'+cell('Time taken',selBox('taken',MST))+cell('Ora timbro',selBox('stamp',HM),b.code)+'</div>';
      } else {
        h+='<div class="cellrow">'+cell('Target time',tgtBox(b.target,i))+cell('Due time',autoBox('dueTime',2),b.code)+cell('Ora timbro',selBox('stamp',HM),b.code)+'</div>';
      }
      h+='</div>';
    });
    h+='</div>';
    const outEl=$('tc_out'); if(outEl){ outEl.innerHTML=h; outEl.classList.toggle('tcedit', editMode); }
    restoreVals();
    recompute();
  }
  function restoreVals(){
    Object.keys(manualVals).forEach(k=>{ const p=k.split('|'); const s=scopeOf(+p[0]); if(!s) return; const el=s.querySelector('[data-role="'+p[1]+'"][data-part="'+p[2]+'"]'); if(el && el.tagName!=='B') el.value=manualVals[k]; });
    Object.keys(alarmOn).forEach(i=>{ const s=scopeOf(+i); if(!s) return; const cb=s.querySelector('.tc-alarm'); if(cb) cb.checked=!!alarmOn[i]; });
  }

  function onChange(e){
    const el=e.target; if(!el) return;
    if(el.id==='tc_name'){ if(curIdx!=null && cfg.tcards[curIdx]){ cfg.tcards[curIdx].name=el.value; persistSoon(); } return; }
    if(el.id==='tc_foldername'){ const f=folderById(curFolder); if(f){ f.name=el.value; if(e.type==='change') saveCfg(); } return; }
    if(el.id==='tc_minSel'){ tcMin=parseInt(el.value)||5; recompute(); persistSoon(); return; }
    if(el.id==='tc_offSel'){ tcOff=parseInt(el.value)||0; recompute(); persistSoon(); return; }
    if(el.classList && el.classList.contains('tc-alarm')){ const i=el.getAttribute('data-band'); alarmOn[i]=el.checked; if(el.checked) ensurePerm(); scheduleSoon(); persistSoon(); return; }
    if(el.tagName==='B') return;
    if(el.dataset && el.dataset.role!=null && el.dataset.part!=null){
      let advance=false;
      if(el.tagName==='INPUT'){ const mx=+(el.dataset.max||2); el.value=el.value.replace(/\D/g,'').slice(0,mx); if(e.type==='input' && el.value.length>=mx) advance=true; }
      const s=el.closest('.blk'); if(s){ manualVals[s.getAttribute('data-band')+'|'+el.dataset.role+'|'+el.dataset.part]=el.value; }
      recompute(); persistSoon();
      if(advance){ const ins=Array.prototype.slice.call($('tc_out').querySelectorAll('input[data-role]')); const i=ins.indexOf(el); if(i>-1 && i<ins.length-1){ ins[i+1].focus(); try{ins[i+1].select();}catch(_){} } }
    }
  }

  function scopeOf(i){ return $('tc_out') && $('tc_out').querySelector('.blk[data-band="'+i+'"]'); }
  function readHM(i,role){ const s=scopeOf(i); if(!s) return null; const h=s.querySelector('[data-role="'+role+'"][data-part="h"]'); const m=s.querySelector('[data-role="'+role+'"][data-part="m"]'); if(!h||!m||h.tagName==='B') return null; const hv=String(h.value==null?'':h.value).trim(), mv=String(m.value==null?'':m.value).trim(); if(hv===''||mv==='') return null; const H=parseInt(hv,10),M=parseInt(mv,10); if(isNaN(H)||isNaN(M)) return null; return H*60+M; }
  function setHM(i,role,mins){ const s=scopeOf(i); if(!s) return; const h=s.querySelector('b[data-role="'+role+'"][data-part="h"]'); const m=s.querySelector('b[data-role="'+role+'"][data-part="m"]'); if(mins==null){ if(h)h.textContent='--'; if(m)m.textContent='--'; return; } mins=((Math.round(mins)%1440)+1440)%1440; const hh=Math.floor(mins/60),mm=mins%60; if(h)h.textContent=(hh<10?'0':'')+hh; if(m)m.textContent=(mm<10?'0':'')+mm; }
  function tmin(v){ if(!v) return NaN; const p=String(v).split(':'); if(p.length<2) return NaN; const h=parseInt(p[0]),m=parseInt(p[1]); if(isNaN(h)||isNaN(m)) return NaN; return h*60+m; }
  function fmt(mins){ mins=((Math.round(mins)%1440)+1440)%1440; const hh=Math.floor(mins/60),mm=mins%60; return (hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm; }

  function recompute(){
    if(!BANDS.length) return;
    const off=tcOff;
    const start=(readHM(0,'actualStart')!=null)?readHM(0,'actualStart'):readHM(0,'dueStart');
    for(const k in tcDue) delete tcDue[k];
    if(start==null){ BANDS.forEach((b,i)=>{ if(i>0){ setHM(i,'dueTime',null); if(b.kind==='ss') setHM(i,'provStart',null); } }); if(curIdx!=null && cfg.tcards[curIdx]) cfg.tcards[curIdx].sched=[]; scheduleSoon(); return; }
    let ideal=start, D=0;
    for(let i=1;i<BANDS.length;i++){
      const b=BANDS[i]; const tg=tmin(b.target); const t=isNaN(tg)?0:tg;
      if(b.kind==='ss'){
        const ssIdeal=ideal+off; setHM(i,'provStart',ssIdeal+D);
        const act=readHM(i,'ssStart'); if(act!=null){ const late=act-(ssIdeal+D); if(late>0) D+=late; }
        ideal=ssIdeal+t; setHM(i,'dueTime',ideal+D); tcDue[i]=ideal+D;
      } else { ideal=ideal+t; setHM(i,'dueTime',ideal+D); tcDue[i]=ideal+D; }
    }
    if(curIdx!=null && cfg.tcards[curIdx]){
      const sc=[]; BANDS.forEach((b,i)=>{ if(i>0 && alarmOn[i] && tcDue[i]!=null) sc.push({band:i, code:b.code, due:tcDue[i]}); });
      cfg.tcards[curIdx].sched=sc;
    }
    scheduleSoon();
  }

  /* ===== SVEGLIA: notifiche locali native (Capacitor) ===== */
  function LN(){ return (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications) || null; }
  async function ensurePerm(){ const ln=LN(); if(!ln) return false; if(permAsked) return true; permAsked=true; try{ await ln.requestPermissions(); return true; }catch(e){ return false; } }
  function scheduleSoon(){ clearTimeout(schedTimer); schedTimer=setTimeout(scheduleOpen, 500); }
  function scheduleOpen(){ if(curIdx==null) return; const e=cfg.tcards[curIdx]; if(!e) return; e.min=tcMin; scheduleEntry(e); }
  async function scheduleEntry(e){
    if(!e) return;
    const ln=LN(); if(!ln) return;
    try{ if(e.sids && e.sids.length){ await ln.cancel({notifications:e.sids.map(id=>({id}))}); } }catch(_){}
    e.sids=[];
    if(!e.notify){ saveCfg(); return; }
    const mins=e.min||5, now=new Date(), notifs=[], base=(e.nid||1)*1000;
    (e.sched||[]).forEach(s=>{
      if(s.due==null) return;
      const fm=s.due-mins; if(fm<0) return;
      const fire=new Date(now); fire.setHours(Math.floor(fm/60), fm%60, 0, 0);
      if(fire.getTime() <= now.getTime()+3000) return;
      const id=base+(+s.band);
      e.sids.push(id);
      notifs.push({ id:id, title:'iRally \u2014 sveglia timbro', body:'Tra '+mins+' min: '+s.code+' \u2014 timbri alle '+fmt(s.due), sound:(cfg.notifSound && cfg.notifSound!=='default') ? cfg.notifSound : 'default', schedule:{ at: fire } });
    });
    if(notifs.length){ try{ await ln.schedule({notifications:notifs}); }catch(_){} }
    saveCfg();
  }
})();
</script>

<script>
/* ===== X di chiusura su tutte le schermate + scorrimento da sinistra ===== */
(function(){
  var MAP={intro:'closeIntro',pilotMenu:'closePilot',navMenu:'closeNav',genMenu:'closeGen'};
  function closeOverlay(ov){
    var id=ov.id;
    if(MAP[id]){ var b=document.getElementById(MAP[id]); if(b){ b.click(); return; } }
    var inner=ov.querySelector('[data-act="close"],#tc_close,#pw_close,#calcClose');
    if(inner){ inner.click(); return; }
    ov.classList.remove('open');
  }
  Object.keys(MAP).concat(['tdmMenu']).forEach(function(id){
    var ov=document.getElementById(id); if(!ov) return;
    var x=document.createElement('button');
    x.className='ov-x'; x.type='button'; x.setAttribute('aria-label','Close'); x.innerHTML='&#10005;';
    x.addEventListener('click',function(){ closeOverlay(ov); });
    ov.appendChild(x);
  });
  /* scorri dal bordo sinistro verso destra per tornare indietro */
  var sx=0, sy=0, on=false;
  document.addEventListener('touchstart',function(e){
    var t=e.touches[0]; on=(t.clientX<=26); sx=t.clientX; sy=t.clientY;
  },{passive:true});
  document.addEventListener('touchend',function(e){
    if(!on) return; on=false;
    var t=e.changedTouches[0];
    if(t.clientX-sx<70 || Math.abs(t.clientY-sy)>60) return;
    var ids=['tcMenu','paywall','tdmMenu','calcMenu','genMenu','navMenu','pilotMenu','intro'];
    for(var i=0;i<ids.length;i++){
      var ov=document.getElementById(ids[i]);
      if(ov && ov.classList.contains('open')){ closeOverlay(ov); return; }
    }
    var d=document.getElementById('drawer');
    if(d && d.classList.contains('open')){ var bg=document.getElementById('drawerBg'); if(bg) bg.click(); }
  },{passive:true});
})();
</script>
</body>
</html>
