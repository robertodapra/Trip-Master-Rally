<title>iRally</title>
<style>
  :root{
    --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
    --bg:#000;
    --panel:#111417;
    --line:#2a2f36;
    --amber:#ffb400;
    --amber-dim:#8a6200;
    --green:#39d353;
    --blue:#3b9dff;
    --red:#ff4d4d;
    --text:#f2f4f7;
    --muted:#8b949e;
    --btnbg:rgba(255,255,255,.06);
    --inputbg:#1a1f25;
  }
  body[data-theme="light"]{
    --bg:#f4f5f7;
    --panel:#ffffff;
    --line:#c9ced6;
    --amber:#b36b00;
    --amber-dim:#d8b26e;
    --green:#178c3b;
    --blue:#0b6bd6;
    --red:#d62828;
    --text:#14171c;
    --muted:#5c6670;
    --btnbg:rgba(0,0,0,.05);
    --inputbg:#eef0f3;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{--numscale:1}
  body[data-numsize="0"]{--numscale:.78}
  body[data-numsize="1"]{--numscale:1}
  body[data-numsize="2"]{--numscale:1.3}
  body[data-numfont="share"]{--mono:'Share Tech Mono',ui-monospace,Menlo,Consolas,monospace}
  body[data-numfont="orbitron"]{--mono:'Orbitron',ui-monospace,Menlo,Consolas,monospace}
  body[data-numfont="system"]{--mono:ui-monospace,Menlo,Consolas,monospace}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,sans-serif;
    overflow:hidden;
    user-select:none;-webkit-user-select:none;
  }

  #statusbar{
    position:fixed;top:0;left:0;right:0;z-index:6;
    display:flex;justify-content:space-between;align-items:center;
    padding:4px 12px;min-height:38px;font-size:12px;color:var(--muted);
    padding-top:calc(env(safe-area-inset-top) + 4px);
  }
  /* in orizzontale i tasti in alto non finiscono sotto la tacca o negli angoli arrotondati */
  @media (orientation:landscape){ #statusbar{padding-left:max(12px, env(safe-area-inset-left));padding-right:max(12px, env(safe-area-inset-right))} }
  #clock{
    font-family:var(--mono);
    font-size:18px;font-weight:700;color:var(--text);
    font-variant-numeric:tabular-nums;letter-spacing:.05em;
  }
  #gpsdot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--red);vertical-align:middle}
  #gpsdot.g{background:var(--green)}
  #gpsdot.b{background:var(--blue)}
  #gpsdot.r{background:var(--red)}
  #btnInfo{
    background:var(--btnbg);border:1px solid var(--line);color:var(--muted);
    border-radius:50%;width:22px;height:22px;font-size:12px;margin-left:8px;vertical-align:middle;
  }
  #btnMenu{background:var(--btnbg);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:7px 14px;font-size:18px}
  /* 23 nov 2026: dal Radar all'elenco delle prove con un tocco */
  #btnRadBack{display:none;background:var(--btnbg);border:1px solid var(--line);color:var(--text);border-radius:8px;width:38px;height:32px;font-size:26px;line-height:1;padding:0 0 4px;margin-right:10px;vertical-align:middle}
  body[data-mode="radar"] #btnRadBack{display:inline-block}
  #btnRadarGuide{
    display:none;
    background:var(--btnbg);border:1px solid var(--line);color:var(--muted);
    border-radius:50%;width:30px;height:30px;font-size:14px;font-weight:700;margin-right:8px;
  }
  body[data-mode="radar"] #btnRadarGuide{display:inline-block}
  #btnArr{
    display:none;
    background:var(--btnbg);border:1px solid var(--line);color:var(--muted);
    border-radius:6px;padding:4px 10px;font-size:16px;margin-right:8px;
  }
  @media (orientation:landscape){
    body[data-mode="radar"] #btnArr{display:inline-block}
  }

  #legend{
    position:fixed;top:56px;left:10px;z-index:9;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px 16px;font-size:13px;display:none;max-width:280px;line-height:1.6;
  }
  #legend.open{display:block}
  #legend b{display:block;margin-bottom:4px;color:var(--text)}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}

  /* ====== LAYOUT PILOTA ====== */
  #app{
    display:grid;
    height:100dvh;
    padding-top:calc(42px + env(safe-area-inset-top));
    padding-bottom:calc(env(safe-area-inset-bottom) + 2px);
    grid-template-columns:1.2fr 1fr;
    grid-template-rows:1fr 1fr;
    grid-template-areas:
      "word total"
      "word partial";
  }
  @media (orientation:portrait){
    #app{
      grid-template-columns:1fr;
      grid-template-rows:1fr 1fr 2fr;
      grid-template-areas:
        "total"
        "partial"
        "word";
    }
  }
  #zoneSpeed{display:none}
  #zoneRadar{display:none}

  /* ====== PILOTA: due modi, uno alla volta ======
     parole      -> Totale + Parola (il parziale in metri e' superfluo)
     metri reali -> Totale + Parziale (niente parole) */
  body[data-mode="pilot"]:not([data-pilotreal="1"]) #zonePartial{display:none}
  body[data-mode="pilot"]:not([data-pilotreal="1"]) #app{
    grid-template-columns:1.2fr 1fr;
    grid-template-rows:1fr;
    grid-template-areas:"word total";
  }
  body[data-mode="pilot"][data-pilotreal="1"] #zoneWord{display:none}
  body[data-mode="pilot"][data-pilotreal="1"] #app{
    grid-template-columns:1fr 1.2fr;
    grid-template-rows:1fr;
    grid-template-areas:"total partial";
  }
  @media (orientation:portrait){
    body[data-mode="pilot"]:not([data-pilotreal="1"]) #app{
      grid-template-columns:1fr;
      grid-template-rows:1fr 2fr;
      grid-template-areas:"total" "word";
    }
    body[data-mode="pilot"][data-pilotreal="1"] #app{
      grid-template-columns:1fr;
      grid-template-rows:1fr 2fr;
      grid-template-areas:"total" "partial";
    }
  }
  #prevPartial{font-size:15px;color:var(--muted);margin-bottom:4px;letter-spacing:.02em}
  #prevPartial .pw-lbl{opacity:.7}
  #prevPartialVal{color:var(--text);font-weight:700}

  /* ====== LAYOUT NAVIGATORE / TRIP ====== */
  body[data-mode="nav"] #app{
    grid-template-columns:1.3fr 1fr;
    grid-template-rows:auto 1fr 1fr;
    grid-template-areas:
      "freebar freebar"
      "partial total"
      "partial speed";
  }
  @media (orientation:portrait){
    body[data-mode="nav"] #app{
      grid-template-columns:1fr;
      grid-template-rows:auto 1.7fr 1fr 0.8fr;
      grid-template-areas:
        "freebar"
        "partial"
        "total"
        "speed";
    }
  }
  body[data-mode="nav"] #zoneWord{display:none}
  body[data-mode="nav"] #zoneSpeed{display:flex}
  body[data-mode="nav"] #zonePartial{cursor:pointer}
  body[data-mode="nav"] #partialVal{
    font-size:calc(clamp(76px,17vw,200px) * var(--numscale));
    color:var(--text);
  }
  body[data-mode="nav"] #totalVal{
    font-size:calc(clamp(48px,11vw,120px) * var(--numscale));
  }

  /* ====== LAYOUT RADAR ====== */
  body[data-mode="radar"] #app{
    grid-template-columns:1fr 1fr;
    grid-template-rows:minmax(0,1fr) auto minmax(0,1fr);
    grid-template-areas:
      "radar radar"
      "badge badge"
      "partial total";
  }
  @media (orientation:portrait){
    body[data-mode="radar"] #app{
      grid-template-columns:1fr;
      grid-template-rows:minmax(0,1.3fr) auto minmax(0,0.65fr) minmax(0,0.65fr);
      grid-template-areas:
        "radar"
        "badge"
        "partial"
        "total";
    }
  }
  body[data-mode="radar"] #zoneWord{display:none}
  body[data-mode="radar"] #zoneRadar{display:flex}
  body[data-mode="radar"] #zonePartial{cursor:pointer}
  body[data-mode="radar"] #partialVal,
  body[data-mode="radar"] #totalVal{
    font-size:calc(clamp(40px,10vw,92px) * var(--numscale));
  }
  body[data-mode="radar"] #partialVal{color:var(--text)}

  /* disposizioni alternative in orizzontale */
  @media (orientation:landscape){
    body[data-mode="radar"][data-arr="left"] #app{
      grid-template-columns:1.5fr 1fr;
      grid-template-rows:auto minmax(0,1fr) minmax(0,1fr);
      grid-template-areas:
        "radar badge"
        "radar partial"
        "radar total";
    }
    body[data-mode="radar"][data-arr="right"] #app{
      grid-template-columns:1fr 1.5fr;
      grid-template-rows:auto minmax(0,1fr) minmax(0,1fr);
      grid-template-areas:
        "badge radar"
        "partial radar"
        "total radar";
    }
    body[data-mode="radar"][data-arr="left"] #zoneRadar,
    body[data-mode="radar"][data-arr="right"] #zoneRadar{
      flex-direction:column;flex-wrap:nowrap;gap:8px;
    }
    /* nelle disposizioni laterali dimensiona sull'altezza per non tagliare nulla */
    body[data-mode="radar"][data-arr="left"] #radSym,
    body[data-mode="radar"][data-arr="right"] #radSym{
      font-size:clamp(40px,18vh,96px);
    }
    body[data-mode="radar"][data-arr="left"] #radNote,
    body[data-mode="radar"][data-arr="right"] #radNote{
      font-size:clamp(14px,4.6vh,26px);
      max-height:3.2em;
    }
    body[data-mode="radar"][data-arr="left"] #radDist,
    body[data-mode="radar"][data-arr="right"] #radDist{
      font-size:calc(clamp(34px,12vh,78px) * var(--numscale));
    }
  }

  body[data-mode="nav"] .zlabel,
  body[data-mode="radar"] .zlabel{
    left:12px;right:auto;top:10px;
    background:var(--btnbg);
    border:1px solid var(--line);
    border-radius:8px;
    padding:5px 10px;
    font-size:11px;
    color:var(--text);
  }
  /* ====== RADAR, FOTO GRANDE (solo ORIZZONTALE) — 24 set 2026 ======
     Sul modello del GPS di gara Be Traced:
       [ nome prova + ◀ metri al prossimo ▶ ] [ PARZIALE ]
       [                                    ] [ TOTALE   ]
       [      foto del riferimento a tutta larghezza      ]
     In VERTICALE non cambia nulla.
     REGOLA D'ORO di questa griglia: OGNI figlio visibile di #app (e di #zoneRadar,
     che qui diventa trasparente con display:contents) deve avere un'area che
     ESISTE in grid-template-areas. Se un elemento punta a un'area inesistente,
     il browser crea da solo righe e colonne in piu' (e' cosi' che nasceva il
     terzo vuoto a destra: #ssBadge puntava all'area "badge"). */
  #radStage{display:none}
  @media (orientation:landscape){
    body[data-mode="radar"][data-bigphoto="1"] #app#app{
      grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) !important;
      grid-template-rows:minmax(0,1fr) minmax(0,1fr) minmax(0,3.3fr) !important;
      grid-template-areas:"left partial" "left total" "photo photo" !important;
      gap:6px !important;
      padding-left:max(8px, env(safe-area-inset-left)) !important;
      padding-right:max(8px, env(safe-area-inset-right)) !important;
    }
    /* tutto cio' che non fa parte del layout esce dalla griglia */
    body[data-mode="radar"][data-bigphoto="1"] #ssBadge,
    body[data-mode="radar"][data-bigphoto="1"] #radNum,
    body[data-mode="radar"][data-bigphoto="1"] #radSym,
    body[data-mode="radar"][data-bigphoto="1"] #radNote{display:none !important}
    /* la zona radar si "apre": i suoi pezzi si piazzano direttamente nella griglia */
    body[data-mode="radar"][data-bigphoto="1"] #zoneRadar,
    body[data-mode="radar"][data-bigphoto="1"] #zoneRadar #radHead{display:contents !important}

    /* BLOCCO SINISTRO: nome in alto, frecce ai lati, metri al centro.
       Stanno tutti nella stessa area "left", allineati in punti diversi. */
    body[data-mode="radar"][data-bigphoto="1"] #radStage{
      display:block !important; grid-area:left !important;
      align-self:start; justify-self:stretch; min-width:0;
      margin:4px 6px 0; text-align:center;
      font-size:clamp(11px, 3.4vh, 15px); font-weight:700; letter-spacing:.04em;
      color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    body[data-mode="radar"][data-bigphoto="1"] #radPrev{
      grid-area:left !important; align-self:center; justify-self:start; margin:14px 0 0 4px;
    }
    body[data-mode="radar"][data-bigphoto="1"] #radNext{
      grid-area:left !important; align-self:center; justify-self:end; margin:14px 4px 0 0;
    }
    body[data-mode="radar"][data-bigphoto="1"] #radDist{
      display:block !important; grid-area:left !important;
      align-self:center; justify-self:center; margin-top:14px;
      font-size:clamp(34px, 14vh, 64px); line-height:1; font-weight:800;
      max-width:calc(100% - 120px); white-space:nowrap; overflow:hidden;
    }

    /* BLOCCO DESTRO: parziale sopra, totale sotto */
    body[data-mode="radar"][data-bigphoto="1"] #zonePartial{grid-area:partial !important}
    body[data-mode="radar"][data-bigphoto="1"] #zoneTotal{grid-area:total !important}
    body[data-mode="radar"][data-bigphoto="1"] #zonePartial,
    body[data-mode="radar"][data-bigphoto="1"] #zoneTotal{
      display:flex !important; flex-direction:row; align-items:center; justify-content:space-between;
      gap:10px; padding:0 14px; min-width:0; min-height:0; overflow:hidden;
    }
    body[data-mode="radar"][data-bigphoto="1"] #partialVal,
    body[data-mode="radar"][data-bigphoto="1"] #totalVal{font-size:clamp(26px, 10.5vh, 50px) !important; line-height:1}
    body[data-mode="radar"][data-bigphoto="1"] .zone .zlabel{
      position:static !important; top:auto; left:auto; right:auto;
      font-size:11px; white-space:nowrap; flex:0 0 auto;
    }
    body[data-mode="radar"][data-bigphoto="1"] .unit{display:none}

    /* FOTO: tutta la riga bassa, proporzioni intatte, niente fondo bianco stirato */
    body[data-mode="radar"][data-bigphoto="1"] #radImg{
      grid-area:photo !important; justify-self:stretch; align-self:stretch;
      width:100% !important; height:100% !important; min-width:0; min-height:0;
      max-width:none !important; max-height:none !important;
      object-fit:contain !important; background:transparent !important; border-radius:0 !important;
    }
  }
  #ssBadge{
    grid-area:badge;
    display:none;
    justify-self:end;
    margin:2px 14px 0;
    background:var(--green);color:#000;
    border-radius:8px;padding:5px 12px;
    font-size:12px;font-weight:800;letter-spacing:.03em;
    max-width:80%;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  body[data-mode="radar"] #ssBadge.show{display:block}

  .zone{
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    padding:26px 8px 10px;
    border:1px solid var(--line);
    border-radius:18px;
    margin:8px;
    background:var(--panel);
    position:relative;
    overflow:hidden;
  }
  .zlabel{
    position:absolute;top:10px;left:14px;right:14px;
    font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
  }
  .unit{font-size:14px;color:var(--muted);margin-top:2px;letter-spacing:.1em}

  /* ===== Guida interattiva Radar ===== */
  #radarTut{position:fixed;inset:0;z-index:900;display:none}
  #radarTut.show{display:block}
  #radarTutHi{
    position:fixed;border-radius:14px;
    box-shadow:0 0 0 9999px rgba(0,0,0,.78);
    border:2px solid var(--blue);
    transition:left .25s ease,top .25s ease,width .25s ease,height .25s ease;
    pointer-events:none;
  }
  #radarTutBubble{
    position:fixed;left:16px;right:16px;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.5);
    transition:top .25s ease,bottom .25s ease;
  }
  #radarTutStepNum{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
  #radarTutTitle{font-size:16px;font-weight:800;color:var(--text);margin-bottom:6px}
  #radarTutText{font-size:14px;color:var(--muted);line-height:1.4}
  #radarTutRow{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
  #radarTutSkip{background:none;border:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:6px 2px}
  #radarTutNext{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:9px 20px;font-size:14px;font-weight:700}
  #radarTutDontShow{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--muted)}
  #radarTutDontShow input{width:16px;height:16px}

  /* ===== Importa Radar da PDF ===== */
  .pdfGroupCard{
    display:flex;gap:12px;align-items:flex-start;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px;margin-bottom:10px;
  }
  .pdfGroupCard.excluded{opacity:.45}
  .pdfGroupThumb{
    width:64px;height:64px;flex-shrink:0;border-radius:8px;object-fit:cover;
    background:var(--inputbg);border:1px solid var(--line);
  }
  .pdfGroupBody{flex:1;min-width:0}
  .pdfGroupName{
    width:100%;background:var(--inputbg);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:8px 10px;font-size:14px;font-weight:700;margin-bottom:6px;
  }
  .pdfGroupMeta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
  .pdfGroupCk{width:20px;height:20px;flex-shrink:0;margin-top:2px}
  .pdfManualForm{
    background:var(--panel);border:1px dashed var(--line);border-radius:12px;
    padding:12px;margin-bottom:10px;
  }
  .pdfManualForm input[type="text"], .pdfManualForm input[type="number"]{
    background:var(--inputbg);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:8px 10px;font-size:14px;margin-bottom:8px;width:100%;
  }
  .pdfManualRow{display:flex;gap:8px}
  .pdfManualRow input{flex:1}
  .pdfGroupAct{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .pdfGroupEdit{background:var(--btnbg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700}
  .pdfEditForm{background:var(--panel);border:1.5px solid var(--blue);border-radius:12px;padding:12px;margin-bottom:10px}
  .pdfEditForm input[type="text"], .pdfEditForm input[type="number"]{
    background:var(--inputbg);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:8px 10px;font-size:14px;margin-bottom:8px;width:100%;
  }
  .pdfEditBtns{display:flex;gap:8px}
  .pdfEditBtns button{flex:1;padding:10px 6px;border-radius:8px;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--btnbg);color:var(--text)}
  .pdfEditBtns .pdfEdSave{background:var(--blue);border-color:var(--blue);color:#fff}
  .pdfEditBtns .pdfEdDel{color:var(--red);border-color:var(--red)}
  #pdfImpBar{
    position:fixed;left:0;right:0;bottom:0;z-index:14;
    padding:12px 18px calc(12px + env(safe-area-inset-bottom));
    background:var(--bg);border-top:1px solid var(--line);
  }
  #pdfImpConfirm{
    width:100%;padding:16px;border-radius:12px;font-size:17px;font-weight:800;
    background:var(--green);color:#000;border:none;
  }
  #pdfImpConfirm:disabled{opacity:.4}
  .pdfGroupTag{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--btnbg);border:1px solid var(--line);color:var(--muted);margin-left:6px}

  #zoneTotal{grid-area:total;cursor:pointer}
  #holdBar,#holdBarP{
    position:absolute;left:0;bottom:0;height:6px;width:0;
    background:var(--red);border-radius:0 3px 3px 0;
  }
  #holdBarP{background:var(--blue)}
  #toast{
    position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(16px);
    background:var(--green);color:#000;
    border-radius:999px;padding:8px 18px;
    font-size:14px;font-weight:800;z-index:8;
    opacity:0;pointer-events:none;
    transition:opacity .25s, transform .25s;
    max-width:86vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #totalVal{
    font-family:var(--mono);
    font-size:calc(clamp(40px,9vw,92px) * var(--numscale));font-weight:700;
    font-variant-numeric:tabular-nums;line-height:1;
  }

  #zonePartial{grid-area:partial}
  #partialVal{
    font-family:var(--mono);
    font-size:calc(clamp(44px,10vw,100px) * var(--numscale));font-weight:800;
    font-variant-numeric:tabular-nums;line-height:1;
    color:var(--amber);
  }
  #zonePartial.stopped #partialVal{color:var(--amber-dim)}
  body[data-mode="nav"] #zonePartial.stopped #partialVal,
  body[data-mode="radar"] #zonePartial.stopped #partialVal{color:var(--text)}

  #zoneSpeed{grid-area:speed}
  #speedVal{
    font-family:var(--mono);
    font-size:calc(clamp(48px,11vw,120px) * var(--numscale));font-weight:800;
    font-variant-numeric:tabular-nums;line-height:1;
    color:var(--blue);
  }

  /* zona radar: riga orizzontale, solo testo, senza bordo né pannello */
  #zoneRadar{
    grid-area:radar;
    flex-direction:row;flex-wrap:wrap;
    justify-content:center;align-items:center;
    gap:6px 16px;
    border:none;background:none;
    text-align:center;padding:0 14px;
  }
  #radNum{
    display:inline-block;
    background:var(--green);color:#000;
    border-radius:8px;padding:2px 12px;
    font-size:clamp(16px,4vw,26px);font-weight:800;
    font-family:var(--mono);
    flex-shrink:0;
  }
  #radSym{
    font-size:clamp(54px,13vw,120px);line-height:1;
    flex-shrink:0;
  }
  #radNote{
    color:var(--text);
    font-size:clamp(20px,5vw,40px);font-weight:800;
    text-transform:uppercase;word-break:break-word;
    max-width:100%;
  }
  #radDist{
    font-family:var(--mono);
    font-size:calc(clamp(48px,12vw,100px) * var(--numscale));font-weight:800;color:var(--green);
    font-variant-numeric:tabular-nums;
    flex-shrink:0;
  }
  #radDist.near{color:var(--red)}
  #radHead{display:flex;align-items:center;gap:10px;flex-shrink:0}
  #radHead button{
    background:var(--btnbg);border:1px solid var(--line);color:var(--text);
    border-radius:10px;width:46px;height:46px;font-size:20px;line-height:1;
  }
  #radHead button:active{background:var(--amber);color:#000}
  #radImg{
    display:none;max-width:100%;max-height:100%;height:auto;
    object-fit:contain;border-radius:10px;background:#fff;
  }
  @media (orientation:portrait){
    body[data-mode="radar"] #radImg{max-height:34vh}
  }
  @media (orientation:landscape){
    body[data-mode="radar"][data-arr="top"] #radImg{max-height:34vh}
    body[data-mode="radar"][data-arr="left"] #radImg,
    body[data-mode="radar"][data-arr="right"] #radImg{max-height:54vh}
  }
  #scanCv{width:100%;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--panel)}
  .scanrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;font-size:14px}
  .scanrow input[type=range]{flex:1;max-width:55%}
  .scanrow input[type=number]{width:84px;padding:8px;background:var(--inputbg);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:16px}
  #scanPick,#openScan{
    width:100%;padding:13px;border-radius:10px;font-size:15px;font-weight:700;
    background:var(--btnbg);border:2px solid var(--green);color:var(--green);margin-bottom:10px;
  }
  #scanMsg{font-size:13px;color:var(--green);min-height:18px;margin-bottom:6px}
  .rb-thumb{width:100%;border-radius:6px;border:1px solid var(--line);display:block;background:#fff}
  .rb-imgdel{background:none;border:none;color:var(--red);font-size:11px;padding:4px 0;width:100%}

  #zoneWord{grid-area:word;cursor:pointer}
  #prevWord{font-size:15px;color:var(--muted);margin-bottom:4px;letter-spacing:.02em}
  #prevWord .pw-lbl{opacity:.7}
  #prevWordVal{color:var(--text);font-weight:700}
  #wordVal{
    font-size:calc(clamp(64px,15vw,170px) * var(--numscale));
    font-weight:900;line-height:1;
    text-align:center;
    color:var(--green);
    text-transform:uppercase;
    word-break:break-word;
    padding:0 10px;
  }
  #wordVal.numeric{
    font-family:var(--mono);
    color:var(--amber);
    font-variant-numeric:tabular-nums;
  }
  #zoneWord.stopped #wordVal.numeric{color:var(--amber-dim)}
  #wordState{
    position:absolute;bottom:12px;
    font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
  }
  #wordState.run{color:var(--green)}

  /* ====== DRAWER ====== */
  #drawerBg{
    position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:11;
    display:none;
  }
  #drawerBg.open{display:block}
  #drawer{
    position:fixed;top:0;right:0;bottom:0;width:min(300px,85vw);z-index:12;
    background:var(--panel);border-left:1px solid var(--line);
    transform:translateX(105%);transition:transform .25s ease;
    display:flex;flex-direction:column;padding:22px 20px;
    padding-top:max(22px, env(safe-area-inset-top));
    overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  #drawer.open{transform:translateX(0)}
  #drawer h2{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600}
  .drawer-item{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:none;border:none;border-bottom:1px solid var(--line);
    color:var(--text);
    padding:17px 2px;font-size:16px;font-weight:600;letter-spacing:.02em;
    text-align:left;width:100%;
  }
  .drawer-item .di-tag{
    font-size:10px;letter-spacing:.14em;text-transform:uppercase;

<script>
(function(){
'use strict';
/* --- chiave app + ID dispositivo per il worker (tetto per utente) --- */
window.__rallyAuth = (function(){
  var d; try{ d = localStorage.getItem('rally_device'); }catch(e){}
  if(!d){ d = 'dev-' + Date.now().toString(36) + Math.random().toString(36).slice(2,10); try{ localStorage.setItem('rally_device', d); }catch(e){} }
  return { key: 'iRallyK3y9Xq7SdP2vLm2026', device: d };
})();
/* --- iRally Pro: stato abbonamento + paywall --- */
window.__rcPro = false; // verra' impostato da RevenueCat (entitlement "pro") dopo l'integrazione
window.__rallyPro = { isPro: function(){ return window.__rcPro===true; } };
window.__rallyShowPaywall = function(){ rcBusy=false; var p=document.getElementById('paywall'); if(p) p.classList.add('open');
  /* 23 nov 2026: se all'avvio non c'era rete i prezzi non sono arrivati: si richiedono adesso */
  try{ if(rcReady && (!rcPkgs.year || !rcPkgs.month)){ var P = rcPlugin(); if(P) rcLoadOfferings(P).catch(function(){}); } }catch(e){}
};
/* --- RevenueCat: acquisti veri (attivi dentro l'app iOS; sul web restano i messaggi) --- */
var RC_KEY = 'appl_qWGygZKkYncucSMVrHIzItFkWUQ';
var rcPkgs = { year:null, month:null };
var rcReady=false; var rcBusy = false;
function rcSay(t,ti){ if(typeof showMsg==='function') showMsg(t,ti); }
function rcPlugin(){ try{ return (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Purchases) || null; }catch(e){ return null; } }
function rcInfoOf(r){ return r && (r.customerInfo || r.purchaserInfo || r); }
function rcHasPro(info){ try{ return !!(info && info.entitlements && info.entitlements.active && info.entitlements.active['pro']); }catch(e){ return false; } }
function rcApply(info){
  var was = window.__rcPro;
  window.__rcPro = rcHasPro(info);
  if(window.__rcPro && !was){ var p=document.getElementById('paywall'); if(p) p.classList.remove('open'); }
  try{ if(typeof updateNavFree==='function') updateNavFree(); }catch(e){}
}
function rcShowUserId(){
  try{
    var v=document.getElementById('supCodeVal');
    var id = window.__rcUserId || (window.__rallyAuth && window.__rallyAuth.device) || '';
    if(v && id) v.textContent = id;
    var row=document.getElementById('supCode');
    if(row && !row.__wired){ row.__wired=true; row.addEventListener('click', function(){
      var t=(document.getElementById('supCodeVal')||{}).textContent||'';
      if(!t || t==='\u2014') return;
      try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t); rcSay('ID assistenza copiato.', 'Info'); return; } }catch(e){}
      try{
        var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta); rcSay('ID assistenza copiato.', 'Info');
      }catch(e){}
    }); }
  }catch(e){}
}
try{ document.addEventListener('DOMContentLoaded', rcShowUserId); }catch(e){}
function rcIsCancel(e){
  if(!e) return false;
  if(e.userCancelled===true) return true;
  var c=String(e.code||'');
  if(c==='1'||c==='PURCHASE_CANCELLED') return true;
  return /cancel/i.test(String(e.message||''));
}
function rcPickPkg(off, type, idPart){
  if(!off || !off.availablePackages) return null;
  var a=off.availablePackages, i, pk, prod;
  for(i=0;i<a.length;i++){ pk=a[i]; if(String(pk.packageType||'').toUpperCase()===type) return pk; }
  for(i=0;i<a.length;i++){ pk=a[i]; prod=pk.product||pk.storeProduct||{}; if(String(prod.identifier||'').indexOf(idPart)>=0) return pk; }
  return null;
}
function rcPrice(pk){ var pr=pk&&(pk.product||pk.storeProduct); return pr&&(pr.priceString||pr.price_string)||''; }
function rcNum(pk){ var pr=pk&&(pk.product||pk.storeProduct); if(!pr) return 0; var v=(typeof pr.price==='number')?pr.price:parseFloat(pr.price); return (isFinite(v)&&v>0)?v:0; }
/* bollino "Risparmi" dell'annuale: percentuale calcolata dai prezzi veri di Apple, nella valuta del paese
   (23 nov 2026; prima era "~20€" fisso in tutte le lingue). Senza prezzi veri il bollino non c'e'. */
function pwSavePct(){ var y=rcNum(rcPkgs.year), m=rcNum(rcPkgs.month); if(!y||!m) return 0; var p=Math.round((1-y/(12*m))*100); return (p>0&&p<100)?p:0; }
function rcUpdatePrices(){
  try{
    var y=rcPrice(rcPkgs.year), m=rcPrice(rcPkgs.month);
    if(y){ var e1=document.querySelector('#paywall [data-plan="year"] .pw-price'); if(e1){ e1.setAttribute('data-price',y); }
           var n1=document.querySelector('#paywall [data-plan="year"] .pw-note'); if(n1) n1.setAttribute('data-price',y); }
    if(m){ var e2=document.querySelector('#paywall [data-plan="month"] .pw-price'); if(e2){ e2.setAttribute('data-price',m); }
           var n2=document.querySelector('#paywall [data-plan="month"] .pw-note'); if(n2) n2.setAttribute('data-price',m); }
    pwRefreshText();
  }catch(e){}
}
function rcLoadOfferings(P){
  return P.getOfferings().then(function(o){
    var cur = (o && (o.current || (o.all && (o.all['main']||o.all['default'])))) || null;
    if(cur){ rcPkgs.year = rcPickPkg(cur,'ANNUAL','year'); rcPkgs.month = rcPickPkg(cur,'MONTHLY','month'); rcUpdatePrices(); }
    return cur;
  });
}
(function rcInit(tries){
  var P = rcPlugin();
  if(!P){ if(tries<20) setTimeout(function(){ rcInit(tries+1); }, 600); return; }
  Promise.resolve(P.configure({ apiKey: RC_KEY })).then(function(){
    rcReady=true;
    try{ P.addCustomerInfoUpdateListener(function(d){ rcApply(rcInfoOf(d)); }); }catch(e){}
    P.getCustomerInfo().then(function(r){ rcApply(rcInfoOf(r)); }).catch(function(){});
    rcLoadOfferings(P).catch(function(){});
    try{ P.getAppUserID().then(function(r){ window.__rcUserId = (r && (r.appUserID || r.appUserId)) || null; rcShowUserId(); }).catch(function(){}); }catch(e){}
  }).catch(function(){});
})(0);
function rcWaitReady(ms){
  return new Promise(function(res,rej){
    var t0=Date.now();
    (function loop(){ if(rcReady) return res(); if(Date.now()-t0>ms) return rej(new Error(t('pwLoading'))); setTimeout(loop,250); })();
  });
}
function rcSetBusy(on){
  rcBusy=on;
  var b=document.getElementById('pw_cta');
  if(b){ b.disabled=on; b.textContent = on ? t('pwWait') : t('pwCta'); b.style.opacity = on ? .6 : 1; }
}
window.__rallyBuy = function(plan){
  var P = rcPlugin();
  if(!P){ rcSay(t('rcOnlyApp'), 'iRally Pro'); return; }
  if(rcBusy) return; rcSetBusy(true);
  /* rete di sicurezza: se qualcosa resta appeso il pulsante torna vivo da solo */
  var guard=setTimeout(function(){ if(rcBusy) rcSetBusy(false); }, 45000);
  rcWaitReady(10000).then(function(){
    var have = plan==='year'? rcPkgs.year : rcPkgs.month;
    return have ? null : rcLoadOfferings(P);
  }).then(function(){
    var pkg = plan==='year'? rcPkgs.year : rcPkgs.month;
    if(!pkg) throw new Error(t('rcNoProducts'));
    return P.purchasePackage({ aPackage: pkg });
  }).then(function(r){
    clearTimeout(guard); rcSetBusy(false); rcApply(rcInfoOf(r));
    if(window.__rcPro) rcSay(t('rcWelcome'), 'iRally Pro');
  }).catch(function(e){
    clearTimeout(guard); rcSetBusy(false);
    if(rcIsCancel(e)) return;
    rcSay(t('rcBuyFail')+' '+((e&&e.message)||t('rcLater')), 'iRally Pro');
  });
};
window.__rallyRestore = function(){
  var P = rcPlugin();
  if(!P){ rcSay(t('rcRestoreSoon'), 'iRally Pro'); return; }
  P.restorePurchases().then(function(r){
    rcApply(rcInfoOf(r));
    rcSay(window.__rcPro ? t('rcRestored') : t('rcNoSub'), t('pwRestore'));
  }).catch(function(e){
    rcSay(t('rcRestoreFail')+' '+((e&&e.message)||t('rcCheckConn')), t('pwRestore'));
  });
};
function proGate(){ if(window.__rallyPro && window.__rallyPro.isPro()) return true; window.__rallyShowPaywall(); return false; }
/* --- Navigatore: km gratis a settimana (reset il martedi') --- */
var FREE_KM_WEEK = 50;
function navWeekKey(){ var d=new Date(); var diff=(d.getDay()-2+7)%7; var t=new Date(d.getFullYear(),d.getMonth(),d.getDate()-diff); return t.getFullYear()+'-'+(t.getMonth()+1)+'-'+t.getDate(); }
function navUsedM(){ try{ if(localStorage.getItem('nav_week')!==navWeekKey()){ localStorage.setItem('nav_week',navWeekKey()); localStorage.setItem('nav_used','0'); } return parseFloat(localStorage.getItem('nav_used')||'0')||0; }catch(e){ return 0; } }
function navRemainM(){ return Math.max(0, FREE_KM_WEEK*1000 - navUsedM()); }
var navPaywallShown=false;
function navAllow(d){ if(window.__rallyPro && window.__rallyPro.isPro()) return true; if(navRemainM()<=0){ if(!navPaywallShown){ navPaywallShown=true; window.__rallyShowPaywall(); } return false; } try{ localStorage.setItem('nav_used', String(navUsedM()+d)); }catch(e){} return true; }
function updateNavFree(){ var el=document.getElementById('navFree'); if(!el) return; var pro=window.__rallyPro&&window.__rallyPro.isPro(); if(cfg.mode==='nav' && !pro){ el.style.display='flex'; var frac=Math.max(0,Math.min(1, navUsedM()/(FREE_KM_WEEK*1000))); var f=document.getElementById('navFreeFill'); if(f){ f.style.width=(frac*100).toFixed(1)+'%'; f.style.background = frac<0.7?'var(--green)':(frac<0.9?'var(--amber)':'var(--red)'); } var rem=navRemainM()/1000; var tx=document.getElementById('navFreeTxt'); if(tx) tx.textContent=(rem<10?rem.toFixed(1):Math.round(rem))+' km'; } else { el.style.display='none'; } }

en:{rbRefs1:"1 reference",pdfImpConfirm1:"Import 1 stage",tutBText:"The ‹ arrow takes you back to the Radar scanner list, to load another stage.",tutBTitle:"Back to the list",totPartResetMsg:"Total and partial reset",selAsk:"Delete {n} stages?",selHint:"Tap the other stages to delete",selDel:"Delete ({n})",ssDelFolderBtn:"Delete folder",pdfSave:"Save",pdfEdit:"Edit",scanWhyTime:"timed out",scanWhyNet:"no network",scanLimit:"You have reached today's scan limit. Try again tomorrow.",rcOnlyApp:"Purchases are only available in the app installed from the App Store/TestFlight.",rcCheckConn:"check your connection.",rcRestoreFail:"Restore failed:",rcNoSub:"No active subscription found on this Apple ID.",rcRestored:"Purchases restored: iRally Pro is active on this device.",rcRestoreSoon:"Restoring purchases will be available at launch.",rcLater:"try again later.",rcBuyFail:"Purchase failed:",rcWelcome:"Welcome to iRally Pro! Free trial active: every feature is unlocked.",rcNoProducts:"Products not available, try again shortly.",rbRefsN:"{n} references",rbNoPhoto:"(no photo)",impShare:"File with a selection of stages and time cards: it can only be added to yours.",impReadErr:"Cannot read the file.",bkExportErr:"Cannot export here:",bkExported:"Backup exported",exGo:"Export",exPart:"Only what you chose, without settings: whoever receives it can only add it.",exFull:"Full backup, with settings.",exNone:"None",exAll:"All",exRadar:"Radar stages",exHint:"Choose what goes in the file. With everything ticked it is the full backup, settings included.",tdGuide:"TIME CARD (MANUAL)\n\n• Tap “+ New time card” (one per section) and type the name.\n• Set the start: type and time.\n• Add controls with “+ Add control”. For each one choose the type (Start section, Service, Regroup, Start SS, TC, Finish, or “Other…” to type your own name), the place and the target time: the due time adds up on its own.\n• During the event enter the actual time: next to it you see the delay (+) or the advance (−). A late stage start and the Regroup out shift the due times of the following controls.\n• On Start SS controls you can note the stage time (SS time). “SS start: stamp +” is the minutes between the stamp and the stage start.",tdAltAsk:"Control name (e.g. Refuel)",tdAltNew:"Other…",tdAddRow:"+ Add control",tdReal:"Actual",tdTeo:"Due",tdStamp:"Stamp",tdPsTime:"SS time",tdLabelPh:"e.g. SS1 Larciano",tdStart:"Start",tdSub:"{n} controls · start {t}",tdEmpty:"No time cards saved. Tap + to create one.",tdNew:"+ New time card",tcStampTime:"Stamp time",tcSecStart:"Section start",tcHdDate:"Date",tcHdSection:"Section",tcPhotoBad:"Photo can't be read:",tcLoadPhoto:"Loading the photo…",tcNoName:"(no name)",tcGuide:"1. Tap “+ New time card” and type the name. With “+ New folder” you keep the cards of one event together: inside a folder you create a new card straight away, and with 📁 you move the ones you already have.\n\n2. Tap “📷 Add page” and photograph the time card, or pick it from the library. Each extra page adds up: check that every TC is there.\n\n3. Enter the start time (Due start, and Actual start when you really leave): the time of every control (Due time) is calculated on its own.\n\n4. During the event enter the actual time of each stamp and the real start of the stages: if you are late or early, the following controls shift on their own.\n\n5. Tap the 🔔 on the controls you want and choose how many minutes before it should ring: it rings with the screen off too.\n\n6. “SS start after the TC”: the minutes between the stamp and the stage start. “How you enter times”: Scroll or Type.\n\n7. If the scanner misread a target time, in “Fix target times” tap Edit and then the time to fix.",tutLText:"In landscape this button changes the layout: big photo, photo on the left or photo on the right (on a tablet also photo on top). Your choice is saved.",tutLTitle:"Change layout",tutDText:"The green number is the distance left to the next symbol. In the last 100 m it turns red and, if you turned on “Sound alert 100 m before” in Radar scanner, you also hear a double chime.",tutDTitle:"Distance to the next symbol",rbGoRadar:"Back to Radar",introTitle:"How it works",

ion, Service, Regroup, Start SS, TC, Finish, ou « Autre… » pour saisir ton propre nom), le lieu et le target time : l'heure théorique s'additionne toute seule.\n• En course saisis l'heure réelle : à côté tu vois le retard (+) ou l'avance (−). Un départ de spéciale en retard et le Regroup out décalent les heures théoriques des contrôles suivants.\n• Sur les contrôles Start SS tu peux noter le temps de la spéciale (temps ES). « Départ ES : pointage + » correspond aux minutes entre le pointage et le départ de la spéciale.",tdAltAsk:"Nom du contrôle (ex. Ravitaillement)",tdAltNew:"Autre…",tdAddRow:"+ Ajouter un contrôle",tdReal:"Réelle",tdTeo:"Théorique",tdStamp:"Pointage",tdPsTime:"temps ES",tdLabelPh:"ex. ES1 Larciano",tdStart:"Départ",tdSub:"{n} contrôles · départ {t}",tdEmpty:"Aucun carnet enregistré. Touche + pour en créer un.",tdNew:"+ Nouveau carnet",tcStampTime:"Heure de pointage",tcSecStart:"Départ de section",tcHdDate:"Date",tcHdSection:"Section",tcPhotoBad:"Photo illisible :",tcLoadPhoto:"Chargement de la photo…",tcNoName:"(sans nom)",tcGuide:"1. Touche « + Nouveau carnet » et saisis le nom. Avec « + Nouveau dossier » tu gardes ensemble les carnets d'une épreuve : dans un dossier tu crées directement un nouveau carnet, et avec 📁 tu déplaces ceux que tu as déjà.\n\n2. Touche « 📷 Ajouter une page » et photographie le carnet, ou choisis-le dans la galerie. Chaque page en plus s'additionne : vérifie que tous les CH sont là.\n\n3. Saisis l'heure de départ (Due start, puis Actual start quand tu pars vraiment) : l'heure de chaque contrôle (Due time) se calcule toute seule.\n\n4. En course, saisis l'heure réelle de chaque pointage et le vrai départ des spéciales : en retard comme en avance, les contrôles suivants se décalent tout seuls.\n\n5. Touche la 🔔 sur les contrôles voulus et choisis combien de minutes avant elle doit sonner : elle sonne même écran éteint.\n\n6. « Départ ES après le TC » : les minutes entre le pointage et le départ de la spéciale. « Saisie des es:{rbRefs1:"1 referencia",pdfImpConfirm1:"Importar 1 tramo",tutBText:"La flecha ‹ te lleva a la lista del Escáner radar, para cargar otro tramo.",tutBTitle:"Volver a la lista",totPartResetMsg:"Total y parcial a cero",selAsk:"¿Eliminar {n} tramos?",selHint:"Toca los otros tramos que quieras eliminar",selDel:"Eliminar ({n})",ssDelFolderBtn:"Eliminar carpeta",pdfSave:"Guardar",pdfEdit:"Editar",scanWhyTime:"tiempo agotado",scanWhyNet:"sin red",scanLimit:"Has alcanzado el límite de escaneos de hoy. Inténtalo de nuevo mañana.",rcOnlyApp:"Las compras solo están disponibles en la app instalada desde App Store/TestFlight.",rcCheckConn:"comprueba la conexión.",rcRestoreFail:"No se pudo restaurar:",rcNoSub:"No se ha encontrado ninguna suscripción activa en este Apple ID.",rcRestored:"Compras restauradas: iRally Pro está activo en este dispositivo.",rcRestoreSoon:"Restaurar compras estará disponible al publicar la app.",rcLater:"inténtalo más tarde.",rcBuyFail:"La compra no se ha completado:",rcWelcome:"¡Bienvenido a iRally Pro! Prueba gratuita activa: todas las funciones están desbloqueadas.",rcNoProducts:"Productos no disponibles, inténtalo de nuevo en un momento.",rbRefsN:"{n} referencias",rbNoPhoto:"(sin foto)",impShare:"Archivo con una selección de tramos y carnés: solo se puede añadir a los tuyos.",impReadErr:"No se puede leer el archivo.",bkExportErr:"No puedo exportar aquí:",bkExported:"Copia exportada",exGo:"Exportar",exPart:"Solo lo que elegiste, sin ajustes: quien lo reciba solo podrá añadirlo.",exFull:"Copia completa, con los ajustes.",exNone:"Nada",exAll:"Todo",exRadar:"Tramos del radar",exHint:"Elige qué va en el archivo. Con todo marcado es la copia completa, ajustes incluidos.",tdGuide:"HOJA DE RUTA MANUAL\n\n• Toca «+ Nuevo carné» (uno por sección) y escribe el nombre.\n• Fija la salida: tipo y hora.\n• Añade controles con «+ Añadir control». En cada uno elige el tipo (Start section, Service, Regroup, Start SS, TC, Finish, u «Otro…» para escribir tu propio nombre), el lugar y el target time: la hora teórica se suma sola.\n• En carrera escribe la hora real: al lado ves el retraso (+) o el adelanto (−). Una salida de tramo con retraso y el Regroup out desplazan las horas teóricas de los controles siguientes.\n• En los controles Start SS puedes anotar el tiempo del tramo (tiempo TC). «Salida TC: sello +» son los minutos entre el sello y la salida del tramo.",tdAltAsk:"Nombre del control (p. ej. Repostaje)",tdAltNew:"Otro…",tdAddRow:"+ Añadir control",tdReal:"Real",tdTeo:"Teórica",tdStamp:"Sello",tdPsTime:"tiempo TC",tdLabelPh:"p. ej. TC1 Larciano",tdStart:"Salida",tdSub:"{n} controles · salida {t}",tdEmpty:"No hay carnés guardados. Toca + para crear uno.",tdNew:"+ Nuevo carné",tcStampTime:"Hora de sello",tcSecStart:"Salida de sección",tcHdDate:"Fecha",tcHdSection:"Sección",tcPhotoBad:"Foto ilegible:",tcLoadPhoto:"Cargando la foto…",tcNoName:"(sin nombre)",tcGuide:"1. Toca «+ Nuevo carné» y escribe el nombre. Con «+ Nueva carpeta» mantienes juntos los carnés de una prueba: dentro de una carpeta creas directamente un carné nuevo, y con 📁 mueves los que ya tienes.\n\n2. Toca «📷 Añadir página» y fotografía el carné, o elígelo de la galería. Cada página más se suma: comprueba que estén todos los CH.\n\n3. Escribe la hora de salida (Due start, y Actual start cuando sales de verdad): la hora de cada control (Due time) se calcula sola.\n\n4. En carrera escribe la hora real de cada sello y la salida real de los tramos: con retraso o adelanto, los controles siguientes se desplazan solos.\n\n5. Toca la 🔔 en los controles que quieras y elige cuántos minutos antes debe sonar: suena también con la pantalla apagada.\n\n6. «Salida TC después del TC»: los minutos entre el sello y la salida del tramo. «Cómo introduces las horas»: Desplazar o Escribir.\n\n7. Si el escáner leyó mal un tiempo impuesto, en «Corregir tiempos impuestos» toca Editar y luego el tiempo que hay que corregir.",tutLText:"En horizontal este botón cambia la disposición: foto grande, foto a la izquierda o foto a la derecha (en tableta también foto arriba). La elección se guarda.",tutLTitle:"Cambiar disposición",tutDText:"El número verde es la distancia que falta hasta el próximo símbolo. En los últimos 100 m se vuelve rojo y, si activaste «Aviso sonoro a 100 m» en Escáner radar, oyes también un doble sonido.",tutDTitle:"Metros al próximo símbolo",rbGoRadar:"Volver al Radar",introTitle:"Cómo funciona",

de:{rbRefs1:"1 Bezugspunkt",pdfImpConfirm1:"1 Prüfung importieren",tutBText:"Der Pfeil ‹ bringt dich zur Liste des Radar-Scanners zurück, um eine andere Prüfung zu laden.",tutBTitle:"Zurück zur Liste",totPartResetMsg:"Gesamt und Teilstrecke zurückgesetzt",selAsk:"{n} Prüfungen löschen?",selHint:"Tippe die weiteren Prüfungen zum Löschen an",selDel:"Löschen ({n})",ssDelFolderBtn:"Ordner löschen",pdfSave:"Speichern",pdfEdit:"Bearbeiten",scanWhyTime:"Zeitüberschreitung",scanWhyNet:"kein Netz",scanLimit:"Du hast das Scan-Limit für heute erreicht. Versuche es morgen wieder.",rcOnlyApp:"Käufe sind nur in der App aus dem App Store/TestFlight möglich.",rcCheckConn:"prüfe die Verbindung.",rcRestoreFail:"Wiederherstellung fehlgeschlagen:",rcNoSub:"Kein aktives Abo für diese Apple-ID gefunden.",rcRestored:"Käufe wiederhergestellt: iRally Pro ist auf diesem Gerät aktiv.",rcRestoreSoon:"Käufe wiederherstellen ist ab der Veröffentlichung verfügbar.",rcLater:"versuche es später noch einmal.",rcBuyFail:"Kauf fehlgeschlagen:",rcWelcome:"Willkommen bei iRally Pro! Gratis-Test aktiv: Alle Funktionen sind freigeschaltet.",rcNoProducts:"Produkte nicht verfügbar, versuche es gleich noch einmal.",rbRefsN:"{n} Bezugspunkte",rbNoPhoto:"(kein Foto)",impShare:"Datei mit einer Auswahl von Prüfungen und Bordkarten: Sie kann nur zu deinen hinzugefügt werden.",impReadErr:"Die Datei kann nicht gelesen werden.",bkExportErr:"Export hier nicht möglich:",bkExported:"Backup exportiert",exGo:"Exportieren",exPart:"Nur deine Auswahl, ohne Einstellungen: Wer sie bekommt, kann sie nur hinzufügen.",exFull:"Komplettes Backup mit Einstellungen.",exNone:"Keine",exAll:"Alle",exRadar:"Radar-Prüfungen",exHint:"Wähle, was in die Datei kommt. Ist alles angehakt, ist es das komplette Backup mit Einstellungen.",tdGuide:"BORDKARTE (MANUELL)\n\n• Tippe auf „+ Neue Bordkarte“ (eine pro Abschnitt) und gib den Namen ein.\n• Lege den Start fest: Typ und Uhrzeit.\n• Füge Kontrollen mit „+ Kontrolle hinzufügen“ hinzu. Wähle für jede den Typ (Start section, Service, Regroup, Start SS, TC, Finish oder „Andere…“ für einen eigenen Namen), den Ort und die Target time: Die Sollzeit addiert sich von selbst.\n• Im Rennen gibst du die echte Zeit ein: Daneben siehst du Verspätung (+) oder Verfrühung (−). Ein verspäteter Prüfungsstart und Regroup out verschieben die Sollzeiten der folgenden Kontrollen.\n• Bei Start-SS-Kontrollen kannst du die Prüfungszeit notieren (WP-Zeit). „WP-Start: Stempel +“ sind die Minuten zwischen Stempel und Start der Prüfung.",tdAltAsk:"Name der Kontrolle (z. B. Tanken)",tdAltNew:"Andere…",tdAddRow:"+ Kontrolle hinzufügen",tdReal:"Ist",tdTeo:"Soll",tdStamp:"Stempel",tdPsTime:"WP-Zeit",tdLabelPh:"z. B. WP1 Larciano",tdStart:"Start",tdSub:"{n} Kontrollen · Start {t}",tdEmpty:"Keine Bordkarte gespeichert. Tippe auf +, um eine anzulegen.",tdNew:"+ Neue Bordkarte",tcStampTime:"Stempelzeit",tcSecStart:"Abschnittsstart",tcHdDate:"Datum",tcHdSection:"Abschnitt",tcPhotoBad:"Foto nicht lesbar:",tcLoadPhoto:"Foto wird geladen…",tcNoName:"(ohne Namen)",tcGuide:"1. Tippe auf „+ Neue Bordkarte“ und gib den Namen ein. Mit „+ Neuer Ordner“ hältst du die Karten einer Veranstaltung zusammen: In einem Ordner legst du direkt eine neue Karte an, und mit 📁 verschiebst du vorhandene.\n\n2. Tippe auf „📷 Seite hinzufügen“ und fotografiere die Bordkarte oder wähle sie aus der Mediathek. Jede weitere Seite wird addiert: Prüfe, ob alle ZK da sind.\n\n3. Gib die Startzeit ein (Due start und Actual start, wenn du wirklich losfährst): Die Zeit jeder Kontrolle (Due time) wird automatisch berechnet.\n\n4. Im Rennen gibst du die echte Zeit jedes Stempels und den echten Start der Prüfungen ein: Bei Verspätung oder Verfrühung verschieben sich die folgenden Kontrollen von selbst.\n\n5. Tippe bei den gewünschten Kontrollen auf die 🔔 und wähle, wie viele Minuten vorher sie klingeln soll: Sie klingelt auch bei ausgeschaltetem Bildschirm.\n\n6. „WP-Start nach dem TC“: die Minuten zwischen Stempel und Start der Prüfung. „Zeiteingabe“: Scrollen oder Tippen.\n\n7. Hat der Scanner eine Sollzeit falsch gelesen, tippe unter „Sollzeiten korrigieren“ auf Bearbeiten und dann auf die Zeit, die du korrigieren willst.",tutLText:"Im Querformat ändert diese Taste die Anordnung: großes Foto, Foto links oder Foto rechts (auf dem Tablet auch Foto oben). Deine Wahl bleibt gespeichert.",tutLTitle:"Anordnung ändern",tutDText:"Die grüne Zahl ist die verbleibende Distanz bis zum nächsten Symbol. Auf den letzten 100 m wird sie rot, und wenn du im Radar-Scanner „Tonsignal 100 m vorher“ eingeschaltet hast, hörst du auch einen Doppelton.",tutDTitle:"Meter bis zum nächsten Symbol",rbGoRadar:"Zurück zum Radar",introTitle:"So funktioniert es",

zinha.\n• Em prova escreve a hora real: ao lado vês o atraso (+) ou o avanço (−). Uma partida de prova atrasada e o Regroup out deslocam as horas teóricas dos controlos seguintes.\n• Nos controlos Start SS podes anotar o tempo da prova (tempo PE). «Partida PE: carimbo +» são os minutos entre o carimbo e a partida da prova.",tdAltAsk:"Nome do controlo (ex. Reabastecimento)",tdAltNew:"Outro…",tdAddRow:"+ Adicionar controlo",tdReal:"Real",tdTeo:"Teórica",tdStamp:"Carimbo",tdPsTime:"tempo PE",tdLabelPh:"ex. PE1 Larciano",tdStart:"Partida",tdSub:"{n} controlos · partida {t}",tdEmpty:"Nenhum cartão guardado. Toca em + para criar um.",tdNew:"+ Novo cartão",tcStampTime:"Hora do carimbo",tcSecStart:"Partida da secção",tcHdDate:"Data",tcHdSection:"Secção",tcPhotoBad:"Foto ilegível:",tcLoadPhoto:"A carregar a foto…",tcNoName:"(sem nome)",tcGuide:"1. Toca em «+ Novo cartão» e escreve o nome. Com «+ Nova pasta» manténs juntos os cartões de um rali: dentro de uma pasta crias logo um cartão novo, e com 📁 moves os que já tens.\n\n2. Toca em «📷 Adicionar página» e fotografa o cartão, ou escolhe-o da galeria. Cada página a mais soma-se: confirma que estão todos os CH.\n\n3. Escreve a hora de partida (Due start, e Actual start quando partes mesmo): a hora de cada controlo (Due time) calcula-se sozinha.\n\n4. Em prova escreve a hora real de cada carimbo e a partida real das provas: em atraso ou adiantado, os controlos seguintes deslocam-se sozinhos.\n\n5. Toca na 🔔 nos controlos que quiseres e escolhe quantos minutos antes deve tocar: toca mesmo com o ecrã desligado.\n\n6. «Partida PE depois do TC»: os minutos entre o carimbo e a partida da prova. «Como introduzes as horas»: Deslizar ou Escrever.\n\n7. Se o scanner leu mal um tempo imposto, em «Corrigir tempos impostos» toca em Editar e depois no tempo a corrigir.",tutLText:"Na horizontal este botão muda a disposição: foto grande, foto à esquerda ou foto à direita (no tablet também foto em cima). A escolha fica guardada.",tutLTitle:"Mudar disposição",tutDText:"O número verde é a distância que falta até ao próximo símbolo. Nos últimos 100 m fica vermelho e, se ligaste «Aviso sonoro a 100 m» no Scanner radar, ouves também um som duplo.",tutDTitle:"Metros até ao próximo símbolo",rbGoRadar:"Voltar ao Radar",introTitle:"Como funciona",

。\n\n2. 「📷 ページを追加」をタップしてタイムカードを撮影するか、ライブラリから選びます。追加したページは加算されるので、すべてのTCがそろっているか確認してください。\n\n3. スタート時刻（Due start、実際に出発したら Actual start）を入力すると、各コントロールの時刻（Due time）が自動で計算されます。\n\n4. 競技中は各押印の実際の時刻とステージの実際のスタートを入力します。遅れても早着しても、以降のコントロールが自動でずれます。\n\n5. 必要なコントロールの 🔔 をタップし、何分前に鳴らすかを選びます。画面がオフでも鳴ります。\n\n6. 「TC後のSSスタート」：押印からステージのスタートまでの分数。「時刻の入力方法」：スクロールまたは入力。\n\n7. スキャナーが規定時間を誤読したら、「規定時間を修正」で 編集 をタップし、直したい時間をタップします。",tutLText:"横向きでは、このボタンで配置を変更します：大きな写真、写真を左、写真を右（タブレットでは写真を上にも）。選んだ配置は保存されます。",tutLTitle:"配置を変更",tutDText:"緑の数字は次の記号までの残り距離です。残り100 mで赤になり、レーダースキャナーで「100 m手前で音を鳴らす」をオンにしていれば2音のチャイムも鳴ります。",tutDTitle:"次の記号までの距離",rbGoRadar:"レーダーに戻る",introTitle:"使い方",

 Regroup out posunou teoretické časy dalších kontrol.\n• U kontrol Start SS můžeš zapsat čas zkoušky (čas RZ). „Start RZ: razítko +“ jsou minuty mezi razítkem a startem zkoušky.",tdAltAsk:"Název kontroly (např. Tankování)",tdAltNew:"Jiné…",tdAddRow:"+ Přidat kontrolu",tdReal:"Skutečný",tdTeo:"Teoretický",tdStamp:"Razítko",tdPsTime:"čas RZ",tdLabelPh:"např. RZ1 Larciano",tdStart:"Start",tdSub:"{n} kontrol · start {t}",tdEmpty:"Žádný uložený výkaz. Klepni na + a vytvoř ho.",tdNew:"+ Nový výkaz",tcStampTime:"Čas razítka",tcSecStart:"Start sekce",tcHdDate:"Datum",tcHdSection:"Sekce",tcPhotoBad:"Fotka je nečitelná:",tcLoadPhoto:"Načítám fotku…",tcNoName:"(bez názvu)",tcGuide:"1. Klepni na „+ Nový výkaz“ a zadej název. Přes „+ Nová složka“ držíš výkazy jedné soutěže pohromadě: ve složce rovnou vytvoříš nový výkaz a přes 📁 přesuneš ty, které už máš.\n\n2. Klepni na „📷 Přidat stránku“ a vyfoť výkaz, nebo ho vyber z galerie. Každá další stránka se přičte: zkontroluj, že jsou tam všechny ČK.\n\n3. Zadej čas startu (Due start a Actual start, když opravdu vyrazíš): čas každé kontroly (Due time) se spočítá sám.\n\n4. Během soutěže zadávej skutečný čas každého razítka a skutečný start zkoušek: při zpoždění i předstihu se další kontroly posunou samy.\n\n5. Klepni na 🔔 u kontrol, které chceš, a zvol, kolik minut předem má zazvonit: zvoní i při vypnutém displeji.\n\n6. „Start RZ po TC“: minuty mezi razítkem a startem zkoušky. „Jak zadáváš časy“: Posunout nebo Psát.\n\n7. Pokud skener špatně přečetl stanovený čas, v „Opravit stanovené časy“ klepni na Upravit a pak na čas, který chceš opravit.",tutLText:"Na šířku toto tlačítko mění rozložení: velká fotka, fotka vlevo nebo vpravo (na tabletu i fotka nahoře). Volba zůstane uložená.",tutLTitle:"Změnit rozložení",tutDText:"Zelené číslo je vzdálenost zbývající do dalšího symbolu. Na posledních 100 m zčervená, a pokud jsi ve Skeneru radaru zapnul „Zvukové upozornění 100 m předem“, uslyšíš i dvojitý tón.",tutDTitle:"Metry k dalšímu symbolu",   [/partenza|start|t\.?c\.?|c\.?o\.?|controllo|timbro|orologio|clock/i, '🕐'],
  [/arrivo|finish|fine/i, '🏁']
];
function wordToSym(s){
  for(const [re, sym] of SYM_WORDS){ if(re.test(s)) return sym; }
  return '⚠️';
}
function extractExit(s){
  const m = String(s).match(/((?:prima|seconda|terza|quarta|quinta|sesta|1|2|3|4|5|6)\s*[ªa°]?\s*uscita|uscita\s*(?:n\.?\s*)?\d)/i);
  return m ? m[1].toUpperCase() : null;
}

   dell'archivio del browser, cosi' ci sta un mondiale intero. ===== */
const IMG_STORE = { db:null, mem:Object.create(null), ready:false };
function idbOpen(){
  return new Promise((res)=>{
    try{
      const rq = indexedDB.open('irally', 1);
      rq.onupgradeneeded = ()=>{ try{ rq.result.createObjectStore('imgs'); }catch(_){} };
      rq.onsuccess = ()=>res(rq.result);
      rq.onerror = ()=>res(null);
    }catch(e){ res(null); }
  });
}
async function imgInit(){
  IMG_STORE.db = await idbOpen();
  if(!IMG_STORE.db){ IMG_STORE.ready = true; return; }
  await new Promise(res=>{
    try{
      const rq = IMG_STORE.db.transaction('imgs','readonly').objectStore('imgs').openCursor();
      rq.onsuccess = e=>{ const c=e.target.result; if(c){ IMG_STORE.mem[c.key]=c.value; c.continue(); } else res(); };
      rq.onerror = ()=>res();
    }catch(e){ res(); }
  });
  IMG_STORE.ready = true;
  try{ radShownIdx = -2; if(typeof buildSsList==='function') buildSsList(); }catch(_){}
}
function imgPut(dataURL){
  if(!dataURL) return '';
  if(!IMG_STORE.db) return dataURL;
  const id = 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  IMG_STORE.mem[id] = dataURL;
  try{ IMG_STORE.db.transaction('imgs','readwrite').objectStore('imgs').put(dataURL, id); }catch(e){}
  return 'idb:' + id;
}
function imgGet(ref){
  if(!ref) return '';
  if(ref.indexOf('idb:') !== 0) return ref;
  return IMG_STORE.mem[ref.slice(4)] || '';
}
function imgDel(ref){
  if(!ref || ref.indexOf('idb:') !== 0) return;
  const id = ref.slice(4);
  delete IMG_STORE.mem[id];
  try{ if(IMG_STORE.db) IMG_STORE.db.transaction('imgs','readwrite').objectStore('imgs').delete(id); }catch(e){}
}
function imgDelStage(ss){ if(ss && Array.isArray(ss.rb)) ss.rb.forEach(r=>imgDel(r.img)); }
function imgAdopt(list){ if(Array.isArray(list)) list.forEach(r=>{ if(r && typeof r.img==='string' && r.img.indexOf('data:')===0) r.img = imgPut(r.img); }); }
