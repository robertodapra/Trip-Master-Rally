["🎯","Radar in gara","Dopo <b>Carica</b> lo schermo mostra il simbolo da seguire.<ul><li>Il numero verde è la distanza al prossimo simbolo; negli ultimi 100 m diventa rosso.</li><li>Le <b>frecce</b> scorrono i simboli senza toccare parziale e totale.</li><li><b>Tocca il parziale</b>: azzera e passa al simbolo successivo. In Automatico corregge anche i metri di scarto.</li><li><b>Tieni premuto il parziale</b> 1 secondo (barra blu): corregge i metri di scarto col GPS e azzera il parziale, restando sullo stesso simbolo.</li><li><b>Tieni premuto il totale</b> 2 secondi alla partenza della prova: si azzerano totale e parziale e il Radar riparte dal simbolo 1.</li><li>In orizzontale la foto è grande. Il tasto <b>⇄</b> cambia disposizione: foto a sinistra, a destra e, sul tablet, sopra.</li><li>La freccia <b>‹</b> in alto a sinistra ti riporta all'elenco dello Scanner radar, per caricare un'altra prova.</li><li>Il tasto <b>?</b> in alto ti guida passo per passo sullo schermo.</li></ul>",""],
["📋","Scanner tabella di marcia","<ul><li><b>+ Nuova tabella di marcia</b>: scrivi il nome, poi <b>📷 Inserisci pagina</b> (foto o libreria). Ogni pagina in più si somma: controlla che ci siano tutti i TC.</li><li><b>+ Nuova cartella</b> raccoglie le tabelle di una gara. Dentro una cartella crei subito una tabella nuova; con 📁 sposti quelle che hai già.</li><li>Scrivi l'ora di partenza: gli orari teorici di ogni controllo si calcolano da soli.</li><li>In gara scrivi l'ora reale dei timbri e la partenza vera delle prove: i controlli dopo si spostano da soli, in ritardo e in anticipo.</li><li>Accendi la <b>🔔</b> sui controlli che vuoi e scegli i <b>minuti prima</b>.</li><li>Se lo scanner ha letto male un tempo imposto, correggilo con <b>Modifica</b>.</li></ul><div class=\"tip\">Il tasto <b>?</b> in alto nello scanner riassume questi passi.</div>","tc"],
["✍️","Tabella di marcia manuale","Per costruire la tabella a mano quando non puoi scansionare.<ul><li><b>+ Nuova tabella</b> (una per sezione) e scrivi il nome.</li><li>Imposta la <b>partenza</b> e aggiungi i timbri con <b>+ Aggiungi timbro</b>.</li><li>Per ogni timbro scegli il tipo (Start section, Service, Regroup, Start SS, TC, Finish, oppure <b>Altro…</b> col nome che vuoi), la località e il target time: l'ora teorica si somma da sola.</li><li>In gara scrivi l'ora reale: vedi il ritardo (+) o l'anticipo (−). Una partenza della prova in ritardo e l'uscita dal Regroup (Regroup out) spostano i teorici successivi.</li><li><b>Start SS: timbro +</b> sono i minuti fra il timbro e la partenza della prova.</li></ul>","tc"],
["🧮","Calcolatrice tempo","Per sommare o togliere orari e tempi imposti. Scrivi l'orario (es. 1335 = 13:35), poi <b>+</b> o <b>−</b> e un altro tempo, infine <b>=</b>.",""],
["👀","Intermedi (spettatore)","Per cronometrare le auto a bordo strada, a metà prova.<ul><li><b>Nuova prova</b>: nome, distacco fra le partenze, a che km della prova sei e una breve descrizione del posto.</li><li>Scrivi il nome del pilota che arriva e premi il <b>pulsante tondo</b> quando passa. La prima auto fa partire il cronometro.</li><li>Se un'auto manca o il distacco cambia, porta il riquadro accanto al nome a 2', 3'…</li><li>La classifica va dal più veloce al più lento. Il riferimento (<b>RIF.</b>) è il più veloce, oppure il pilota che scegli toccandolo; toccandolo puoi anche cancellare il suo tempo.</li><li>Alla fine tocca <b>Stop</b>: la prova si chiude e ti chiede se esportare.</li><li><b>Esporta</b> crea un'immagine con distacchi e secondi al km, da mandare per esempio su WhatsApp.</li></ul><div class=\"tip\">Gli Intermedi restano solo nel telefono: non entrano nel backup.</div>",""],
["🔔","Sveglie e notifiche","Quando accendi la 🔔 su un controllo è <b>iOS</b> a tenere la sveglia: suona anche a <b>schermo spento</b> e ad <b>app chiusa</b>.<ul><li>Serve il <b>permesso notifiche</b> (l'app lo chiede la prima volta).</li><li>Le sveglie si riprogrammano <b>quando l'app è aperta</b>: dopo un ritardo riapri un attimo l'app per aggiornarle.</li><li>Il suono si sceglie in <b>Impostazioni generali → Suono notifica</b>.</li></ul>","tc"],
["💾","Backup (importante)","I dati stanno nel telefono e iOS <b>può cancellarli</b> se serve spazio: prima delle gare fai un backup.<ul><li><b>Impostazioni generali → Esporta backup</b> apre l'elenco di prove radar e tabelle, tutto spuntato: così è il backup completo, impostazioni comprese.</li><li>Per mandare a qualcuno solo alcune prove o tabelle, togli la spunta a quelle che non servono: il file contiene solo quello che hai scelto e prende il suo nome.</li><li><b>Importa backup</b>: vedi cosa contiene il file e scegli <b>Aggiungi alle mie prove</b> o <b>Sostituisci tutto</b>. Un file con una scelta parziale si può solo aggiungere.</li></ul><div class=\"tip\">Gli Intermedi non sono nel backup.</div>",""],
["⚙️","Impostazioni","Qui cambi <b>lingua</b>, <b>unità</b> (km/mi), <b>grandezza e stile dei numeri</b> con anteprima dal vivo, <b>formato orario</b> 12/24, <b>tema</b> e <b>suono delle notifiche</b>. Da qui fai anche <b>Esporta backup</b> e <b>Importa backup</b>.",""]
],
en:[
["☰","Menu and modes","Tap <b>☰</b> at the top to open the menu. Each section opens when you tap it:<ul><li><b>Driver</b>: Driver mode and Word table.</li><li><b>Co-driver</b>: Trip, Radar scanner (the Radar opens from here too), Time card scanner, Time card (manual) and Time calculator.</li><li><b>Spectator</b>: Split times.</li></ul>At the bottom you find <b>General settings</b> and this <b>Guide</b>.","menu"],
["🏁","Driver","Open <b>Word table</b> from the menu: type a word or note and the metres where it should appear (From included, To excluded; empty To = no limit).<ul><li>Tap the word, or the button of a Bluetooth remote, to start and stop the measurement.</li><li>When the partial enters the set metres the word appears. With <b>Speak the word aloud</b> you hear it at the tap that closes the measurement.</li><li>Above the big word, <b>Before:</b> shows the word of the measurement you just closed.</li><li><b>Every tap resets the measurement</b>: each tap starts again from zero instead of stopping.</li><li><b>Use real metres (no words)</b>: you only see total and partial in metres.</li><li>Hold the <b>total</b> for 2 seconds to reset it.</li></ul>",""],
["🧭","Co-driver / Trip","<b>Partial</b> always running, <b>speed</b> and <b>total</b>.<ul><li>Tap the partial to reset it.</li><li>Hold the total for 2 seconds to reset it.</li><li>The GPS dot is green when the signal is excellent (under 6 m), blue when it is good (6–10 m), red when it is weak (over 10 m).</li><li>In a tunnel, without GPS, the app keeps counting at the last speed for up to 60 seconds.</li></ul>",""],
["📡","Radar scanner","This is where you prepare the road book stages.<ul><li><b>+ New stage (scan)</b>: type the name and photograph the page, or pick one or more from the library. The app finds the table, crops every reference and puts the pages into a single stage.</li><li><b>📄 Import from PDF road book</b>: choose the PDF, then for each stage type the name and the pages (from… to…) and tap <b>Add</b>; for the next stage use <b>+ Add page range</b>. If you made a mistake, <b>✎ Edit</b> on the range lets you fix name and pages, or delete it. At the end confirm and type the event name: the stages go into a folder with that name.</li><li><b>+ New folder</b> keeps the stages of one event together; inside the folder they are in alphabetical order. With <b>⋯</b> on the folder you rename or delete it (the stages stay).</li><li>Tap the <b>name</b> of a stage to see its symbols: ✕ removes a wrong reference, <b>+ Add scan</b> adds pages. With <b>⋯</b> you rename, move to a folder or delete. To delete more than one, <b>hold</b> a stage (or ⋯ → Delete), tap the others and press <b>Delete</b> at the bottom.</li><li><b>Load</b> takes the stage into the Radar. When you come back here, <b>Back to Radar</b> returns you to the symbol where you were.</li><li><b>Road book symbol advance</b>: Automatic (the symbol changes by itself) or Manual (you change it by tapping the partial). <b>Sound alert 100 m before</b>: a double chime before each symbol.</li></ul><div class=\"tip\">Photograph the page straight and well lit, framing only the table.</div>",""],
["🎯","Radar during the stage","After <b>Load</b> the screen shows the symbol to follow.<ul><li>The green number is the distance to the next symbol; in the last 100 m it turns red.</li><li>The <b>arrows</b> scroll through the symbols without touching partial and total.</li><li><b>Tap the partial</b>: resets and moves to the next symbol. In Automatic it also corrects the distance offset.</li><li><b>Hold the partial</b> for 1 second (blue bar): corrects the distance offset with the GPS and resets the partial, staying on the same symbol.</li><li><b>Hold the total</b> for 2 seconds at the start of the stage: total and partial reset and the Radar starts again from symbol 1.</li><li>In landscape the photo is big. The <b>⇄</b> button changes the layout: photo on the left, on the right and, on a tablet, on top.</li><li>The <b>‹</b> arrow at the top left takes you back to the Radar scanner list, to load another stage.</li><li>The <b>?</b> button at the top guides you step by step on the screen.</li></ul>",""],
["📋","Time card scanner","<ul><li><b>+ New time card</b>: type the name, then <b>📷 Add page</b> (photo or library). Each extra page adds up: check that every TC is there.</li><li><b>+ New folder</b> groups the time cards of one event. Inside a folder you create a new card straight away; with 📁 you move the ones you already have.</li><li>Enter the start time: the due time of every control is calculated on its own.</li><li>During the event enter the actual stamp times and the real stage starts: the following controls shift on their own, late or early.</li><li>Turn on the <b>🔔</b> on the controls you want and choose the <b>minutes before</b>.</li><li>If the scanner misread a target time, fix it with <b>Edit</b>.</li></ul><div class=\"tip\">The <b>?</b> button at the top of the scanner sums up these steps.</div>","tc"],
["✍️","Time card (manual)","To build the card by hand when you cannot scan.<ul><li><b>+ New time card</b> (one per section) and type the name.</li><li>Set the <b>start</b> and add controls with <b>+ Add control</b>.</li><li>For each control choose the type (Start section, Service, Regroup, Start SS, TC, Finish, or <b>Other…</b> with any name you like), the place and the target time: the due time adds up on its own.</li><li>During the event enter the actual time: you see the delay (+) or the advance (−). A late stage start and the Regroup out shift the following due times.</li><li><b>SS start: stamp +</b> is the minutes between the stamp and the stage start.</li></ul>","tc"],
["🧮","Time calculator","To add or subtract times and target times. Type a time (e.g. 1335 = 13:35), then <b>+</b> or <b>−</b> and another time, then <b>=</b>.",""],
["👀","Split times (spectator)","To time the cars from the roadside, mid-stage.<ul><li><b>New stage</b>: name, start interval, the km of the stage where you are and a short description of the spot.</li><li>Type the name of the driver who is coming and press the <b>round button</b> when the car passes. The first car starts the stopwatch.</li><li>If a car is missing or the interval changes, set the box next to the name to 2', 3'…</li><li>The list goes from fastest to slowest. The reference (<b>REF</b>) is the fastest, or the driver you pick by tapping them; tapping also lets you delete their time.</li><li>At the end tap <b>Stop</b>: the stage is closed and it asks whether to export.</li><li><b>Export</b> creates an image with gaps and seconds per km, to send for example on WhatsApp.</li></ul><div class=\"tip\">Split times stay only on the phone: they are not in the backup.</div>",""],
["🔔","Alarms and notifications","When you turn on the 🔔 for a control, <b>iOS</b> holds the alarm: it rings with the <b>screen off</b> and the <b>app closed</b>.<ul><li>The <b>notification permission</b> must be on (the app asks the first time).</li><li>Alarms are rescheduled <b>while the app is open</b>: after a delay open the app for a moment to update them.</li><li>Choose the sound in <b>General settings → Notification sound</b>.</li></ul>","tc"],
["💾","Backup (important)","Data lives on the phone and iOS <b>can delete it</b> if it needs space: make a backup before every event.<ul><li><b>General settings → Export backup</b> opens the list of radar stages and time cards, all ticked: that is the full backup, settings included.</li><li>To send only some stages or cards to someone, untick the ones you don't need: the file holds only what you chose and is named after it.</li><li><b>Import backup</b>: you see what the file contains and choose <b>Add to my stages</b> or <b>Replace everything</b>. A file with a partial selection can only be added.</li></ul><div class=\"tip\">Split times are not in the backup.</div>",""],
["⚙️","Settings","Here you change <b>language</b>, <b>units</b> (km/mi), <b>number size and style</b> with a live preview, <b>time format</b> 12/24, <b>theme</b> and <b>notification sound</b>. This is also where you <b>Export backup</b> and <b>Import backup</b>.",""]
],
fr:[
["☰","Menu et modes","Touchez <b>☰</b> en haut pour ouvrir le menu. Chaque section s'ouvre quand vous la touchez :<ul><li><b>Pilote</b> : mode Pilote et Tableau des mots.</li><li><b>Navigateur</b> : Trip, Scanner radar (le Radar s'ouvre aussi d'ici), Scanner carnet de contrôle, Carnet de route manuel et Calculatrice de temps.</li><li><b>Spectateur</b> : Temps intermédiaires.</li></ul>En bas se trouvent <b>Réglages généraux</b> et ce <b>Guide</b>.","menu"],
["🏁","Pilote","Ouvrez <b>Tableau des mots</b> depuis le menu : saisissez un mot ou une note et les mètres où il doit apparaître (De inclus, À exclu ; À vide = sans limite).<ul><li>Touchez le mot, ou le bouton d'une télécommande Bluetooth, pour lancer et arrêter la mesure.</li><li>Quand le partiel entre dans les mètres réglés, le mot apparaît. Avec <b>Lire le mot à voix haute</b> vous l'entendez à la touche qui clôt la mesure.</li><li>Au-dessus du grand mot, <b>Avant :</b> montre celui de la mesure qui vient de se terminer.</li><li><b>Chaque touche remet la mesure à zéro</b> : chaque touche repart de zéro au lieu d'arrêter.</li><li><b>Utiliser les mètres réels (sans mots)</b> : vous ne voyez que le total et le partiel en mètres.</li><li>Maintenez le <b>total</b> 2 secondes pour le remettre à zéro.</li></ul>",""],
["🧭","Copilote / Trip","<b>Partiel</b> toujours actif, <b>vitesse</b> et <b>total</b>.<ul><li>Touchez le partiel pour le remettre à zéro.</li><li>Maintenez le total 2 secondes pour le remettre à zéro.</li><li>Le point GPS est vert quand le signal est excellent (moins de 6 m), bleu quand il est bon (6–10 m), rouge quand il est faible (plus de 10 m).</li><li>En tunnel, sans GPS, l'application continue de compter à la dernière vitesse pendant 60 secondes au maximum.</li></ul>",""],
["📡","Scanner radar","C'est ici que vous préparez les spéciales du road book.<ul><li><b>+ Nouvelle spéciale (scanner)</b> : saisissez le nom et photographiez la page, ou choisissez-en une ou plusieurs dans la galerie. L'application trouve le tableau, découpe chaque repère et réunit les pages dans une seule spéciale.</li><li><b>📄 Importer depuis un road book PDF</b> : choisissez le PDF, puis pour chaque spéciale saisissez le nom et les pages (de… à…) et touchez <b>Ajouter</b> ; pour la suivante utilisez <b>+ Ajouter une plage de pages</b>. En cas d'erreur, <b>✎ Modifier</b> sur la plage permet de corriger le nom et les pages, ou de la supprimer. À la fin, confirmez et saisissez le nom de l'épreuve : les spéciales sont rangées dans un dossier à ce nom.</li><li><b>+ Nouveau dossier</b> regroupe les spéciales d'une épreuve ; dans le dossier elles sont classées par ordre alphabétique. Avec <b>⋯</b> sur le dossier vous le renommez ou le supprimez (les spéciales restent).</li><li>Touchez le <b>nom</b> d'une spéciale pour voir ses symboles : ✕ enlève un repère erroné, <b>+ Ajouter un scan</b> ajoute des pages. Avec <b>⋯</b> vous renommez, déplacez dans un dossier ou supprimez. Pour en supprimer plusieurs, <b>maintenez</b> une spéciale (ou ⋯ → Supprimer), touchez les autres puis <b>Supprimer</b> en bas.</li><li><b>Charger</b> envoie la spéciale dans le Radar. En revenant ici, <b>Retour au Radar</b> vous ramène au symbole où vous étiez.</li><li><b>Défilement des repères radar</b> : Automatique (le symbole change tout seul) ou Manuel (vous le changez en touchant le partiel). <b>Alerte sonore à 100 m</b> : un double son avant chaque symbole.</li></ul><div class=\"tip\">Photographiez la page bien droite et bien éclairée, en ne cadrant que le tableau.</div>",""],
["🎯","Radar en course","Après <b>Charger</b>, l'écran montre le symbole à suivre.<ul><li>Le nombre vert est la distance jusqu'au prochain symbole ; dans les 100 derniers mètres il devient rouge.</li><li>Les <b>flèches</b> font défiler les symboles sans toucher au partiel ni au total.</li><li><b>Touchez le partiel</b> : remise à zéro et passage au symbole suivant. En Automatique il corrige aussi l'écart de distance.</li><li><b>Maintenez le partiel</b> 1 seconde (barre bleue) : corrige l'écart avec le GPS et remet le partiel à zéro, en restant sur le même symbole.</li><li><b>Maintenez le total</b> 2 secondes au départ de la spéciale : le total et le partiel reviennent à zéro et le Radar repart du symbole 1.</li><li>En paysage la photo est grande. Le bouton <b>⇄</b> change la disposition : photo à gauche, à droite et, sur tablette, en haut.</li><li>La flèche <b>‹</b> en haut à gauche vous ramène à la liste du Scanner radar, pour charger une autre spéciale.</li><li>Le bouton <b>?</b> en haut vous guide pas à pas à l'écran.</li></ul>",""],
["📋","Scanner carnet de contrôle","<ul><li><b>+ Nouveau carnet</b> : saisissez le nom, puis <b>📷 Ajouter une page</b> (photo ou galerie). Chaque page en plus s'additionne : vérifiez que tous les CH sont là.</li><li><b>+ Nouveau dossier</b> regroupe les carnets d'une épreuve. Dans un dossier vous créez directement un nouveau carnet ; avec 📁 vous déplacez ceux que vous avez déjà.</li><li>Saisissez l'heure de départ : l'heure idéale de chaque contrôle se calcule toute seule.</li><li>En course, saisissez l'heure réelle des pointages et le vrai départ des spéciales : les contrôles suivants se décalent tout seuls, en retard comme en avance.</li><li>Activez la <b>🔔</b> sur les contrôles voulus et choisissez les <b>minutes avant</b>.</li><li>Si le scanner a mal lu un temps imparti, corrigez-le avec <b>Modifier</b>.</li></ul><div class=\"tip\">Le bouton <b>?</b> en haut du scanner résume ces étapes.</div>","tc"],
["✍️","Carnet de route manuel","Pour construire le carnet à la main quand le scan est impossible.<ul><li><b>+ Nouveau carnet</b> (un par section) et saisissez le nom.</li><li>Réglez le <b>départ</b> et ajoutez les contrôles avec <b>+ Ajouter un contrôle</b>.</li><li>Pour chaque contrôle choisissez le type (Start section, Service, Regroup, Start SS, TC, Finish, ou <b>Autre…</b> avec le nom de votre choix), le lieu et le target time : l'heure idéale s'additionne toute seule.</li><li>En course saisissez l'heure réelle : vous voyez le retard (+) ou l'avance (−). Un départ de spéciale en retard et le Regroup out décalent les heures idéales suivantes.</li><li><b>Départ ES : pointage +</b> correspond aux minutes entre le pointage et le départ de la spéciale.</li></ul>","tc"],
["🧮","Calculatrice de temps","Pour additionner ou soustraire des heures et des temps impartis. Saisissez une heure (ex. 1335 = 13:35), puis <b>+</b> ou <b>−</b> et une autre durée, enfin <b>=</b>.",""],
["👀","Temps intermédiaires (spectateur)","Pour chronométrer les voitures au bord de la route, au milieu de la spéciale.<ul><li><b>Nouvelle spéciale</b> : nom, intervalle entre les départs, le km de la spéciale où vous êtes et une courte description de l'endroit.</li><li>Saisissez le nom du pilote qui arrive et appuyez sur le <b>bouton rond</b> quand la voiture passe. La première voiture lance le chrono.</li><li>Si une voiture manque ou si l'intervalle change, réglez la case à côté du nom sur 2', 3'…</li><li>La liste va du plus rapide au plus lent. La référence (<b>RÉF.</b>) est le plus rapide, ou le pilote que vous choisissez en le touchant ; en le touchant vous pouvez aussi effacer son temps.</li><li>À la fin touchez <b>Arrêter</b> : la spéciale est close et l'application propose de l'exporter.</li><li><b>Exporter</b> crée une image avec les écarts et les secondes au km, à envoyer par exemple sur WhatsApp.</li></ul><div class=\"tip\">Les temps intermédiaires restent seulement dans le téléphone : ils ne sont pas dans la sauvegarde.</div>",""],
["🔔","Alarmes et notifications","Quand vous activez la 🔔 sur un contrôle, c'est <b>iOS</b> qui tient l'alarme : elle sonne <b>écran éteint</b> et <b>application fermée</b>.<ul><li>L'<b>autorisation de notifications</b> doit être active (l'application la demande la première fois).</li><li>Les alarmes se reprogramment <b>quand l'application est ouverte</b> : après un retard, ouvrez-la un instant pour les mettre à jour.</li><li>Le son se choisit dans <b>Réglages généraux → Son de notification</b>.</li></ul>","tc"],
["💾","Sauvegarde (important)","Les données sont dans le téléphone et iOS <b>peut les supprimer</b> s'il manque de place : faites une sauvegarde avant chaque épreuve.<ul><li><b>Réglages généraux → Exporter la sauvegarde</b> ouvre la liste des spéciales radar et des carnets, tout coché : c'est la sauvegarde complète, réglages compris.</li><li>Pour n'envoyer que certaines spéciales ou certains carnets à quelqu'un, décochez ceux qui ne servent pas : le fichier contient seulement votre choix et en porte le nom.</li><li><b>Importer la sauvegarde</b> : vous voyez ce que contient le fichier et choisissez <b>Ajouter à mes spéciales</b> ou <b>Tout remplacer</b>. Un fichier avec une sélection partielle peut seulement être ajouté.</li></ul><div class=\"tip\">Les temps intermédiaires ne sont pas dans la sauvegarde.</div>",""],
["⚙️","Réglages","Ici vous changez la <b>langue</b>, les <b>unités</b> (km/mi), la <b>taille et le style des chiffres</b> avec aperçu en direct, le <b>format horaire</b> 12/24, le <b>thème</b> et le <b>son des notifications</b>. C'est aussi ici que vous faites <b>Exporter la sauvegarde</b> et <b>Importer la sauvegarde</b>.",""]
],
es:[
["☰","Menú y modos","Toca <b>☰</b> arriba para abrir el menú. Cada sección se abre al tocarla:<ul><li><b>Piloto</b>: modo Piloto y Tabla de palabras.</li><li><b>Navegante</b>: Trip, Escáner radar (desde aquí se abre también el Radar), Escáner de carné de control, Hoja de ruta manual y Calculadora de tiempo.</li><li><b>Espectador</b>: Tiempos intermedios.</li></ul>Abajo están <b>Ajustes generales</b> y esta <b>Guía</b>.","menu"],
["🏁","Piloto","Abre <b>Tabla de palabras</b> desde el menú: escribe una palabra o nota y los metros en los que debe aparecer (Desde incluido, Hasta excluido; Hasta vacío = sin límite).<ul><li>Toca la palabra, o el botón de un mando Bluetooth, para iniciar y parar la medición.</li><li>Cuando el parcial entra en los metros fijados aparece la palabra. Con <b>Leer la palabra en voz alta</b> la oyes en el toque que cierra la medición.</li><li>Encima de la palabra grande, <b>Antes:</b> muestra la de la medición que acabas de cerrar.</li><li><b>Cada toque pone a cero la medición</b>: cada toque empieza de cero en lugar de parar.</li><li><b>Usar metros reales (sin palabras)</b>: solo ves total y parcial en metros.</li><li>Mantén pulsado el <b>total</b> 2 segundos para ponerlo a cero.</li></ul>",""],
["🧭","Navegante / Trip","<b>Parcial</b> siempre activo, <b>velocidad</b> y <b>total</b>.<ul><li>Toca el parcial para ponerlo a cero.</li><li>Mantén pulsado el total 2 segundos para ponerlo a cero.</li><li>El punto del GPS es verde cuando la señal es excelente (menos de 6 m), azul cuando es buena (6–10 m) y rojo cuando es débil (más de 10 m).</li><li>En un túnel, sin GPS, la app sigue contando con la última velocidad durante 60 segundos como máximo.</li></ul>",""],
["📡","Escáner radar","Aquí preparas los tramos del road book.<ul><li><b>+ Nuevo tramo (escanear)</b>: escribe el nombre y fotografía la página, o elige una o varias de la galería. La app encuentra la tabla, recorta cada referencia y junta las páginas en un solo tramo.</li><li><b>📄 Importar desde road book PDF</b>: elige el PDF y, para cada tramo, escribe el nombre y las páginas (de… a…) y toca <b>Añadir</b>; para el siguiente usa <b>+ Añadir rango de páginas</b>. Si te equivocas, <b>✎ Editar</b> en el rango te deja corregir nombre y páginas, o eliminarlo. Al final confirma y escribe el nombre de la prueba: los tramos van a una carpeta con ese nombre.</li><li><b>+ Nueva carpeta</b> reúne los tramos de una prueba; dentro de la carpeta están en orden alfabético. Con <b>⋯</b> en la carpeta la renombras o la eliminas (los tramos se quedan).</li><li>Toca el <b>nombre</b> de un tramo para ver sus símbolos: ✕ quita una referencia equivocada, <b>+ Añadir escaneo</b> añade páginas. Con <b>⋯</b> renombras, mueves a una carpeta o eliminas. Para eliminar varios, <b>mantén pulsado</b> un tramo (o ⋯ → Eliminar), toca los demás y pulsa <b>Eliminar</b> abajo.</li><li><b>Cargar</b> lleva el tramo al Radar. Al volver aquí, <b>Volver al Radar</b> te devuelve al símbolo donde estabas.</li><li><b>Avance de símbolos del radar</b>: Automático (el símbolo cambia solo) o Manual (lo cambias tocando el parcial). <b>Aviso sonoro a 100 m</b>: un doble sonido antes de cada símbolo.</li></ul><div class=\"tip\">Fotografía la página recta y bien iluminada, encuadrando solo la tabla.</div>",""],
["🎯","Radar en carrera","Después de <b>Cargar</b> la pantalla muestra el símbolo que hay que seguir.<ul><li>El número verde es la distancia hasta el próximo símbolo; en los últimos 100 m se vuelve rojo.</li><li>Las <b>flechas</b> pasan los símbolos sin tocar parcial ni total.</li><li><b>Toca el parcial</b>: lo pone a cero y pasa al símbolo siguiente. En Automático corrige también el desfase de distancia.</li><li><b>Mantén pulsado el parcial</b> 1 segundo (barra azul): corrige el desfase con el GPS y pone el parcial a cero, sin cambiar de símbolo.</li><li><b>Mantén pulsado el total</b> 2 segundos en la salida del tramo: total y parcial se ponen a cero y el Radar vuelve al símbolo 1.</li><li>En horizontal la foto es grande. El botón <b>⇄</b> cambia la disposición: foto a la izquierda, a la derecha y, en tableta, arriba.</li><li>La flecha <b>‹</b> arriba a la izquierda te lleva de vuelta a la lista del Escáner radar, para cargar otro tramo.</li><li>El botón <b>?</b> de arriba te guía paso a paso en la pantalla.</li></ul>",""],
["📋","Escáner de carné de control","<ul><li><b>+ Nuevo carné</b>: escribe el nombre y luego <b>📷 Añadir página</b> (foto o galería). Cada página más se suma: comprueba que estén todos los CH.</li><li><b>+ Nueva carpeta</b> agrupa los carnés de una prueba. Dentro de una carpeta creas directamente un carné nuevo; con 📁 mueves los que ya tienes.</li><li>Escribe la hora de salida: la hora teórica de cada control se calcula sola.</li><li>En carrera escribe la hora real de los sellos y la salida real de los tramos: los controles siguientes se desplazan solos, con retraso o adelanto.</li><li>Activa la <b>🔔</b> en los controles que quieras y elige los <b>min antes</b>.</li><li>Si el escáner leyó mal un tiempo impuesto, corrígelo con <b>Editar</b>.</li></ul><div class=\"tip\">El botón <b>?</b> arriba en el escáner resume estos pasos.</div>","tc"],
["✍️","Hoja de ruta manual","Para crear el carné a mano cuando no puedes escanear.<ul><li><b>+ Nuevo carné</b> (uno por sección) y escribe el nombre.</li><li>Fija la <b>salida</b> y añade controles con <b>+ Añadir control</b>.</li><li>En cada control elige el tipo (Start section, Service, Regroup, Start SS, TC, Finish, u <b>Otro…</b> con el nombre que quieras), el lugar y el target time: la hora teórica se suma sola.</li><li>En carrera escribe la hora real: ves el retraso (+) o el adelanto (−). Una salida de tramo con retraso y el Regroup out desplazan las horas teóricas siguientes.</li><li><b>Salida TC: sello +</b> son los minutos entre el sello y la salida del tramo.</li></ul>","tc"],
["🧮","Calculadora de tiempo","Para sumar o restar horas y tiempos impuestos. Escribe la hora (p. ej. 1335 = 13:35), luego <b>+</b> o <b>−</b> y otro tiempo, y por último <b>=</b>.",""],
["👀","Tiempos intermedios (espectador)","Para cronometrar los coches desde la cuneta, a mitad de tramo.<ul><li><b>Nuevo tramo</b>: nombre, intervalo entre salidas, en qué km del tramo estás y una breve descripción del sitio.</li><li>Escribe el nombre del piloto que llega y pulsa el <b>botón redondo</b> cuando pase. El primer coche pone en marcha el cronómetro.</li><li>Si falta un coche o cambia el intervalo, pon la casilla junto al nombre en 2', 3'…</li><li>La lista va del más rápido al más lento. La referencia (<b>REF.</b>) es el más rápido, o el piloto que eliges tocándolo; tocándolo también puedes borrar su tiempo.</li><li>Al final toca <b>Detener</b>: el tramo se cierra y te pregunta si quieres exportar.</li><li><b>Exportar</b> crea una imagen con las diferencias y los segundos por km, para enviar por ejemplo por WhatsApp.</li></ul><div class=\"tip\">Los tiempos intermedios se quedan solo en el teléfono: no entran en la copia de seguridad.</div>",""],
["🔔","Alarmas y notificaciones","Cuando activas la 🔔 en un control, es <b>iOS</b> quien mantiene la alarma: suena con la <b>pantalla apagada</b> y la <b>app cerrada</b>.<ul><li>Hace falta el <b>permiso de notificaciones</b> (la app lo pide la primera vez).</li><li>Las alarmas se reprograman <b>con la app abierta</b>: después de un retraso abre la app un momento para actualizarlas.</li><li>El sonido se elige en <b>Ajustes generales → Sonido de notificación</b>.</li></ul>","tc"],
["💾","Copia de seguridad (importante)","Los datos están en el teléfono e iOS <b>puede borrarlos</b> si necesita espacio: haz una copia antes de cada prueba.<ul><li><b>Ajustes generales → Exportar copia</b> abre la lista de tramos del radar y carnés, todo marcado: así es la copia completa, ajustes incluidos.</li><li>Para enviar a alguien solo algunos tramos o carnés, desmarca los que no hagan falta: el archivo lleva solo lo que elegiste y toma su nombre.</li><li><b>Importar copia</b>: ves lo que contiene el archivo y eliges <b>Añadir a mis tramos</b> o <b>Sustituir todo</b>. Un archivo con una selección parcial solo se puede añadir.</li></ul><div class=\"tip\">Los tiempos intermedios no están en la copia de seguridad.</div>",""],
["⚙️","Ajustes","Aquí cambias <b>idioma</b>, <b>unidades</b> (km/mi), <b>tamaño y estilo de los números</b> con vista previa en directo, <b>formato de hora</b> 12/24, <b>tema</b> y <b>sonido de las notificaciones</b>. Aquí también haces <b>Exportar copia</b> e <b>Importar copia</b>.",""]

de:[
["☰","Menü und Modi","Tippe oben auf <b>☰</b>, um das Menü zu öffnen. Jeder Bereich öffnet sich beim Antippen:<ul><li><b>Fahrer</b>: Fahrer-Modus und Worttabelle.</li><li><b>Beifahrer</b>: Trip, Radar-Scanner (von hier öffnet sich auch das Radar), Bordkarten-Scanner, Bordkarte (manuell) und Zeitrechner.</li><li><b>Zuschauer</b>: Zwischenzeiten.</li></ul>Ganz unten findest du <b>Allgemeine Einstellungen</b> und diese <b>Anleitung</b>.","menu"],
["🏁","Fahrer","Öffne <b>Worttabelle</b> im Menü: Gib ein Wort oder eine Notiz ein und die Meter, bei denen es erscheinen soll (Von inklusive, Bis exklusive; Bis leer = ohne Grenze).<ul><li>Tippe auf das Wort oder die Taste einer Bluetooth-Fernbedienung, um die Messung zu starten und zu stoppen.</li><li>Sobald die Teilstrecke im eingestellten Bereich ist, erscheint das Wort. Mit <b>Wort vorlesen</b> hörst du es beim Tippen, das die Messung beendet.</li><li>Über dem großen Wort zeigt <b>Vorher:</b> das Wort der gerade beendeten Messung.</li><li><b>Jedes Tippen setzt die Messung zurück</b>: Jedes Tippen beginnt wieder bei null, statt zu stoppen.</li><li><b>Echte Meter verwenden (ohne Wörter)</b>: Du siehst nur Gesamt und Teilstrecke in Metern.</li><li>Halte <b>Gesamt</b> 2 Sekunden gedrückt, um es zu nullen.</li></ul>",""],
["🧭","Beifahrer / Trip","<b>Teilstrecke</b> immer aktiv, <b>Geschwindigkeit</b> und <b>Gesamt</b>.<ul><li>Tippe auf die Teilstrecke, um sie zu nullen.</li><li>Halte Gesamt 2 Sekunden gedrückt, um es zu nullen.</li><li>Der GPS-Punkt ist grün bei sehr gutem Signal (unter 6 m), blau bei gutem (6–10 m), rot bei schwachem (über 10 m).</li><li>Im Tunnel ohne GPS zählt die App mit der letzten Geschwindigkeit bis zu 60 Sekunden weiter.</li></ul>",""],
["📡","Radar-Scanner","Hier bereitest du die Prüfungen aus dem Roadbook vor.<ul><li><b>+ Neue Prüfung (scannen)</b>: Namen eingeben und die Seite fotografieren oder eine oder mehrere aus der Mediathek wählen. Die App findet die Tabelle, schneidet jeden Bezugspunkt aus und fasst die Seiten zu einer Prüfung zusammen.</li><li><b>📄 Aus Roadbook-PDF importieren</b>: Wähle das PDF, gib dann für jede Prüfung den Namen und die Seiten (von… bis…) ein und tippe auf <b>Hinzufügen</b>; für die nächste nutze <b>+ Seitenbereich hinzufügen</b>. Bei einem Fehler kannst du mit <b>✎ Bearbeiten</b> am Bereich Name und Seiten korrigieren oder ihn löschen. Zum Schluss bestätigen und den Namen der Veranstaltung eingeben: Die Prüfungen landen in einem Ordner mit diesem Namen.</li><li><b>+ Neuer Ordner</b> hält die Prüfungen einer Veranstaltung zusammen; im Ordner stehen sie alphabetisch. Mit <b>⋯</b> am Ordner benennst du ihn um oder löschst ihn (die Prüfungen bleiben).</li><li>Tippe auf den <b>Namen</b> einer Prüfung, um ihre Symbole zu sehen: ✕ entfernt einen falschen Bezugspunkt, <b>+ Scan hinzufügen</b> fügt Seiten hinzu. Mit <b>⋯</b> umbenennen, in einen Ordner verschieben oder löschen. Um mehrere zu löschen, <b>halte</b> eine Prüfung gedrückt (oder ⋯ → Löschen), tippe die anderen an und dann unten auf <b>Löschen</b>.</li><li><b>Laden</b> bringt die Prüfung ins Radar. Kommst du hierher zurück, bringt dich <b>Zurück zum Radar</b> zum Symbol, bei dem du warst.</li><li><b>Roadbook-Symbolwechsel</b>: Automatisch (das Symbol wechselt von selbst) oder Manuell (du wechselst es durch Tippen auf die Teilstrecke). <b>Tonsignal 100 m vorher</b>: ein Doppelton vor jedem Symbol.</li></ul><div class=\"tip\">Fotografiere die Seite gerade und gut beleuchtet und nur die Tabelle.</div>",""],
["🎯","Radar in der Prüfung","Nach <b>Laden</b> zeigt der Bildschirm das Symbol, dem du folgst.<ul><li>Die grüne Zahl ist die Distanz bis zum nächsten Symbol; auf den letzten 100 m wird sie rot.</li><li>Die <b>Pfeile</b> blättern durch die Symbole, ohne Teilstrecke und Gesamt zu verändern.</li><li><b>Teilstrecke antippen</b>: nullt und geht zum nächsten Symbol. Im Automatikmodus korrigiert es auch die Abweichung.</li><li><b>Teilstrecke 1 Sekunde halten</b> (blauer Balken): korrigiert die Abweichung mit dem GPS und nullt die Teilstrecke, das Symbol bleibt.</li><li><b>Gesamt 2 Sekunden halten</b> am Start der Prüfung: Gesamt und Teilstrecke werden genullt und das Radar beginnt wieder bei Symbol 1.</li><li>Im Querformat ist das Foto groß. Die Taste <b>⇄</b> ändert die Anordnung: Foto links, rechts und auf dem Tablet oben.</li><li>Der Pfeil <b>‹</b> oben links bringt dich zurück zur Liste des Radar-Scanners, um eine andere Prüfung zu laden.</li><li>Die Taste <b>?</b> oben führt dich Schritt für Schritt über den Bildschirm.</li></ul>",""],
["📋","Bordkarten-Scanner","<ul><li><b>+ Neue Bordkarte</b>: Namen eingeben, dann <b>📷 Seite hinzufügen</b> (Foto oder Mediathek). Jede weitere Seite wird addiert: Prüfe, ob alle ZK da sind.</li><li><b>+ Neuer Ordner</b> sammelt die Bordkarten einer Veranstaltung. In einem Ordner legst du direkt eine neue Karte an; mit 📁 verschiebst du vorhandene.</li><li>Gib die Startzeit ein: Die Sollzeit jeder Kontrolle wird automatisch berechnet.</li><li>Im Rennen gibst du die echten Stempelzeiten und die echten Starts der Prüfungen ein: Die folgenden Kontrollen verschieben sich von selbst, nach hinten wie nach vorne.</li><li>Schalte die <b>🔔</b> bei den gewünschten Kontrollen ein und wähle die <b>Min vorher</b>.</li><li>Hat der Scanner eine Sollzeit falsch gelesen, korrigiere sie mit <b>Bearbeiten</b>.</li></ul><div class=\"tip\">Die Taste <b>?</b> oben im Scanner fasst diese Schritte zusammen.</div>","tc"],
["✍️","Bordkarte (manuell)","Zum Anlegen der Karte von Hand, wenn Scannen nicht geht.<ul><li><b>+ Neue Bordkarte</b> (eine pro Abschnitt) und Namen eingeben.</li><li>Lege den <b>Start</b> fest und füge Kontrollen mit <b>+ Kontrolle hinzufügen</b> hinzu.</li><li>Wähle für jede Kontrolle den Typ (Start section, Service, Regroup, Start SS, TC, Finish oder <b>Andere…</b> mit einem eigenen Namen), den Ort und die Target time: Die Sollzeit addiert sich von selbst.</li><li>Im Rennen gibst du die echte Zeit ein: Du siehst Verspätung (+) oder Verfrühung (−). Ein verspäteter Prüfungsstart und Regroup out verschieben die folgenden Sollzeiten.</li><li><b>WP-Start: Stempel +</b> sind die Minuten zwischen Stempel und Start der Prüfung.</li></ul>","tc"],
["🧮","Zeitrechner","Zum Addieren und Subtrahieren von Uhrzeiten und Sollzeiten. Gib eine Zeit ein (z. B. 1335 = 13:35), dann <b>+</b> oder <b>−</b> und eine weitere Zeit, zum Schluss <b>=</b>.",""],
["👀","Zwischenzeiten (Zuschauer)","Zum Stoppen der Autos am Straßenrand, mitten in der Prüfung.<ul><li><b>Neue Prüfung</b>: Name, Startabstand, der Kilometer der Prüfung, an dem du stehst, und eine kurze Beschreibung der Stelle.</li><li>Gib den Namen des Fahrers ein, der gleich kommt, und drücke den <b>runden Knopf</b>, wenn er vorbeifährt. Das erste Auto startet die Stoppuhr.</li><li>Fehlt ein Auto oder ändert sich der Abstand, stelle das Feld neben dem Namen auf 2', 3'…</li><li>Die Liste geht vom Schnellsten zum Langsamsten. Die Referenz (<b>REF.</b>) ist der Schnellste oder der Fahrer, den du durch Antippen wählst; durch Antippen kannst du auch seine Zeit löschen.</li><li>Tippe am Ende auf <b>Stopp</b>: Die Prüfung wird abgeschlossen und die App fragt, ob du exportieren möchtest.</li><li><b>Exportieren</b> erstellt ein Bild mit Abständen und Sekunden pro km, zum Beispiel für WhatsApp.</li></ul><div class=\"tip\">Zwischenzeiten bleiben nur auf dem Telefon: Sie sind nicht im Backup.</div>",""],
["🔔","Wecker und Mitteilungen","Wenn du die 🔔 bei einer Kontrolle einschaltest, hält <b>iOS</b> den Wecker: Er klingelt auch bei <b>ausgeschaltetem Bildschirm</b> und <b>geschlossener App</b>.<ul><li>Die <b>Mitteilungsberechtigung</b> muss an sein (die App fragt beim ersten Mal).</li><li>Die Wecker werden <b>bei geöffneter App</b> neu geplant: Öffne die App nach einer Verspätung kurz, um sie zu aktualisieren.</li><li>Den Ton wählst du unter <b>Allgemeine Einstellungen → Benachrichtigungston</b>.</li></ul>","tc"],
["💾","Backup (wichtig)","Die Daten liegen im Telefon und iOS <b>kann sie löschen</b>, wenn Platz fehlt: Mache vor jeder Veranstaltung ein Backup.<ul><li><b>Allgemeine Einstellungen → Backup exportieren</b> öffnet die Liste der Radar-Prüfungen und Bordkarten, alles angehakt: Das ist das komplette Backup, Einstellungen inklusive.</li><li>Willst du jemandem nur einige Prüfungen oder Karten schicken, entferne die Haken bei denen, die nicht gebraucht werden: Die Datei enthält nur deine Auswahl und trägt ihren Namen.</li><li><b>Backup importieren</b>: Du siehst, was die Datei enthält, und wählst <b>Zu meinen Prüfungen hinzufügen</b> oder <b>Alles ersetzen</b>. Eine Datei mit Teilauswahl kann nur hinzugefügt werden.</li></ul><div class=\"tip\">Zwischenzeiten sind nicht im Backup.</div>",""],
["⚙️","Einstellungen","Hier änderst du <b>Sprache</b>, <b>Einheiten</b> (km/mi), <b>Größe und Stil der Zahlen</b> mit Live-Vorschau, <b>Zeitformat</b> 12/24, <b>Design</b> und <b>Benachrichtigungston</b>. Hier findest du auch <b>Backup exportieren</b> und <b>Backup importieren</b>.",""]
],
pt:[
["☰","Menu e modos","Toca em <b>☰</b> em cima para abrir o menu. Cada secção abre-se ao tocar:<ul><li><b>Piloto</b>: modo Piloto e Tabela de palavras.</li><li><b>Navegador</b>: Trip, Scanner radar (daqui abre-se também o Radar), Scanner do cartão de controlo, Tabela de tempos manual e Calculadora de tempo.</li><li><b>Espectador</b>: Tempos intermédios.</li></ul>No fim estão as <b>Definições gerais</b> e este <b>Guia</b>.","menu"],
["🏁","Piloto","Abre a <b>Tabela de palavras</b> no menu: escreve uma palavra ou nota e os metros em que deve aparecer (De incluído, Até excluído; Até vazio = sem limite).<ul><li>Toca na palavra, ou no botão de um comando Bluetooth, para iniciar e parar a medição.</li><li>Quando o parcial entra nos metros definidos aparece a palavra. Com <b>Ler a palavra em voz alta</b> ouves-a no toque que fecha a medição.</li><li>Por cima da palavra grande, <b>Antes:</b> mostra a da medição que acabaste de fechar.</li><li><b>Cada toque zera a medição</b>: cada toque recomeça do zero em vez de parar.</li><li><b>Usar metros reais (sem palavras)</b>: vês só o total e o parcial em metros.</li><li>Mantém premido o <b>total</b> 2 segundos para o zerar.</li></ul>",""],
["🧭","Navegador / Trip","<b>Parcial</b> sempre ativo, <b>velocidade</b> e <b>total</b>.<ul><li>Toca no parcial para o zerar.</li><li>Mantém premido o total 2 segundos para o zerar.</li><li>O ponto do GPS fica verde quando o sinal é ótimo (menos de 6 m), azul quando é bom (6–10 m) e vermelho quando é fraco (mais de 10 m).</li><li>Num túnel, sem GPS, a app continua a contar com a última velocidade durante 60 segundos no máximo.</li></ul>",""],
["📡","Scanner radar","Aqui preparas as provas do road book.<ul><li><b>+ Nova prova (digitalizar)</b>: escreve o nome e fotografa a página, ou escolhe uma ou mais da galeria. A app encontra a tabela, recorta cada referência e junta as páginas numa só prova.</li><li><b>📄 Importar de road book PDF</b>: escolhe o PDF e, para cada prova, escreve o nome e as páginas (de… a…) e toca em <b>Adicionar</b>; para a seguinte usa <b>+ Adicionar intervalo de páginas</b>. Se te enganares, <b>✎ Editar</b> no intervalo deixa-te corrigir o nome e as páginas, ou eliminá-lo. No fim confirma e escreve o nome do rali: as provas vão para uma pasta com esse nome.</li><li><b>+ Nova pasta</b> junta as provas de um rali; dentro da pasta ficam por ordem alfabética. Com <b>⋯</b> na pasta mudas-lhe o nome ou eliminas (as provas ficam).</li><li>Toca no <b>nome</b> de uma prova para ver os símbolos: ✕ tira uma referência errada, <b>+ Adicionar scan</b> acrescenta páginas. Com <b>⋯</b> mudas o nome, moves para uma pasta ou eliminas. Para eliminar várias, <b>mantém premida</b> uma prova (ou ⋯ → Eliminar), toca nas outras e carrega em <b>Eliminar</b> em baixo.</li><li><b>Carregar</b> leva a prova para o Radar. Ao voltar aqui, <b>Voltar ao Radar</b> leva-te ao símbolo onde estavas.</li><li><b>Avanço dos símbolos do radar</b>: Automático (o símbolo muda sozinho) ou Manual (mudas tu tocando no parcial). <b>Aviso sonoro a 100 m</b>: um som duplo antes de cada símbolo.</li></ul><div class=\"tip\">Fotografa a página direita e bem iluminada, enquadrando só a tabela.</div>",""],
["🎯","Radar em prova","Depois de <b>Carregar</b> o ecrã mostra o símbolo a seguir.<ul><li>O número verde é a distância até ao próximo símbolo; nos últimos 100 m fica vermelho.</li><li>As <b>setas</b> passam os símbolos sem mexer no parcial nem no total.</li><li><b>Toca no parcial</b>: zera e passa ao símbolo seguinte. Em Automático corrige também o desvio de distância.</li><li><b>Mantém premido o parcial</b> 1 segundo (barra azul): corrige o desvio com o GPS e zera o parcial, ficando no mesmo símbolo.</li><li><b>Mantém premido o total</b> 2 segundos na partida da prova: o total e o parcial ficam a zero e o Radar recomeça do símbolo 1.</li><li>Na horizontal a foto é grande. O botão <b>⇄</b> muda a disposição: foto à esquerda, à direita e, no tablet, em cima.</li><li>A seta <b>‹</b> em cima à esquerda leva-te de volta à lista do Scanner radar, para carregar outra prova.</li><li>O botão <b>?</b> em cima guia-te passo a passo no ecrã.</li></ul>",""],
["📋","Scanner do cartão de controlo","<ul><li><b>+ Novo cartão</b>: escreve o nome e depois <b>📷 Adicionar página</b> (foto ou galeria). Cada página a mais soma-se: confirma que estão todos os CH.</li><li><b>+ Nova pasta</b> junta os cartões de um rali. Dentro de uma pasta crias logo um cartão novo; com 📁 moves os que já tens.</li><li>Escreve a hora de partida: a hora teórica de cada controlo calcula-se sozinha.</li><li>Em prova escreve a hora real dos carimbos e a partida real das provas: os controlos seguintes deslocam-se sozinhos, em atraso ou adiantados.</li><li>Liga a <b>🔔</b> nos controlos que quiseres e escolhe os <b>min antes</b>.</li><li>Se o scanner leu mal um tempo imposto, corrige-o com <b>Editar</b>.</li></ul><div class=\"tip\">O botão <b>?</b> em cima no scanner resume estes passos.</div>","tc"],
["✍️","Tabela de tempos manual","Para fazer o cartão à mão quando não dá para digitalizar.<ul><li><b>+ Novo cartão</b> (um por secção) e escreve o nome.</li><li>Define a <b>partida</b> e acrescenta controlos com <b>+ Adicionar controlo</b>.</li><li>Em cada controlo escolhe o tipo (Start section, Service, Regroup, Start SS, TC, Finish, ou <b>Outro…</b> com o nome que quiseres), o local e o target time: a hora teórica soma-se sozinha.</li><li>Em prova escreve a hora real: vês o atraso (+) ou o avanço (−). Uma partida de prova atrasada e o Regroup out deslocam as horas teóricas seguintes.</li><li><b>Partida PE: carimbo +</b> são os minutos entre o carimbo e a partida da prova.</li></ul>","tc"],
["🧮","Calculadora de tempo","Para somar ou subtrair horas e tempos impostos. Escreve a hora (ex. 1335 = 13:35), depois <b>+</b> ou <b>−</b> e outro tempo, e por fim <b>=</b>.",""],
["👀","Tempos intermédios (espectador)","Para cronometrar os carros à beira da estrada, a meio da especial.<ul><li><b>Nova especial</b>: nome, intervalo entre partidas, o km da especial onde estás e uma breve descrição do local.</li><li>Escreve o nome do piloto que vem aí e carrega no <b>botão redondo</b> quando o carro passar. O primeiro carro põe o cronómetro a andar.</li><li>Se faltar um carro ou o intervalo mudar, põe o quadrado ao lado do nome em 2', 3'…</li><li>A lista vai do mais rápido ao mais lento. A referência (<b>REF.</b>) é o mais rápido, ou o piloto que escolhes tocando nele; tocando nele também podes apagar o seu tempo.</li><li>No fim toca em <b>Parar</b>: a especial fica fechada e a app pergunta se queres exportar.</li><li><b>Exportar</b> cria uma imagem com as diferenças e os segundos por km, para enviar por exemplo no WhatsApp.</li></ul><div class=\"tip\">Os tempos intermédios ficam só no telemóvel: não entram na cópia de segurança.</div>",""],
["🔔","Alarmes e notificações","Quando ligas a 🔔 num controlo, é o <b>iOS</b> que guarda o alarme: toca com o <b>ecrã desligado</b> e a <b>app fechada</b>.<ul><li>É preciso a <b>permissão de notificações</b> (a app pede na primeira vez).</li><li>Os alarmes são reprogramados <b>com a app aberta</b>: depois de um atraso abre a app um instante para os atualizar.</li><li>O som escolhe-se em <b>Definições gerais → Som de notificação</b>.</li></ul>","tc"],
["💾","Cópia de segurança (importante)","Os dados estão no telemóvel e o iOS <b>pode apagá-los</b> se precisar de espaço: faz uma cópia antes de cada rali.<ul><li><b>Definições gerais → Exportar cópia</b> abre a lista de provas do radar e cartões, tudo marcado: assim é a cópia completa, com as definições.</li><li>Para enviar a alguém só algumas provas ou cartões, desmarca os que não interessam: o ficheiro tem só o que escolheste e fica com esse nome.</li><li><b>Importar cópia</b>: vês o que o ficheiro contém e escolhes <b>Adicionar aos meus troços</b> ou <b>Substituir tudo</b>. Um ficheiro com uma escolha parcial só pode ser adicionado.</li></ul><div class=\"tip\">Os tempos intermédios não estão na cópia de segurança.</div>",""],
["⚙️","Definições","Aqui mudas o <b>idioma</b>, as <b>unidades</b> (km/mi), o <b>tamanho e estilo dos números</b> com pré-visualização, o <b>formato da hora</b> 12/24, o <b>tema</b> e o <b>som das notificações</b>. É também aqui que fazes <b>Exportar cópia</b> e <b>Importar cópia</b>.",""]
],
ja:[
["☰","メニューとモード","上部の <b>☰</b> をタップしてメニューを開きます。各セクションはタップすると開きます：<ul><li><b>ドライバー</b>：ドライバーモードと言葉テーブル。</li><li><b>ナビ</b>：トリップ、レーダースキャナー（レーダーもここから開きます）、タイムカード・スキャナー、タイムカード（手動）、タイム計算機。</li><li><b>観客</b>：スプリットタイム。</li></ul>一番下に <b>一般設定</b> とこの <b>ガイド</b> があります。","menu"],
["🏁","ドライバー","メニューから <b>言葉テーブル</b> を開き、言葉やノートと、それを表示する距離を入力します（「から」は含む、「まで」は含まない。「まで」が空欄なら上限なし）。<ul><li>言葉、または Bluetooth リモコンのボタンをタップして計測を開始・停止します。</li><li>区間距離が設定した範囲に入ると言葉が表示されます。<b>言葉を読み上げる</b> をオンにすると、計測を終えるタップで読み上げます。</li><li>大きな言葉の上の <b>前回：</b> には、終えたばかりの計測の言葉が表示されます。</li><li><b>タップするたびに計測をリセット</b>：タップするたびに停止せずゼロから計測し直します。</li><li><b>実際のメートルを使う（単語なし）</b>：合計と区間距離をメートルで表示するだけになります。</li><li><b>合計</b> を2秒長押しするとリセットされます。</li></ul>",""],
["🧭","ナビ / トリップ","常に動いている <b>区間距離</b>、<b>速度</b>、<b>合計</b> を表示します。<ul><li>区間距離をタップするとリセットされます。</li><li>合計を2秒長押しするとリセットされます。</li><li>GPSの点は、信号が非常に良いと緑（6 m未満）、良いと青（6〜10 m）、弱いと赤（10 m超）です。</li><li>トンネルなどでGPSがないときは、直前の速度で最大60秒間計測を続けます。</li></ul>",""],
["📡","レーダースキャナー","ロードブックのステージをここで準備します。<ul><li><b>+ 新しいステージ（スキャン）</b>：名前を入力してページを撮影するか、ライブラリから1枚以上選びます。アプリが表を見つけて各基準点を切り出し、ページを1つのステージにまとめます。</li><li><b>📄 ロードブックPDFから読み込む</b>：PDFを選び、ステージごとに名前とページ（開始〜終了）を入力して <b>追加</b> をタップします。次のステージは <b>+ ページ範囲を追加</b> で追加します。間違えたときは範囲の <b>✎ 編集</b> で名前とページを直したり、削除したりできます。最後に確定して大会名を入力すると、ステージはその名前のフォルダに入ります。</li><li><b>＋ 新しいフォルダ</b> で1つの大会のステージをまとめます。フォルダ内では名前順に並びます。フォルダの <b>⋯</b> で名前の変更や削除ができます（ステージは残ります）。</li><li>ステージの <b>名前</b> をタップすると記号が見られます。✕ で間違った基準点を削除、<b>+ スキャンを追加</b> でページを追加。<b>⋯</b> で名前の変更、フォルダへの移動、削除ができます。複数削除するには、ステージを <b>長押し</b>（または ⋯ → 削除）して他のステージをタップし、下の <b>削除</b> を押します。</li><li><b>読み込む</b> でステージをレーダーに送ります。ここに戻ったときは <b>レーダーに戻る</b> で元の記号に戻れます。</li><li><b>ロードブック記号の切替</b>：自動（記号が自動で切り替わる）または手動（区間距離をタップして切り替える）。<b>100 m手前で音を鳴らす</b>：各記号の前に2音のチャイム。</li></ul><div class=\"tip\">ページはまっすぐ、明るい場所で、表だけを写してください。</div>",""],
["🎯","競技中のレーダー","<b>読み込む</b> と、たどるべき記号が画面に表示されます。<ul><li>緑の数字は次の記号までの距離で、残り100 mで赤になります。</li><li><b>矢印</b> は区間距離と合計を変えずに記号を切り替えます。</li><li><b>区間距離をタップ</b>：ゼロにして次の記号へ進みます。自動では距離のずれも補正します。</li><li><b>区間距離を1秒長押し</b>（青いバー）：GPSで距離のずれを補正して区間距離をゼロにします。記号はそのままです。</li><li>ステージのスタートで <b>合計を2秒長押し</b>：合計と区間がゼロになり、レーダーは記号1から始まります。</li><li>横向きでは写真が大きく表示されます。<b>⇄</b> ボタンで配置を変更：写真を左、右、タブレットでは上にも。</li><li>左上の <b>‹</b> 矢印でレーダースキャナーの一覧に戻り、別のステージを読み込めます。</li><li>上部の <b>?</b> ボタンで、画面上で1ステップずつ説明します。</li></ul>",""],
["📋","タイムカード・スキャナー","<ul><li><b>＋ 新しいタイムカード</b>：名前を入力し、<b>📷 ページを追加</b>（写真またはライブラリ）。ページを追加するたびに加算されるので、すべてのTCがそろっているか確認します。</li><li><b>＋ 新しいフォルダ</b> で1つの大会のタイムカードをまとめます。フォルダ内ですぐに新しいカードを作成でき、📁 で既存のカードを移動できます。</li><li>スタート時刻を入力すると、各コントロールの予定時刻が自動で計算されます。</li><li>競技中は実際の押印時刻とステージの実際のスタートを入力：以降のコントロールは遅れでも早着でも自動でずれます。</li><li>必要なコントロールで <b>🔔</b> をオンにし、<b>分前</b> を選びます。</li><li>スキャナーが規定時間を誤読した場合は <b>編集</b> で修正します。</li></ul><div class=\"tip\">スキャナー上部の <b>?</b> ボタンで、この手順をまとめて見られます。</div>","tc"],
["✍️","タイムカード（手動）","スキャンできないときに、カードを手で作ります。<ul><li><b>＋ 新しいタイムカード</b>（区間ごとに1枚）を作り、名前を入力します。</li><li><b>スタート</b> を設定し、<b>＋ コントロールを追加</b> で追加します。</li><li>各コントロールで種類（Start section、Service、Regroup、Start SS、TC、Finish、または好きな名前を付ける <b>その他…</b>）、場所、target time を選ぶと、予定時刻が自動で加算されます。</li><li>競技中は実際の時刻を入力すると、遅れ（+）または早着（−）が表示されます。ステージのスタートの遅れと Regroup out は、以降の予定時刻をずらします。</li><li><b>SSスタート：押印 +</b> は押印からステージのスタートまでの分数です。</li></ul>","tc"],
["🧮","タイム計算機","時刻や規定時間の足し算・引き算に使います。時刻を入力し（例 1335 = 13:35）、<b>+</b> または <b>−</b> と別の時間を入れて、最後に <b>=</b> を押します。",""],
["👀","スプリットタイム（観客）","ステージの途中、沿道で車のタイムを計ります。<ul><li><b>新しいステージ</b>：名前、スタート間隔、ステージ内で自分がいる km 地点、場所の短い説明。</li><li>次に来るドライバーの名前を入力し、車が通過したら <b>丸いボタン</b> を押します。最初の車でストップウォッチが始まります。</li><li>車が欠けたり間隔が変わったりしたら、名前の横の枠を 2'、3'… にします。</li><li>リストは速い順です。<b>基準</b> は最速の車か、タップして選んだドライバーです。タップするとタイムを削除することもできます。</li><li>最後に <b>停止</b> をタップ：ステージが終了し、書き出すかどうか聞かれます。</li><li><b>書き出し</b> で、差と1kmあたりの秒数を入れた画像を作り、WhatsAppなどで送れます。</li></ul><div class=\"tip\">スプリットタイムは端末内だけに保存され、バックアップには含まれません。</div>",""],
["🔔","アラームと通知","コントロールで 🔔 をオンにすると、アラームは <b>iOS</b> が管理します。<b>画面オフ</b> でも <b>アプリを閉じていても</b> 鳴ります。<ul><li><b>通知の許可</b> が必要です（初回にアプリが確認します）。</li><li>アラームは <b>アプリを開いているとき</b> に再設定されます。遅れが出たら一度アプリを開いて更新してください。</li><li>音は <b>一般設定 → 通知音</b> で選べます。</li></ul>","tc"],
["💾","バックアップ（重要）","データは端末内にあり、空き容量が足りないと iOS が <b>削除することがあります</b>。大会の前にバックアップを取ってください。<ul><li><b>一般設定 → バックアップを書き出す</b> で、レーダーのステージとタイムカードの一覧がすべてチェックされた状態で開きます。これが設定も含む完全なバックアップです。</li><li>一部のステージやカードだけを誰かに送るときは、不要なもののチェックを外します。ファイルには選んだものだけが入り、その名前が付きます。</li><li><b>バックアップを読み込む</b>：ファイルの中身を確認して、<b>自分のステージに追加</b> または <b>すべて置き換える</b> を選びます。一部だけを選んだファイルは追加のみできます。</li></ul><div class=\"tip\">スプリットタイムはバックアップに含まれません。</div>",""],
["⚙️","設定","ここで <b>言語</b>、<b>単位</b>（km/mi）、<b>数字の大きさとスタイル</b>（プレビュー付き）、<b>時刻表示</b> 12/24、<b>テーマ</b>、<b>通知音</b> を変更できます。<b>バックアップを書き出す</b> と <b>バックアップを読み込む</b> もここにあります。",""]
],
cs:[
["☰","Menu a režimy","Klepnutím na <b>☰</b> nahoře otevřete menu. Každá sekce se otevře klepnutím:<ul><li><b>Jezdec</b>: režim Řidič a Tabulka slov.</li><li><b>Navigátor</b>: Trip, Skener radaru (odtud se otevírá i Radar), Skener jízdního výkazu, Jízdní výkaz (ruční) a Kalkulačka času.</li><li><b>Divák</b>: Mezičasy.</li></ul>Dole najdete <b>Obecná nastavení</b> a tohoto <b>Průvodce</b>.","menu"],
["🏁","Řidič","V menu otevřete <b>Tabulka slov</b>: zadejte slovo nebo poznámku a metry, kde se má objevit (Od včetně, Do bez; prázdné Do = bez omezení).<ul><li>Klepnutím na slovo nebo na tlačítko Bluetooth ovladače měření spustíte a zastavíte.</li><li>Když dílčí vzdálenost vstoupí do nastavených metrů, objeví se slovo. S volbou <b>Přečíst slovo nahlas</b> ho uslyšíte při klepnutí, které měření ukončí.</li><li>Nad velkým slovem ukazuje <b>Předtím:</b> slovo právě ukončeného měření.</li><li><b>Každé klepnutí vynuluje měření</b>: každé klepnutí začne od nuly místo zastavení.</li><li><b>Používat skutečné metry (bez slov)</b>: uvidíte jen celkovou a dílčí vzdálenost v metrech.</li><li>Podržením <b>celkové</b> vzdálenosti 2 sekundy ji vynulujete.</li></ul>",""],
["🧭","Navigátor / Trip","Stále běžící <b>dílčí</b> vzdálenost, <b>rychlost</b> a <b>celková</b> vzdálenost.<ul><li>Klepnutím na dílčí ji vynulujete.</li><li>Podržením celkové 2 sekundy ji vynulujete.</li><li>Tečka GPS je zelená při výborném signálu (pod 6 m), modrá při dobrém (6–10 m) a červená při slabém (nad 10 m).</li><li>V tunelu bez GPS aplikace počítá dál poslední rychlostí nejvýše 60 sekund.</li></ul>",""],

/* ================= GPS ================= */
function haversine(lat1, lon1, lat2, lon2){
  const R = 6371000, rad = Math.PI/180;
  const dLat = (lat2-lat1)*rad, dLon = (lon2-lon1)*rad;
  const a = Math.sin(dLat/2)**2 +
            Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

function onFix(pos){
  const c = pos.coords;
  const acc = c.accuracy;

  gpsdot.className = acc < 6 ? 'g' : (acc <= 10 ? 'b' : 'r');

  const hasSpeed = (c.speed !== null && !isNaN(c.speed));
  const v = hasSpeed ? (c.speed < 0.7 ? 0 : c.speed) : null;

  if(acc > ACC_LIMIT && !(v !== null && v > 3)) return;

  if(v !== null){
    curSpeed = v;
    lastGoodFix = performance.now();
    lastPos = c;
  } else {
    if(lastPos){
      const d = haversine(lastPos.latitude, lastPos.longitude, c.latitude, c.longitude);
      const noiseFloor = Math.max(2, acc * 0.5);
      if(d >= noiseFloor && d < 500){
        if(!(cfg.mode==='nav') || navAllow(d)){ total += d; if(partialActive()) partial += d; }
      }
    }
    curSpeed = 0;
    lastGoodFix = performance.now();
    lastPos = c;
  }
}

function onErr(err){ gpsdot.className='r'; }

navigator.geolocation.watchPosition(onFix, onErr, {
  enableHighAccuracy: true,
  maximumAge: 0,
  timeout: 15000
});

function activeWord(p){
  for(const r of cfg.rows){
    const a = parseFloat(r.from);
    const b = (r.to === '' || r.to === null || r.to === undefined) ? Infinity : parseFloat(r.to);
    if(!isNaN(a) && r.w && p >= a && p < (isNaN(b) ? Infinity : b)) return r.w;
  }
  return null;
}

/* ================= RADAR ================= */
function parseKm(s){
  if(typeof s === 'number') return s;
  return parseFloat(String(s).replace(',', '.'));
}
/* righe senza km (es. appena scansionate) restano in fondo */
function rbSortKey(r){
  const v = parseKm(r.km);
  return isNaN(v) ? 1e9 : v;
}

/* offset manuale: permette di riancorare il radar al riferimento scelto */
let rbOffset = 0;
let radNextIdx = -1;
let radManualIdx = null;   /* riferimento scelto a mano con le frecce/tap */
let radManualAhead = false; /* true se scelto piu' avanti della posizione attuale */
let radDisplayIdx = 0;     /* riferimento attualmente mostrato */
function radT(){ return total + rbOffset; }

/* azzeramento automatico del parziale a ogni riferimento superato (modalità Radar) */
function rbAutoReset(){
  if(!cfg.rb.length){ rbPassedIdx = null; return; }
  const tR = radT();
  let idx = -1;
  for(let i = 0; i < cfg.rb.length; i++){
    const dM = parseKm(cfg.rb[i].km) * 1000;
    if(isNaN(dM)) continue;
    if(tR >= dM) idx = i;
    else break;
  }
  if(rbPassedIdx === null){
    rbPassedIdx = idx;
    return;
  }
  if(idx > rbPassedIdx && cfg.autoReset){
    const dM = parseKm(cfg.rb[idx].km) * 1000;
    partial = Math.max(0, tR - dM);
  }
  rbPassedIdx = idx;
}

/* zona radar — mostra il riferimento in arrivo con countdown in metri */
let radShownIdx = -2;
/* Avviso a 100 m dal simbolo: due note brevi e morbide (sinusoide con dissolvenza),
   non un beep squillante. Volume basso, dura meno di mezzo secondo. */
let radBeepIdx = -1, radAudioCtx = null;
/* iOS blocca l'audio finche' non c'e' stato un tocco dell'utente: il nostro avviso
   parte mentre guidi, quindi il permesso va preso prima. Lo prendiamo al primo
   tocco nell'app, con un suono muto, e poi il contesto resta utilizzabile. */
function radAudioUnlock(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!radAudioCtx) radAudioCtx = new AC();
    if(radAudioCtx.state === 'suspended') radAudioCtx.resume();
    const b = radAudioCtx.createBuffer(1, 1, 22050);
    const src = radAudioCtx.createBufferSource();
    src.buffer = b; src.connect(radAudioCtx.destination); src.start(0);
  }catch(e){}
}
['touchend','pointerdown','click'].forEach(ev=>{
  document.addEventListener(ev, function once(){ radAudioUnlock(); }, { passive:true });
});

function radarBeep(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!radAudioCtx) radAudioCtx = new AC();
    if(radAudioCtx.state === 'suspended') radAudioCtx.resume();
    const t0 = radAudioCtx.currentTime;
    /* volume alzato (0,12 -> 0,85) e note piu' lunghe: in abitacolo, con il motore,
       il suono precedente non si sentiva nemmeno col volume al massimo.
       Ogni nota ha una seconda voce un'ottava sopra, a volume basso: senza cambiare
       il carattere morbido, il suono "taglia" molto meglio il rumore di fondo. */
    [[660, 0], [880, 0.16]].forEach(([f, off])=>{
      [[f, 1.0], [f*2, 0.30]].forEach(([freq, vol])=>{   /* volume al massimo: in gara il rumore copre tutto */
        const o = radAudioCtx.createOscillator(), g = radAudioCtx.createGain();
        o.type = 'sine'; o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t0 + off);
        g.gain.exponentialRampToValueAtTime(vol, t0 + off + 0.02);    /* attacco dolce */
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.20); /* coda morbida */
        o.connect(g); g.connect(radAudioCtx.destination);
        o.start(t0 + off); o.stop(t0 + off + 0.22);
      });
    });
  }catch(e){}
}

      radDist.textContent = '';
      radImg.style.display = 'none'; radImg.removeAttribute('src');
      radShownIdx = -2;
    }
    radNextIdx = -1;
    return;
  }
  const tR = radT();
  let next = -1, dM = 0;
  for(let i = 0; i < cfg.rb.length; i++){
    const d = parseKm(cfg.rb[i].km) * 1000;
    if(isNaN(d)) continue;
    if(tR < d){ next = i; dM = d; break; }
  }
  /* si torna al flusso automatico solo quando il GPS raggiunge davvero
     il riferimento che stavi guardando in avanti; sfogliando indietro resta fermo */
  if(cfg.autoReset){
    if(radManualIdx !== null && radManualAhead){
      const dSel = parseKm(cfg.rb[radManualIdx].km) * 1000;
      if(!isNaN(dSel) && tR >= dSel) radManualIdx = null;
    }
  } else {
    /* manuale: il simbolo mostrato lo decidi tu; l'app lo aggancia solo la prima volta */
    if(radManualIdx === null) radManualIdx = (next === -1 ? cfg.rb.length - 1 : next);
  }
  let idx, key;
  if(radManualIdx !== null){
    idx = radManualIdx;
    key = 'm' + idx;
    dM = parseKm(cfg.rb[idx].km) * 1000;
    if(isNaN(dM)) dM = tR;
  } else {
    idx = next === -1 ? cfg.rb.length - 1 : next;
    key = next === -1 ? idx + 10000 : next;
  }
  radDisplayIdx = idx;
  radNextIdx = next === -1 ? cfg.rb.length : next;
  /* suono quando mancano 100 m al simbolo mostrato, una volta sola per riferimento */
  if(cfg.radBeep && !isNaN(dM)){
    const left = dM - tR;
    if(left > 0 && left <= 100){ if(radBeepIdx !== idx){ radBeepIdx = idx; radarBeep(); } }
    else if(left > 130) { if(radBeepIdx === idx) radBeepIdx = -1; }
  }
  if(radShownIdx !== key){
    const r = cfg.rb[idx];
    radNum.textContent = idx + 1;
    if(imgGet(r.img)){
      radImg.src = imgGet(r.img);
      radImg.style.display = 'block';
      radSym.style.display = 'none';
      radNote.style.display = 'none';
    } else {
      radImg.style.display = 'none'; radImg.removeAttribute('src');
      radSym.style.display = ''; radNote.style.display = '';
      radSym.textContent = r.s || (next === -1 ? '🏁' : '⚠️');
      radNote.textContent = r.n || '';
    }
    radShownIdx = key;
  }
  const rem = (radManualIdx === null && next === -1) ? 0 : Math.max(0, dM - tR);
  radDist.textContent = fmtDist(rem) + ' ' + distUnit();
  radDist.classList.toggle('near', rem > 0 && rem <= 100);
}

/* frecce: scorrono i riferimenti avanti/indietro senza toccare la misurazione */
function rbJump(dir){
  if(!cfg.rb.length) return;
  const cur = Math.max(0, Math.min(cfg.rb.length - 1, radDisplayIdx));
  const n = Math.max(0, Math.min(cfg.rb.length - 1, cur + dir));
  if(n === radDisplayIdx && radManualIdx !== null) return;
  radManualIdx = n;
  const dSel = parseKm(cfg.rb[n].km) * 1000;
  radManualAhead = !isNaN(dSel) && radT() < dSel;
  radShownIdx = -2;
  if(navigator.vibrate) navigator.vibrate(30);
}

/* frecce sopra la foto: collegate qui (prima non lo erano) */

/* ================= CONTEGGIO CONTINUO + RENDER ================= */
const loc = () => LOCALES[cfg.lang] || 'en-US';
function fmtDist(m){
  const v = isImp() ? m/MI : m/1000;
  return v.toLocaleString(loc(), {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtM(m){ return Math.round(m).toLocaleString(loc()); }
function pad(n){ return n < 10 ? '0'+n : ''+n; }

function frame(){
  const now = performance.now();
  const dtF = (now - lastFrame) / 1000;
  lastFrame = now;

  const d0 = new Date();
  let hh = d0.getHours(), suffix = '';
  if(!cfg.h24){
    suffix = hh >= 12 ? ' PM' : ' AM';
    hh = hh % 12 || 12;
  }
  clock.textContent = pad(hh)+':'+pad(d0.getMinutes())+':'+pad(d0.getSeconds())+suffix;

  const sinceFix = (now - lastGoodFix) / 1000;
  const maxGap = 60; /* modalità galleria sempre attiva */
  const counting = curSpeed > 0 && lastGoodFix > 0 && sinceFix < maxGap;
  if(counting && dtF > 0 && dtF < 1){
    const d = curSpeed * dtF;
    if(!(cfg.mode==='nav') || navAllow(d)){ total += d; if(partialActive()) partial += d; }
  }

  totalVal.textContent = fmtDist(total);
  partialVal.textContent = cfg.mode === 'pilot' ? fmtM(partial) : fmtDist(partial);
  updateNavFree();

  if(cfg.mode === 'nav'){
    const target = counting ? curSpeed : 0;
    dispSpeed += (target - dispSpeed) * Math.min(1, dtF * 3);
    if(Math.abs(target - dispSpeed) < 0.05) dispSpeed = target;
    const s = isImp() ? dispSpeed*2.236936 : dispSpeed*3.6;
    speedVal.textContent = s.toLocaleString(loc(), {minimumFractionDigits:1, maximumFractionDigits:1});
  }

  if(cfg.mode === 'radar'){
    rbAutoReset();
    radarRender();
  }

  if(cfg.mode === 'pilot'){
    if(running){
      /* La parola NON viene piu' letta mentre i metri scorrono: verrebbe letta ogni
         fascia attraversata. Si legge al tocco, ed e' quella della distanza appena
         misurata (vedi speakMeasured in mainAction). */
      currentWord = activeWord(partial);
    }
    if(currentWord){
      if(wordVal.textContent !== currentWord){ wordVal.textContent = currentWord; }
      wordVal.classList.remove('numeric');
    } else {
      wordVal.textContent = fmtM(partial);
      wordVal.classList.add('numeric');
    }
  }
  requestAnimationFrame(frame);
}

/* ================= DISPOSIZIONE RADAR / SCALA NUMERI ================= */
/* Radar in orizzontale: foto grande -> sopra -> sinistra -> destra (tasto ⇄).
   Sul telefono "sopra" non lascia spazio ai metri al prossimo riferimento: si salta,
   e se arriva da un backup del tablet vale come foto grande. Sul tablet ci stanno. */
function radSmall(){ return Math.min(window.innerWidth, window.innerHeight) < 600; }
function radLay(){ return (cfg.lay.rad === 'top' && radSmall()) ? 'big' : cfg.lay.rad; }
function radBigPhoto(){ return cfg.mode === 'radar' && radLay() === 'big'; }

/* legge la parola corrispondente alla distanza appena misurata */
function speakMeasured(dist){
  const w = activeWord(dist);
  /* la parola della misurazione appena chiusa resta scritta sopra quella corrente,
     cosi' durante la misurazione nuova si vede ancora cos'aveva detto prima */
  try{
    const pw = $('prevWord'), pv = $('prevWordVal');
    if(pw && pv){ if(w){ pv.textContent = w; pw.hidden = false; } }
    /* modo metri reali: sopra il parziale restano i metri della misurazione chiusa */
    const pp = $('prevPartial'), ppv = $('prevPartialVal');
    if(pp && ppv && cfg.pilotRealMeters){ ppv.textContent = Math.round(dist) + ' m'; pp.hidden = false; }
  }catch(e){}
  if(!cfg.speak || !('speechSynthesis' in window)) return;
  if(!w) return;
  const u = new SpeechSynthesisUtterance(w);
  u.lang = loc();
  try{ speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}
}

function mainAction(){
  if(cfg.mode !== 'pilot'){
    partial = 0;
    showToast(t('partialResetMsg'));
  } else {
    /* opzione "ogni tocco azzera": il tocco non ferma mai, riparte sempre da zero */
    if(cfg.pilotTapReset){
      speakMeasured(partial);       /* la parola dei metri appena percorsi */
      partial = 0;
      currentWord = null;
      lastSpoken = null;
      running = true;
      zonePartial.classList.remove('stopped');
      zoneWord.classList.remove('stopped');
    } else if(running){
      speakMeasured(partial);       /* la parola dei metri appena percorsi */
      running = false;
      zonePartial.classList.add('stopped');
      zoneWord.classList.add('stopped');
    } else {
      partial = 0;
      currentWord = null;
      lastSpoken = null;
      running = true;
      zonePartial.classList.remove('stopped');
      zoneWord.classList.remove('stopped');
    }

}

});

/* pressione lunga (1 s) sul parziale in radar: azzera lo scarto col GPS */
/* Riallineamento: assorbe i metri in piu' o in meno rispetto al riferimento mostrato,
   cosi' l'errore non si trascina sui riferimenti successivi, e azzera il parziale.
   E' l'azione della pressione lunga; in scorrimento AUTOMATICO la fa anche il tocco
   semplice (richiesta di Roberto, 16 set 2026): li' il simbolo avanza da solo al
   chilometraggio, quindi il tocco serve solo a rimettersi in bolla. */
function radarRealign(advance){
  if(cfg.mode !== 'radar' || !cfg.rb.length) return;
  const i = Math.max(0, Math.min(cfg.rb.length - 1, radDisplayIdx));
  const kmM = parseKm(cfg.rb[i].km) * 1000;
  if(!isNaN(kmM)) rbOffset = kmM - total;
  partial = 0;
  rbPassedIdx = i;
  radManualIdx = null; radManualAhead = false;
  radShownIdx = -2;
  /* col tocco (non con la pressione lunga) si passa anche al simbolo successivo */
  if(advance && i < cfg.rb.length - 1){
    radManualIdx = i + 1;
    const dNext = parseKm(cfg.rb[radManualIdx].km) * 1000;
    radManualAhead = !isNaN(dNext) && radT() < dNext;
  }
  flash.style.opacity = 1;
  setTimeout(()=>flash.style.opacity = 0, 200);
  if(navigator.vibrate) navigator.vibrate([40,40,40]);
}

/* ================= GUIDA INTERATTIVA RADAR ================= */
const RADAR_TUT_STEPS = [
  { el:'radHead',    titleK:'tut1Title', textK:'tut1Text' },
  { el:'radImg',     titleK:'tut2Title', textK:'tut2Text' },
  { el:'radDist',    titleK:'tutDTitle', textK:'tutDText' },   /* 22 nov 2026: i metri verdi hanno un passo loro */
  { el:'zonePartial',titleK:'tut3Title', textK:'tut3Text' },
  { el:'zonePartial',titleK:'tut4Title', textK:'tut4Text' },
  { el:'zoneTotal',  titleK:'tut5Title', textK:'tut5Text' },
  { el:'btnArr',     titleK:'tutLTitle', textK:'tutLText', land:true },   /* tasto ⇄: c'e' solo in orizzontale */
  { el:'btnRadBack', titleK:'tutBTitle', textK:'tutBText' }   /* 23 nov 2026: ‹ torna all'elenco delle prove */
];
let radarTutIdx = 0, radarTutList = RADAR_TUT_STEPS;
const radarTutEl = $('radarTut'), radarTutHi = $('radarTutHi'), radarTutBubble = $('radarTutBubble'),
      radarTutStepNum = $('radarTutStepNum'), radarTutTitle = $('radarTutTitle'), radarTutText = $('radarTutText'),
      radarTutNext = $('radarTutNext'), radarTutSkip = $('radarTutSkip'),
      radarTutDontShowCk = $('radarTutDontShowCk');

function radarTutStart(force){
  if(cfg.radarTutorialSeen && !force) return;
  if(!cfg.rb || !cfg.rb.length) return; /* niente prova caricata: niente da indicare */
  /* solo i passi con l'elemento davvero sullo schermo (il tasto ⇄ c'e' solo in orizzontale) */
  radarTutList = RADAR_TUT_STEPS.filter(st => {
    if(st.land && window.innerWidth <= window.innerHeight) return false;
    const el = $(st.el); if(!el) return false;
    const r = radarTutRect(el); return r.width > 0 && r.height > 0;
  });
  if(!radarTutList.length) return;
  radarTutIdx = 0;
  radarTutEl.classList.add('show');
  radarTutDontShowCk.checked = false;
  radarTutShowStep();
}
/* rettangolo di un elemento; se e' "trasparente" (display:contents, come #radHead
   nel layout Foto grande) misura 0x0: allora uso l'unione dei figli visibili */
function radarTutRect(el){
  const r = el.getBoundingClientRect();
  if(r.width || r.height) return r;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for(const c of el.children){
    const q = c.getBoundingClientRect();
    if(!q.width || !q.height) continue;
    x0 = Math.min(x0, q.left); y0 = Math.min(y0, q.top); x1 = Math.max(x1, q.right); y1 = Math.max(y1, q.bottom);
  }
  if(x0 === Infinity) return r;
  return { left:x0, top:y0, right:x1, bottom:y1, width:x1 - x0, height:y1 - y0 };
}
function radarTutPosition(){
  const step = radarTutList[radarTutIdx];
  if(!step) return;
  const el = $(step.el);
  if(!el) return;
  const r = radarTutRect(el);
  const pad = 10;
  const edge = 3; /* margine minimo dal bordo dello schermo */
  let left = r.left - pad, top = r.top - pad;
  let width = r.width + pad * 2, height = r.height + pad * 2;
  /* tieni il riquadro sempre dentro la viewport, in entrambi gli orientamenti */
  if(left < edge){ width -= (edge - left); left = edge; }
  if(top < edge){ height -= (edge - top); top = edge; }
  if(left + width > window.innerWidth - edge){ width = window.innerWidth - edge - left; }
  if(top + height > window.innerHeight - edge){ height = window.innerHeight - edge - top; }
  width = Math.max(width, 20); height = Math.max(height, 20);
  radarTutHi.style.left = Math.round(left) + 'px';
  radarTutHi.style.top = Math.round(top) + 'px';
  radarTutHi.style.width = Math.round(width) + 'px';
  radarTutHi.style.height = Math.round(height) + 'px';
  const W = window.innerWidth, H = window.innerHeight, b = radarTutBubble;
  if(W <= H){
    /* VERTICALE (22 nov 2026): il riquadro va sotto o sopra l'elemento, dove ci sta,
       senza coprirlo (prima ai passi del parziale finiva sopra il parziale stesso).
       Se non ci sta da nessuna parte va dal lato con piu' spazio. */
    b.style.left = ''; b.style.right = ''; b.style.width = ''; b.style.maxHeight = ''; b.style.overflowY = '';
    b.style.bottom = 'auto'; b.style.top = '0px';
    const mv = 10, gv = 12;
    let hb = b.offsetHeight;
    if(hb > H - 2 * mv){ b.style.maxHeight = (H - 2 * mv) + 'px'; b.style.overflowY = 'auto'; hb = H - 2 * mv; }
    const hlT = top, hlB = top + height;
    let bt;
    if(hlB + gv + hb <= H - mv) bt = hlB + gv;                 /* sotto */
    else if(hlT - gv - hb >= mv) bt = hlT - gv - hb;           /* sopra */
    else bt = (hlT >= H - hlB) ? mv : H - hb - mv;             /* elemento enorme: dal lato piu' libero */
    b.style.top = Math.round(bt) + 'px';
    return;
  }
  /* ORIZZONTALE (24 set 2026): lo schermo e' basso, quindi il riquadro e' piu' stretto
     e va dove c'e' davvero posto — sotto, sopra, a destra o a sinistra dell'elemento —
     ma resta SEMPRE tutto dentro lo schermo. Prima veniva messo sopra senza
     controllare e usciva dal bordo superiore. */
  const m = 8, gap = 12;
  const bw = Math.min(460, Math.round(W * 0.48));
  b.style.right = 'auto'; b.style.bottom = 'auto';
  b.style.width = bw + 'px';
  b.style.maxHeight = (H - 2 * m) + 'px'; b.style.overflowY = 'auto';
  const h = Math.min(b.offsetHeight, H - 2 * m);
  const hl = { l:left, t:top, r:left + width, b:top + height };
  const cx = (hl.l + hl.r) / 2, cy = (hl.t + hl.b) / 2;
  const clampTop = v => Math.max(m, Math.min(v, H - h - m));
  const clampLeft = v => Math.max(m, Math.min(v, W - bw - m));
  let bt, bl;
  if(hl.b + gap + h <= H - m){ bt = hl.b + gap; bl = clampLeft(cx - bw / 2); }            /* sotto */
  else if(hl.t - gap - h >= m){ bt = hl.t - gap - h; bl = clampLeft(cx - bw / 2); }       /* sopra */
  else if(hl.r + gap + bw <= W - m){ bl = hl.r + gap; bt = clampTop(cy - h / 2); }        /* a destra */
  else if(hl.l - gap - bw >= m){ bl = hl.l - gap - bw; bt = clampTop(cy - h / 2); }       /* a sinistra */
  else {                                                                                   /* elemento enorme */
    bl = clampLeft(cx - bw / 2);
    bt = (hl.t - m >= H - hl.b - m) ? m : H - h - m;
  }
  b.style.left = Math.round(bl) + 'px';
  b.style.top = Math.round(bt) + 'px';
}

let ssCurFolder = null;
function ssEsc(x){ return String(x==null?'':x).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ssFolders(){ if(!Array.isArray(cfg.ssFolders)) cfg.ssFolders=[]; return cfg.ssFolders; }
/* SELEZIONE MULTIPLA (23 nov 2026, come su WhatsApp): si entra da ⋯ → Elimina o tenendo premuta
   una prova; si toccano le altre e in basso c'e' Elimina (N). null = selezione spenta. */
let ssSel = null;
let ssSwallow = false;   /* il dito che si alza dopo la pressione lunga non deve spuntare o aprire niente */
document.addEventListener('click', e=>{ if(ssSwallow){ ssSwallow = false; e.stopPropagation(); e.preventDefault(); } }, true);
['touchstart','mousedown'].forEach(ev=>document.addEventListener(ev, ()=>{ ssSwallow = false; }, true));
function ssNameCmp(a,b){ return String(a&&a.name||'').localeCompare(String(b&&b.name||''), undefined, {numeric:true, sensitivity:'base'}); }
function ssSelStart(ss){ ssSel = new Set([ss]); buildSsList(); }
function ssSelEnd(){ ssSel = null; buildSsList(); }
function ssSelToggle(ss){ if(!ssSel) return; if(ssSel.has(ss)) ssSel.delete(ss); else ssSel.add(ss); if(!ssSel.size){ ssSelEnd(); return; } buildSsList(); }
function ssLongPress(row, ss){
  let tm = null, x0 = 0, y0 = 0;
  const stop = ()=>{ if(tm){ clearTimeout(tm); tm = null; } };
  const start = (x,y)=>{ stop(); x0 = x; y0 = y; tm = setTimeout(()=>{ tm = null; ssSwallow = true; if(navigator.vibrate) navigator.vibrate(30); ssSelStart(ss); }, 550); };
  row.addEventListener('touchstart', e=>{ const p = e.touches && e.touches[0]; if(p) start(p.clientX, p.clientY); }, { passive:true });
  row.addEventListener('touchmove', e=>{ const p = e.touches && e.touches[0]; if(p && (Math.abs(p.clientX-x0) > 10 || Math.abs(p.clientY-y0) > 10)) stop(); }, { passive:true });
  row.addEventListener('touchend', stop); row.addEventListener('touchcancel', stop);
  row.addEventListener('mousedown', e=>{ if(e.button === 0) start(e.clientX, e.clientY); });
  row.addEventListener('mouseup', stop); row.addEventListener('mouseleave', stop);
  row.addEventListener('contextmenu', e=>e.preventDefault());
}
function ssSelDelete(){
  if(!ssSel || !ssSel.size) return;
  const arr = Array.from(ssSel);
  const q = arr.length === 1 ? t('ssDelAsk') + ' “' + arr[0].name + '”?' : t('selAsk').replace('{n}', arr.length);
  showConfirm(q, ()=>{
    for(let k = cfg.ssLib.length - 1; k >= 0; k--){
      const ss = cfg.ssLib[k];
      if(!arr.includes(ss)) continue;
      if(ssIsActive(ss)){ cfg.ssActive=''; cfg.ssActiveId=''; cfg.rb=[]; updateSsBadge(); }
      imgDelStage(ss);
      cfg.ssLib.splice(k, 1);
    }
    ssSel = null; saveCfg(); buildSsList();
  });
}
function ssSelBar(){
  let bar = $('ssSelBar');
  if(!ssSel){ if(bar) bar.remove(); return; }
  if(!bar){ bar = document.createElement('div'); bar.id = 'ssSelBar'; $('navMenu').appendChild(bar); }

  const dl = document.createElement('button'); dl.type = 'button'; dl.id = 'ssSelDel'; dl.className = 'ss-seldel'; dl.textContent = '✕ ' + t('selDel').replace('{n}', ssSel.size); dl.addEventListener('click', ssSelDelete);
  bw.appendChild(cn); bw.appendChild(dl); bar.appendChild(bw);

function ssFolderMenu(f){
  const {ov,box}=uiBox();
  const h=document.createElement('div'); h.style.cssText='font-weight:800;color:var(--amber);margin-bottom:12px'; h.textContent='📁 '+f.name; box.appendChild(h);

    b.style.cssText='width:100%;padding:13px;border-radius:10px;font-weight:700;margin-bottom:8px;border:1px solid var(--line,#333);background:var(--btnbg,#222);text-align:left;color:'+(col||'var(--text,#eee)');
