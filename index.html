<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="iRally">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap">
<title>iRally</title>
<style>
  :root{
    --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
    --bg:#000;
    --panel:#111417;
    --line:#2a2f36;
    --amber:#ffb400;
    --amber-dim:#8a6200;
    --green:#39d353;
    --blue:#3b9dff;
    --red:#ff4d4d;
    --text:#f2f4f7;
    --muted:#8b949e;
    --btnbg:rgba(255,255,255,.06);
    --inputbg:#1a1f25;
  }
  body[data-theme="light"]{
    --bg:#f4f5f7;
    --panel:#ffffff;
    --line:#c9ced6;
    --amber:#b36b00;
    --amber-dim:#d8b26e;
    --green:#178c3b;
    --blue:#0b6bd6;
    --red:#d62828;
    --text:#14171c;
    --muted:#5c6670;
    --btnbg:rgba(0,0,0,.05);
    --inputbg:#eef0f3;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{--numscale:1}
  body[data-numsize="0"]{--numscale:.78}
  body[data-numsize="1"]{--numscale:1}
  body[data-numsize="2"]{--numscale:1.3}
  body[data-numfont="share"]{--mono:'Share Tech Mono',ui-monospace,Menlo,Consolas,monospace}
  body[data-numfont="orbitron"]{--mono:'Orbitron',ui-monospace,Menlo,Consolas,monospace}
  body[data-numfont="system"]{--mono:ui-monospace,Menlo,Consolas,monospace}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,sans-serif;
    overflow:hidden;
    user-select:none;-webkit-user-select:none;
  }

  #statusbar{
    position:fixed;top:0;left:0;right:0;z-index:6;
    display:flex;justify-content:space-between;align-items:center;
    padding:4px 12px;min-height:38px;font-size:12px;color:var(--muted);
    padding-top:calc(env(safe-area-inset-top) + 4px);
  }
  #clock{
    font-family:var(--mono);
    font-size:18px;font-weight:700;color:var(--text);
    font-variant-numeric:tabular-nums;letter-spacing:.05em;
  }
  #gpsdot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--red);vertical-align:middle}
  #gpsdot.g{background:var(--green)}
  #gpsdot.b{background:var(--blue)}
  #gpsdot.r{background:var(--red)}
  #btnInfo{
    background:var(--btnbg);border:1px solid var(--line);color:var(--muted);
    border-radius:50%;width:22px;height:22px;font-size:12px;margin-left:8px;vertical-align:middle;
  }
  #btnMenu{background:var(--btnbg);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:7px 14px;font-size:18px}
  #btnArr{
    display:none;
    background:var(--btnbg);border:1px solid var(--line);color:var(--muted);
    border-radius:6px;padding:4px 10px;font-size:16px;margin-right:8px;
  }
  @media (orientation:landscape){
    body[data-mode="radar"] #btnArr{display:inline-block}
  }

  #legend{
    position:fixed;top:56px;left:10px;z-index:9;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px 16px;font-size:13px;display:none;max-width:280px;line-height:1.6;
  }
  #legend.open{display:block}
  #legend b{display:block;margin-bottom:4px;color:var(--text)}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}

  /* ====== LAYOUT PILOTA ====== */
  #app{
    display:grid;
    height:100dvh;
    padding-top:calc(42px + env(safe-area-inset-top));
    padding-bottom:calc(env(safe-area-inset-bottom) + 2px);
    grid-template-columns:1.2fr 1fr;
    grid-template-rows:1fr 1fr;
    grid-template-areas:
      "word total"
      "word partial";
  }
  @media (orientation:portrait){
    #app{
      grid-template-columns:1fr;
      grid-template-rows:1fr 1fr 2fr;
      grid-template-areas:
        "total"
        "partial"
        "word";
    }
  }
  #zoneSpeed{display:none}
  #zoneRadar{display:none}

  /* ====== LAYOUT NAVIGATORE / TRIP ====== */
  body[data-mode="nav"] #app{
    grid-template-columns:1.3fr 1fr;
    grid-template-rows:auto 1fr 1fr;
    grid-template-areas:
      "freebar freebar"
      "partial total"
      "partial speed";
  }
  @media (orientation:portrait){
    body[data-mode="nav"] #app{
      grid-template-columns:1fr;
      grid-template-rows:auto 1.7fr 1fr 0.8fr;
      grid-template-areas:
        "freebar"
        "partial"
        "total"
        "speed";
    }
  }
  body[data-mode="nav"] #zoneWord{display:none}
  body[data-mode="nav"] #zoneSpeed{display:flex}
  body[data-mode="nav"] #zonePartial{cursor:pointer}
  body[data-mode="nav"] #partialVal{
    font-size:calc(clamp(76px,17vw,200px) * var(--numscale));
    color:var(--text);
  }
  body[data-mode="nav"] #totalVal{
    font-size:calc(clamp(48px,11vw,120px) * var(--numscale));
  }

  /* ====== LAYOUT RADAR ====== */
  body[data-mode="radar"] #app{
    grid-template-columns:1fr 1fr;
    grid-template-rows:minmax(0,1fr) auto minmax(0,1fr);
    grid-template-areas:
      "radar radar"
      "badge badge"
      "partial total";
  }
  @media (orientation:portrait){
    body[data-mode="radar"] #app{
      grid-template-columns:1fr;
      grid-template-rows:minmax(0,1.3fr) auto minmax(0,0.65fr) minmax(0,0.65fr);
      grid-template-areas:
        "radar"
        "badge"
        "partial"
        "total";
    }
  }
  body[data-mode="radar"] #zoneWord{display:none}
  body[data-mode="radar"] #zoneRadar{display:flex}
  body[data-mode="radar"] #zonePartial{cursor:pointer}
  body[data-mode="radar"] #partialVal,
  body[data-mode="radar"] #totalVal{
    font-size:calc(clamp(40px,10vw,92px) * var(--numscale));
  }
  body[data-mode="radar"] #partialVal{color:var(--text)}

  /* disposizioni alternative in orizzontale */
  @media (orientation:landscape){
    body[data-mode="radar"][data-arr="left"] #app{
      grid-template-columns:1.5fr 1fr;
      grid-template-rows:auto minmax(0,1fr) minmax(0,1fr);
      grid-template-areas:
        "radar badge"
        "radar partial"
        "radar total";
    }
    body[data-mode="radar"][data-arr="right"] #app{
      grid-template-columns:1fr 1.5fr;
      grid-template-rows:auto minmax(0,1fr) minmax(0,1fr);
      grid-template-areas:
        "badge radar"
        "partial radar"
        "total radar";
    }
    body[data-mode="radar"][data-arr="left"] #zoneRadar,
    body[data-mode="radar"][data-arr="right"] #zoneRadar{
      flex-direction:column;flex-wrap:nowrap;gap:8px;
    }
    /* nelle disposizioni laterali dimensiona sull'altezza per non tagliare nulla */
    body[data-mode="radar"][data-arr="left"] #radSym,
    body[data-mode="radar"][data-arr="right"] #radSym{
      font-size:clamp(40px,18vh,96px);
    }
    body[data-mode="radar"][data-arr="left"] #radNote,
    body[data-mode="radar"][data-arr="right"] #radNote{
      font-size:clamp(14px,4.6vh,26px);
      max-height:3.2em;
    }
    body[data-mode="radar"][data-arr="left"] #radDist,
    body[data-mode="radar"][data-arr="right"] #radDist{
      font-size:calc(clamp(34px,12vh,78px) * var(--numscale));
    }
  }

  body[data-mode="nav"] .zlabel,
  body[data-mode="radar"] .zlabel{
    left:12px;right:auto;top:10px;
    background:var(--btnbg);
    border:1px solid var(--line);
    border-radius:8px;
    padding:5px 10px;
    font-size:11px;
    color:var(--text);
  }
  #ssBadge{
    grid-area:badge;
    display:none;
    justify-self:end;
    margin:2px 14px 0;
    background:var(--green);color:#000;
    border-radius:8px;padding:5px 12px;
    font-size:12px;font-weight:800;letter-spacing:.03em;
    max-width:80%;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  body[data-mode="radar"] #ssBadge.show{display:block}

  .zone{
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    padding:26px 8px 10px;
    border:1px solid var(--line);
    border-radius:18px;
    margin:8px;
    background:var(--panel);
    position:relative;
    overflow:hidden;
  }
  .zlabel{
    position:absolute;top:10px;left:14px;right:14px;
    font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
  }
  .unit{font-size:14px;color:var(--muted);margin-top:2px;letter-spacing:.1em}

  #zoneTotal{grid-area:total;cursor:pointer}
  #holdBar,#holdBarP{
    position:absolute;left:0;bottom:0;height:6px;width:0;
    background:var(--red);border-radius:0 3px 3px 0;
  }
  #holdBarP{background:var(--blue)}
  #toast{
    position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(16px);
    background:var(--green);color:#000;
    border-radius:999px;padding:8px 18px;
    font-size:14px;font-weight:800;z-index:8;
    opacity:0;pointer-events:none;
    transition:opacity .25s, transform .25s;
    max-width:86vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #totalVal{
    font-family:var(--mono);
    font-size:calc(clamp(40px,9vw,92px) * var(--numscale));font-weight:700;
    font-variant-numeric:tabular-nums;line-height:1;
  }

  #zonePartial{grid-area:partial}
  #partialVal{
    font-family:var(--mono);
    font-size:calc(clamp(44px,10vw,100px) * var(--numscale));font-weight:800;
    font-variant-numeric:tabular-nums;line-height:1;
    color:var(--amber);
  }
  #zonePartial.stopped #partialVal{color:var(--amber-dim)}
  body[data-mode="nav"] #zonePartial.stopped #partialVal,
  body[data-mode="radar"] #zonePartial.stopped #partialVal{color:var(--text)}

  #zoneSpeed{grid-area:speed}
  #speedVal{
    font-family:var(--mono);
    font-size:calc(clamp(48px,11vw,120px) * var(--numscale));font-weight:800;
    font-variant-numeric:tabular-nums;line-height:1;
    color:var(--blue);
  }

  /* zona radar: riga orizzontale, solo testo, senza bordo né pannello */
  #zoneRadar{
    grid-area:radar;
    flex-direction:row;flex-wrap:wrap;
    justify-content:center;align-items:center;
    gap:6px 16px;
    border:none;background:none;
    text-align:center;padding:0 14px;
  }
  #radNum{
    display:inline-block;
    background:var(--green);color:#000;
    border-radius:8px;padding:2px 12px;
    font-size:clamp(16px,4vw,26px);font-weight:800;
    font-family:var(--mono);
    flex-shrink:0;
  }
  #radSym{
    font-size:clamp(54px,13vw,120px);line-height:1;
    flex-shrink:0;
  }
  #radNote{
    color:var(--text);
    font-size:clamp(20px,5vw,40px);font-weight:800;
    text-transform:uppercase;word-break:break-word;
    max-width:100%;
  }
  #radDist{
    font-family:var(--mono);
    font-size:calc(clamp(48px,12vw,100px) * var(--numscale));font-weight:800;color:var(--green);
    font-variant-numeric:tabular-nums;
    flex-shrink:0;
  }
  #radDist.near{color:var(--red)}
  #radHead{display:flex;align-items:center;gap:10px;flex-shrink:0}
  #radHead button{
    background:var(--btnbg);border:1px solid var(--line);color:var(--text);
    border-radius:10px;width:46px;height:46px;font-size:20px;line-height:1;
  }
  #radHead button:active{background:var(--amber);color:#000}
  #radImg{
    display:none;max-width:100%;max-height:100%;height:auto;
    object-fit:contain;border-radius:10px;background:#fff;
  }
  @media (orientation:portrait){
    body[data-mode="radar"] #radImg{max-height:34vh}
  }
  @media (orientation:landscape){
    body[data-mode="radar"][data-arr="top"] #radImg{max-height:34vh}
    body[data-mode="radar"][data-arr="left"] #radImg,
    body[data-mode="radar"][data-arr="right"] #radImg{max-height:54vh}
  }
  #scanCv{width:100%;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--panel)}
  .scanrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;font-size:14px}
  .scanrow input[type=range]{flex:1;max-width:55%}
  .scanrow input[type=number]{width:84px;padding:8px;background:var(--inputbg);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:16px}
  #scanPick,#openScan{
    width:100%;padding:13px;border-radius:10px;font-size:15px;font-weight:700;
    background:var(--btnbg);border:2px solid var(--green);color:var(--green);margin-bottom:10px;
  }
  #scanMsg{font-size:13px;color:var(--green);min-height:18px;margin-bottom:6px}
  .rb-thumb{width:100%;border-radius:6px;border:1px solid var(--line);display:block;background:#fff}
  .rb-imgdel{background:none;border:none;color:var(--red);font-size:11px;padding:4px 0;width:100%}

  #zoneWord{grid-area:word;cursor:pointer}
  #wordVal{
    font-size:calc(clamp(64px,15vw,170px) * var(--numscale));
    font-weight:900;line-height:1;
    text-align:center;
    color:var(--green);
    text-transform:uppercase;
    word-break:break-word;
    padding:0 10px;
  }
  #wordVal.numeric{
    font-family:var(--mono);
    color:var(--amber);
    font-variant-numeric:tabular-nums;
  }
  #zoneWord.stopped #wordVal.numeric{color:var(--amber-dim)}
  #wordState{
    position:absolute;bottom:12px;
    font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
  }
  #wordState.run{color:var(--green)}

  /* ====== DRAWER ====== */
  #drawerBg{
    position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:11;
    display:none;
  }
  #drawerBg.open{display:block}
  #drawer{
    position:fixed;top:0;right:0;bottom:0;width:min(300px,85vw);z-index:12;
    background:var(--panel);border-left:1px solid var(--line);
    transform:translateX(105%);transition:transform .25s ease;
    display:flex;flex-direction:column;padding:22px 20px;
    padding-top:max(22px, env(safe-area-inset-top));
    overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  #drawer.open{transform:translateX(0)}
  #drawer h2{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600}
  .drawer-item{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:none;border:none;border-bottom:1px solid var(--line);
    color:var(--text);
    padding:17px 2px;font-size:16px;font-weight:600;letter-spacing:.02em;
    text-align:left;width:100%;
  }
  .drawer-item .di-tag{
    font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--green);display:none;flex-shrink:0;
  }
  .drawer-item.active{color:var(--amber)}
  .drawer-item.active .di-tag{display:inline}
  .dsep{height:26px;flex-shrink:0}

  /* ====== OVERLAY ====== */
  .overlay{
    position:fixed;inset:0;background:var(--bg);z-index:13;
    display:none;flex-direction:column;padding:18px;overflow-y:auto;
    padding-top:max(18px, env(safe-area-inset-top));
  }
  .overlay.open{display:flex}
  .overlay h2{font-size:17px;letter-spacing:.15em;text-transform:uppercase;color:var(--amber);margin-bottom:10px}
  .overlay h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
  .overlay p{font-size:14px;color:var(--text);margin-bottom:10px;line-height:1.5}
  .overlay p.small{font-size:13px;color:var(--muted)}
  .okbtn{
    background:var(--amber);color:#fff;border:none;width:100%;
    padding:15px;border-radius:10px;font-size:16px;font-weight:700;margin-top:auto;
  }
  body[data-theme="dark"] .okbtn{color:#000}
  .chk{display:flex;align-items:center;gap:10px;font-size:14px;margin:14px 0}
  .chk input{width:22px;height:22px}
  .grow{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}
  .gbadge{
    flex-shrink:0;min-width:92px;text-align:center;
    background:var(--inputbg);border:1px solid var(--line);color:var(--green);
    border-radius:8px;padding:7px 10px;
    font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    font-family:var(--mono);
  }
  .grow p{margin:0;font-size:14px;line-height:1.55}

  table{width:100%;border-collapse:collapse;margin-bottom:14px}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:6px 3px}
  td{padding:3px}
  td input, td select{
    width:100%;padding:10px 8px;background:var(--inputbg);border:1px solid var(--line);
    border-radius:8px;color:var(--text);font-size:16px;
  }
  td select{font-size:20px;padding:8px 4px}
  td button{background:none;border:none;color:var(--red);font-size:20px;padding:6px}
  .rowbtns{display:flex;gap:10px;margin-bottom:8px}
  .rowbtns button{
    flex:1;padding:14px;border-radius:10px;font-size:15px;font-weight:600;
    background:var(--panel);border:1px solid var(--line);color:var(--text);
  }
  .setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;font-size:14px}
  .setting-row select{padding:10px;background:var(--inputbg);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:15px}
  .setting-row input[type=checkbox]{width:24px;height:24px}
  .g-lead{color:var(--muted);font-size:13px;margin:0 0 12px}
  #guideAcc{margin-bottom:14px}
  .gsec{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;background:var(--panel)}
  .gsec-h{width:100%;text-align:left;background:transparent;border:0;color:var(--text);font-size:15px;font-weight:700;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .gsec-h::after{content:'\25B8';color:var(--muted);font-size:16px;transition:transform .15s ease}
  .gsec.open .gsec-h::after{transform:rotate(90deg)}
  .gsec-b{display:none;padding:2px 14px 14px;font-size:14px;line-height:1.55;color:var(--text)}
  .gsec.open .gsec-b{display:block}
  .gsec-b b{color:var(--green);font-weight:700}
  .gsec-b ul{margin:8px 0 0;padding-left:20px}
  .gsec-b li{margin:6px 0}
  .gsec-b .tip{color:var(--muted);font-style:italic;margin-top:10px;font-size:13px}
  #navFree{display:none;grid-area:freebar;align-items:center;gap:9px;padding:4px 16px 2px;min-height:0}
#navFreeTrack{flex:1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
#navFreeFill{height:100%;width:0;background:var(--green);transition:width .3s linear}
#navFreeTxt{font-family:var(--mono,monospace);font-size:12px;font-weight:700;color:var(--muted);min-width:52px;text-align:right}
.pw-body{padding:4px 4px 20px}
#paywall .tc-topbar{display:flex;align-items:center;justify-content:space-between;padding:2px 0 12px}
#paywall .tc-topbar h2{margin-bottom:0;text-transform:none;letter-spacing:.06em}
#paywall .tc-x{background:var(--btnbg);border:1px solid var(--line);color:var(--text);border-radius:50%;width:38px;height:38px;font-size:17px;font-weight:700;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.pw-sub{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 16px}
.pw-plan{display:block;width:100%;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:12px;position:relative;color:var(--text)}
.pw-plan.sel{border-color:var(--green);box-shadow:0 0 0 3px rgba(37,224,168,.10)}
.pw-plan .pw-check{position:absolute;top:14px;right:14px;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:transparent}

<script>
(function(){
'use strict';
/* --- chiave app + ID dispositivo per il worker (tetto per utente) --- */
window.__rallyAuth = (function(){
  var d; try{ d = localStorage.getItem('rally_device'); }catch(e){}
  if(!d){ d = 'dev-' + Date.now().toString(36) + Math.random().toString(36).slice(2,10); try{ localStorage.setItem('rally_device', d); }catch(e){} }
  return { key: 'iRallyK3y9Xq7SdP2vLm2026', device: d };
})();
/* --- iRally Pro: stato abbonamento + paywall --- */
window.__rcPro = false; // verra' impostato da RevenueCat (entitlement "pro") dopo l'integrazione
window.__rallyPro = { isPro: function(){ return window.__rcPro===true; } };
window.__rallyShowPaywall = function(){ rcBusy=false; var p=document.getElementById('paywall'); if(p) p.classList.add('open'); };
/* --- RevenueCat: acquisti veri (attivi dentro l'app iOS; sul web restano i messaggi) --- */
var RC_KEY = 'appl_qWGygZKkYncucSMVrHIzItFkWUQ';
var rcPkgs = { year:null, month:null };
var rcReady=false; var rcBusy = false;
function rcSay(t,ti){ if(typeof showMsg==='function') showMsg(t,ti); }
function rcPlugin(){ try{ return (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Purchases) || null; }catch(e){ return null; } }
function rcInfoOf(r){ return r && (r.customerInfo || r.purchaserInfo || r); }
function rcHasPro(info){ try{ return !!(info && info.entitlements && info.entitlements.active && info.entitlements.active['pro']); }catch(e){ return false; } }
function rcApply(info){
  var was = window.__rcPro;
  window.__rcPro = rcHasPro(info);
  if(window.__rcPro && !was){ var p=document.getElementById('paywall'); if(p) p.classList.remove('open'); }
  try{ if(typeof updateNavFree==='function') updateNavFree(); }catch(e){}
}
function rcShowUserId(){
  try{
    var v=document.getElementById('supCodeVal');
    var id = window.__rcUserId || (window.__rallyAuth && window.__rallyAuth.device) || '';
    if(v && id) v.textContent = id;
    var row=document.getElementById('supCode');
    if(row && !row.__wired){ row.__wired=true; row.addEventListener('click', function(){
      var t=(document.getElementById('supCodeVal')||{}).textContent||'';
      if(!t || t==='\u2014') return;
      try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t); rcSay('ID assistenza copiato.', 'Info'); return; } }catch(e){}
      try{
        var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta); rcSay('ID assistenza copiato.', 'Info');
      }catch(e){}
    }); }

var FREE_KM_WEEK = 50;
function navWeekKey(){ var d=new Date(); var diff=(d.getDay()-2+7)%7; var t=new Date(d.getFullYear(),d.getMonth(),d.getDate()-diff); return t.getFullYear()+'-'+(t.getMonth()+1)+'-'+t.getDate(); }
function navUsedM(){ try{ if(localStorage.getItem('nav_week')!==navWeekKey()){ localStorage.setItem('nav_week',navWeekKey()); localStorage.setItem('nav_used','0'); } return parseFloat(localStorage.getItem('nav_used')||'0')||0; }catch(e){ return 0; } }
function navRemainM(){ return Math.max(0, FREE_KM_WEEK*1000 - navUsedM()); }
var navPaywallShown=false;
function navAllow(d){ if(window.__rallyPro && window.__rallyPro.isPro()) return true; if(navRemainM()<=0){ if(!navPaywallShown){ navPaywallShown=true; window.__rallyShowPaywall(); } return false; } try{ localStorage.setItem('nav_used', String(navUsedM()+d)); }catch(e){} return true; }
function updateNavFree(){ var el=document.getElementById('navFree'); if(!el) return; var pro=window.__rallyPro&&window.__rallyPro.isPro(); if(cfg.mode==='nav' && !pro){ el.style.display='flex'; var frac=Math.max(0,Math.min(1, navUsedM()/(FREE_KM_WEEK*1000))); var f=document.getElementById('navFreeFill'); if(f){ f.style.width=(frac*100).toFixed(1)+'%'; f.style.background = frac<0.7?'var(--green)':(frac<0.9?'var(--amber)':'var(--red)'); } var rem=navRemainM()/1000; var tx=document.getElementById('navFreeTxt'); if(tx) tx.textContent=(rem<10?rem.toFixed(1):Math.round(rem))+' km'; } else { el.style.display='none'; } }

const SYM_WORDS = [
  [/rotond|roundabout|rond/i, '🔄'],
  [/incrocio|crossroad|junction|bivio|fork/i, '➕'],
  [/sinistra|left|gauche/i, '⬅️'],
  [/destra|right|droite/i, '➡️'],
  [/diritto|dritto|straight|ahead/i, '⬆️'],

  [/ferrovia|railway|passaggio a livello|rail/i, '🛤️'],
  [/chiesa|church/i, '⛪'],
  [/benzina|carburante|fuel|refuel/i, '⛽'],
  [/pericolo|attenzione|caution|danger|!!/i, '⚠️'],
  [/partenza|start|t\.?c\.?|c\.?o\.?|controllo|timbro|orologio|clock/i, '🕐'],
  [/arrivo|finish|fine/i, '🏁']
];
function wordToSym(s){
  for(const [re, sym] of SYM_WORDS){ if(re.test(s)) return sym; }
  return '⚠️';
}
function extractExit(s){
  const m = String(s).match(/((?:prima|seconda|terza|quarta|quinta|sesta|1|2|3|4|5|6)\s*[ªa°]?\s*uscita|uscita\s*(?:n\.?\s*)?\d)/i);
  return m ? m[1].toUpperCase() : null;
}

["⚙️","Impostazioni","Da qui cambi <b>lingua</b>, <b>unità</b> (km/mi), <b>stile e dimensione dei numeri</b> con anteprima dal vivo, <b>tema</b> e formato orario 12/24."]

en:[
["☰","Menu and modes","Tap <b>☰</b> at the top to open the menu and pick what to use: <b>Driver</b> (reads notes at set distances), <b>Co-driver / Trip</b> (partial and speed), <b>Radar</b> (road book), <b>Time card scanner</b>, <b>Manual time card</b>, <b>Settings</b> and <b>Guide</b>."],
["🏁","Driver","Set a <b>word or note</b> and the <b>metre range</b> where it should appear. During the stage, when the counter enters the range the note shows up and is <b>read aloud</b> if you turn the switch on. Reset the counter at the start.<div class=\"tip\">With a compatible Bluetooth remote you can reset the partial without touching the screen.</div>"],
["🧭","Co-driver / Trip","<b>Always-on partial</b>, <b>speed</b> and <b>GPS quality</b>. In a tunnel turn on <b>Tunnel mode</b>: distance keeps being estimated even without signal. Hold the partial to reset it."],
["📡","Radar (road book)","<ul><li>Tap <b>+</b> to create a stage: type a name, photograph the page and the app reads and saves it on its own.</li><li>Tap a saved stage to <b>load</b> it.</li><li>In the race <b>reset the TOTAL</b> at the start (hold 2 seconds).</li><li>Hold the <b>PARTIAL</b> to zero the metres and jump <b>straight to the next reference</b>.</li><li>For each reference you see <b>number</b>, <b>photo</b> and <b>metres to go</b>. The arrows scroll without touching the total.</li></ul><div class=\"tip\">Photograph the page straight and well lit.</div>"],
["📋","Time card scanner","<ul><li>Tap <b>+</b> and give it any name.</li><li>Photograph <b>every page</b>: the <b>controls add up</b>, so you can check none are missing.</li><li>Enter the <b>actual start time</b>: due times are worked out automatically.</li><li>If a stage starts late, the <b>following controls shift</b> by themselves.</li><li>Turn on the <b>🔔</b> on the controls you want and choose <b>how many minutes before</b>.</li><li>During the race just open the file by name: everything is ready.</li></ul><div class=\"tip\">Everything is stored on the phone and included in the backup.</div>"],
["✍️","Manual time card","Same as above, but built by hand when you cannot scan.<ul><li>Tap <b>+</b> and give it a name (one card per section).</li><li>Set the start time and add the controls.</li><li>For each control pick type, location and allowed minutes: the due time adds up on its own.</li><li>During the race write the real time you stamped: the app works out the delay and shifts the following due times.</li></ul>"],
["🔔","Alarms and notifications","When you turn on the 🔔 for a control, <b>iOS</b> holds the alarm: it rings with the <b>screen off</b> and the <b>app closed</b>.<ul><li>The <b>notification permission</b> must be on (the app asks the first time).</li><li>Alarms are rescheduled <b>while the app is open</b>: after a delay, reopen the app briefly so they update.</li></ul>"],
["💾","Backup (important)","Data lives on the phone and iOS <b>can delete it</b> if it needs space. Before an event use <b>Settings → Export</b> and save the file; use <b>Import</b> to put it back. The backup holds everything: radar stages, time cards, alarms and settings."],
["⚙️","Settings","Here you change <b>language</b>, <b>units</b> (km/mi), <b>number style and size</b> with a live preview, <b>theme</b> and 12/24-hour format."]

fr:[
["☰","Menu et modes","Touchez <b>☰</b> en haut pour ouvrir le menu et choisir : <b>Pilote</b> (lit les notes aux mètres réglés), <b>Copilote / Trip</b> (partiel et vitesse), <b>Radar</b> (carnet de route), <b>Scanner du carnet de contrôle</b>, <b>Carnet de contrôle manuel</b>, <b>Réglages</b> et <b>Guide</b>."],
["🏁","Pilote","Vous réglez un <b>mot ou une note</b> et la <b>plage de mètres</b> où il doit apparaître. Pendant la spéciale, quand le compteur entre dans la plage, la note s'affiche et est <b>lue à voix haute</b> si vous activez l'interrupteur. Remettez le compteur à zéro au départ.<div class=\"tip\">Avec une télécommande Bluetooth compatible, vous remettez le partiel à zéro sans toucher l'écran.</div>"],
["🧭","Copilote / Trip","<b>Partiel toujours actif</b>, <b>vitesse</b> et <b>qualité du GPS</b>. En tunnel, activez le <b>mode Tunnel</b> : la distance continue d'être estimée sans signal. Appui long sur le partiel pour le remettre à zéro."],
["📡","Radar (carnet de route)","<ul><li>Touchez <b>+</b> pour créer une spéciale : saisissez le nom, photographiez la page et l'application la lit et l'enregistre seule.</li><li>Touchez une spéciale enregistrée pour la <b>charger</b>.</li><li>En course, <b>remettez le TOTAL à zéro</b> au départ (appui long 2 secondes).</li><li>Appui long sur le <b>PARTIEL</b> pour remettre les mètres à zéro et passer <b>directement au repère suivant</b>.</li><li>Pour chaque repère : <b>numéro</b>, <b>photo</b> et <b>mètres restants</b>. Les flèches défilent sans toucher au total.</li></ul><div class=\"tip\">Photographiez la page bien droite et bien éclairée.</div>"],
["📋","Scanner du carnet de contrôle","<ul><li>Touchez <b>+</b> et donnez le nom que vous voulez.</li><li>Photographiez <b>toutes les pages</b> : les <b>contrôles s'additionnent</b>, vous vérifiez qu'il n'en manque aucun.</li><li>Saisissez l'<b>heure réelle de départ</b> : les heures théoriques se calculent seules.</li><li>Si une spéciale part en retard, les <b>contrôles suivants se décalent</b> automatiquement.</li><li>Activez la <b>🔔</b> sur les contrôles voulus et choisissez <b>combien de minutes avant</b>.</li><li>En course, ouvrez simplement le fichier par son nom : tout est prêt.</li></ul><div class=\"tip\">Tout est enregistré dans le téléphone et inclus dans la sauvegarde.</div>"],
["✍️","Carnet de contrôle manuel","Comme ci-dessus, mais construit à la main quand le scan est impossible.<ul><li>Touchez <b>+</b> et donnez un nom (un carnet par section).</li><li>Réglez l'heure de départ et ajoutez les contrôles.</li><li>Pour chaque contrôle : type, lieu et minutes imparties ; l'heure théorique s'additionne seule.</li><li>En course, saisissez l'heure réelle de pointage : l'application calcule le retard et décale les heures suivantes.</li></ul>"],
["🔔","Alarmes et notifications","Quand vous activez la 🔔 sur un contrôle, c'est <b>iOS</b> qui tient l'alarme : elle sonne <b>écran éteint</b> et <b>application fermée</b>.<ul><li>L'<b>autorisation de notifications</b> doit être active (demandée la première fois).</li><li>Les alarmes sont reprogrammées <b>quand l'application est ouverte</b> : après un retard, rouvrez-la un instant.</li></ul>"],
["💾","Sauvegarde (important)","Les données sont dans le téléphone et iOS <b>peut les supprimer</b> s'il manque de place. Avant les courses, faites <b>Réglages → Exporter</b> et gardez le fichier ; utilisez <b>Importer</b> pour les restaurer. La sauvegarde contient tout : spéciales radar, carnets, alarmes et réglages."],
["⚙️","Réglages","Ici vous changez la <b>langue</b>, les <b>unités</b> (km/mi), le <b>style et la taille des chiffres</b> avec aperçu en direct, le <b>thème</b> et le format 12/24 h."]

es:[
["☰","Menú y modos","Toca <b>☰</b> arriba para abrir el menú y elegir: <b>Piloto</b> (lee las notas en los metros que marques), <b>Copiloto / Trip</b> (parcial y velocidad), <b>Radar</b> (road book), <b>Escáner de carné de control</b>, <b>Carné de control manual</b>, <b>Ajustes</b> y <b>Guía</b>."],
["🏁","Piloto","Defines una <b>palabra o nota</b> y el <b>rango de metros</b> donde debe aparecer. Durante el tramo, cuando el contador entra en el rango, la nota aparece y se <b>lee en voz alta</b> si activas el interruptor. Pon el contador a cero en la salida.<div class=\"tip\">Con un mando Bluetooth compatible pones el parcial a cero sin tocar la pantalla.</div>"],
["🧭","Copiloto / Trip","<b>Parcial siempre activo</b>, <b>velocidad</b> y <b>calidad del GPS</b>. En túnel activa el <b>modo Túnel</b>: la distancia se sigue estimando sin señal. Mantén pulsado el parcial para ponerlo a cero."],
["📡","Radar (road book)","<ul><li>Toca <b>+</b> para crear un tramo: escribe el nombre, fotografía la página y la app la lee y la guarda sola.</li><li>Toca un tramo guardado para <b>cargarlo</b>.</li><li>En carrera <b>pon el TOTAL a cero</b> en la salida (mantén 2 segundos).</li><li>Mantén pulsado el <b>PARCIAL</b> para poner los metros a cero y pasar <b>directo a la referencia siguiente</b>.</li><li>De cada referencia ves <b>número</b>, <b>foto</b> y <b>metros que faltan</b>. Las flechas avanzan sin tocar el total.</li></ul><div class=\"tip\">Fotografía la página recta y bien iluminada.</div>"],
["📋","Escáner de carné de control","<ul><li>Toca <b>+</b> y ponle el nombre que quieras.</li><li>Fotografía <b>todas las páginas</b>: los <b>controles se suman</b>, así compruebas que no falte ninguno.</li><li>Pon la <b>hora real de salida</b>: los tiempos teóricos se calculan solos.</li><li>Si un tramo sale con retraso, los <b>controles siguientes se desplazan</b> automáticamente.</li><li>Activa la <b>🔔</b> en los controles que quieras y elige <b>cuántos minutos antes</b>.</li><li>En carrera abre el archivo por su nombre: está todo listo.</li></ul><div class=\"tip\">Todo se guarda en el teléfono y entra en la copia de seguridad.</div>"],
["✍️","Carné de control manual","Igual que arriba, pero construido a mano cuando no puedes escanear.<ul><li>Toca <b>+</b> y ponle nombre (un carné por sección).</li><li>Define la hora de salida y añade los controles.</li><li>De cada control eliges tipo, localidad y minutos concedidos: la hora teórica se suma sola.</li><li>En carrera escribe la hora real del sello: la app calcula el retraso y desplaza las siguientes.</li></ul>"],
["🔔","Alarmas y notificaciones","Cuando activas la 🔔 en un control, es <b>iOS</b> quien mantiene la alarma: suena con la <b>pantalla apagada</b> y la <b>app cerrada</b>.<ul><li>Hace falta el <b>permiso de notificaciones</b> activo (la app lo pide la primera vez).</li><li>Las alarmas se reprograman <b>con la app abierta</b>: tras un retraso, ábrela un momento para actualizarlas.</li></ul>"],
["💾","Copia de seguridad (importante)","Los datos están en el teléfono y iOS <b>puede borrarlos</b> si necesita espacio. Antes de las carreras usa <b>Ajustes → Exportar</b> y guarda el archivo; para recuperarlos usa <b>Importar</b>. La copia contiene todo: tramos de radar, carnés, alarmas y ajustes."],
["⚙️","Ajustes","Aquí cambias <b>idioma</b>, <b>unidades</b> (km/mi), <b>estilo y tamaño de los números</b> con vista previa en directo, <b>tema</b> y formato de hora 12/24."]

de:[
["☰","Menü und Modi","Tippe oben auf <b>☰</b>, um das Menü zu öffnen und zu wählen: <b>Fahrer</b> (liest Notizen bei den eingestellten Metern), <b>Beifahrer / Trip</b> (Teilstrecke und Tempo), <b>Radar</b> (Roadbook), <b>Bordkarten-Scanner</b>, <b>Bordkarte manuell</b>, <b>Einstellungen</b> und <b>Anleitung</b>."],
["🏁","Fahrer","Du legst ein <b>Wort oder eine Notiz</b> und den <b>Meterbereich</b> fest, in dem sie erscheinen soll. Auf der Prüfung erscheint die Notiz, sobald der Zähler in den Bereich kommt, und wird <b>vorgelesen</b>, wenn du den Schalter aktivierst. Setze den Zähler am Start zurück.<div class=\"tip\">Mit einer kompatiblen Bluetooth-Fernbedienung setzt du die Teilstrecke zurück, ohne den Bildschirm zu berühren.</div>"],
["🧭","Beifahrer / Trip","<b>Teilstrecke immer aktiv</b>, <b>Geschwindigkeit</b> und <b>GPS-Qualität</b>. Im Tunnel den <b>Tunnel-Modus</b> einschalten: die Distanz wird auch ohne Signal geschätzt. Lange auf die Teilstrecke drücken, um sie zurückzusetzen."],
["📡","Radar (Roadbook)","<ul><li>Tippe auf <b>+</b>, um eine Prüfung anzulegen: Namen eingeben, Seite fotografieren – die App liest und speichert sie selbst.</li><li>Tippe eine gespeicherte Prüfung an, um sie zu <b>laden</b>.</li><li>Im Rennen am Start den <b>GESAMTWERT zurücksetzen</b> (2 Sekunden halten).</li><li>Die <b>TEILSTRECKE</b> gedrückt halten, um die Meter zu nullen und <b>direkt zum nächsten Punkt</b> zu springen.</li><li>Zu jedem Punkt siehst du <b>Nummer</b>, <b>Foto</b> und <b>Restmeter</b>. Die Pfeile blättern, ohne den Gesamtwert zu ändern.</li></ul><div class=\"tip\">Fotografiere die Seite gerade und gut beleuchtet.</div>"],
["📋","Bordkarten-Scanner","<ul><li>Tippe auf <b>+</b> und vergib einen beliebigen Namen.</li><li>Fotografiere <b>alle Seiten</b>: die <b>Kontrollen summieren sich</b>, so siehst du, dass keine fehlt.</li><li>Trage die <b>echte Startzeit</b> ein: die Sollzeiten werden automatisch berechnet.</li><li>Startet eine Prüfung später, <b>verschieben sich die folgenden Kontrollen</b> von selbst.</li><li>Schalte die <b>🔔</b> bei den gewünschten Kontrollen ein und wähle <b>wie viele Minuten vorher</b>.</li><li>Im Rennen einfach die Datei mit dem Namen öffnen: alles ist bereit.</li></ul><div class=\"tip\">Alles wird im Telefon gespeichert und ist im Backup enthalten.</div>"],
["✍️","Bordkarte manuell","Wie oben, aber von Hand erstellt, wenn Scannen nicht geht.<ul><li>Tippe auf <b>+</b> und vergib einen Namen (eine Karte pro Abschnitt).</li><li>Startzeit einstellen und Kontrollen hinzufügen.</li><li>Pro Kontrolle Typ, Ort und Sollminuten wählen: die Sollzeit addiert sich selbst.</li><li>Im Rennen die echte Stempelzeit eintragen: die App berechnet den Verzug und verschiebt die folgenden Sollzeiten.</li></ul>"],
["🔔","Wecker und Mitteilungen","Wenn du die 🔔 bei einer Kontrolle aktivierst, hält <b>iOS</b> den Wecker: er klingelt auch bei <b>ausgeschaltetem Bildschirm</b> und <b>geschlossener App</b>.<ul><li>Die <b>Mitteilungsberechtigung</b> muss aktiv sein (die App fragt beim ersten Mal).</li><li>Wecker werden neu geplant, <b>während die App offen ist</b>: nach einer Verzögerung die App kurz öffnen.</li></ul>"],
["💾","Backup (wichtig)","Die Daten liegen im Telefon und iOS <b>kann sie löschen</b>, wenn Platz fehlt. Mache vor dem Rennen <b>Einstellungen → Exportieren</b> und sichere die Datei; mit <b>Importieren</b> holst du sie zurück. Das Backup enthält alles: Radar-Prüfungen, Bordkarten, Wecker und Einstellungen."],
["⚙️","Einstellungen","Hier änderst du <b>Sprache</b>, <b>Einheiten</b> (km/mi), <b>Stil und Größe der Zahlen</b> mit Live-Vorschau, <b>Design</b> und 12/24-Stunden-Format."]
],
pt:[
["☰","Menu e modos","Toca em <b>☰</b> em cima para abrir o menu e escolher: <b>Piloto</b> (lê as notas aos metros definidos), <b>Navegador / Trip</b> (parcial e velocidade), <b>Radar</b> (road book), <b>Scanner do cartão de controlo</b>, <b>Cartão de controlo manual</b>, <b>Definições</b> e <b>Guia</b>."],
["🏁","Piloto","Defines uma <b>palavra ou nota</b> e o <b>intervalo de metros</b> em que deve aparecer. Durante o troço, quando o contador entra no intervalo, a nota aparece e é <b>lida em voz alta</b> se ligares o interruptor. Põe o contador a zero na partida.<div class=\"tip\">Com um comando Bluetooth compatível zeras o parcial sem tocar no ecrã.</div>"],
["🧭","Navegador / Trip","<b>Parcial sempre ativo</b>, <b>velocidade</b> e <b>qualidade do GPS</b>. Em túnel liga o <b>modo Túnel</b>: a distância continua a ser estimada sem sinal. Mantém premido o parcial para o zerar."],
["📡","Radar (road book)","<ul><li>Toca em <b>+</b> para criar um troço: escreve o nome, fotografa a página e a app lê e guarda sozinha.</li><li>Toca num troço guardado para o <b>carregar</b>.</li><li>Em prova <b>zera o TOTAL</b> na partida (mantém 2 segundos).</li><li>Mantém premido o <b>PARCIAL</b> para zerar os metros e passar <b>já para a referência seguinte</b>.</li><li>Em cada referência vês <b>número</b>, <b>foto</b> e <b>metros em falta</b>. As setas avançam sem mexer no total.</li></ul><div class=\"tip\">Fotografa a página direita e bem iluminada.</div>"],

/* ================= GPS ================= */
function haversine(lat1, lon1, lat2, lon2){
  const R = 6371000, rad = Math.PI/180;
  const dLat = (lat2-lat1)*rad, dLon = (lon2-lon1)*rad;
  const a = Math.sin(dLat/2)**2 +
            Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

function onFix(pos){
  const c = pos.coords;
  const acc = c.accuracy;

  gpsdot.className = acc < 6 ? 'g' : (acc <= 10 ? 'b' : 'r');

  const hasSpeed = (c.speed !== null && !isNaN(c.speed));
  const v = hasSpeed ? (c.speed < 0.7 ? 0 : c.speed) : null;

  if(acc > ACC_LIMIT && !(v !== null && v > 3)) return;

  if(v !== null){
    curSpeed = v;
    lastGoodFix = performance.now();
    lastPos = c;
  } else {
    if(lastPos){
      const d = haversine(lastPos.latitude, lastPos.longitude, c.latitude, c.longitude);
      const noiseFloor = Math.max(2, acc * 0.5);
      if(d >= noiseFloor && d < 500){
        if(!(cfg.mode==='nav') || navAllow(d)){ total += d; if(partialActive()) partial += d; }
      }
    }
    curSpeed = 0;
    lastGoodFix = performance.now();
    lastPos = c;
  }
}

function onErr(err){ gpsdot.className='r'; }

navigator.geolocation.watchPosition(onFix, onErr, {
  enableHighAccuracy: true,
  maximumAge: 0,
  timeout: 15000
});

/* ================= PAROLE A INTERVALLI ================= */
function activeWord(p){
  for(const r of cfg.rows){
    const a = parseFloat(r.from);
    const b = (r.to === '' || r.to === null || r.to === undefined) ? Infinity : parseFloat(r.to);
    if(!isNaN(a) && r.w && p >= a && p < (isNaN(b) ? Infinity : b)) return r.w;
  }
  return null;
}

/* ================= RADAR ================= */
function parseKm(s){
  if(typeof s === 'number') return s;
  return parseFloat(String(s).replace(',', '.'));
}
/* righe senza km (es. appena scansionate) restano in fondo */
function rbSortKey(r){
  const v = parseKm(r.km);
  return isNaN(v) ? 1e9 : v;
}

/* offset manuale: permette di riancorare il radar al riferimento scelto */
let rbOffset = 0;
let radNextIdx = -1;
let radManualIdx = null;   /* riferimento scelto a mano con le frecce/tap */
let radManualAhead = false; /* true se scelto piu' avanti della posizione attuale */
let radDisplayIdx = 0;     /* riferimento attualmente mostrato */
function radT(){ return total + rbOffset; }

/* azzeramento automatico del parziale a ogni riferimento superato (modalità Radar) */
function rbAutoReset(){
  if(!cfg.rb.length){ rbPassedIdx = null; return; }
  const tR = radT();
  let idx = -1;
  for(let i = 0; i < cfg.rb.length; i++){
    const dM = parseKm(cfg.rb[i].km) * 1000;
    if(isNaN(dM)) continue;
    if(tR >= dM) idx = i;
    else break;
  }
  if(rbPassedIdx === null){
    rbPassedIdx = idx;
    return;
  }
  if(idx > rbPassedIdx && cfg.autoReset){
    const dM = parseKm(cfg.rb[idx].km) * 1000;
    partial = Math.max(0, tR - dM);
  }
  rbPassedIdx = idx;
}

/* zona radar — mostra il riferimento in arrivo con countdown in metri */
let radShownIdx = -2;
function radarRender(){
  if(!cfg.rb.length){
    if(radShownIdx !== -2){
      radNum.textContent = '';
      radSym.textContent = '\u2014'; radSym.style.display = '';
      radNote.textContent = ''; radNote.style.display = '';
      radDist.textContent = '';
      radImg.style.display = 'none'; radImg.removeAttribute('src');
      radShownIdx = -2;
    }
    radNextIdx = -1;
    return;
  }
  const tR = radT();
  let next = -1, dM = 0;
  for(let i = 0; i < cfg.rb.length; i++){
    const d = parseKm(cfg.rb[i].km) * 1000;
    if(isNaN(d)) continue;
    if(tR < d){ next = i; dM = d; break; }
  }
  /* si torna al flusso automatico solo quando il GPS raggiunge davvero
     il riferimento che stavi guardando in avanti; sfogliando indietro resta fermo */
  if(radManualIdx !== null && radManualAhead){
    const dSel = parseKm(cfg.rb[radManualIdx].km) * 1000;
    if(!isNaN(dSel) && tR >= dSel) radManualIdx = null;
  }
  let idx, key;
  if(radManualIdx !== null){
    idx = radManualIdx;
    key = 'm' + idx;
    dM = parseKm(cfg.rb[idx].km) * 1000;
    if(isNaN(dM)) dM = tR;
  } else {
    idx = next === -1 ? cfg.rb.length - 1 : next;
    key = next === -1 ? idx + 10000 : next;
  }
  radDisplayIdx = idx;
  radNextIdx = next === -1 ? cfg.rb.length : next;
  if(radShownIdx !== key){
    const r = cfg.rb[idx];
    radNum.textContent = idx + 1;
    if(r.img){
      radImg.src = r.img;
      radImg.style.display = 'block';
      radSym.style.display = 'none';
      radNote.style.display = 'none';
    } else {
      radImg.style.display = 'none'; radImg.removeAttribute('src');
      radSym.style.display = ''; radNote.style.display = '';
      radSym.textContent = r.s || (next === -1 ? '🏁' : '⚠️');
      radNote.textContent = r.n || '';
    }
    radShownIdx = key;
  }
  const rem = (radManualIdx === null && next === -1) ? 0 : Math.max(0, dM - tR);
  radDist.textContent = fmtDist(rem) + ' ' + distUnit();
  radDist.classList.toggle('near', rem > 0 && rem <= 100);
}

/* frecce: scorrono i riferimenti avanti/indietro senza toccare la misurazione */
function rbJump(dir){
  if(!cfg.rb.length) return;
  const cur = Math.max(0, Math.min(cfg.rb.length - 1, radDisplayIdx));
  const n = Math.max(0, Math.min(cfg.rb.length - 1, cur + dir));
  if(n === radDisplayIdx && radManualIdx !== null) return;
  radManualIdx = n;
  const dSel = parseKm(cfg.rb[n].km) * 1000;
  radManualAhead = !isNaN(dSel) && radT() < dSel;
  radShownIdx = -2;
  if(navigator.vibrate) navigator.vibrate(30);
}

/* frecce sopra la foto: collegate qui (prima non lo erano) */
$('radPrev').addEventListener('click', e => { e.stopPropagation(); rbJump(-1); });
$('radNext').addEventListener('click', e => { e.stopPropagation(); rbJump(1); });

const loc = () => LOCALES[cfg.lang] || 'en-US';
function fmtDist(m){
  const v = isImp() ? m/MI : m/1000;
  return v.toLocaleString(loc(), {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtM(m){ return Math.round(m).toLocaleString(loc()); }
function pad(n){ return n < 10 ? '0'+n : ''+n; }

function frame(){
  const now = performance.now();
  const dtF = (now - lastFrame) / 1000;
  lastFrame = now;

  const d0 = new Date();
  let hh = d0.getHours(), suffix = '';
  if(!cfg.h24){
    suffix = hh >= 12 ? ' PM' : ' AM';
    hh = hh % 12 || 12;
  }
  clock.textContent = pad(hh)+':'+pad(d0.getMinutes())+':'+pad(d0.getSeconds())+suffix;

  const sinceFix = (now - lastGoodFix) / 1000;
  const maxGap = 60; /* modalità galleria sempre attiva */
  const counting = curSpeed > 0 && lastGoodFix > 0 && sinceFix < maxGap;
  if(counting && dtF > 0 && dtF < 1){
    const d = curSpeed * dtF;
    if(!(cfg.mode==='nav') || navAllow(d)){ total += d; if(partialActive()) partial += d; }
  }

  totalVal.textContent = fmtDist(total);
  partialVal.textContent = cfg.mode === 'pilot' ? fmtM(partial) : fmtDist(partial);
  updateNavFree();

  if(cfg.mode === 'nav'){
    const target = counting ? curSpeed : 0;
    dispSpeed += (target - dispSpeed) * Math.min(1, dtF * 3);
    if(Math.abs(target - dispSpeed) < 0.05) dispSpeed = target;
    const s = isImp() ? dispSpeed*2.236936 : dispSpeed*3.6;
    speedVal.textContent = s.toLocaleString(loc(), {minimumFractionDigits:1, maximumFractionDigits:1});
  }

  if(cfg.mode === 'radar'){
    rbAutoReset();
    radarRender();
  }

  if(cfg.mode === 'pilot'){
    if(running){
      const w = activeWord(partial);
      currentWord = w;
      if(w && cfg.speak && w !== lastSpoken && 'speechSynthesis' in window){
        lastSpoken = w;
        const u = new SpeechSynthesisUtterance(w);
        u.lang = loc();
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
      }
      if(!w) lastSpoken = null;
    }
    if(currentWord){
      if(wordVal.textContent !== currentWord){ wordVal.textContent = currentWord; }
      wordVal.classList.remove('numeric');
    } else {
      wordVal.textContent = fmtM(partial);
      wordVal.classList.add('numeric');
    }
  }
  requestAnimationFrame(frame);
}

function anyOverlayOpen(){
  return ['intro','pilotMenu','navMenu','genMenu','tdmMenu','calcMenu','tcMenu'].some(id => $(id).classList.contains('open'))
    || $('drawer').classList.contains('open');
}

function mainAction(){
  if(cfg.mode !== 'pilot'){
    partial = 0;
    showToast(t('partialResetMsg'));
  } else {
    if(running){
      running = false;
      zonePartial.classList.add('stopped');
      zoneWord.classList.add('stopped');
    } else {
      partial = 0;
      currentWord = null;
      lastSpoken = null;
      running = true;
      zonePartial.classList.remove('stopped');
      zoneWord.classList.remove('stopped');
    }
    updateStateText();
  }
  flash.style.opacity = 1;
  setTimeout(()=>flash.style.opacity=0, 200);
  if(navigator.vibrate) navigator.vibrate(60);
}

zoneWord.addEventListener('click', mainAction);
zonePartial.addEventListener('click', ()=>{
  if(cfg.mode === 'pilot') return;
  if(pHoldFired){ pHoldFired = false; return; }
  mainAction();
  if(cfg.mode === 'radar' && cfg.rb.length){
    const shown = Math.max(0, Math.min(cfg.rb.length - 1, radDisplayIdx));
    rbPassedIdx = Math.max(rbPassedIdx === null ? -1 : rbPassedIdx, shown);
    radManualIdx = Math.min(cfg.rb.length - 1, shown + 1);
    const dNext = parseKm(cfg.rb[radManualIdx].km) * 1000;
    radManualAhead = !isNaN(dNext) && radT() < dNext;
    radShownIdx = -2;
  }
});

/* pressione lunga (1 s) sul parziale in radar: azzera lo scarto col GPS */
let pHoldTimer = null, pHoldFired = false;
const holdBarP = $('holdBarP');
function pResetBar(){ holdBarP.style.transition = 'none'; holdBarP.style.width = '0'; }
function pStartHold(){
  if(cfg.mode !== 'radar' || !cfg.rb.length) return;
  holdBarP.style.transition = 'width 1s linear';
  holdBarP.style.width = '100%';
  pHoldTimer = setTimeout(()=>{
    const i = Math.max(0, Math.min(cfg.rb.length - 1, radDisplayIdx));
    const kmM = parseKm(cfg.rb[i].km) * 1000;
    if(!isNaN(kmM)) rbOffset = kmM - total;
    partial = 0;
    rbPassedIdx = i;
    radManualIdx = null; radManualAhead = false;
    radShownIdx = -2;
    pResetBar();
    pHoldFired = true;
    flash.style.opacity = 1;
    setTimeout(()=>flash.style.opacity = 0, 200);
    if(navigator.vibrate) navigator.vibrate([40,40,40]);
    pHoldTimer = null;
  }, 1000);
}
function pCancelHold(){ pResetBar(); if(pHoldTimer){ clearTimeout(pHoldTimer); pHoldTimer = null; } }
zonePartial.addEventListener('pointerdown', pStartHold);
zonePartial.addEventListener('pointerup', pCancelHold);
zonePartial.addEventListener('pointercancel', pCancelHold);
zonePartial.addEventListener('pointerleave', pCancelHold);
zonePartial.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  if(anyOverlayOpen()) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
  e.preventDefault();
  mainAction();
});

/* ================= TOTALE: reset con pressione lunga (2 s) ================= */
let holdTimer = null;
function resetHoldBar(){
  holdBar.style.transition = 'none';
  holdBar.style.width = '0';
}
function startHold(e){
  holdBar.style.transition = 'width 2s linear';
  holdBar.style.width = '100%';
  holdTimer = setTimeout(()=>{
    total = 0;
    rbOffset = 0; rbPassedIdx = null; radManualIdx = null; radManualAhead = false; radShownIdx = -2;
    rbOffset = 0;
    rbPassedIdx = null;
    radShownIdx = -2;
    resetHoldBar();
    showToast(t('totalResetMsg'));
    flash.style.opacity = 1;
    setTimeout(()=>flash.style.opacity=0, 200);
    if(navigator.vibrate) navigator.vibrate([40,40,40]);
    holdTimer = null;
  }, 2000);
}
function cancelHold(){
  resetHoldBar();
  if(holdTimer){ clearTimeout(holdTimer); holdTimer = null; }
}
zoneTotal.addEventListener('pointerdown', startHold);
zoneTotal.addEventListener('pointerup', cancelHold);
zoneTotal.addEventListener('pointercancel', cancelHold);
zoneTotal.addEventListener('pointerleave', cancelHold);

let ssCurFolder = null;
function ssEsc(x){ return String(x==null?'':x).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ssFolders(){ if(!Array.isArray(cfg.ssFolders)) cfg.ssFolders=[]; return cfg.ssFolders; }
function ssRow(ss,i){
  const row=document.createElement('div'); row.className='ss-row';
  if(cfg.ssActive===ss.name) row.style.borderColor='var(--green)';
  const name=document.createElement('span'); name.className='ss-name'; name.style.cursor='pointer';
  name.textContent=ss.name+(cfg.ssActive===ss.name?' \u2713':'');
  name.addEventListener('click',()=>showStageDetail(i));
  const loadBtn=document.createElement('button'); loadBtn.textContent=t('ssLoad'); loadBtn.addEventListener('click',()=>loadStage(i));
  const mvBtn=document.createElement('button'); mvBtn.textContent='\uD83D\uDCC1'; mvBtn.title=t('tcMove'); mvBtn.addEventListener('click',()=>ssMove(i));
  const delBtn=document.createElement('button'); delBtn.className='del'; delBtn.textContent='\u2715';
  delBtn.addEventListener('click',()=>{
    showConfirm(t('ssDelAsk')+' \u201C'+ss.name+'\u201D?',()=>{
      if(cfg.ssActive===cfg.ssLib[i].name){ cfg.ssActive=''; cfg.rb=[]; updateSsBadge(); }
      cfg.ssLib.splice(i,1); saveCfg(); buildSsList();
    });
  });
  row.appendChild(name); row.appendChild(loadBtn); row.appendChild(mvBtn); row.appendChild(delBtn);
  return row;
}
function buildSsList(){
  const list=$('ssList'); list.innerHTML='';
  const folders=ssFolders();
  const inFolder = ssCurFolder ? folders.find(f=>f.id===ssCurFolder) : null;
  if(ssCurFolder && !inFolder) ssCurFolder=null;
  let shown=0;
  if(inFolder){
    const hd=document.createElement('div'); hd.className='ss-row'; hd.style.cursor='pointer';
    hd.innerHTML='<span class="ss-name">\u2039 \uD83D\uDCC1 '+ssEsc(inFolder.name)+'</span>';
    const delF=document.createElement('button'); delF.className='del'; delF.textContent='\u2715';
    delF.addEventListener('click',(e)=>{ e.stopPropagation(); showConfirm(t('tcDelFolder')+' \u201C'+inFolder.name+'\u201D?',()=>{
      cfg.ssLib.forEach(x=>{ if(x.folder===inFolder.id) delete x.folder; });
      cfg.ssFolders=folders.filter(f=>f.id!==inFolder.id); ssCurFolder=null; saveCfg(); buildSsList();
    }); });
    hd.appendChild(delF);
    hd.addEventListener('click',()=>{ ssCurFolder=null; buildSsList(); });
    list.appendChild(hd);
    cfg.ssLib.forEach((ss,i)=>{ if(ss.folder===inFolder.id){ list.appendChild(ssRow(ss,i)); shown++; } });
  } else {
    folders.forEach(f=>{
      const n=cfg.ssLib.filter(x=>x.folder===f.id).length;
      const row=document.createElement('div'); row.className='ss-row'; row.style.cursor='pointer';
      row.innerHTML='<span class="ss-name">\uD83D\uDCC1 '+ssEsc(f.name)+' <span style="color:var(--muted);font-weight:400">\u00B7 '+n+'</span></span><span style="color:var(--muted)">\u203A</span>';
      row.addEventListener('click',()=>{ ssCurFolder=f.id; buildSsList(); });
      list.appendChild(row); shown++;
    });
    cfg.ssLib.forEach((ss,i)=>{ if(!ss.folder){ list.appendChild(ssRow(ss,i)); shown++; } });
  }
  $('ssEmpty').style.display=shown?'none':'block';
}
function ssMove(i){
  const e=cfg.ssLib[i]; if(!e) return;
  const ov=document.createElement('div'); ov.className='tc-emodal';
  let opts='<button class="tc-mvopt" data-f="">'+t('tcMoveLoose')+'</button>';
  ssFolders().forEach(f=>{ opts+='<button class="tc-mvopt" data-f="'+ssEsc(f.id)+'">\uD83D\uDCC1 '+ssEsc(f.name)+'</button>'; });
  opts+='<button class="tc-mvopt newf" data-f="__new">'+t('tcMoveNew')+'</button>';
  ov.innerHTML='<div class="tc-ebox"><div class="tc-etitle">'+t('tcMove')+' \u201C'+ssEsc(e.name)+'\u201D</div><div class="tc-mvlist">'+opts+'</div><div class="tc-ebtns"><button class="tc-ecancel">'+t('tcCancel')+'</button></div></div>';
  document.body.appendChild(ov);
  function close(){ try{ document.body.removeChild(ov); }catch(_){} }
  ov.addEventListener('click', ev=>{ if(ev.target===ov) close(); });
  ov.querySelector('.tc-ecancel').addEventListener('click', close);
  ov.querySelectorAll('.tc-mvopt').forEach(btn=> btn.addEventListener('click', ()=>{
    const f=btn.getAttribute('data-f');
    if(f==='__new'){ close(); askName('', function(name){ const id='r'+Date.now(); ssFolders().push({id:id,name:name}); e.folder=id; saveCfg(); buildSsList(); }, 'askFolderName'); return; }
    if(f) e.folder=f; else delete e.folder;
    saveCfg(); close(); buildSsList();
  }));

async function exportData(){
  const data = localStorage.getItem('rallytrip_cfg') || JSON.stringify(cfg);
  const d = new Date(); const p = n => (n<10?'0':'')+n;
  const fname = 'iRally-backup-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+'.json';
  try{
    const file = new File([data], fname, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'iRally backup'});
      return;
    }
  }catch(e){ /* condivisione annullata o non disponibile: uso il download */ }
  try{
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ if(a.parentNode) a.parentNode.removeChild(a); URL.revokeObjectURL(url); }, 1500);
    showToast('Backup esportato');
  }catch(e){ showMsg('Non riesco a esportare qui: '+e); }
}
$('btnExport').addEventListener('click', exportData);

$('importFile').addEventListener('change', e=>{
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(err){ showMsg('File non valido: non sembra un backup iRally.'); return; }
    if(!parsed || typeof parsed !== 'object' || Array.isArray(parsed)){ showMsg('File non valido: non sembra un backup iRally.'); return; }
    const nSt = Array.isArray(parsed.ssLib) ? parsed.ssLib.length : 0;
    const nTab = Array.isArray(parsed.tdm) ? parsed.tdm.length : 0;
    showConfirm('Ripristinare questo backup? Contiene '+nSt+' prove radar e '+nTab+' tabelle. I dati attuali verranno sostituiti.', ()=>{
      try{
        localStorage.setItem('rallytrip_cfg', JSON.stringify(parsed));
        location.reload();
      }catch(err){ showMsg('Errore durante il ripristino: '+err); }
    }, 'Ripristina', 'var(--green,#39d353)');

});

let tdmOpenIdx = null;
const tdmGuide = "TABELLA DI MARCIA\n\n\u2022 Tocca + per creare una tabella (una per sezione) e dai un nome.\n\u2022 Imposta l'orario di partenza (CO 0) e aggiungi i timbri con \u201C+ Aggiungi timbro\u201D.\n\u2022 Per ogni timbro scegli il tipo, la localita e i minuti di tempo imposto: l'ora teorica si calcola da sola sommando.\n\u2022 In gara scrivi l'ora reale a cui timbri (oppure usa \u2212 e +): l'app calcola il ritardo e sposta i teorici dei controlli successivi.\n\u2022 Sui timbri Start SS puoi segnare il tempo fatto in prova.";
function td_esc(x){ return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function td_att(x){ return td_esc(x).replace(/"/g,'&quot;'); }
function td_hm(x){ x=String(x==null?'':x).trim(); var m=x.match(/^(\d{1,2})[:.\s]+(\d{1,2})$/); var h,mi; if(m){ h=+m[1]; mi=+m[2]; } else { var d=x.replace(/\D/g,''); if(d.length===4){ h=+d.slice(0,2); mi=+d.slice(2); } else if(d.length===3){ h=+d.slice(0,1); mi=+d.slice(1); } else if(d.length>0&&d.length<=2){ h=+d; mi=0; } else return NaN; } if(isNaN(h)||isNaN(mi)||h>23||mi>59) return NaN; return h*60+mi; }
function td_mh(m){ m=((Math.round(m)%1440)+1440)%1440; const h=Math.floor(m/60), mi=m%60; return (h<10?'0':'')+h+':'+(mi<10?'0':'')+mi; }
function td_norm(x){ x=((x%1440)+1440)%1440; if(x>720)x-=1440; return x; }
function impMin(x){ x=String(x==null?'':x).trim(); if(!x) return 0; if(/[:.]/.test(x)){ var v=td_hm(x); return isNaN(v)?0:v; } var n=parseInt(x.replace(/\D/g,'')); return isNaN(n)?0:n; }
function impHM(x){ return td_mh(impMin(x)); }
function td_mark(n){ if(!n) return ''; return '<span class="b-late">'+(n>0?'+':'\u2212')+Math.abs(n)+'\u2032</span>'; }
function td_calc(tab){ const out=[]; let ideal=td_hm(tab.start); if(isNaN(ideal)) ideal=0; let D=0; const OFF=(tab.offset==null||isNaN(parseInt(tab.offset)))?3:parseInt(tab.offset);
  (tab.rows||[]).forEach(r=>{ ideal+=impMin(r.imp);
    if(r.tipo==='SS'){ const idT=ideal, idP=idT+OFF; const teoT=idT+D, teoP=idP+D; const tr=td_hm(r.real); const tmark=isNaN(tr)?null:td_norm(tr-teoT); const pr=td_hm(r.rstart); if(!isNaN(pr)){ const extra=td_norm(pr-teoP); if(extra>0) D+=extra; } out.push({isPS:true,teoT:td_mh(teoT),teoP:td_mh(teoP),tmark:tmark}); ideal=idP; }
    else if(r.tipo==='RGO'){ const teo=ideal+D; const rm=td_hm(r.real); if(!isNaN(rm)){ D=td_norm(rm-ideal); } out.push({isPS:false,teo:td_mh(teo)}); }
    else { const teo=ideal+D; const rm=td_hm(r.real); const mark=isNaN(rm)?null:td_norm(rm-teo); out.push({isPS:false,teo:td_mh(teo),mark:mark}); }
  }); return out; }
function td_types(sel){ const o=[['SEC','Start section'],['SVI','Service in'],['SVO','Service out'],['RGI','Regroup in'],['RGO','Regroup out'],['SS','Start SS'],['TC','TC'],['FIN','Finish']]; return o.map(x=>'<option value="'+x[0]+'"'+(x[0]===sel?' selected':'')+'>'+x[1]+'</option>').join(''); }

function td_pstParse(v){ v=String(v||'').trim(); if(!v) return {m:0,s:0,d:0}; let mt=v.match(/^(\d+)[:.](\d{1,2})(?:[.,](\d))?$/); if(mt) return {m:+mt[1], s:+mt[2], d:mt[3]!=null?+mt[3]:0}; const ds=v.replace(/\D/g,''); if(!ds) return {m:0,s:0,d:0}; return {m:+(ds.slice(0,-3)||0), s:+(ds.slice(-3,-1)||0), d:+ds.slice(-1)}; }

/* ================= CALCOLATRICE TEMPO ================= */
let calc={acc:null,op:null,entry:'',exprDone:''};
function calcFmt(min){ const neg=min<0; min=Math.abs(min); const h=Math.floor(min/60), m=min%60; return (neg?'-':'')+(h<10?'0':'')+h+':'+(m<10?'0':'')+m; }
function calcSym(o){ return o==='plus'?'+':'\u2212'; }
function calcEntryMin(){ if(!calc.entry) return 0; const s=calc.entry; const mm=parseInt(s.slice(-2),10)||0; const hh=parseInt(s.slice(0,-2),10)||0; return hh*60+mm; }
function calcShow(){
  const d=$('calcDisp'), e=$('calcExpr');
  if(calc.entry!==''){ d.textContent=calcFmt(calcEntryMin()); }
  else if(calc.acc!=null){ d.textContent=calcFmt(calc.acc); }
  else { d.textContent='00:00'; }
  let ex='';
  if(calc.op!=null){ ex=calcFmt(calc.acc)+' '+calcSym(calc.op); if(calc.entry!=='') ex+=' '+calcFmt(calcEntryMin()); }
  else if(calc.exprDone){ ex=calc.exprDone; }
  e.textContent=ex;
}
function calcKey(k){
  if(k==='clear'){ calc={acc:null,op:null,entry:'',exprDone:''}; }
  else if(k==='back'){ calc.entry=calc.entry.slice(0,-1); }
  else if(k==='plus'||k==='minus'){ calc.exprDone=''; const v=(calc.entry!=='')?calcEntryMin():(calc.acc!=null?calc.acc:0); if(calc.acc==null){ calc.acc=v; } else if(calc.op){ calc.acc=calc.op==='plus'?calc.acc+v:calc.acc-v; } calc.op=k; calc.entry=''; }
  else if(k==='eq'){ if(calc.op!=null){ const a=calc.acc; const v=(calc.entry!=='')?calcEntryMin():0; const r=calc.op==='plus'?a+v:a-v; calc.exprDone=calcFmt(a)+' '+calcSym(calc.op)+' '+calcFmt(v)+' ='; calc.acc=r; calc.op=null; calc.entry=''; } }
  else { if(calc.op==null && calc.exprDone){ calc.acc=null; calc.exprDone=''; } const dd=(k==='00')?'00':k; if((calc.entry.length+dd.length)<=4){ calc.entry=(calc.entry==='0'?'':calc.entry)+dd; } }
  calcShow();
}

const SCAN_API = 'https://rally-scan.roberto-dapra5858.workers.dev';

function aiCrop(img, box){
  let ymin=box[0], xmin=box[1], ymax=box[2], xmax=box[3];
  const W=img.width, H=img.height;
  let x0=Math.max(0,Math.min(W, xmin/1000*W));
  let y0=Math.max(0,Math.min(H, ymin/1000*H));
  let x1=Math.max(0,Math.min(W, xmax/1000*W));
  let y1=Math.max(0,Math.min(H, ymax/1000*H));
  let w=Math.max(4, x1-x0), h=Math.max(4, y1-y0);
  const OUT_W=520, sc=Math.min(1, OUT_W/w);
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w*sc));
  c.height=Math.max(1,Math.round(h*sc));
  const g=c.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
  g.drawImage(img, x0,y0,w,h, 0,0,c.width,c.height);
  return c.toDataURL('image/jpeg', 0.72);
}
function imgToB64(img, maxDim){
  const s = Math.min(1, maxDim / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(img.width * s));
  c.height = Math.max(1, Math.round(img.height * s));
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height);
  g.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.72).split(',')[1];
}
/* trova le linee della tabella sui pixel: righe (bande) e colonne, in px di un canvas 900 di larghezza */
function detectTable(img){
  try{
    const W=900, sc=W/img.naturalWidth, H=Math.max(1, Math.round(img.naturalHeight*sc));
    const c=document.createElement('canvas'); c.width=W; c.height=H;
    const cx=c.getContext('2d'); cx.drawImage(img,0,0,W,H);
    const d=cx.getImageData(0,0,W,H).data;
    const dark=new Uint8Array(W*H), colc=new Float32Array(W);
    for(let y=0;y<H;y++){ for(let x=0;x<W;x++){ const i=(y*W+x)*4; const l=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000; if(l<165){ dark[y*W+x]=1; colc[x]+=1; } } }
    for(let x=0;x<W;x++) colc[x]/=H;
    const med=a=>{ const t=Array.from(a).sort((p,q)=>p-q); return t.length? t[Math.floor(t.length/2)] : 0; };
    const runs=(mask, n, mind, keep)=>{
      const ls=[]; let inl=false, st=0;
      for(let i=0;i<=n;i++){ const on=i<n && mask(i); if(on&&!inl){ inl=true; st=i; } if(!on&&inl){ inl=false; if(!keep || keep(st,i)) ls.push((st+i-1)/2); } }
      const cl=[]; ls.forEach(v=>{ if(cl.length && v-cl[cl.length-1]<mind) cl[cl.length-1]=(cl[cl.length-1]+v)/2; else cl.push(v); });
      return cl;
    };
    /* 1) colonne: linee verticali su tutta l'altezza -> estensione della tabella */
    const thrC=Math.max(0.35, med(colc)+0.25);
    const vc=runs(x=>colc[x]>thrC, W, W*0.02);
    if(vc.length<2) return null;
    const xL=Math.round(vc[0]), xR=Math.round(vc[vc.length-1]), tw=xR-xL;
    const leftEnd = vc.length>=4 ? Math.round(vc[2]) : Math.round(xL+0.2*tw);
    /* 2) righe: linea piena su tutta la tabella, oppure linea sottile nelle colonne delle distanze */
    const full=new Float32Array(H), left=new Float32Array(H);
    for(let y=0;y<H;y++){ let nf=0, nl=0; const o=y*W; for(let x=xL;x<=xR;x++){ if(dark[o+x]){ nf++; if(x<=leftEnd) nl++; } } full[y]=nf/Math.max(1,tw+1); left[y]=nl/Math.max(1,leftEnd-xL+1); }
    const hc=runs(y=> (full[y]>0.6 || left[y]>0.7), H, H*0.012, (s,e)=>{ if(e-s<=H*0.008) return true; let m=0; for(let y=s;y<e;y++) m+=full[y]; return m/(e-s)>0.6; });
    if(hc.length<2) return null;
    const bands=[]; for(let i=0;i<hc.length-1;i++) bands.push([hc[i], hc[i+1]]);
    /* 3) larghezza: dal bordo sinistro a prima dell'ultima colonna stretta (distanza regressiva) */
    const lw=(vc[vc.length-1]-vc[vc.length-2])/tw;
    const x0=vc[0];
    const x1=(vc.length>=3 && lw>=0.05 && lw<=0.22) ? vc[vc.length-2] : vc[vc.length-1];
    return { W, H, bands, x0, x1 };
  }catch(e){ return null; }
}

/* legge UNA pagina e restituisce i riferimenti trovati (o lancia un errore) */
async function scanOnePage(img){
  const b64 = imgToB64(img, 1800);
  if(!b64) throw new Error('immagine vuota');
  const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const tm = setTimeout(()=>{ try{ ctrl && ctrl.abort(); }catch(_){} }, 150000);
  let res;
  try{
    res = await fetch(SCAN_API, {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'X-App-Key': window.__rallyAuth.key},
      body: JSON.stringify({ image: b64, device: window.__rallyAuth.device }),
      signal: ctrl ? ctrl.signal : undefined
    });
  }catch(e){ clearTimeout(tm); throw new Error(e && e.name === 'AbortError' ? 'tempo scaduto (150 s)' : 'rete'); }
  clearTimeout(tm);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  let rows = Array.isArray(data.rows) ? data.rows : [];
  if(!rows.length) return { rb: [], gap: 0 };
  rows = rows.slice().sort((a,b)=> (parseInt(a.num,10)||0) - (parseInt(b.num,10)||0));
  const cols = (data.cols && typeof data.cols === 'object') ? data.cols : null;
  const okBox = b => Array.isArray(b) && b.length===4 && b.every(v => typeof v === 'number' && !isNaN(v));
  const tbl = detectTable(img);
  let snapped = false;
  if(tbl && tbl.bands.length){
    const M = rows.length;
    const maxH = Math.max.apply(null, tbl.bands.map(b=>b[1]-b[0]));
    const bands = tbl.bands.filter(b => (b[1]-b[0]) >= 0.28*maxH);   /* via le righe sottili di intestazione */
    const cyOf = r => okBox(r.rowbox) ? (r.rowbox[0]+r.rowbox[2])/2 : (okBox(r.box) ? (r.box[0]+r.box[2])/2 : (okBox(r.numbox) ? r.numbox[0] : null));
    const cys = rows.map(r => { const v=cyOf(r); return v==null ? null : v*tbl.H/1000; });
    let pick = null;
    if(bands.length >= M && cys.every(v => v!=null)){
      /* M bande consecutive che meglio combaciano con i centri stimati dal modello */
      let best=null;
      for(let st=0; st+M<=bands.length; st++){
        const run = bands.slice(st, st+M);
        const rh = run.map(b=>b[1]-b[0]).sort((a,b)=>a-b), mh = rh[Math.floor(rh.length/2)];
        let cost=0;
        for(let i=0;i<M;i++){ const b=run[i]; cost += Math.abs(cys[i] - (b[0]+b[1])/2); }
        /* le righe vere hanno altezze uguali: una serie con altezze diverse e' quasi certamente sbagliata */
        run.forEach(b => { cost += 1.5*Math.abs((b[1]-b[0]) - mh); });
        if(best===null || cost<best.cost) best={st, cost, mh};
      }
      if(best && best.cost/M < 0.9*best.mh) pick = rows.map((r,i)=> bands[best.st+i]);
    }
    if(!pick && cys.every(v => v!=null)){
      /* ripiego: ogni riga nella banda che contiene il suo centro, senza tornare indietro */
      pick=[]; let last=-1;
      for(let i=0;i<M;i++){
        let k = bands.findIndex(b => cys[i]>=b[0] && cys[i]<b[1]);
        if(k<=last) k = last+1;
        if(k<0 || k>=bands.length){ pick=null; break; }
        pick.push(bands[k]); last=k;
      }
    }
    if(pick){
      const X0 = tbl.x0!=null ? tbl.x0*1000/tbl.W : ((cols && typeof cols.left==='number') ? cols.left : 0);
      const X1 = tbl.x1!=null ? tbl.x1*1000/tbl.W : ((cols && typeof cols.infoEnd==='number') ? cols.infoEnd : 1000);
      rows.forEach((r,i)=>{ r.box = [pick[i][0]*1000/tbl.H, X0, pick[i][1]*1000/tbl.H, X1]; });
      snapped = true;
    }
  }
  const hasRow = !snapped && rows.every(r => okBox(r.rowbox));
  if(hasRow){
    /* 1) altezza tipica di una riga (mediana): serve a riconoscere righe "doppie" */
    const hs = rows.map(r => r.rowbox[2]-r.rowbox[0]).filter(h=>h>10).sort((a,b)=>a-b);
    const medH = hs.length ? hs[Math.floor(hs.length/2)] : 0;
    /* 2) bordi colonna: quelli di pagina se ci sono, altrimenti quelli della riga stessa */
    const X0 = (cols && typeof cols.left==='number') ? cols.left : null;
    const X1 = (cols && typeof cols.infoEnd==='number') ? cols.infoEnd : null;
    for(let i=0;i<rows.length;i++){
      const r = rows[i]; let [y0,x0,y1,x1] = r.rowbox;
      /* righe consecutive non si sovrappongono: il confine e' la linea in mezzo */
      if(i>0){ const p = rows[i-1].rowbox; if(y0 < p[2]){ const mid = (y0 + p[2]) / 2; p[2] = mid; y0 = mid; } }
      /* riga alta il doppio = due riferimenti fusi: tengo solo la parte del suo numerino */
      if(medH && (y1-y0) > medH*1.7){ if(okBox(r.numbox)) { y1 = Math.min(y1, r.numbox[2] + medH*0.06); y0 = Math.max(y0, y1 - medH); } else y1 = y0 + medH; }
      rows[i].rowbox = [y0, X0!==null ? X0 : x0, y1, X1!==null ? X1 : x1];
    }
    rows.forEach(r => { r.box = r.rowbox.slice(); });
  } else if(!snapped){
    /* fallback: vecchio metodo basato sui numerini */
    const hasNB = rows.every(r => okBox(r.numbox));
    if(hasNB){
      const hs=[];
      for(let i=1;i<rows.length;i++){ const d=rows[i].numbox[2]-rows[i-1].numbox[2]; if(d>15) hs.push(d); }
      hs.sort((a,b)=>a-b);
      const cellH = hs.length ? hs[Math.floor(hs.length/2)] : 0;
      for(let i=0;i<rows.length;i++){
        const r=rows[i], nb=r.numbox, prev = i>0 ? rows[i-1].numbox : null;
        let top;
        if(prev) top = prev[2];
        else if(cellH) top = Math.max(0, nb[2] - cellH);
        else top = okBox(r.box) ? Math.min(r.box[0], nb[0]) : 0;
        const bottom = nb[2];
        const x0 = (cols && typeof cols.left==='number') ? cols.left : 0;
        const x1 = (cols && typeof cols.infoEnd==='number') ? cols.infoEnd : (okBox(r.box) ? r.box[3] : 1000);
        if(bottom - top > 15) r.box = [top, x0, bottom, x1];
      }
    }
  }
  let gap = 0;
  for(let i=1;i<rows.length;i++){ const a=parseInt(rows[i-1].num,10), b=parseInt(rows[i].num,10); if(a && b && b>a+1){ gap=a+1; break; } }
  const rb = [];
  for(const r of rows){
    const km = (r.km == null ? '' : String(r.km)).replace('.', ',').trim();
    const nota = (r.nota || '').trim();
    let cropped = '';
    if(Array.isArray(r.box) && r.box.length === 4){ try{ cropped = aiCrop(img, r.box); }catch(e){} }
    rb.push({ km: km, s: '', n: nota, img: cropped });
  }
  return { rb, gap, model: data.model || '', ms: data.ms || 0 };
}

/* piu' pagine insieme: una alla volta, poi fuse in un'unica prova ordinata per Totali */
async function scanAIRunFiles(files){
  const name = pendingStageName;
  const append = pendingAppend;
  pendingStageName = null; pendingAppend = false;
  if(!files.length || !name) return;
  const n = files.length;
  let failed = [], gaps = [], why = [], info = '';
  const parts = new Array(n).fill(null);
  const t0 = Date.now();
  let doneCount = 0;
  const label = ()=> (n>1 ? t('scanPage').replace('{i}', doneCount).replace('{n}', n) : t('scanReading'));
  const tick = setInterval(()=>{ window.__scanBusy(true, label() + ' \u00B7 ' + Math.round((Date.now()-t0)/1000) + ' s'); }, 1000);
  window.__scanBusy(true, label());
  /* pagine in parallelo, massimo 3 insieme: il tempo totale e' quello della piu' lenta */
  const MAXP = 3;
  let cursor = 0;
  async function worker(){
    while(true){
      const i = cursor++;
      if(i >= n) return;
      try{
        const img = await loadImageFile(files[i]);
        const r = await scanOnePage(img);
        if(r.model && !info) info = r.model + (r.ms ? ' \u00B7 ' + Math.round(r.ms/1000) + 's' : '');
        if(!r.rb.length){ failed.push(i+1); why.push((i+1)+': 0 riferimenti'); }
        else { parts[i] = r.rb; if(r.gap) gaps.push(i+1); }
      }catch(e){ failed.push(i+1); why.push((i+1)+': '+((e&&e.message)||'errore')); }
      doneCount++;
    }
  }
  try{
    await Promise.all(Array.from({length: Math.min(MAXP, n)}, worker));
  } finally { clearInterval(tick); }
  failed.sort((a,b)=>a-b); gaps.sort((a,b)=>a-b);
  let all = [];
  parts.forEach(rb=>{ if(rb) all = all.concat(rb); });
  if(!all.length){ showMsg('\u26A0\uFE0F ' + (n>1 ? t('scanNone') : t('scanConnErr')) + (why.length ? '\n(' + why.join(' \u00B7 ') + ')' : '')); return; }
  let stage = cfg.ssLib.find(x => x.name === name);
  if(!stage){ stage = { name: name, rb: [] }; if(ssCurFolder) stage.folder = ssCurFolder; cfg.ssLib.push(stage); }
  stage.rb = append ? (stage.rb || []).concat(all) : all;
  stage.rb.sort((a,b)=> (parseKm(a.km)||0) - (parseKm(b.km)||0));
  cfg.rb = JSON.parse(JSON.stringify(stage.rb));
  cfg.ssActive = name;
  rbPassedIdx = null; radShownIdx = -2; rbOffset = 0; radManualIdx = null; radManualAhead = false;
  updateSsBadge();
  const ok = saveCfg();
  buildSsList();
  if(!ok){ showMsg('\u26A0\uFE0F ' + t('storeFull')); return; }
  let warn = '';
  if(failed.length) warn += t('scanPagesFail').replace('{list}', failed.join(', ')) + (why.length ? '\n(' + why.join(' \u00B7 ') + ')' : '');
  if(gaps.length) warn += (warn ? '\n' : '') + t('scanPagesGap').replace('{list}', gaps.join(', '));
  if(warn) showMsg('\u26A0\uFE0F ' + all.length + ' ' + t('scanSaved') + '\n' + warn);
  else showToast('\u2705 ' + all.length + ' ' + t('scanSaved') + (info ? ' \u00B7 ' + info : ''));
}

/* scelta delle foto: parte la lettura (una o piu' pagine) */
function loadImageFile(f){
  return new Promise((res, rej)=>{
    let done = false;
    const url = URL.createObjectURL(f);
    const im = new Image();
    const finish = (ok, v)=>{ if(done) return; done = true; clearTimeout(tm); try{ URL.revokeObjectURL(url); }catch(_){} ok ? res(v) : rej(v); };
    const tm = setTimeout(()=> finish(false, new Error('timeout foto')), 25000);
    im.onload = ()=> finish(true, im);
    im.onerror = ()=> finish(false, new Error('foto non leggibile'));
    im.src = url;
  });
}
$('aiFile').addEventListener('change', e=>{

    .finally(function(){ window.__scanBusy(false); try{ $('aiFile').value = ''; }catch(_){} });
});
