  function scopeOf(i){ return $('tc_out') && $('tc_out').querySelector('.blk[data-band="'+i+'"]'); }
  function readHM(i,role){ const s=scopeOf(i); if(!s) return null; const h=s.querySelector('[data-role="'+role+'"][data-part="h"]'); const m=s.querySelector('[data-role="'+role+'"][data-part="m"]'); if(!h||!m||h.tagName==='B') return null; const hv=String(h.value==null?'':h.value).trim(), mv=String(m.value==null?'':m.value).trim(); if(hv===''||mv==='') return null; const H=parseInt(hv,10),M=parseInt(mv,10); if(isNaN(H)||isNaN(M)) return null; return H*60+M; }
  function setHM(i,role,mins){ const s=scopeOf(i); if(!s) return; const h=s.querySelector('b[data-role="'+role+'"][data-part="h"]'); const m=s.querySelector('b[data-role="'+role+'"][data-part="m"]'); if(mins==null){ if(h)h.textContent='--'; if(m)m.textContent='--'; return; } mins=((Math.round(mins)%1440)+1440)%1440; const hh=Math.floor(mins/60),mm=mins%60; if(h)h.textContent=(hh<10?'0':'')+hh; if(m)m.textContent=(mm<10?'0':'')+mm; }
  function tmin(v){ if(!v) return NaN; const p=String(v).split(':'); if(p.length<2) return NaN; const h=parseInt(p[0]),m=parseInt(p[1]); if(isNaN(h)||isNaN(m)) return NaN; return h*60+m; }
  function fmt(mins){ mins=((Math.round(mins)%1440)+1440)%1440; const hh=Math.floor(mins/60),mm=mins%60; return (hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm; }

  function recompute(){
    if(!BANDS.length) return;
    const off=tcOff;
    const start=(readHM(0,'actualStart')!=null)?readHM(0,'actualStart'):readHM(0,'dueStart');
    for(const k in tcDue) delete tcDue[k];
    if(start==null){ BANDS.forEach((b,i)=>{ if(i>0){ setHM(i,'dueTime',null); if(b.kind==='ss') setHM(i,'provStart',null); } }); if(curIdx!=null && cfg.tcards[curIdx]) cfg.tcards[curIdx].sched=[]; scheduleSoon(); return; }
    /* ================== CALCOLO BLOCCATO - NON RISCRIVERE ==================
       Regola confermata da Roberto (navigatore) il 7 settembre 2026, verificata
       sui numeri veri della Targa Florio. Chi tocca questo blocco deve prima
       rileggere queste tre righe:
         1. OGNI orario reale (partenza effettiva PS oppure ORA TIMBRO) ridefinisce
            lo scarto: D = reale - teorico. Vale in ritardo E in anticipo.
         2. Lo scarto NON si accumula e NON si azzera altrove (nemmeno sui Regroup):
            comanda sempre l'ultimo orario reale inserito.
         3. Il "due time" mostrato su un controllo usa lo scarto di PRIMA di quel
            controllo; il timbro di quel controllo sposta solo i successivi.
       Controprova: partenza 10:57, T.C.1 +01:15, PS +3' start e target 00:32.
       Timbro 12:58 su teorico 12:47 -> T.C.3 passa da 12:50/13:53 a 13:01/14:04.
       ======================================================================= */
    /* "ideal" e' la catena teorica pura (dalla partenza, sommando i tempi imposti).
       "D" e' lo scarto rispetto alla realta': OGNI orario reale che scrivi
       (partenza effettiva di una PS oppure ORA TIMBRO) lo ridefinisce, in ritardo
       o in anticipo. Da li' in poi tutti i teorici successivi slittano, sveglie comprese. */
    let ideal=start, D=0;
    for(let i=1;i<BANDS.length;i++){
      const b=BANDS[i]; const tg=tmin(b.target); const t=isNaN(tg)?0:tg;
      if(b.kind==='ss'){
        const ssIdeal=ideal+off; setHM(i,'provStart',ssIdeal+D);
        const act=readHM(i,'ssStart'); if(act!=null) D = act - ssIdeal;
        ideal=ssIdeal+t;
      } else { ideal=ideal+t; }
      setHM(i,'dueTime',ideal+D); tcDue[i]=ideal+D;
      const st=readHM(i,'stamp'); if(st!=null) D = st - ideal;
    }
    if(curIdx!=null && cfg.tcards[curIdx]){
      const sc=[]; BANDS.forEach((b,i)=>{ if(i>0 && alarmOn[i] && tcDue[i]!=null) sc.push({band:i, code:b.code, due:tcDue[i]}); });
      cfg.tcards[curIdx].sched=sc;
    }
    scheduleSoon();
  }

  /* ===== SVEGLIA: notifiche locali native (Capacitor) ===== */
  function LN(){ return (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications) || null; }
  async function ensurePerm(){ const ln=LN(); if(!ln) return false; if(permAsked) return true; permAsked=true; try{ await ln.requestPermissions(); return true; }catch(e){ return false; } }
  /* ============ SVEGLIE TIMBRO - SISTEMA BLOCCATO, NON RISCRIVERE ============
     Comportamento confermato da Roberto e verificato il 7 settembre 2026.
     Regole da NON cambiare senza una sua richiesta esplicita:
       A. Le sveglie si accendono SOLO dalle caselle dei singoli controlli dentro
          la tabella. Nell'elenco delle tabelle NON deve esserci nessuna
          campanella: ogni tabella salvata e' sempre attiva.
       B. Raffica di 10 squilli distanziati 3 secondi (circa 30 s), identica ad
          app aperta e ad app chiusa.
       C. Le sveglie di TUTTE le tabelle vanno messe in fila per orario e
          programmate insieme, con precedenza alle piu' vicine nel tempo.
       D. Toccare la casella di un controllo deve chiamare recompute(): senza,
          l'elenco sveglie non si rifa' e la sveglia non suona mai (era un bug).
     ==========================================================================
     Una notifica iOS suona UNA volta sola: per avere una sveglia che insiste
     ne programmiamo una raffica. 10 squilli, uno ogni 3 secondi = 30 secondi.
     Appena apri l'app la raffica in corso si ferma (riprogrammiamo, e quelle
     con orario gia' passato non vengono piu' messe in coda).
     iOS accetta al massimo 64 notifiche in attesa per app: le sveglie di TUTTE
     le tabelle vengono messe in fila per orario e si riempie fino al tetto,
     quindi le piu' vicine nel tempo hanno sempre la precedenza. */
  const BURST_N = 10;      // squilli per sveglia
  const BURST_GAP = 3;     // secondi fra uno squillo e l'altro
  const IOS_MAX = 60;      // tetto reale 64: teniamo un margine

  function scheduleSoon(){ clearTimeout(schedTimer); schedTimer=setTimeout(scheduleAll, 500); }

  async function scheduleAll(){
    const ln=LN(); if(!ln) return;
    /* 1) togli dalla coda tutto quello che avevamo messo noi */
    try{
      const old=[];
      (cfg.tcards||[]).forEach(e=>{ (e.sids||[]).forEach(id=>old.push({id})); });
      if(old.length) await ln.cancel({notifications:old});
    }catch(_){}
    (cfg.tcards||[]).forEach(e=>{ e.sids=[]; });

    /* 2) raccogli le sveglie di TUTTE le tabelle e ordinale per orario */
    const now=Date.now();
    const items=[];
    (cfg.tcards||[]).forEach(e=>{
      if(!e.nid){ cfg.tcNidSeq=(cfg.tcNidSeq||0)+1; e.nid=(cfg.tcNidSeq%2000)+1; }
      const mins=e.min||5;
      (e.sched||[]).forEach(s=>{
        if(s.due==null) return;
        const fm=s.due-mins; if(fm<0) return;
        const fire=new Date(); fire.setHours(Math.floor(fm/60), fm%60, 0, 0);
        if(fire.getTime() <= now+3000) return;   /* gia' passata: si salta */
        items.push({ e:e, band:+s.band, code:s.code, due:s.due, mins:mins, at:fire.getTime() });
      });
    });
    items.sort((a,b)=>a.at-b.at);

    /* 3) una raffica per sveglia, fino al tetto di iOS */
    const notifs=[];
    const snd=(cfg.notifSound && cfg.notifSound!=='default') ? cfg.notifSound : 'default';
    for(const it of items){
      if(notifs.length + BURST_N > IOS_MAX) break;
      const body='Tra '+it.mins+' min: '+it.code+' \u2014 timbri alle '+fmt(it.due)
                 + (it.e.name ? ' ('+it.e.name+')' : '');
      for(let k=0;k<BURST_N;k++){
        const id = it.e.nid*1000 + it.band*10 + k;   /* band < 100: nessuna collisione */
        it.e.sids.push(id);
        notifs.push({
          id:id,
          title:'iRally \u2014 sveglia timbro',
          body:body,
          sound:snd,
          schedule:{ at: new Date(it.at + k*BURST_GAP*1000) }
        });
      }
    }
    if(notifs.length){ try{ await ln.schedule({notifications:notifs}); }catch(_){} }
    saveCfg();
  }

  /* riaprendo l'app la raffica in corso si spegne e tutto viene riprogrammato */
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') scheduleSoon();
  });
})();
</script>

/* ===== X di chiusura su tutte le schermate + scorrimento da sinistra ===== */
(function(){
  var MAP={intro:'closeIntro',pilotMenu:'closePilot',navMenu:'closeNav',genMenu:'closeGen'};
  function closeOverlay(ov){
    var id=ov.id;
    if(MAP[id]){ var b=document.getElementById(MAP[id]); if(b){ b.click(); return; } }
    var inner=ov.querySelector('[data-act="close"],#tc_close,#pw_close,#calcClose');
    if(inner){ inner.click(); return; }
    ov.classList.remove('open');
  }
  Object.keys(MAP).concat(['tdmMenu']).forEach(function(id){
    var ov=document.getElementById(id); if(!ov) return;
    var x=document.createElement('button');
    x.className='ov-x'; x.type='button'; x.setAttribute('aria-label','Close'); x.innerHTML='&#10005;';
    x.addEventListener('click',function(){ closeOverlay(ov); });
    ov.appendChild(x);
  });
  /* scorri dal bordo sinistro verso destra per tornare indietro */
  var sx=0, sy=0, on=false;
  document.addEventListener('touchstart',function(e){
    var t=e.touches[0]; on=(t.clientX<=26); sx=t.clientX; sy=t.clientY;
  },{passive:true});
  document.addEventListener('touchend',function(e){
    if(!on) return; on=false;
    var t=e.changedTouches[0];
    if(t.clientX-sx<70 || Math.abs(t.clientY-sy)>60) return;
    var ids=['spectOv','tcMenu','paywall','tdmMenu','calcMenu','genMenu','navMenu','pilotMenu','intro'];
    for(var i=0;i<ids.length;i++){
      var ov=document.getElementById(ids[i]);
      if(ov && ov.classList.contains('open')){ closeOverlay(ov); return; }
    }
    var d=document.getElementById('drawer');
    if(d && d.classList.contains('open')){ var bg=document.getElementById('drawerBg'); if(bg) bg.click(); }
  },{passive:true});
})();
</script>

/* ================= DATI =================
   Ogni auto: t = istante del passaggio, off = secondi di partenza dopo la prima auto.
   Prova: t0 = primo passaggio (zero del cronometro), lastOff = partenza dell'ultima auto
   cronometrata. Cancellare un tempo non sposta le partenze delle altre auto. */
const LS_KEY = 'irally_spect_v1';
let SP = null;
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function spLoad(){ try{ const j = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); if(j && Array.isArray(j.stages)) return j; }catch(e){} return null; }
function spSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(SP)); }catch(e){} }
function fix(st){
  if(!st || !Array.isArray(st.cars)) return;
  st.cars.forEach((c,i) => { if(typeof c.off !== 'number') c.off = 0; });
  if(st.lastOff === undefined) st.lastOff = st.cars.length ? st.cars[st.cars.length - 1].off : null;
  if(st.t0 === undefined) st.t0 = st.cars.length ? st.cars[0].t : null;
  if(!st.draft || !(st.draft.d > 0)) st.draft = { name: (st.draft && st.draft.name) || '', d: st.iv || 60 };
  if(typeof st.km !== 'number') st.km = null;
  if(typeof st.kmTot !== 'number') st.kmTot = null;
  if(typeof st.place !== 'string') st.place = '';
  if(st.refId === undefined) st.refId = null;
  if(typeof st.stopped !== 'boolean') st.stopped = false;
  if(typeof st.stopAt !== 'number') st.stopAt = null;
}
function ensure(){
  if(SP) return;
  SP = spLoad();
  if(!SP){ SP = { v:2, cur:null, stages:[] }; seedExample(); spSave(); }
  SP.stages.forEach(fix);
}
/* prova di esempio: un'auto mancante fra la 4 e la 5 */
function seedExample(){
  const base = Date.now() - 26*3600*1000;
  const names = ['Rossi','Bianchi','Colombo','Ricci','Marino','Greco'];
  const perf  = [0, -2.4, 3.1, 0.8, -5.6, 12.3];
  const offs  = [0, 60, 120, 180, 300, 360];
  const cars = names.map((n,i) => ({ id:uid(), name:n, t: Math.round(base + 154300 + offs[i]*1000 + perf[i]*1000), off: offs[i] }));
  SP.stages.push({ id:uid(), name:'PS 1', iv:60, created: base, ex:true, cars, t0: cars[0].t, lastOff: 360, draft:{ name:'', d:60 }, km:6, kmTot:16, place: t('spExPlace'), refId:null });
}

/* ================= FORMATI ================= */
function carN(n){ return t('spCarN').replace('{n}', n); }
function carsN(n){
  switch(lang()){
    case 'en': return n + (n===1 ? ' car' : ' cars');
    case 'fr': return n + (n<=1 ? ' voiture' : ' voitures');
    case 'es': return n + (n===1 ? ' coche' : ' coches');
    case 'de': return n + (n===1 ? ' Auto' : ' Autos');
    case 'pt': return n + (n===1 ? ' carro' : ' carros');
    case 'ja': return n + '台';
    case 'cs': return n + (n===1 ? ' auto' : (n>=2 && n<=4 ? ' auta' : ' aut'));
    default:   return n + ' auto';
  }
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad(n){ return (n < 10 ? '0' : '') + n; }
function dec(){ return (lang() === 'en' || lang() === 'ja') ? '.' : ','; }
function loc(){ return LOCALE[lang()] || 'it-IT'; }
/* cronometro m:ss,d (decimi troncati, come un cronometro vero) */
function fmtWatch(ms){
  if(!(ms > 0)) ms = 0;
  const ten = Math.floor(ms/100), d = ten % 10, s = Math.floor(ten/10) % 60, m = Math.floor(ten/600) % 60, h = Math.floor(ten/36000);
  return (h ? h + ':' + pad(m) + ':' : m + ':') + pad(s) + dec() + d;
}
/* distacco dal riferimento, arrotondato al decimo */
function fmtGap(ms){
  const ten = Math.sign(ms) * Math.round(Math.abs(ms)/100);
  if(ten === 0) return '0' + dec() + '0';
  const a = Math.abs(ten), d = a % 10, s = Math.floor(a/10);
  const body = s >= 60 ? Math.floor(s/60) + ':' + pad(s % 60) + dec() + d : s + dec() + d;
  return (ten < 0 ? '−' : '+') + body;
}
/* minuti e secondi di partenza: 60 -> 1', 90 -> 1'30", 30 -> 30" */
function fmtOff(sec){
  sec = Math.round(sec); const m = Math.floor(sec/60), s = sec % 60;
  if(m && s) return m + "'" + pad(s) + '"';
  if(m) return m + "'";
  return s + '"';
}
function timeOfDay(ms){
  try{ return new Date(ms).toLocaleTimeString(loc(), {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false}); }
  catch(e){ const d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
}
function dateShort(ms){
  try{ return new Date(ms).toLocaleString(loc(), {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false}); }
  catch(e){ const d = new Date(ms); return pad(d.getDate()) + '/' + pad(d.getMonth()+1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
}
function dateLong(ms){
  try{ return new Date(ms).toLocaleString(loc(), {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:false}); }
  catch(e){ const d = new Date(ms); return pad(d.getDate()) + '/' + pad(d.getMonth()+1) + '/' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
}
/* km: si scrive con la virgola o col punto, fino a due decimali */
function fmtKm(n){ return String(Math.round(n*100)/100).replace('.', dec()); }
function parseKm(s){ const v = parseFloat(String(s || '').replace(',', '.').replace(/[^0-9.]/g, '')); return (v > 0 && v < 1000) ? Math.round(v*100)/100 : null; }
function kmLabel(st){
  if(!(st.km > 0)) return '';
  return (st.kmTot > 0) ? t('spKmOf').replace('{a}', fmtKm(st.km)).replace('{b}', fmtKm(st.kmTot)) : t('spKmAt').replace('{a}', fmtKm(st.km));
}
function placeText(st){ const k = kmLabel(st), p = (st.place || '').trim(); return (k && p) ? k + ' · ' + p : (k || p); }
/* secondi al km: distacco (al decimo, come si vede) diviso per il km in cui sei, due decimali */
function perKm(st, r){
  if(!(st.km > 0) || r.isRef) return '';
  return (Math.round(Math.abs(r.gap)/100) / 10 / st.km).toFixed(2).replace('.', dec());
}
/* passo del riquadro: un minuto se il distacco e' a minuti interi, altrimenti il distacco stesso */
function stepOf(iv){ return (iv >= 60 && iv % 60 === 0) ? 60 : iv; }

/* ================= CALCOLO =================
   Tempo "rimesso in partenza" = passaggio - partenza dopo la prima auto.
   Ordine sempre dal piu' veloce al piu' lento. Il riferimento e' il pilota scelto
   (st.refId) oppure, se non e' scelto, il piu' veloce. */
function ranking(st){
  const rows = st.cars.map((c,i) => ({ c, i, raw: c.t - c.off*1000, pass: c.t - (st.t0 != null ? st.t0 : c.t) }));
  if(!rows.length) return rows;
  rows.sort((a,b) => (a.raw - b.raw) || (a.i - b.i));
  const ref = rows.find(r => r.c.id === st.refId) || rows[0];
  rows.forEach(r => { r.gap = r.raw - ref.raw; r.isRef = (r === ref); });
  return rows;
}
function gapCls(r){
  if(r.isRef) return 'sp-zero';
  const ten = Math.sign(r.gap) * Math.round(Math.abs(r.gap)/100);
  return ten < 0 ? 'sp-neg' : (ten > 0 ? 'sp-pos' : 'sp-zero');
}
/* Stop (21 nov 2026): fine prova. Il cronometro non riparte piu' (fermarlo a meta' prova non
   serve) e il pulsante tondo non registra; Esporta in basso funziona sempre, come prima. */
function isStopped(st){ return !!st && !st.ex && st.t0 != null && !!st.stopped; }
function nextOff(st){ return st.lastOff == null ? 0 : st.lastOff + st.draft.d; }
function cur(){ return (SP && SP.stages.find(s => s.id === SP.cur)) || null; }
function dispName(c, i){ return (c.name && c.name.trim()) ? c.name.trim() : carN(i + 1); }

/* Annulla: fotografia della prova prima di ogni tocco o cancellazione (solo in memoria) */
const HIST = {};
function pushHist(st, type, label){
  const h = HIST[st.id] || (HIST[st.id] = []);
  h.push({ type, label: label || '', snap: JSON.stringify({ cars: st.cars, lastOff: st.lastOff, t0: st.t0, draft: st.draft }) });
  if(h.length > 40) h.shift();
}

/* ================= SCHERMATE ================= */
function spOpen(){
  ensure(); spTexts();
  E('spectOv').classList.add('open');
  if(SP.cur && cur()) showRun(SP.cur); else { SP.cur = null; showList(); }
}
function spCloseOv(){
  try{ E('spInName').blur(); }catch(e){}
  stopTick();
  E('spectOv').classList.remove('open', 'sp-running');
}
function showList(){
  try{ E('spInName').blur(); }catch(e){}
  stopTick();
  E('spRun').hidden = true; E('spList').hidden = false;
  E('spectOv').classList.remove('sp-running');
  renderList();
}
function showRun(id){
  SP.cur = id; spSave();
  E('spList').hidden = true; E('spRun').hidden = false;
  E('spectOv').classList.add('sp-running');
  lastWatch = ''; renderRun(); startTick();
}

function renderList(){
  const list = E('spStages'); list.innerHTML = '';
  const arr = SP.stages.slice().sort((a,b)=> b.created - a.created);

/* cronometro dal primo passaggio; fermo sull'ultimo se non passa nessuno da 30 minuti,
   oppure fermo dove l'ha lasciato il tasto Stop */
let rafId = 0, lastWatch = '';
function lastPass(st){ let last = st.t0; st.cars.forEach(c => { if(c.t > last) last = c.t; }); return last; }
function tickOnce(){
  const st = cur(); if(!st || st.t0 == null) return;
  const last = lastPass(st), stopped = isStopped(st);
  const now = Date.now(), live = !stopped && (now - last) < 30*60*1000 && !st.ex;
  const txt = fmtWatch(stopped ? (st.stopAt != null ? st.stopAt : last) - st.t0 : (live ? now - st.t0 : last - st.t0));
  if(txt !== lastWatch){ E('spWNum').textContent = txt; lastWatch = txt; }
  E('spWatch').classList.toggle('sp-idle', !live);
}
function loop(){ tickOnce(); rafId = requestAnimationFrame(loop); }
function startTick(){ stopTick(); rafId = requestAnimationFrame(loop); }
function stopTick(){ if(rafId) cancelAnimationFrame(rafId); rafId = 0; }

/* ---- il tocco: tempo preso nell'istante in cui il dito tocca, non al rilascio ---- */
let lastPress = 0;
function evEpoch(e){
  let lag = 0;
  try{ if(e && typeof e.timeStamp === 'number' && e.timeStamp > 0){ lag = performance.now() - e.timeStamp; if(!(lag >= 0 && lag < 1000)) lag = 0; } }catch(_){ lag = 0; }
  return Date.now() - lag;
}
function shot(when){
  const st = cur(); if(!st || st.ex) return;
  if(isStopped(st)) return;   /* fermato col tasto Stop: la prova e' chiusa */
  if(st.stopped){ st.stopped = false; st.stopAt = null; }   /* tutto annullato: si riparte da zero */
  if(when - lastPress < 350) return;   /* doppio tocco involontario */
  lastPress = when;
  pushHist(st, 'shot');
  const off = nextOff(st);
  const car = { id:uid(), name: (E('spInName').value || '').trim(), t: Math.round(when), off };
  if(st.t0 == null) st.t0 = car.t;
  st.cars.push(car);
  st.lastOff = off;
  st.draft = { name:'', d: st.iv };
  E('spInName').value = '';
  spSave();
  const f = E('spFlash'); f.classList.add('sp-on'); requestAnimationFrame(() => requestAnimationFrame(() => f.classList.remove('sp-on')));
  lastWatch = '';
  renderRun(car.id);
  tickOnce();
}

  const c = st.cars[idx], nm = dispName(c, idx);

function undoLast(){
  const st = cur(); if(!st) return;
  const h = HIST[st.id]; if(!h || !h.length) return;
  const top = h[h.length - 1];
  const apply = () => {
    h.pop();
    try{ const s = JSON.parse(top.snap); st.cars = s.cars; st.lastOff = s.lastOff; st.t0 = s.t0; st.draft = s.draft || { name:'', d: st.iv }; }catch(e){ return; }
    if(st.t0 == null){ st.stopped = false; st.stopAt = null; }
    E('spInName').value = st.draft.name || '';
    spSave(); lastWatch = ''; renderRun(); tickOnce();
  };
  if(top.type === 'shot'){
    const last = st.cars[st.cars.length - 1];
    const r = last ? ranking(st).find(x => x.c.id === last.id) : null;
    confirmBox(t('spUndoAsk'), last ? dispName(last, st.cars.length - 1) + (r ? ' · ' + fmtGap(r.gap) : '') : '', t('ssDelete'), 'sp-danger', apply);
  } else {
    confirmBox(t('spUndoDelAsk'), top.label, t('spRestore'), 'sp-ok', apply);
  }
}
/* Stop (in alto a destra): il cronometro resta dov'e' e non riparte piu', il pulsante tondo
   non registra, e se ci sono tempi chiede se esportare. Esporta in basso resta diretto. */
function stopWatch(){
  const st = cur(); if(!st || st.ex || st.t0 == null || st.stopped) return;
  try{ E('spInName').blur(); }catch(e){}
  const now = Date.now(), last = lastPass(st);
  st.stopped = true;
  st.stopAt = (now - last) < 30*60*1000 ? now : last;   /* se era gia' fermo sull'ultimo passaggio, resta li' */
  spSave(); lastWatch = ''; renderRun(); tickOnce();
  if(st.cars.length) askExport();
}
function askExport(){
  const { bg, box } = dlg();
  const h = document.createElement('h3'); h.textContent = t('spStopped'); box.appendChild(h);
  const p = document.createElement('p'); p.textContent = t('spExportAsk'); box.appendChild(p);
  const b = document.createElement('div'); b.className = 'sp-btns';
  const no = btn(t('spNo')); no.id = 'spStopNo'; no.addEventListener('click', () => close(bg));
  const ye = btn(t('spExport'), 'sp-ok'); ye.id = 'spStopExp';
  /* condivisione chiamata subito, dentro il tocco, come il tasto Esporta */
  ye.addEventListener('click', () => { close(bg); exportImage(); });
  b.appendChild(no); b.appendChild(ye); box.appendChild(b);
}
function stepDraft(dir){
  const st = cur(); if(!st) return;
  const step = stepOf(st.iv);
  st.draft.d = Math.min(3600, Math.max(step, st.draft.d + dir*step));
  spSave(); renderRun();
}

/* ================= IMMAGINE DA CONDIVIDERE ================= */
const SANS = '-apple-system, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
const MONO = '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';
let logoImg = null;
(function(){ try{ const im = new Image(); im.onload = () => { logoImg = im; }; im.src = LOGO; }catch(e){} })();
try{ if(document.fonts && document.fonts.load){ document.fonts.load('800 46px "JetBrains Mono"').catch(()=>{}); document.fonts.load('700 27px "JetBrains Mono"').catch(()=>{}); } }catch(e){}
function rrect(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function fitText(g, s, maxW){
  if(g.measureText(s).width <= maxW) return s;
  let lo = 0, hi = s.length;
  while(lo < hi){ const mid = (lo + hi + 1) >> 1; if(g.measureText(s.slice(0, mid) + '…').width <= maxW) lo = mid; else hi = mid - 1; }
  return s.slice(0, lo) + '…';
}
function spacedW(g, s, sp){ let w = 0; for(const ch of s) w += g.measureText(ch).width + sp; return Math.max(0, w - sp); }
function drawSpaced(g, s, x, y, sp, align){
  if(align === 'right') x -= spacedW(g, s, sp);
  const a = g.textAlign; g.textAlign = 'left';
  for(const ch of s){ g.fillText(ch, x, y); x += g.measureText(ch).width + sp; }
  g.textAlign = a;
}
function fitSpaced(g, s, maxW, sp){
  if(spacedW(g, s, sp) <= maxW) return s;
  let k = s.length; while(k > 0 && spacedW(g, s.slice(0, k) + '…', sp) > maxW) k--;
  return s.slice(0, k) + '…';
}
function drawShare(st){
  const rows = ranking(st);
  const W = 1080, P = 60, L = 112, RH = 112, RG = 14, MAXW = W - 2*P;
  const km = kmLabel(st), place = (st.place || '').trim(), showPk = st.km > 0;
  const yTitle = P + L + 62, yDate = yTitle + 50, yPlace = yDate + 44;
  const top = (place ? yPlace : yDate) + 48;
  const H = top + rows.length * (RH + RG) - RG + 120;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  /* fondo nero con la trama carbonio dell'app */
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  const tile = document.createElement('canvas'); tile.width = tile.height = 8;
  const tg = tile.getContext('2d'); tg.strokeStyle = 'rgba(255,255,255,0.035)'; tg.lineWidth = 2;
  tg.beginPath(); tg.moveTo(-2, 10); tg.lineTo(10, -2); tg.moveTo(-2, -2); tg.lineTo(10, 10); tg.stroke();
  const pat = g.createPattern(tile, 'repeat'); if(pat){ g.fillStyle = pat; g.fillRect(0, 0, W, H); }
  /* logo + nome */
  if(logoImg){ g.save(); rrect(g, P, P, L, L, 26); g.clip(); g.drawImage(logoImg, P, P, L, L); g.restore(); }
  g.strokeStyle = '#2a2f36'; g.lineWidth = 2; rrect(g, P, P, L, L, 26); g.stroke();
  g.textBaseline = 'middle'; g.textAlign = 'left';
  g.fillStyle = '#f2f4f7'; g.font = '800 68px ' + SANS; g.fillText('iRally', P + L + 28, P + L/2 + 2);
  const nameEnd = P + L + 28 + g.measureText('iRally').width;
  g.fillStyle = '#ffb400'; g.font = '800 26px ' + SANS;
  const mode = t('spNav').toUpperCase();
  if(W - P - spacedW(g, mode, 4) > nameEnd + 30) drawSpaced(g, mode, W - P, P + L/2 + 2, 4, 'right');
  /* PS 1  /  Km 6 di 16 */
  const name = String(st.name).toUpperCase(), kmPart = km ? '  /  ' + km : '';
  let fs = 46;
  const widths = () => { g.font = '800 ' + fs + 'px ' + SANS; const a = spacedW(g, name, 3); g.font = '700 ' + fs + 'px ' + SANS; const b = kmPart ? g.measureText(kmPart).width : 0; return [a, b]; };
  let wd = widths();
  while(fs > 28 && wd[0] + wd[1] > MAXW){ fs -= 2; wd = widths(); }
  g.font = '800 ' + fs + 'px ' + SANS; g.fillStyle = '#ffb400';
  const nm0 = (wd[0] + wd[1] > MAXW) ? fitSpaced(g, name, MAXW - wd[1], 3) : name;
  drawSpaced(g, nm0, P, yTitle, 3);
  if(kmPart){ const x = P + spacedW(g, nm0, 3); g.font = '700 ' + fs + 'px ' + SANS; g.fillStyle = '#f2f4f7'; g.fillText(kmPart, x, yTitle); }
  /* data e descrizione del posto */
  g.fillStyle = '#8b949e'; g.font = '500 28px ' + SANS; g.fillText(fitText(g, dateLong(st.created), MAXW), P, yDate);
  if(place){ g.fillStyle = '#f2f4f7'; g.font = '600 30px ' + SANS; g.fillText(fitText(g, place, MAXW), P, yPlace); }
  /* classifica: distacco e, sotto, i secondi al km */
  rows.forEach((r, k) => {
    const y = top + k * (RH + RG), cy = y + RH/2, cls = gapCls(r);
    const col = cls === 'sp-neg' ? '#39d353' : (cls === 'sp-pos' ? '#ff4d4d' : '#ffb400');
    g.fillStyle = '#111417'; rrect(g, P, y, W - 2*P, RH, 20); g.fill();
    g.strokeStyle = r.isRef ? '#ffb400' : '#2a2f36'; g.lineWidth = 2; rrect(g, P, y, W - 2*P, RH, 20); g.stroke();
    g.fillStyle = '#ffb400'; g.font = '800 40px ' + MONO; g.textAlign = 'center'; g.fillText(String(k + 1), P + 52, cy);
    const gt = fmtGap(r.gap), pk = showPk ? perKm(st, r) : '';
    g.textAlign = 'right'; g.fillStyle = col;
    let gw;
    if(pk){
      g.font = '800 44px ' + MONO; gw = g.measureText(gt).width; g.fillText(gt, W - P - 30, cy - 15);
      g.font = '700 27px ' + MONO; gw = Math.max(gw, g.measureText(pk).width); g.fillText(pk, W - P - 30, cy + 30);
    } else {
      g.font = '800 46px ' + MONO; gw = g.measureText(gt).width; g.fillText(gt, W - P - 30, cy);
    }
    g.textAlign = 'left';
    const nx = P + 104;
    let tagW = 0;
    if(r.isRef){ g.font = '800 22px ' + SANS; tagW = spacedW(g, t('spRef'), 2) + 24; }
    g.font = '700 40px ' + SANS; g.fillStyle = '#f2f4f7';
    const nm = fitText(g, dispName(r.c, r.i), W - P - 30 - gw - 36 - nx - (tagW ? tagW + 16 : 0));
    g.fillText(nm, nx, cy + 1);
    if(r.isRef){
      const tx = nx + g.measureText(nm).width + 16;
      g.strokeStyle = '#ffb400'; g.lineWidth = 2; rrect(g, tx, cy - 19, tagW, 38, 8); g.stroke();
      g.fillStyle = '#ffb400'; g.font = '800 22px ' + SANS; drawSpaced(g, t('spRef'), tx + 12, cy + 1, 2);
    }
  });
  /* piede */
  g.fillStyle = '#8b949e'; g.font = '500 24px ' + SANS; g.textAlign = 'left';
  g.fillText(fitText(g, t('spShareFoot'), MAXW), P, H - 56);
  return c;
}
function shareName(st){
  const base = String(st.name).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'prova';
  return 'iRally-' + base + '.png';
}
function dataUrlToBlob(u){
  const i = u.indexOf(','); const bin = atob(u.slice(i + 1));
  const a = new Uint8Array(bin.length); for(let k = 0; k < bin.length; k++) a[k] = bin.charCodeAt(k);
  return new Blob([a], { type:'image/png' });
}
/* condivisione di iOS (WhatsApp, Messaggi, Salva immagine...): chiamata subito, nel tocco,
   come l'esportazione del backup; se il telefono non la offre, anteprima da tenere premuta */
function exportImage(){
  const st = cur(); if(!st || !st.cars.length) return;
  let url;
  try{ url = drawShare(st).toDataURL('image/png'); }catch(e){ showMsg(String(e && e.message || e)); return; }
  const blob = dataUrlToBlob(url), fname = shareName(st);
  try{
    const file = new File([blob], fname, { type:'image/png' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      navigator.share({ files:[file] }).catch(err => { if(err && err.name === 'AbortError') return; showPreview(url); });
      return;
    }
  }catch(e){}
  showPreview(url);
}
function showPreview(url){ E('spPvImg').src = url; E('spPv').hidden = false; }

/* ================= FINESTRE (stile uiBox dell'app) ================= */
function dlg(){ const r = uiBox(); r.box.classList.add('sp-dlg'); return { bg: r.ov, box: r.box }; }
function close(bg){ uiClose(bg); }
function btn(label, cls){ const b = document.createElement('button'); b.type = 'button'; b.textContent = label; if(cls) b.className = cls; return b; }
function confirmBox(title, text, yes, yesCls, onYes){
  const { bg, box } = dlg();
  const h = document.createElement('h3'); h.textContent = title; box.appendChild(h);
  if(text){ const p = document.createElement('p'); p.textContent = text; box.appendChild(p); }
  const b = document.createElement('div'); b.className = 'sp-btns';
  const no = btn(t('tcCancel')); no.addEventListener('click', () => close(bg));
  const ye = btn(yes, yesCls || 'sp-danger'); ye.addEventListener('click', () => { close(bg); onYes(); });
  b.appendChild(no); b.appendChild(ye); box.appendChild(b);
}
function askText(title, preset, onOk){
  const { bg, box } = dlg();
  const h = document.createElement('h3'); h.textContent = title; box.appendChild(h);
  const inp = document.createElement('input'); inp.type = 'text'; inp.className = 'sp-in'; inp.id = 'spAsk'; inp.value = preset || ''; inp.maxLength = 40;
  inp.setAttribute('autocapitalize','characters'); inp.setAttribute('autocomplete','off');
  box.appendChild(inp);
  const b = document.createElement('div'); b.className = 'sp-btns';
  const no = btn(t('tcCancel')); no.addEventListener('click', () => close(bg));
  const ok = btn('OK', 'sp-ok');
  const go = () => { const v = inp.value.trim(); if(!v){ inp.focus(); return; } close(bg); onOk(v); };
  ok.addEventListener('click', go);
  inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); go(); } });
  b.appendChild(no); b.appendChild(ok); box.appendChild(b);
  setTimeout(() => { try{ inp.focus(); }catch(e){} }, 120);
}
function pickInterval(start, onOk){
  const { bg, box } = dlg();
  let v = start || 60;
  const h = document.createElement('h3'); h.textContent = t('spIv'); box.appendChild(h);
  const chips = document.createElement('div'); chips.className = 'sp-chips';
  const btns = [30, 60, 120, 180, 300].map(sec => { const c = btn(fmtOff(sec)); c.dataset.sec = sec; c.addEventListener('click', () => { v = sec; upd(); }); chips.appendChild(c); return c; });
  box.appendChild(chips);
  const stp = document.createElement('div'); stp.className = 'sp-step';
  const m = btn('−'); m.setAttribute('aria-label','-');
  const val = document.createElement('b'); val.id = 'spIvVal';
  const p = btn('+'); p.setAttribute('aria-label','+');
  m.addEventListener('click', () => { v = Math.max(5, v - 5); upd(); });
  p.addEventListener('click', () => { v = Math.min(900, v + 5); upd(); });
  stp.appendChild(m); stp.appendChild(val); stp.appendChild(p); box.appendChild(stp);
  const upd = () => { val.textContent = fmtOff(v); btns.forEach(c => c.classList.toggle('sp-sel', +c.dataset.sec === v)); };
  upd();
  const b = document.createElement('div'); b.className = 'sp-btns';
  const no = btn(t('tcCancel')); no.addEventListener('click', () => close(bg));
  const ok = btn('OK', 'sp-ok'); ok.id = 'spIvOk';
  ok.addEventListener('click', () => { close(bg); onOk(v); });
  b.appendChild(no); b.appendChild(ok); box.appendChild(b);
}
function pickPlace(v, onOk){
  const { bg, box } = dlg();
  const h = document.createElement('h3'); h.textContent = t('spWhere'); box.appendChild(h);
  const row = document.createElement('div'); row.className = 'sp-kmrow';
  const l1 = document.createElement('span'); l1.textContent = 'Km';
  const a = document.createElement('input'); a.type = 'text'; a.id = 'spKmAt'; a.inputMode = 'decimal'; a.autocomplete = 'off'; a.maxLength = 6; a.placeholder = '6'; a.value = v.km != null ? fmtKm(v.km) : '';
  const l2 = document.createElement('span'); l2.textContent = t('spKmOfWord');
  const b2 = document.createElement('input'); b2.type = 'text'; b2.id = 'spKmTot'; b2.inputMode = 'decimal'; b2.autocomplete = 'off'; b2.maxLength = 6; b2.placeholder = '16'; b2.value = v.kmTot != null ? fmtKm(v.kmTot) : '';
  const l3 = document.createElement('span'); l3.textContent = 'km';
  [l1, a, l2, b2, l3].forEach(e => row.appendChild(e)); box.appendChild(row);
  const d = document.createElement('input'); d.type = 'text'; d.className = 'sp-in'; d.id = 'spPlaceTxt'; d.maxLength = 60; d.autocomplete = 'off'; d.setAttribute('autocapitalize','sentences'); d.placeholder = t('spPlaceHint'); d.value = v.place || '';
  box.appendChild(d);
  const bt = document.createElement('div'); bt.className = 'sp-btns';
  const no = btn(t('tcCancel')); no.addEventListener('click', () => close(bg));
  const ok = btn('OK', 'sp-ok'); ok.id = 'spPlaceOk';
  ok.addEventListener('click', () => { close(bg); onOk({ km: parseKm(a.value), kmTot: parseKm(b2.value), place: d.value.trim() }); });
  a.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); b2.focus(); } });
  b2.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); d.focus(); } });
  d.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); ok.click(); } });
  bt.appendChild(no); bt.appendChild(ok); box.appendChild(bt);
}
function showHelp(){
  const { bg, box } = dlg();
  const h = document.createElement('h3'); h.textContent = t('spNav') + ' · ' + t('spHelpTitle'); box.appendChild(h);
  const p = document.createElement('p'); p.textContent = t('spHelpBody'); box.appendChild(p);
  const b = document.createElement('div'); b.className = 'sp-btns';
  const ok = btn('OK', 'sp-ok'); ok.addEventListener('click', () => close(bg));
  b.appendChild(ok); box.appendChild(b);
}

/* ================= COLLEGAMENTI ================= */
E('drvSpect').addEventListener('click', () => { closeDrawer(); spOpen(); });
E('spClose').addEventListener('click', () => { if(!E('spRun').hidden){ SP.cur = null; spSave(); showList(); } else spCloseOv(); });
E('spHelp').addEventListener('click', showHelp);
E('spNew').addEventListener('click', newStage);
E('spBack').addEventListener('click', () => { SP.cur = null; spSave(); showList(); });
E('spPlace').addEventListener('click', () => { const st = cur(); if(!st) return; pickPlace(st, pl => { st.km = pl.km; st.kmTot = pl.kmTot; st.place = pl.place; spSave(); renderRun(); }); });
E('spUndo').addEventListener('click', undoLast);
E('spExport').addEventListener('click', exportImage);
E('spStop').addEventListener('click', stopWatch);
E('spPvClose').addEventListener('click', () => { E('spPv').hidden = true; E('spPvImg').removeAttribute('src'); });
E('spDMinus').addEventListener('click', () => stepDraft(-1));
E('spDPlus').addEventListener('click', () => stepDraft(1));
E('spInName').addEventListener('input', () => { const st = cur(); if(!st) return; st.draft.name = E('spInName').value; spSave(); renderNext(); });
E('spInName').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); E('spInName').blur(); } });
E('spRows').addEventListener('click', e => { const r = e.target.closest('.sp-row'); if(r) rowMenu(r.getAttribute('data-id')); });
E('spRows').addEventListener('touchstart', () => { if(document.activeElement === E('spInName')) E('spInName').blur(); }, { passive:true });
E('spWatch').addEventListener('click', () => { if(document.activeElement === E('spInName')) E('spInName').blur(); });
const SH = E('spShot');
/* touchstart con preventDefault: il tempo parte al tocco e la tastiera, se aperta, resta aperta */
SH.addEventListener('touchstart', e => { e.preventDefault(); if(SH.disabled) return; SH.classList.add('sp-down'); shot(evEpoch(e)); }, { passive:false });
SH.addEventListener('touchend', () => SH.classList.remove('sp-down'));
SH.addEventListener('touchcancel', () => SH.classList.remove('sp-down'));
SH.addEventListener('mousedown', e => { e.preventDefault(); if(SH.disabled) return; SH.classList.add('sp-down'); shot(evEpoch(e)); });
SH.addEventListener('mouseup', () => SH.classList.remove('sp-down'));
SH.addEventListener('mouseleave', () => SH.classList.remove('sp-down'));
SH.addEventListener('keydown', e => { if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); if(!e.repeat) shot(Date.now()); } });
})();
</script>
