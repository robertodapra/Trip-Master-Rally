  for(let i=first-1, t=1; i>=0; i--, t++){ const top = f[0]-hf*t; out[i] = top >= -hf*0.5 ? [Math.max(0, top), Math.max(0, f[0]-hf*(t-1))] : f; }
  const l = bands[at[lastI]], hl = l[1]-l[0];
  for(let i=lastI+1, t=1; i<M; i++, t++) out[i] = [l[1]+hl*(t-1), l[1]+hl*t];
  for(let i=first+1;i<lastI;i++) if(!out[i]){
    let pv = i-1; while(at[pv] < 0) pv--; let nx = i+1; while(at[nx] < 0) nx++;
    out[i] = Math.abs(cys[i] - ctr(bands[at[pv]])) <= Math.abs(cys[i] - ctr(bands[at[nx]])) ? bands[at[pv]] : bands[at[nx]];
  }
  return { pick: out, free: at.filter(v => v < 0).length };
}
async function scanOnePage(img, fromPdf, pdfBands, pageBounds){
  /* DUE PERCORSI SEPARATI (16 set 2026, richiesta di Roberto):
       - pagina resa da un PDF: immagine gia' perfetta, NESSUN trattamento
       - foto della fotocamera: contrasto + raddrizzamento (vedi prepPhoto)
     L'app sa da dove viene l'immagine, non lo deve indovinare: cosi' una
     modifica pensata per le foto non puo' toccare il PDF, e viceversa. */
  const isPhoto = !fromPdf && looksLikePhoto(img);
  let unreadable = false;
  const img0 = img;   /* la foto com'e': il nuovo ritaglio lavora sull'originale, non ruotato */
  if(isPhoto) img = prepPhoto(img);
  const b64 = imgToB64(img, 1800);
  if(!b64) throw new Error('immagine vuota');
  const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const tm = setTimeout(()=>{ try{ ctrl && ctrl.abort(); }catch(_){} }, 150000);
  let res;
  try{
    res = await fetch(SCAN_API, {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'X-App-Key': window.__rallyAuth.key},
      body: JSON.stringify({ image: b64, device: window.__rallyAuth.device }),
      signal: ctrl ? ctrl.signal : undefined
    });
  }catch(e){ clearTimeout(tm); throw new Error(e && e.name === 'AbortError' ? t('scanWhyTime') + ' (150 s)' : t('scanWhyNet')); }
  clearTimeout(tm);
  const data = await res.json();
  /* 23 nov 2026: limite giornaliero del worker. Prima si leggeva "Errore di connessione" con il
     motivo in italiano anche nelle altre lingue; e la seconda lettura automatica lo ripeteva. */
  if(data && data.limited){ const le = new Error(t('scanLimit')); le.limited = true; throw le; }
  if(data.error) throw new Error(data.error);
  let rows = Array.isArray(data.rows) ? data.rows : [];
  if(!rows.length && !(Array.isArray(pdfBands) && pdfBands.length)) return { rb: [], gap: 0 };   /* col testo del PDF le righe ci sono anche se l'AI non ne vede */
  rows = rows.slice().sort((a,b)=> (parseInt(a.num,10)||0) - (parseInt(b.num,10)||0));
  /* FOTO A MANO (13 ott 2026): strisce raddrizzate a maglia (vedi PhotoTable). Il numero
     di riferimenti letto dall'AI serve solo a dire in quante parti va una cella unita.
     Se il conto non torna (es. due pagine nella stessa foto) si ripiega sul metodo di prima. */
  let photoCrops = null;
  if(isPhoto){ try{ photoCrops = PhotoTable.strips(img0, rows.length); }catch(e){ photoCrops = null; } }
  const cols = (data.cols && typeof data.cols === 'object') ? data.cols : null;
  const okBox = b => Array.isArray(b) && b.length===4 && b.every(v => typeof v === 'number' && !isNaN(v));
  const cyOf0 = r => okBox(r.rowbox) ? (r.rowbox[0]+r.rowbox[2])/2 : (okBox(r.box) ? (r.box[0]+r.box[2])/2 : (okBox(r.numbox) ? r.numbox[0] : null));
  const tbl = detectTable(img, { y: rows.map(cyOf0).filter(v=>v!=null), photo: isPhoto });
  /* tolleranza larga: l'avviso scatta solo se NON trova nessuna riga, non alla prima
     imperfezione. Le foto fatte bene continuano a passare senza dire niente. */
  if(isPhoto && !tbl && !photoCrops) unreadable = true;
  /* bordi misurati su tutte le pagine: vincono su quelli trovati qui. Dal 23 nov 2026 la
     posizione e' quella di QUESTA pagina (pageBounds), la larghezza quella comune. */
  const sb = pageBounds || scanBounds;
  if(tbl && sb && tbl.W){
    tbl.x0 = sb.x0 * tbl.W;
    tbl.x1 = sb.x1 * tbl.W;
  }
  let snapped = false;
  /* RIGHE DAL TESTO DEL PDF (15 nov 2026, vedi planPdfBands): una striscia per ogni numerino
     scritto nella pagina. Dall'AI si prendono solo i dati della riga con lo stesso numero
     (o, se i numeri non tornano, nello stesso ordine); il Totale scritto nel PDF vince su
     quello letto dall'AI. Le posizioni dell'AI qui non servono piu'. */
  const fromText = !isPhoto && Array.isArray(pdfBands) && pdfBands.length > 0;
  if(fromText){
    const HH = img.naturalHeight || img.height;
    let X0 = 0, X1 = 1000;
    if(tbl && tbl.W){ X0 = tbl.x0*1000/tbl.W; X1 = tbl.x1*1000/tbl.W; }
    else if(sb){ X0 = sb.x0*1000; X1 = sb.x1*1000; }
    const byNum = {};
    rows.forEach(r => { const k = parseInt(r.num, 10); if(k && !byNum[k]) byNum[k] = r; });
    const allNum = pdfBands.every(b => byNum[b.n]);
    rows = pdfBands.map((b, i) => {
      const r = allNum ? byNum[b.n] : (rows.length === pdfBands.length ? rows[i] : (byNum[b.n] || null));
      return { num: String(b.n), km: b.km || (r && r.km != null ? r.km : ''), nota: r ? (r.nota || '') : '', box: [b.y0*1000/HH, X0, b.y1*1000/HH, X1] };
    });
    snapped = true;
  }
  /* RIGHE CHE NON TORNANO (4 nov 2026): se sulla pagina (non foto) si trovano meno righe
     dei riferimenti letti, il taglio resta quello di sempre ma la pagina viene segnalata
     nel resoconto finale, cosi' si sa quali strisce controllare. */
  let short = null;
  if(!fromText && !isPhoto && !photoCrops && (!tbl || tbl.bands.length < rows.length)) short = { found: tbl ? tbl.bands.length : 0, want: rows.length };
  if(!fromText && tbl && tbl.bands.length){
    const M = rows.length;
    const bands = tbl.bands;   /* gia' filtrate: solo righe dei riferimenti */
    const cyOf = r => okBox(r.rowbox) ? (r.rowbox[0]+r.rowbox[2])/2 : (okBox(r.box) ? (r.box[0]+r.box[2])/2 : (okBox(r.numbox) ? r.numbox[0] : null));
    const cys = rows.map(r => { const v=cyOf(r); return v==null ? null : v*tbl.H/1000; });
    let pick = null;
    if(bands.length === M){
      /* tante righe quante ne ha lette l'AI: nessun dubbio, si usano in ordine */
      pick = bands.slice();
    } else if(bands.length > M){
      /* piu' righe che riferimenti: scelgo la finestra di M righe consecutive
         piu' vicina a quello che ha letto l'AI (se ha dato coordinate utili) */
      let best=null;
      for(let st=0; st+M<=bands.length; st++){
        let cost=0;
        for(let i=0;i<M;i++){ const b=bands[st+i]; cost += (cys[i]==null? 0 : Math.abs(cys[i]-(b[0]+b[1])/2)); }
        if(best===null || cost<best.cost) best={st, cost};
      }
      pick = bands.slice(best.st, best.st+M);
      /* RIGHE NON CONSECUTIVE (Schio p.66, 4 nov 2026): fra due riferimenti ci puo' essere una
         fascia senza riferimenti (foto aerea, mappa). Se abbinando ogni riferimento alla sua riga,
         in ordine e saltando quelle vuote, si sta molto piu' vicini all'AI, vince questo. */
      if(!isPhoto && cys.every(v => v != null)){
        const B = bands.length, INF = 1e18, cost = (k, j) => Math.abs(cys[k] - (bands[j][0]+bands[j][1])/2);
        const dp = [], from = [];
        for(let k=0;k<M;k++){ dp.push(new Array(B).fill(INF)); from.push(new Array(B).fill(-1)); }
        for(let j=0;j<B;j++) dp[0][j] = cost(0, j);
        for(let k=1;k<M;k++){ let bi=-1, bv=INF; for(let j=k;j<B;j++){ if(dp[k-1][j-1] < bv){ bv = dp[k-1][j-1]; bi = j-1; } if(bv < INF){ dp[k][j] = bv + cost(k, j); from[k][j] = bi; } } }
        let j = -1, v = INF; for(let jj=M-1;jj<B;jj++) if(dp[M-1][jj] < v){ v = dp[M-1][jj]; j = jj; }
        if(j >= 0 && v < best.cost*0.5){ const idx = []; for(let k=M-1;k>=0;k--){ idx.unshift(j); j = from[k][j]; } pick = idx.map(i => bands[i]); }
      }
    } else if(bands.length && (!isPhoto || bands.length >= Math.max(2, Math.ceil(M*0.6)))){
      /* meno righe che riferimenti (foto con due pagine, o riga in piu' letta dall'AI):
         uso le righe trovate e per le eccedenti proseguo con la stessa altezza.
         Solo se ne ho trovate quasi tutte: con 1 riga su 5 (foto in prospettiva)
         prolungare produce strisce nere, meglio il ritaglio con le posizioni dell'AI. */
      const h = bands[bands.length-1][1] - bands[bands.length-1][0];
      pick = bands.slice();
      /* righe mancanti SOPRA (Galles p.127, 4 nov 2026: la tabella continua dalla pagina prima e
         la prima riga non ha la linea in alto): se l'AI vede riferimenti sopra la prima riga
         trovata, le righe mancanti vanno sopra, non in fondo */
      if(!isPhoto){
        let nA = cys.filter(c => c != null && c < pick[0][0]).length;
        while(nA-- > 0 && pick.length < M){ const f = pick[0], hf = f[1]-f[0]; if(f[0] < hf*0.5) break; pick.unshift([Math.max(0, f[0]-hf), f[0]]); }
      }
      while(pick.length < M){ const last = pick[pick.length-1]; pick.push([last[1], last[1]+h]); }
    }
    /* ABBINAMENTO PER POSIZIONE (5 nov 2026, vedi matchPick): se mettendo ogni riferimento nella
       riga dove l'AI lo vede si sta molto piu' vicini all'AI (meno del 60% della distanza), vince
       questo. Con l'AI precisa le due scelte coincidono e non cambia niente. */
    if(pick && !isPhoto && M >= 2 && cys.every(v => v != null)){
      const alt = matchPick(bands, cys);
      const cst = a => a.reduce((s, r, i) => s + Math.abs(cys[i] - (r[0]+r[1])/2), 0);
      if(alt && cst(alt.pick) < cst(pick)*0.6){
        pick = alt.pick;
        /* un riferimento senza una riga sua (letto in piu' o riga non trovata): pagina da controllare */
        if(alt.free && !short) short = { found: M - alt.free, want: M };
      }
    }
    if(pick){
      const X0 = tbl.x0!=null ? tbl.x0*1000/tbl.W : ((cols && typeof cols.left==='number') ? cols.left : 0);
      const X1 = tbl.x1!=null ? tbl.x1*1000/tbl.W : ((cols && typeof cols.infoEnd==='number') ? cols.infoEnd : 1000);
      rows.forEach((r,i)=>{ r.box = [pick[i][0]*1000/tbl.H, X0, pick[i][1]*1000/tbl.H, X1]; });
      snapped = true;
    }
  }
  const hasRow = !snapped && rows.every(r => okBox(r.rowbox));
  if(hasRow){
    /* 1) altezza tipica di una riga (mediana): serve a riconoscere righe "doppie" */
    const hs = rows.map(r => r.rowbox[2]-r.rowbox[0]).filter(h=>h>10).sort((a,b)=>a-b);
    const medH = hs.length ? hs[Math.floor(hs.length/2)] : 0;
    /* 2) bordi colonna: quelli di pagina se ci sono, altrimenti quelli della riga stessa */
    const X0 = (cols && typeof cols.left==='number') ? cols.left : null;
    const X1 = (cols && typeof cols.infoEnd==='number') ? cols.infoEnd : null;
    for(let i=0;i<rows.length;i++){
      const r = rows[i]; let [y0,x0,y1,x1] = r.rowbox;
      /* righe consecutive non si sovrappongono: il confine e' la linea in mezzo */
      if(i>0){ const p = rows[i-1].rowbox; if(y0 < p[2]){ const mid = (y0 + p[2]) / 2; p[2] = mid; y0 = mid; } }
      /* riga alta il doppio = due riferimenti fusi: tengo solo la parte del suo numerino */
      if(medH && (y1-y0) > medH*1.7){ if(okBox(r.numbox)) { y1 = Math.min(y1, r.numbox[2] + medH*0.06); y0 = Math.max(y0, y1 - medH); } else y1 = y0 + medH; }
      rows[i].rowbox = [y0, X0!==null ? X0 : x0, y1, X1!==null ? X1 : x1];
    }
    rows.forEach(r => { r.box = r.rowbox.slice(); });
  } else if(!snapped){
    /* fallback: vecchio metodo basato sui numerini */
    const hasNB = rows.every(r => okBox(r.numbox));
    if(hasNB){
      const hs=[];
      for(let i=1;i<rows.length;i++){ const d=rows[i].numbox[2]-rows[i-1].numbox[2]; if(d>15) hs.push(d); }
      hs.sort((a,b)=>a-b);
      const cellH = hs.length ? hs[Math.floor(hs.length/2)] : 0;
      for(let i=0;i<rows.length;i++){
        const r=rows[i], nb=r.numbox, prev = i>0 ? rows[i-1].numbox : null;
        let top;
        if(prev) top = prev[2];
        else if(cellH) top = Math.max(0, nb[2] - cellH);
        else top = okBox(r.box) ? Math.min(r.box[0], nb[0]) : 0;
        const bottom = nb[2];
        const x0 = (cols && typeof cols.left==='number') ? cols.left : 0;
        const x1 = (cols && typeof cols.infoEnd==='number') ? cols.infoEnd : (okBox(r.box) ? r.box[3] : 1000);
        if(bottom - top > 15) r.box = [top, x0, bottom, x1];
      }
    }
  }
  let gap = 0;
  for(let i=1;i<rows.length;i++){ const a=parseInt(rows[i-1].num,10), b=parseInt(rows[i].num,10); if(a && b && b>a+1){ gap=a+1; break; } }
  const rb = [];
  for(let ri = 0; ri < rows.length; ri++){
    const r = rows[ri];
    const km = (r.km == null ? '' : String(r.km)).replace('.', ',').trim();
    const nota = (r.nota || '').trim();
    let cropped = '';
    if(photoCrops) cropped = photoCrops[ri];
    else if(Array.isArray(r.box) && r.box.length === 4){ try{ cropped = aiCrop(img, r.box); }catch(e){} }
    rb.push({ km: km, s: '', n: nota, img: imgPut(cropped) });
  }
  return { unreadable, rb, gap, short, model: data.model || '', ms: data.ms || 0 };
}

/* piu' pagine insieme: una alla volta, poi fuse in un'unica prova ordinata per Totali */
async function scanAIRunFiles(files, fromPdf, pageNums){
  const name = pendingStageName;
  const append = pendingAppend;
  const target = pendingStageObj;
  const targetFolder = pendingFolder || ssCurFolder || null;   /* cartella in cui finisce una prova nuova */
  pendingStageName = null; pendingAppend = false; pendingStageObj = null;
  /* resoconto per chi chiama: l'importazione PDF lo usa per UN solo avviso finale */
  const report = { name: name, saved: 0, failed: [], why: [], gaps: [], rows: [] };
  if(!files.length || !name) return report;
  const n = files.length;
  /* come si chiama la pagina negli avvisi: il numero VERO della pagina del PDF quando
     c'e' (prima usciva "7" per la pagina 47), altrimenti la posizione fra le foto */
  const lbl = i => (pageNums && pageNums[i] != null) ? pageNums[i] : (i+1);
  let gaps = [], info = '';
  const bad = {};   /* pagine non lette: indice -> { why, retry } */
  const shortP = {};   /* pagine con meno righe trovate dei riferimenti: indice -> { found, want } */
  const parts = new Array(n).fill(null);
  const t0 = Date.now();
  let doneCount = 0;
  /* BORDI LATERALI CONDIVISI (16 set 2026): le pagine di una stessa prova hanno la
     stessa tabella, ma su qualche pagina i bordi venivano trovati piu' stretti e la
     striscia perdeva Totale e Parziale. Li misuro su tutte le pagine e tengo il
     valore centrale: le pagine difficili ereditano quello delle altre. */
  /* PAGINE A SPECCHIO (23 nov 2026, road book di Alba): nei libretti stampati fronte/retro
     la tabella sta un po' piu' a sinistra sulle pagine pari che sulle dispari (o viceversa).
     Con i bordi UGUALI per tutte le pagine, le pagine dell'altro tipo uscivano spostate: Totale
     tagliato a sinistra e un pezzo della colonna dopo a destra, una pagina si' e una no.
     Ora si condivide la LARGHEZZA (strisce identiche) e ogni pagina tiene la SUA posizione.
     Una pagina con i bordi trovati male (piu' stretti) prende la posizione di una pagina buona
     con lo stesso bordo sinistro o destro, poi della pagina di due prima o dopo (stesso lato
     del libretto); solo se non c'e' niente di meglio resta il valore centrale di prima. */
  scanBounds = null;
  files.forEach(f => { try{ delete f.__bounds; }catch(_){} });
  if(n > 1){
    try{
      const xs = [], xe = [], pb = [];
      for(const f of files){
        const im = await loadImageFile(f);
        const t = detectTable(im, { y: [], photo: !fromPdf && looksLikePhoto(im) });
        if(t && t.W){ xs.push(t.x0 / t.W); xe.push(t.x1 / t.W); pb.push({ x0: t.x0 / t.W, x1: t.x1 / t.W }); }
        else pb.push(null);
      }
      if(xs.length >= 2){
        xs.sort((a,b)=>a-b); xe.sort((a,b)=>a-b);
        scanBounds = { x0: xs[Math.floor(xs.length/2)], x1: xe[Math.floor(xe.length/2)] };
        const ws = pb.filter(Boolean).map(b => b.x1 - b.x0).sort((a,b)=>a-b);
        const Wm = ws[Math.floor(ws.length/2)], TOL = 0.012;
        const ok = b => !!b && Math.abs((b.x1 - b.x0) - Wm) <= TOL;
        const good = pb.filter(ok);
        if(good.length){
          pb.forEach((b, i) => {
            let x0 = null;
            if(ok(b)) x0 = b.x0;
            else if(b){
              const g = good.find(q => Math.abs(q.x0 - b.x0) <= TOL) || good.find(q => Math.abs(q.x1 - b.x1) <= TOL);
              if(g) x0 = g.x0;
            }
            if(x0 == null){ const q = [pb[i-2], pb[i+2]].find(ok); if(q) x0 = q.x0; }
            if(x0 != null) files[i].__bounds = { x0: x0, x1: Math.min(1, x0 + Wm) };
          });
        }
      }
    }catch(e){ scanBounds = null; }
  }
  let retrying = false;
  const label = ()=> retrying ? t('scanRetrying') : (n>1 ? t('scanPage').replace('{i}', doneCount).replace('{n}', n) : t('scanReading'));
  const tick = setInterval(()=>{ window.__scanBusy(true, label() + ' \u00B7 ' + Math.round((Date.now()-t0)/1000) + ' s'); }, 1000);
  window.__scanBusy(true, label());
  /* pagine in parallelo, massimo 3 insieme: il tempo totale e' quello della piu' lenta */
  const MAXP = 3;
  async function readPage(i){
    try{
      const img = await loadImageFile(files[i]);
      const r = await scanOnePage(img, !!fromPdf, files[i] && files[i].__bands, files[i] && files[i].__bounds);
      if(r.model && !info) info = r.model + (r.ms ? ' \u00B7 ' + Math.round(r.ms/1000) + 's' : '');
      if(!r.rb.length) bad[i] = { why: r.unreadable ? t('scanBlurry') : t('rbRefsN').replace('{n}', '0'), retry: !r.unreadable };
      else { parts[i] = r.rb; delete bad[i]; if(r.gap) gaps.push(lbl(i)); if(r.short) shortP[i] = r.short; else delete shortP[i]; }
    }catch(e){ bad[i] = { why: (e&&e.message)||'errore', retry: !(e&&e.limited), limited: !!(e&&e.limited) }; }
  }
  async function runQueue(list, onDone){
    let cursor = 0;
    const worker = async ()=>{ while(cursor < list.length){ const i = list[cursor++]; await readPage(i); if(onDone) onDone(); } };
    await Promise.all(Array.from({length: Math.min(MAXP, list.length)}, worker));
  }
  try{
    await runQueue(Array.from({length: n}, (_, i) => i), ()=>{ doneCount++; });
    /* SECONDA LETTURA AUTOMATICA (28 set 2026): una pagina non letta e' quasi sempre un
       errore momentaneo dell'AI (risposta malformata, sovraccarico). Si riprova da soli,
       dopo una breve pausa, PRIMA di avvisare. Le foto illeggibili no: stessa foto,
       stesso risultato. */
    const again = Object.keys(bad).map(Number).filter(i => bad[i].retry);
    if(again.length){
      retrying = true; window.__scanBusy(true, label());
      await new Promise(r => setTimeout(r, 1500));
      await runQueue(again);
    }
  } finally { clearInterval(tick); }
  const failIdx = Object.keys(bad).map(Number).sort((a,b)=>a-b);
  const failed = failIdx.map(lbl), why = failIdx.map(i => lbl(i) + ': ' + bad[i].why);
  gaps.sort((a,b)=>a-b);
  const rowsTxt = Object.keys(shortP).map(Number).filter(i => parts[i]).sort((a,b)=>a-b)
    .map(i => t('scanRowsItem').replace('{p}', lbl(i)).replace('{f}', shortP[i].found).replace('{w}', shortP[i].want));
  report.failed = failed; report.why = why; report.gaps = gaps; report.rows = rowsTxt;
  const lim = failIdx.some(i => bad[i] && bad[i].limited);   /* limite di oggi: si dice quello e basta */
  let all = [];
  parts.forEach(rb=>{ if(rb) all = all.concat(rb); });
  if(!all.length){
    if(!pageNums) showMsg('\u26A0\uFE0F ' + (lim ? t('scanLimit') : (n>1 ? t('scanNone') : t('scanConnErr'))) + (!lim && why.length ? '\n(' + why.join(' \u00B7 ') + ')' : ''));
    return report;
  }
  /* la prova si cerca SOLO nella sua cartella: una omonima in un'altra cartella (Ticino "ps2"
     contro Casciana "ps2") e' un'altra prova e non va toccata. "+ Aggiungi scan" sa gia' quale. */
  let stage = (append && target && cfg.ssLib.indexOf(target) >= 0) ? target
    : cfg.ssLib.find(x => x.name === name && (x.folder || null) === targetFolder);
  if(!stage){ stage = { id: ssNewId(), name: name, rb: [] }; if(targetFolder) stage.folder = targetFolder; cfg.ssLib.push(stage); }
  if(!stage.id) stage.id = ssNewId();
  stage.rb = append ? (stage.rb || []).concat(all) : all;
  if(pendingMaxKm != null){
    /* importazione da PDF: il roadbook include spesso il trasferimento dopo il fine prova.
       Conosciamo i km della prova dal titolo: le righe oltre (con tolleranza) vengono tolte */
    /* tolleranza 50 m, non 500: l'ultima riga della prova sta esattamente al
       chilometraggio del titolo (e' la bandiera a scacchi). Con mezzo chilometro
       passavano i primi riferimenti del rientro (Cassino: 30,04 e 30,13 su una
       prova di 29,93). */
    const maxKm = pendingMaxKm + 0.05; pendingMaxKm = null;
    stage.rb = stage.rb.filter(r => (parseKm(r.km) || 0) <= maxKm);
  }
  stage.rb.sort((a,b)=> (parseKm(a.km)||0) - (parseKm(b.km)||0));
  cfg.rb = JSON.parse(JSON.stringify(stage.rb));
  cfg.ssActive = stage.name;
  cfg.ssActiveId = stage.id;
  rbPassedIdx = null; radShownIdx = -2; rbOffset = 0; radManualIdx = null; radManualAhead = false;
  updateSsBadge();
  const ok = saveCfg();
  buildSsList();
  if(!ok){ showMsg('\u26A0\uFE0F ' + t('storeFull')); return report; }
  report.saved = all.length;
  if(pageNums) return report;   /* importazione PDF: gli avvisi li mostra lei, tutti insieme alla fine */
  let warn = '';
  if(failed.length) warn += t('scanPagesFail').replace('{list}', failed.join(', ')) + (why.length ? '\n(' + why.join(' \u00B7 ') + ')' : '');
  if(gaps.length) warn += (warn ? '\n' : '') + t('scanPagesGap').replace('{list}', gaps.join(', '));
  if(rowsTxt.length) warn += (warn ? '\n' : '') + t('scanPagesRows').replace('{list}', rowsTxt.join(', '));
  if(warn) showMsg('\u26A0\uFE0F ' + all.length + ' ' + t('scanSaved') + '\n' + warn);
  else showToast('\u2705 ' + all.length + ' ' + t('scanSaved') + (info ? ' \u00B7 ' + info : ''));
}

/* scelta delle foto: parte la lettura (una o piu' pagine) */
function loadImageFile(f){
  return new Promise((res, rej)=>{
    let done = false;
    const url = URL.createObjectURL(f);
    const im = new Image();
    const finish = (ok, v)=>{ if(done) return; done = true; clearTimeout(tm); try{ URL.revokeObjectURL(url); }catch(_){} ok ? res(v) : rej(v); };
    const tm = setTimeout(()=> finish(false, new Error('timeout foto')), 25000);
    im.onload = ()=> finish(true, im);
    im.onerror = ()=> finish(false, new Error('foto non leggibile'));
    im.src = url;
  });
}
$('aiFile').addEventListener('change', e=>{
  const files = Array.from(e.target.files || []);
  if(!files.length){ e.target.value = ''; pendingStageName = null; pendingAppend = false; pendingStageObj = null; pendingDetail = null; return; }
  const det = pendingDetail; pendingDetail = null;
  window.__scanBusy(true, t('scanReading'));   /* rotellina subito, prima ancora di aprire le foto */
  scanAIRunFiles(files).catch(function(err){ showMsg('\u26A0\uFE0F ' + t('scanConnErr')); })
    .finally(function(){
      window.__scanBusy(false); try{ $('aiFile').value = ''; }catch(_){}
      /* eravamo nel dettaglio della prova: lo ridisegno con i riferimenti appena aggiunti */
      if(det){ try{ uiClose(det.ov); }catch(_){} try{ showStageDetail(det.idx); }catch(_){} }
    });
});

/* ================= IMPORTA RADAR DA PDF ================= */
let PDFJS_READY = null;
function ensurePdfJs(){
  if(PDFJS_READY) return PDFJS_READY;
  const BASE = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/';
  PDFJS_READY = import(/* @vite-ignore */ BASE + 'pdf.min.mjs').then(function(lib){
    lib.GlobalWorkerOptions.workerSrc = BASE + 'pdf.worker.min.mjs';
    window.pdfjsLib = lib;
    return lib;
  });
  return PDFJS_READY;
}

/* Pattern noti di intestazione prova (diversi organizzatori scrivono in modo diverso).
   L'ordine conta: i piu' specifici prima. */
const PDF_STAGE_PATTERNS = [
  /* ERC / CIAR (Cassino 2026): sotto "Special Stage:" c'e' la riga
     "6/9 TORRE DI CICERONE 29,93km New stage 1h30 min" — numero, nome, lunghezza. */
  { re:/Special Stage:[\s\S]{0,160}?\b(\d+(?:\/\d+)?)\s+([A-Z][A-Za-z\u00C0-\u017F'’.\- ]{2,40}?)\s+(\d{1,3})[,.](\d{1,2})\s*km\b/,
    build:(m)=> (m[2]||'').trim()+' (SS '+m[1]+')' },
  /* Road book internazionali (FIA/ERC, es. Ceredigion 2026): l'intestazione e' del tipo
     "SS3 - Elerch TC4 - Blaenmelindwr" oppure "TC SSS1 - Aberystwyth 1 ...", con la
     lunghezza su una riga a parte "DISTANCE 10.14 KM". Il nome e' quello che segue il
     trattino, fermandosi al prossimo codice di controllo (TC, SS, CO...). */
  { re:/\bS{2,3}\s*(\d+[A-Z]?)\s*[-\u2013]\s*([^\n]{2,40}?)\s*(?=\s(?:TC|CO|SSS?|PS)\s*\d|\s(?:Parc|Service|Technical|Regroup|Finish|Stop)\b|\sDISTANCE\b|\n|$)/i,
    build:(m)=> (m[2]||'').trim().replace(/\s+(?:TC|CO|SS|SSS|PS)$/i,'').trim()+' (SS '+m[1]+')' },
  /* "Free Practice / Shakedown - Pendam ..." */
  { re:/\bShakedown\s*[-\u2013]\s*([^\n]{2,30}?)\s*(?=\s(?:TC|CO)\s*\d|\s(?:Service|Parc)\b|\sDISTANCE\b|\n|$)/i,
    build:(m)=> 'Shakedown '+(m[1]||'').trim() },
  { re:/SPS\s*(\d+)\s*["\u201c]?([^"\u201d\n,\d]{0,40})/i, build:(m)=> ('SPS'+m[1]+' '+(m[2]||'').trim()).trim() },
  { re:/SS\s*([\dA-Z]+\/[\dA-Z]+)\s*:?\s*["\u201c]?\s*([^"\u201d\n,\d]{2,40})/i, build:(m)=> (m[2]||'').trim()+' (SS '+m[1]+')' },
  /* ACI: "P.S. 1 \"Nome\" Km 14,20" e anche "C.O. PS 1/5 \"Borine-Cissone\"" (con la barra, senza km) */
  { re:/P\.?\s?S\.?\s*([\d]+(?:\s*[\-\/]\s*[\d]+)*)\s*["\u201c]([^"\u201d\n]{2,40})["\u201d]/i, build:(m)=> (m[2]||'').trim()+' (PS '+(m[1]||'').replace(/\s+/g,'')+')' },
  { re:/SHAKEDOWN\s*["\u201c]([^"\u201d\n]{2,40})["\u201d]/i, build:(m)=> 'Shakedown '+(m[1]||'').trim() },
  /* solo con i km accanto: "Shakedown 4,29km" e' la prova, il semplice "Shakedown"
     compare anche nel trasferimento che porta alla partenza */
  { re:/SHAKEDOWN[^\n]{0,40}?\d{1,3}[,.]\d{2}\s*km/i, build:()=> 'Shakedown' }
];
/* parole della tabella che a volte restano attaccate al nome catturato: il nome si ferma qui */
const PDF_NAME_STOPWORDS = /\b(Average|Target|Total|Distance|Speed|Km|Road|Section|Time|Start|Stop|Saturday|Sunday|Monday|Service|Park)\b/i;
function pdfDistanceKm(norm){
  const m = norm.match(/\bDISTANCE\s+(\d{1,3}[.,]\d{1,2})\s*KM/i);
  return m ? parseFloat(m[1].replace(',', '.')) : null;
}
function pdfHeaderKey(text){
  const norm = (text||'').replace(/\s+/g,' ').trim();
  for(const p of PDF_STAGE_PATTERNS){
    const m = norm.match(p.re);
    if(!m) continue;
    let name = p.build(m).replace(/\s+/g,' ').trim();
    const cut = name.search(PDF_NAME_STOPWORDS);
    if(cut > 0) name = name.slice(0, cut).trim();
    name = name.replace(/[\s,.:;-]+$/,'');
    if(!name) continue;
    /* km della prova: primo "12,34 km" o "Km 12,34" dopo il titolo,
       saltando i totali di sezione ("Total Distance 27,78 km") */
    let km = pdfDistanceKm(norm);   /* road book internazionali: "DISTANCE 10.14 KM" */
    const after = norm.slice(m.index, m.index + 200);
    const reKm = km == null ? /(\d{1,3})[,.](\d{2})\s*km\b|km\.?\s*(\d{1,3})[,.](\d{2})/ig : null;
    let mk;
    while(reKm && (mk = reKm.exec(after))){
      const before = after.slice(Math.max(0, mk.index - 30), mk.index);
      if(/total|dist|media|average/i.test(before)) continue;
      const a = mk[1] || mk[3], b = mk[2] || mk[4];
      km = Math.round((parseInt(a,10) + parseInt(b,10)/100) * 100) / 100;
      break;
    }
    return { key: m[0].replace(/\s+/g,''), name, km };
  }
  return null;
}
/* alcuni PDF spezzettano il testo lettera per lettera: togliendo tutti gli spazi
   il confronto fra pagine resta affidabile anche quando il pattern sopra non riconosce nulla */
function pdfFingerprint(text){ return (text||'').replace(/\s+/g,'').slice(0, 160); }
function pdfFpSimilar(a, b){
  if(!a || !b) return false;
  const n = Math.min(a.length, b.length);
  if(n < 20) return a === b;
  let i = 0; while(i < n && a[i] === b[i]) i++;
  return i >= n * 0.6;
}
/* una pagina di tabella pace-note ha sempre parecchie distanze tipo "12,34":
   e' un segnale che non dipende da come l'organizzatore scrive i titoli */
function pdfLooksLikeTable(text){
  /* i road book internazionali usano il PUNTO decimale (20.38), quelli italiani
     la virgola (20,38): vanno accettati entrambi, altrimenti non si trova nessuna
     griglia e l'importazione dice "nessuna prova" (Ceredigion, 12 set 2026) */
  const m = (text||'').match(/\d{1,3}[,.]\d{2}/g);
  return !!(m && m.length >= 6);
}
/* Testo della pagina ordinato per POSIZIONE (alto->basso, sinistra->destra), non nell'ordine
   in cui il PDF lo disegna: molti roadbook disegnano l'intestazione per ultima. */
async function pdfPageText(page){
  const tc = await page.getTextContent();
  const view = page.view || [0,0,595,842];
  const h = (view[3] - view[1]) || 1, yTop = view[3];
  const items = [];
  for(const it of tc.items){
    if(!it.str || !it.str.trim() || !it.transform) continue;
    items.push({ str: it.str, x: it.transform[4], y: yTop - it.transform[5] });
  }
  items.sort((a,b)=> (Math.round(a.y/3) - Math.round(b.y/3)) || (a.x - b.x));
  const all = items.map(it=>it.str).join(' ');
  const head = items.filter(it=> it.y < h * 0.18).map(it=>it.str).join(' ');
  return { all, head };
}

/* ============ RICONOSCIMENTO PROVE NEL PDF - PER STRUTTURA, NON PER TESTO ============
   Verificato l'11 settembre 2026 sui road book di Lamia (GR), Alba (ACI) e Noale (TTR).
   Il testo dell'intestazione cambia da organizzatore a organizzatore; la STRUTTURA no:
     1. una pagina di prova e' una griglia (almeno 6 chilometraggi "12,34")
     2. la colonna Direzione della PROVA ha uno sfondo colorato (grigio a Lamia,
        arancione ad Alba, giallo a Noale); il TRASFERIMENTO no
     3. dentro un road book il colore delle prove e' sempre lo stesso: si tiene il
        colore dominante del documento
     4. pagine consecutive con quel colore = una prova; "Finish"/"Stop" la chiude
   Misurato sui pixel a bassa risoluzione: prove fra 8% e 22% della pagina in quel
   colore, trasferimenti sotto il 4%. Soglia: 6%.
   Il titolo (SS/PS/Shakedown) serve SOLO per dare il nome e i km: se non c'e', la
   prova si chiama "Prova (pag. x-y)" e si rinomina, ma non si perde.
   Se il PDF non ha nessuna colonna colorata, si ripiega sul vecchio raggruppamento
   per intestazione. Non tocca detectTable() ne' la pipeline di scansione.
   ================================================================================== */
const PDF_COLOR_SHARE = 0.06;
/* Quando la prova finisce a meta' pagina, su quella pagina il colore copre poco
   (misurato su Noale: 3,7-3,9%, mentre la pagina dopo e' a 0%). Va inclusa: e'
   la coda della prova. Non si estende se il blocco era gia' chiuso da "Finish". */
const PDF_COLOR_TAIL = 0.015;
const PDF_STOP = /\b(finish|stop)\b/i;

/* istogramma dei colori di una pagina resa piccola: chiave = colore quantizzato a 8 livelli */
async function pdfPagePalette(page){
  const base = page.getViewport({ scale: 1 });
  const scale = 480 / Math.max(base.width, base.height);   /* a 220 px la colonna colorata si impastava con lo sfondo */
  const vp = page.getViewport({ scale });
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(vp.width)); c.height = Math.max(1, Math.round(vp.height));
  const g = c.getContext('2d', { willReadFrequently: true });
  await page.render({ canvasContext: g, viewport: vp }).promise;
  const d = g.getImageData(0, 0, c.width, c.height).data;
  c.width = c.height = 0;
  const hist = Object.create(null);
  const total = d.length / 4;
  for(let i = 0; i < d.length; i += 4){
    const r = d[i], gg = d[i+1], b = d[i+2];
    if(r > 235 && gg > 235 && b > 235) continue;   /* bianco */
    if(r < 40 && gg < 40 && b < 40) continue;       /* nero / testo */
    const k = ((r >> 5) << 6) | ((gg >> 5) << 3) | (b >> 5);
    hist[k] = (hist[k] || 0) + 1;
  }
  return { hist, total };
}
/* raggruppa pagine consecutive (con eventuale chiusura su Finish/Stop) */
function pdfGroupConsecutive(pages){
  const groups = []; let cur = null;
  for(const p of pages){
    if(cur && p.num === cur.pages[cur.pages.length-1] + 1 && !cur.closed){ cur.pages.push(p.num); }
    else { cur = { pages:[p.num], closed:false }; groups.push(cur); }
    if(p.fin) cur.closed = true;
  }
  return groups;
}
/* nome e km di ogni gruppo: dall'intestazione delle sue pagine, altrimenti dalle 1-3
   pagine subito prima (cartina / foto della prova). Con il metodo per colore il nome NON
   decide se e' una prova; con quello per intestazione si'. */
function nameGroups(groups, byNum, colorDecided){
  for(const g of groups){
    let hit = null, fallback = null;
    for(const num of g.pages){ const h = byNum[num] && byNum[num].hit; if(h){ if(h.km != null){ hit = h; break; } if(!fallback) fallback = h; } }
    if(!hit){
      for(let k=1; k<=3 && !hit; k++){
        const prev = byNum[g.pages[0] - k];
        if(!prev) break;
        if(prev.isTable) continue;   /* la pagina col titolo puo' stare oltre una griglia */
        const h = pdfHeaderKey(prev.head) || pdfHeaderKey(prev.all);
        if(!h) continue;
        if(h.km != null){ hit = h; break; }
        if(!fallback) fallback = h;
      }
    }
    if(!hit) hit = fallback;
    g.name = hit ? hit.name : '';
    g.km = hit ? hit.km : null;
    if(!colorDecided) g.isStage = !!hit;
  }
}

/* quanti chilometraggi hanno in comune due pagine, sul totale della piu' corta */
function pdfKmOverlap(a, b){
  if(!a.length || !b.length) return 0;
  const pool = b.slice();
  let common = 0;
  for(const v of a){ const i = pool.indexOf(v); if(i >= 0){ pool.splice(i,1); common++; } }
  return common / Math.min(a.length, b.length);
}
/* metodo classico: pagine-tabella consecutive con la stessa intestazione */
function pdfGroupsByHeader(pages){
  const groups = []; let cur = null;
  for(const p of pages){
    if(!p.isTable){ cur = null; continue; }
    const sameByHit = cur && p.hit && cur.hitKey && p.hit.key === cur.hitKey;
    const sameByFp = cur && !p.hit && !cur.hitKey && pdfFpSimilar(p.fp, cur.fp);
    if(sameByHit || sameByFp){ cur.pages.push(p.num); continue; }
    cur = { pages:[p.num], hitKey: p.hit ? p.hit.key : null, fp: p.fp, isStage: !!p.hit };
    groups.push(cur);
  }
  return groups;
}
/* dato l'elenco pagine con {num, isTable, share:{colore:quota}, fin}, restituisce i gruppi-prova.
   Funzione pura: e' quella collaudata sui numeri misurati dai tre road book. */
function pdfGroupsByColor(pages){
  const grid = pages.filter(p => p.isTable && p.share);
  if(grid.length < 3) return null;
  const votes = Object.create(null);
  grid.forEach(p => { Object.keys(p.share).forEach(k => { if(p.share[k] >= PDF_COLOR_SHARE) votes[k] = (votes[k]||0) + 1; }); });
  /* Un colore presente su QUASI TUTTE le griglie e' la carta o il reticolo, non la prova:
     le prove sono una minoranza delle pagine-griglia (il resto sono trasferimenti). */
  const CAP = Math.max(2, Math.floor(grid.length * 0.55));
  let dom = null, best = 0;
  Object.keys(votes).forEach(k => { if(votes[k] <= CAP && votes[k] > best){ best = votes[k]; dom = k; } });
  if(dom === null) return null;                       /* nessuna colonna colorata: ripiego */
  const stagePages = pages.filter(p => p.isTable && p.share && (p.share[dom]||0) >= PDF_COLOR_SHARE);
  const groups = pdfGroupConsecutive(stagePages);
  groups.forEach(g => { g.isStage = true; });
  /* coda: allunga il blocco finche' la pagina dopo conserva un po' del colore della prova */
  const byN = Object.create(null); pages.forEach(p => { byN[p.num] = p; });
  groups.forEach(g => {
    if(g.closed) return;                    /* "Finish" ha gia' detto dove finisce */
    for(let guard=0; guard<3; guard++){
      const nx = byN[g.pages[g.pages.length-1] + 1];
      if(!nx || !nx.isTable || !nx.share) break;
      const sh = nx.share[dom] || 0;
      if(sh < PDF_COLOR_TAIL || sh >= PDF_COLOR_SHARE) break;
      g.pages.push(nx.num);
      if(nx.fin) break;
    }
  });
  const stageSet = new Set(stagePages.map(p => p.num).concat([].concat.apply([], groups.map(g=>g.pages))));
  const others = pdfGroupConsecutive(pages.filter(p => p.isTable && !stageSet.has(p.num)));
  others.forEach(g => { g.isStage = false; });
  return { groups, others, color: dom };
}

/* Legge ogni pagina, individua le prove per struttura, da' loro un nome */
async function pdfExtractGroups(pdf, onProgress){
  const n = pdf.numPages;
  const pages = [];
  for(let i=1;i<=n;i++){
    if(onProgress) onProgress(i, n);
    const page = await pdf.getPage(i);
    const tx = await pdfPageText(page);
    const isTable = pdfLooksLikeTable(tx.all);
    const p = { num:i, isTable, head:tx.head, all:tx.all, hit:pdfHeaderKey(tx.head), fp:pdfFingerprint(tx.head),
                fin: PDF_STOP.test(tx.all), share:null,
                /* i primi chilometraggi della pagina: due pagine con la stessa sequenza
                   sono la stessa prova ristampata (es. rientro allo shakedown) */
                kmList: isTable ? (tx.all.match(/\d{1,3}[,.]\d{2}/g) || []) : [] };
    if(isTable){
      try{
        const pal = await pdfPagePalette(page);
        const share = Object.create(null);
        Object.keys(pal.hist).forEach(k => { share[k] = pal.hist[k] / pal.total; });
        p.share = share;
      }catch(e){ p.share = null; }
    }
    try{ page.cleanup(); }catch(e){}
    pages.push(p);
  }

  /* PDF scansionato = quasi nessun testo su tutte le pagine */
  pdfImpScanned = pages.length >= 3 && pages.reduce((a,p)=>a+((p.all||'').trim().length),0) < pages.length * 20;

  /* nome della gara: la riga che compare in fondo a quasi tutte le pagine
     (es. "20° #RA Rally Regione Piemonte - CIAR", "Rally Il Ciocco") */
  try{
    /* Due tentativi. 1) la riga con "rally" ripetuta su piu' pagine (Alba:
       "20° #RA Rally Regione Piemonte - CIAR"). 2) la riga di piede ripetuta,
       che spesso e' il nome o l'hashtag della gara (Lamia: "#Rallyfthiotidos").
       Se nessuno dei due trova niente, il nome lo scrive l'utente. */
    const tally = (obj, v) => {
      v = (v||'').replace(/\s+/g,' ').trim()
            .replace(/\bpag\.?\s*\/?\s*page\s*\d*\b/ig,'')
            .replace(/^[-\u2013|\s]+|[-\u2013|\s]+$/g,'');
      if(v.length < 6 || v.length > 60) return;
      if(/^[\d\s,./|-]+$/.test(v)) return;
      obj[v] = (obj[v]||0) + 1;
    };
    const pick = (obj, min) => {
      let bv='', bn=0;
      Object.keys(obj).forEach(k => { if(obj[k] > bn){ bn = obj[k]; bv = k; } });
      return bn >= min ? bv : '';
    };
    const withRally = Object.create(null), footers = Object.create(null);
    pages.forEach(p => {
      const lines = (p.all||'').split('\n');
      const m = (p.all||'').match(/([^\n]*\b(?:rally|rallye)\b[^\n]*)/i);
      if(m) tally(withRally, m[1]);
      lines.slice(-2).forEach(l => tally(footers, l));
    });
    /* prima la riga di piede ripetuta su almeno un quarto delle pagine (la piu'
       affidabile), poi come ripiego la riga che contiene "rally" */
    pdfImpRally = pick(footers, Math.max(3, Math.floor(pages.length * 0.25))) || pick(withRally, 3);
  }catch(e){}

  /* 1) prove per struttura (colore); se il PDF non ha colonne colorate, per intestazione */
  let byColor = pdfGroupsByColor(pages);
  /* Rete di sicurezza: se il colore promuove quasi tutto a prova, o se NESSUNA prova
     riceve un nome, la misura non e' affidabile su questo PDF -> si torna al metodo
     per intestazione, che almeno da' prove con un nome e i km per il taglio. */
  if(byColor){
    const nTab = pages.filter(p=>p.isTable).length;
    const nStage = byColor.groups.reduce((a,g)=>a+g.pages.length, 0);
    if(nTab && nStage > nTab*0.6) byColor = null;
  }
  let groups;
  if(byColor){
    groups = byColor.groups.concat(byColor.others);
  } else {
    groups = pdfGroupsByHeader(pages);
  }
  groups.sort((a,b) => a.pages[0] - b.pages[0]);

  /* 2) nome e km: dall'intestazione delle pagine del gruppo, altrimenti dalle 1-3 pagine prima
        (mappa / foto della prova). Il nome NON decide se e' una prova: quello lo ha gia' deciso il colore. */
  const byNum = Object.create(null); pages.forEach(p => { byNum[p.num] = p; });
  nameGroups(groups, byNum, !!byColor);

  /* Se il colore ha trovato prove ma NESSUNA ha un nome, quasi certamente ha sbagliato
     bersaglio: meglio il metodo per intestazione. */
  if(byColor && groups.length >= 3 && !groups.some(g => g.isStage && g.name)){
    byColor = null;
    groups = pdfGroupsByHeader(pages);
    groups.sort((a,b) => a.pages[0] - b.pages[0]);
    nameGroups(groups, byNum, false);
  }

  /* 3) ripetizioni della stessa prova (stesso nome e stessa dimensione) */
  const seen = {};
  const firsts = [];      /* prove gia' viste, per riconoscere le ristampe */
  const out = [];
  for(const g of groups){
    if(!g.isStage && g.pages.length < 2 && !byColor) continue;
    /* RISTAMPA DELLA STESSA PROVA (passaggi ripetuti, rientro allo shakedown):
       stessa strada = stessi chilometraggi. Non pretendo che siano identici, perche'
       i totali in testata cambiano fra un passaggio e l'altro: misuro quanto si
       sovrappongono. Misurato sui tre road book: stessa prova 70-100%, prove diverse
       8-16%. Soglia al 50%, con margine larghissimo da entrambe le parti.
       La ristampa prende nome e km dall'originale e nasce deselezionata. */
    const mine = g.isStage ? ((byNum[g.pages[0]] && byNum[g.pages[0]].kmList) || []) : [];
    let src = null;
    if(mine.length >= 6){
      for(const f of firsts){
        /* anche la LUNGHEZZA deve combaciare: lo shakedown si corre sulla strada della
           prova, quindi ha molti km in comune con lei senza esserne una ristampa
           (Noale: shakedown 2 pagine, ZERO BRANCO 5). */
        if(Math.abs(f.len - g.pages.length) > 1) continue;
        if(pdfKmOverlap(mine, f.list) >= 0.5){ src = f; break; }
      }
    }
    if(src){
      g.repeat = true;
      if(!g.name) g.name = src.name;
      if(g.km == null) g.km = src.km;
      out.push(g);
      continue;
    }
    if(mine.length >= 6) firsts.push({ list: mine, name: g.name, km: g.km, len: g.pages.length });
    const k = (g.name || '').toLowerCase();
    const prev = k ? seen[k] : null;
    g.repeat = !!(g.isStage && prev && Math.abs(prev - g.pages.length) <= 1);
    if(g.isStage && k && !prev) seen[k] = g.pages.length;
    out.push(g);
  }
  return out;
}

async function pdfRenderPageToBlob(pdf, pageNum, targetPx){
  const page = await pdf.getPage(pageNum);
  const base = page.getViewport({ scale: 1 });
  const scale = Math.max(0.2, Math.min(3, (targetPx || 1800) / Math.max(base.width, base.height)));
  const viewport = page.getViewport({ scale });
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(viewport.width);
  canvas.height = Math.round(viewport.height);
  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport: viewport }).promise;
  /* righe dal testo del PDF: solo per le pagine da leggere, non per le miniature */
  let rowsInfo = null;
  if((targetPx || 1800) >= 1000){ try{ rowsInfo = await pdfPageRowsInfo(page, viewport, ctx, canvas.width, canvas.height); }catch(e){ rowsInfo = null; } }
  const blob = await new Promise(res => canvas.toBlob(b => res(b), 'image/jpeg', 0.9));
  canvas.width = canvas.height = 0;
  try{ page.cleanup(); }catch(e){}
  if(!blob || blob.size < 3000) throw new Error('pagina non renderizzata');
  if(rowsInfo){ try{ blob.__pdfRows = rowsInfo; }catch(e){} }
  return blob;
}

/* ===== STRISCE DAL TESTO DEL PDF (15 nov 2026) =====
   Ogni riga del radar ha il suo numerino (16, 17, 18...) e quasi sempre il suo Totale, e nei
   PDF fatti al computer sono scritti come TESTO, con la posizione esatta. Prima le righe si
   cercavano solo sui pixel, aiutati dalle posizioni lette dall'AI: quando l'AI sbagliava di
   mezza riga, o la pagina non aveva le linee fra le righe (Ticino p. 28, 29, 59, 80), una riga
   spariva e tutte le strisce dopo scivolavano di una. Qui:
     - una striscia per ogni numerino scritto nel PDF (anche le righe senza Totale, come la
       partenza della PS a Schio p. 40);
     - il taglio fra due righe e' la linea della tabella che sta fra i due numerini;
     - dove la linea non c'e', il taglio va alla stessa distanza dal numerino che ha sulle
       righe con la linea (stessa prova): le righe del radar sono tutte uguali.
   Provato fuori dall'app su Ticino (145 righe), Schio (221), Galles (144) e Cassino (165):
   tutte giuste. Le foto e i PDF fatti di sole immagini non hanno testo: restano come prima. */
async function pdfPageRowsInfo(page, vp, ctx, W, H){
  /* linee orizzontali: righe di pixel scure per almeno il 60% della pagina, sottili e con il
     chiaro sopra e sotto (una foto o una mappa scura non e' una linea) */
  const d = ctx.getImageData(0, 0, W, H).data;
  const cnt = new Int32Array(H);
  for(let y=0, i=0; y<H; y++){ let c = 0; for(let x=0; x<W; x++, i+=4){ if(d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114 < 210) c++; } cnt[y] = c; }
  const lines = [], lim = W*0.6;
  for(let y=0; y<H; y++){
    if(cnt[y] < lim) continue;
    let e = y; while(e+1 < H && cnt[e+1] >= lim) e++;
    const up = y-3 >= 0 ? cnt[y-3] : 0, dn = e+3 < H ? cnt[e+3] : 0;
    if(e - y <= 8 && up < cnt[y]*0.5 && dn < cnt[e]*0.5) lines.push((y+e)/2);
    y = e;
  }
  /* numeri scritti nel PDF, con il centro del carattere */
  const tc = await page.getTextContent();
  const nums = [];
  for(const it of tc.items){
    const s = String(it.str || '').trim();
    if(!/^\d{1,3}([,.]\d{2})?$/.test(s)) continue;
    const tr = it.transform, p = vp.convertToViewportPoint(tr[4], tr[5]);
    const fh = Math.hypot(tr[2], tr[3]) * vp.scale;
    nums.push({ s: s, x: p[0], y: p[1] - fh*0.35, dec: /[,.]/.test(s) });
  }
  /* numerini dei riferimenti: interi in colonna, in fila n, n+1, n+2... nella meta' sinistra,
     ognuno con un Totale o un Parziale alla sua sinistra nella stessa riga. Senza questo, su una
     pagina di sola mappa due numeri dell'intestazione ("Start P.S. 2", "C.O. 3") sembravano
     due riferimenti (Schio p. 47) */
  const decs0 = nums.filter(q => q.dec);
  const ints = nums.filter(q => !q.dec && q.x < W*0.5 && decs0.some(d => d.x < q.x && Math.abs(d.y - q.y) < H*0.12));
  let best = [];
  for(const q0 of ints){
    const col = ints.filter(q => Math.abs(q.x - q0.x) < W*0.012).sort((a,b) => a.y - b.y);
    let run = [];
    for(const q of col){
      const lst = run[run.length-1];
      if(!lst) run = [q];
      else if(+q.s === +lst.s + 1 && q.y > lst.y) run.push(q);
      else if(+q.s !== +lst.s) run = [q];
      if(run.length > best.length) best = run.slice();
    }
  }
  /* Totali: la colonna di decimali piu' a sinistra */
  const decs = nums.filter(q => q.dec);
  let tots = [];
  if(decs.length){ const xm = Math.min.apply(null, decs.map(q => q.x)); tots = decs.filter(q => q.x < xm + W*0.02).sort((a,b) => a.y - b.y); }
  return { W: W, H: H, lines: lines, refs: best.map(q => ({ n: +q.s, y: q.y })), tots: tots.map(q => ({ t: q.s, y: q.y })) };
}
function pdfMedian(a){ const b = a.slice().sort((x,y) => x-y); return b.length ? b[Math.floor(b.length/2)] : null; }
/* piano delle strisce per tutte le pagine di UNA prova (stesso road book, stesse righe) */
function planPdfBands(blobs){
  const infos = blobs.map(b => (b && b.__pdfRows && b.__pdfRows.refs.length >= 2) ? b.__pdfRows : null);
  /* il numerino e il Totale della stessa riga: si porta il numerino all'altezza del Totale
     (in certi road book il testo del numerino sta a cavallo della linea) */
  const sh = [];
  infos.forEach(p => { if(p && p.tots.length === p.refs.length) p.refs.forEach((r, i) => sh.push(r.y - p.tots[i].y)); });
  const SHIFT = sh.length ? pdfMedian(sh) : 0;
  infos.forEach(p => { if(p) p.anc = p.refs.map(r => r.y - SHIFT); });
  /* ogni numerino: la linea subito sopra e subito sotto, senza scavalcare i numerini vicini.
     Fra due righe ci puo' essere una mappa o una foto aerea (Schio p. 65): conta la linea
     attaccata alla riga, non quella dopo la mappa. */
  infos.forEach(p => { if(!p) return; const a = p.anc, L = p.lines;
    p.up = a.map((y, k) => { const lo = k ? a[k-1] : -1e9, c = L.filter(l => l < y-2 && l > lo+2); return c.length ? Math.max.apply(null, c) : null; });
    p.dn = a.map((y, k) => { const hi = k < a.length-1 ? a[k+1] : 1e9, c = L.filter(l => l > y+2 && l < hi-2); return c.length ? Math.min.apply(null, c) : null; }); });
  /* misure della prova, dove le linee ci sono: altezza della riga e posto del numerino nella riga */
  const hs = [], ab = [], be = [];
  infos.forEach(p => { if(!p) return; p.anc.forEach((y, k) => { if(p.up[k] != null && p.dn[k] != null){ hs.push(p.dn[k] - p.up[k]); ab.push(y - p.up[k]); be.push(p.dn[k] - y); } }); });
  const M = { rowH: pdfMedian(hs), above: pdfMedian(ab), below: pdfMedian(be) };
  blobs.forEach((b, i) => { const p = infos[i]; if(!p) return; const bands = pdfBandsOf(p, M); if(bands){ try{ b.__bands = bands; }catch(e){} } });
}
function pdfBandsOf(p, M){
  const a = p.anc, n = a.length;
  let rowH = M.rowH, above = M.above, below = M.below;
  if(rowH == null){
    /* nessuna riga con le linee in tutta la prova: righe uguali, misurate sulla pagina
       (passo fra i numerini e linea sotto l'intestazione) */
    const g = []; for(let k=1; k<n; k++) g.push(a[k] - a[k-1]);
    const P = pdfMedian(g);
    if(!(P > 10) || p.up[0] == null || a[0] - p.up[0] > 1.6*P) return null;
    rowH = P; above = a[0] - p.up[0]; below = P - above;
  }
  const out = [];
  for(let k=0; k<n; k++){
    let y0 = p.up[k], y1 = p.dn[k];
    /* una linea troppo lontana non e' il bordo di questa riga (sopra o sotto c'e' altro) */
    if(y0 != null && a[k] - y0 > rowH*1.6) y0 = null;
    if(y1 != null && y1 - a[k] > rowH*1.6) y1 = null;
    if(y0 == null) y0 = a[k] - above;   /* linea non stampata: stessa distanza delle altre righe */
    if(y1 == null) y1 = a[k] + below;
    out.push([Math.max(0, y0), Math.min(p.H, y1)]);
  }
  for(let k=1; k<n; k++) if(out[k][0] < out[k-1][1]){ const m = (out[k][0] + out[k-1][1]) / 2; out[k-1][1] = m; out[k][0] = m; }
  for(let k=0; k<n; k++) if(!(out[k][1] - out[k][0] > rowH*0.3) || !(a[k] > out[k][0] && a[k] < out[k][1])) return null;   /* qualcosa non torna: metodo di prima */
  return p.refs.map((r, k) => {
    const y0 = out[k][0], y1 = out[k][1], ts = p.tots.filter(q => q.y > y0 && q.y < y1);
    /* riga con due Totali (zona da ... a ...): vale quello accanto al numerino */
    const t = ts.length ? ts.reduce((x, q) => Math.abs(q.y - a[k]) < Math.abs(x.y - a[k]) ? q : x) : null;
    return { y0: y0, y1: y1, n: r.n, km: t ? t.t : '' };
  });
}

  body.appendChild(meta);
  card.appendChild(body);
  return card;

   si correggono, oppure l'intervallo aggiunto per sbaglio si toglie. La scheda diventa il

   classe pdfManualForm, che pdfImpRenderList conserva come "modulo di aggiunta aperto". */
function pdfImpEditForm(g){
  const form = document.createElement('div');
  form.className = 'pdfEditForm';
  const nameInput = document.createElement('input');
  nameInput.type = 'text'; nameInput.placeholder = t('pdfImpNameLbl'); nameInput.value = g.name || '';
  form.appendChild(nameInput);
  const max = pdfImpDoc ? pdfImpDoc.numPages : 9999;
  const row = document.createElement('div'); row.className = 'pdfManualRow';
  const fromInput = document.createElement('input');
  fromInput.type = 'number'; fromInput.min = '1'; fromInput.max = String(max); fromInput.placeholder = t('pdfImpFrom'); fromInput.value = g.pages[0];
  const toInput = document.createElement('input');
  toInput.type = 'number'; toInput.min = '1'; toInput.max = String(max); toInput.placeholder = t('pdfImpTo'); toInput.value = g.pages[g.pages.length-1];
  row.appendChild(fromInput); row.appendChild(toInput);
  form.appendChild(row);
  const btns = document.createElement('div'); btns.className = 'pdfEditBtns';
  const mk = (txt, cls, fn)=>{ const b = document.createElement('button'); b.type = 'button'; b.className = cls; b.textContent = txt; b.addEventListener('click', fn); btns.appendChild(b); return b; };
  const save = mk(t('pdfSave'), 'pdfEdSave', async ()=>{
    if(save.disabled) return;
    const from = parseInt(fromInput.value, 10), to = parseInt(toInput.value, 10);
    if(!from || !to || from < 1 || to > max || to < from){ showMsg('\u26A0\uFE0F ' + t('pdfImpErrRange')); return; }
    save.disabled = true;
    const pages = []; for(let i=from;i<=to;i++) pages.push(i);
    const moved = from !== g.pages[0];
    g.pages = pages;
    g.name = nameInput.value.trim() || t('pdfImpUnnamed').replace('{a}', from).replace('{b}', to);
    if(moved && pdfImpDoc){
      try{ const blob = await pdfRenderPageToBlob(pdfImpDoc, from, 260);
        if(g.thumb){ try{ URL.revokeObjectURL(g.thumb); }catch(e){} }
        g.thumb = URL.createObjectURL(blob); }catch(e){}
    }
    delete g.__edit;
    pdfImpRenderList();
  });
  mk('✕ ' + t('ssDelete'), 'pdfEdDel', ()=>{
    const k = pdfImpGroups.indexOf(g); if(k >= 0) pdfImpGroups.splice(k, 1);
    if(g.thumb){ try{ URL.revokeObjectURL(g.thumb); }catch(e){} }
    pdfImpRenderList();
  });
  mk(t('tcCancel'), 'pdfEdCancel', ()=>{ delete g.__edit; pdfImpRenderList(); });
  form.appendChild(btns);
  return form;
}

async function pdfImpAnalyze(file){
  $('pdfImpLoading').style.display = 'block';
  /* con la ricerca spenta il PDF si apre e basta: niente "Analisi in corso" */
  $('pdfImpLoadingTxt').textContent = t(PDF_AUTO_FIND ? 'pdfImpLoadingTxt' : 'pdfImpOpening');
  $('pdfImpGroups').innerHTML = ''; $('pdfImpOthersList').innerHTML = '';
  $('pdfImpOthers').style.display = 'none';
  pdfImpGroups = [];
  pdfImpRally = ''; pdfImpScanned = false;   /* niente nome di gara rimasto da un PDF precedente */
  try{
    const pdfjsLib = await ensurePdfJs();
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    pdfImpDoc = pdf;
    if(PDF_AUTO_FIND){
      const groups = await pdfExtractGroups(pdf, (i, n)=>{
        $('pdfImpLoadingTxt').textContent = t('pdfImpAnalyzing').replace('{i}', i).replace('{n}', n);
      });
      for(const g of groups){
        /* preselezionate: solo le prove vere, senza le ripetizioni */
        g.included = g.isStage && !g.repeat;
        if(!g.name) g.name = t('pdfImpUnnamed').replace('{a}', g.pages[0]).replace('{b}', g.pages[g.pages.length-1]);
        try{
          const blob = await pdfRenderPageToBlob(pdf, g.pages[0], 260);
          g.thumb = URL.createObjectURL(blob);
        }catch(e){ g.thumb = ''; }
      }
      pdfImpGroups = groups;
    }
  }catch(e){
    showMsg('\u26A0\uFE0F ' + t('pdfImpErrFile'));
  }
  $('pdfImpLoading').style.display = 'none';
  pdfImpRenderList();
  /* ricerca spenta: si parte subito dal modulo Nome prova / Da pagina / A pagina */
  if(!PDF_AUTO_FIND && pdfImpDoc) pdfImpManualForm();
}

/* Legge (o rilegge) le pagine delle prove indicate. jobs: [{ name, pages, km, append }].
   Restituisce quante prove sono state salvate e, per ognuna, le pagine del PDF non lette. */
async function pdfImpRun(pdf, jobs, folderId){
  const report = [];
  let done = 0;
  try{
    for(const j of jobs){
      const blobs = [], nums = [], noRender = [];
      for(let i=0;i<j.pages.length;i++){
        window.__scanBusy(true, t('pdfImpRendering').replace('{name}', j.name).replace('{i}', i+1).replace('{n}', j.pages.length));
        let blob = null;
        try{ blob = await pdfRenderPageToBlob(pdf, j.pages[i], 1800); }
        catch(e){
          /* seconda prova: su iPhone a volte la memoria si libera dopo un attimo.
             Prima una pagina che non si preparava spariva senza dire niente. */
          try{ await new Promise(r => setTimeout(r, 400)); blob = await pdfRenderPageToBlob(pdf, j.pages[i], 1800); }catch(e2){}
        }
        if(blob){ blobs.push(blob); nums.push(j.pages[i]); } else noRender.push(j.pages[i]);
      }
      let r = { saved: 0, failed: [], why: [], gaps: [] };
      if(blobs.length){
        pendingStageName = j.name;
        pendingAppend = !!j.append;
        pendingFolder = folderId;
        pendingMaxKm = j.km;
        try{ planPdfBands(blobs); }catch(e){}   /* righe dal testo del PDF, per tutta la prova */
        r = await scanAIRunFiles(blobs, true, nums);   /* pagine da PDF: percorso senza trattamento foto */
        pendingMaxKm = null;
      }
      if(r.saved) done++;
      const miss = r.failed.concat(noRender).sort((x,y)=>x-y);
      if(miss.length || r.gaps.length || (r.rows && r.rows.length)) report.push({ name: j.name, km: j.km, miss: miss, why: r.why, gaps: r.gaps, rows: r.rows || [] });
    }
  }catch(e){
    showMsg('\u26A0\uFE0F ' + t('scanConnErr'));
  } finally {
    pendingMaxKm = null;
    pendingFolder = null;
    window.__scanBusy(false);
  }
  return { done: done, report: report };
}

/* Resoconto finale in UN solo messaggio: prove importate + pagine non lette col numero
   VERO della pagina del PDF, e il tasto per rileggere subito solo quelle (finiscono al
   posto giusto nella prova, ordinate per Totali). Prima l'avviso diceva "7" invece di
   "47" e restava sotto il messaggio "prove importate". */
function pdfImpShowReport(pdf, folderId, res, isRetry){
  const miss = res.report.filter(x => x.miss.length);
  const gapped = res.report.filter(x => x.gaps.length);
  const shorted = res.report.filter(x => x.rows && x.rows.length);
  if(!miss.length && !gapped.length && !shorted.length){
    if(isRetry) showMsg('\u2705 ' + t('pdfImpRetryOk'));
    else if(res.done) showMsg('\u2705 ' + t('pdfImpDoneN').replace('{n}', res.done));
    return;
  }
  const {ov, box} = uiBox();
  let txt = (!isRetry && res.done) ? '\u2705 ' + t('pdfImpDoneN').replace('{n}', res.done) + '\n\n' : '';
  if(miss.length) txt += '\u26A0\uFE0F ' + t('pdfImpMissHead') + '\n' + miss.map(x => '\u2022 ' + x.name + ': ' + t('pdfImpPagesList').replace('{list}', x.miss.join(', '))).join('\n');
  if(gapped.length) txt += (miss.length ? '\n\n' : '\u26A0\uFE0F ') + gapped.map(x => x.name + ': ' + t('scanPagesGap').replace('{list}', x.gaps.join(', '))).join('\n');
  if(shorted.length) txt += ((miss.length || gapped.length) ? '\n\n' : '\u26A0\uFE0F ') + t('scanRowsHead') + '\n' + shorted.map(x => '\u2022 ' + x.name + ': ' + t('pdfImpPagesList').replace('{list}', x.rows.join(', '))).join('\n');
  const p = document.createElement('div'); p.style.cssText = 'white-space:pre-wrap;font-size:14px;line-height:1.5;margin-bottom:10px'; p.textContent = txt; box.appendChild(p);
  const why = [].concat.apply([], miss.map(x => x.why));
  if(why.length){ const w = document.createElement('div'); w.style.cssText = 'font-size:12px;color:var(--muted);line-height:1.4;margin-bottom:14px'; w.textContent = '(' + why.join(' \u00B7 ') + ')'; box.appendChild(w); }
  if(miss.length){
    const again = document.createElement('button'); again.textContent = t('pdfImpRetryBtn');
    again.style.cssText = 'width:100%;padding:12px;border-radius:10px;font-weight:800;background:var(--green,#39d353);border:none;color:#000;margin-bottom:8px';
    again.addEventListener('click', async ()=>{
      uiClose(ov);
      window.__scanBusy(true, t('scanRetrying'));
      const r2 = await pdfImpRun(pdf, miss.map(x => ({ name: x.name, pages: x.miss, km: x.km, append: true })), folderId);
      buildSsList();
      pdfImpShowReport(pdf, folderId, r2, true);
    });
    box.appendChild(again);
  }
  const ok = document.createElement('button'); ok.textContent = 'OK';
  ok.style.cssText = 'width:100%;padding:12px;border-radius:10px;font-weight:800;background:var(--amber);border:none;color:#000';
  ok.addEventListener('click', ()=>uiClose(ov)); box.appendChild(ok);
}

/* Nell'app iPhone lo schermo resta acceso grazie al comando NATIVO isIdleTimerDisabled
   (passaggio "Schermo sempre acceso" in codemagic.yaml): funziona con qualsiasi Blocco
   automatico e anche col Risparmio energetico. Questo blocco web resta per Safari/PWA:
   iOS lo toglie quando la pagina va in secondo piano e a volte lo concede solo dopo un
   tocco, quindi si richiede al ritorno in primo piano e al primo tocco utile. */
let wakeLock = null;
async function keepAwake(){
  try{
    if('wakeLock' in navigator && (!wakeLock || wakeLock.released) && document.visibilityState === 'visible'){
      wakeLock = await navigator.wakeLock.request('screen');
      if(wakeLock && wakeLock.addEventListener) wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
    }
  }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible') keepAwake();
});
['touchend','click'].forEach(ev => document.addEventListener(ev, ()=>{ if(!wakeLock || wakeLock.released) keepAwake(); }, { passive:true }));

<script>
/* ===== TIME CARD (schermata isolata: IIFE separato, non tocca l'app) ===== */
(function(){
  const __b = window.__rallyBridge || {};
  const cfg = __b.getCfg ? __b.getCfg() : (window.cfg || { tcards:[] });
  const saveCfg = __b.saveCfg || function(){};
  const askName = __b.askName || function(p,cb){ if(cb) cb(''); };
  const showConfirm = __b.showConfirm || function(m,cb){ if(cb) cb(); };
  const t = __b.t || function(k){ return k; };
  if(!cfg.tcards || !Array.isArray(cfg.tcards)) cfg.tcards = [];
  /* worker DEDICATO alla tabella di marcia: separato da quello del radar,
     cosi' una modifica di qua non puo' rompere di la'. */
  const API='https://rally-scan-tc.roberto-dapra5858.workers.dev';
  const $=id=>document.getElementById(id);
  const root=()=>$('tcMenu');
  let BANDS=[], INPUT_MODE='wheel', lastCard=null, tcMin=5, tcOff=3, curIdx=null, persistTimer=null, editMode=false, curFolder=null;
  const manualVals={}, alarmOn={}, tcDue={};
  let lastIds=[], schedTimer=null, permAsked=false;

  function setTxt(t){ const s=$('tc_status'); if(s) s.textContent=t; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  window.tcShowLib = function(){ curFolder=null; showLib(); };
  window.tcRelang = function(){ const r=$('tcMenu'); if(r && r.classList.contains('open')){ if(curIdx!=null && lastCard) render(lastCard); else renderLib(); } };
  ['input','change'].forEach(ev=> root().addEventListener(ev, onChange));
  root().addEventListener('click', function(e){
    const el0=e.target; if(!el0||!el0.closest) return;
    if(el0.closest('#tc_close')){ persist(); root().classList.remove('open'); return; }
    if(el0.closest('#tc_help')){ if(__b.showMsg) __b.showMsg(t('tcGuide'), t('navTimecard')); return; }   /* 22 nov 2026: guida dello scanner */
    if(el0.closest('#tc_pick')){ if(!(window.__rallyPro&&window.__rallyPro.isPro())){ if(window.__rallyShowPaywall) window.__rallyShowPaywall(); return; } const f=$('tc_file'); if(f) f.click(); return; }
    if(el0.closest('#tc_newin')){ newCard(curFolder); return; }
    if(el0.closest('#tc_new')){ newCard(); return; }
    if(el0.closest('#tc_newfolder')){ newFolder(); return; }
    if(el0.closest('#tc_folderback')){ curFolder=null; renderLib(); return; }
    if(el0.closest('#tc_folderdel')){ deleteFolder(curFolder); return; }
    const of=el0.closest('[data-openf]'); if(of){ curFolder=of.getAttribute('data-openf'); renderLib(); return; }
    const df=el0.closest('[data-delf]'); if(df){ deleteFolder(df.getAttribute('data-delf')); return; }
    const mv=el0.closest('[data-move]'); if(mv){ moveTable(+mv.getAttribute('data-move')); return; }
    if(el0.closest('#tc_back')){ showLib(); return; }
    if(el0.closest('#tc_delcur')){ deleteCur(); return; }
    const o=el0.closest('[data-open]'); if(o){ openCard(+o.getAttribute('data-open')); return; }
    const d=el0.closest('[data-del]'); if(d){ const i=+d.getAttribute('data-del'); const nm=(cfg.tcards[i]&&cfg.tcards[i].name)||''; showConfirm(t('tcDelTable')+' \u201C'+nm+'\u201D?', function(){ cfg.tcards.splice(i,1); saveCfg(); renderLib(); scheduleAll(); }); return; }
    const mb=el0.closest('.tc-mbtn'); if(mb){ INPUT_MODE=mb.dataset.mode; root().querySelectorAll('.tc-mbtn').forEach(x=>x.classList.toggle('on', x.dataset.mode===INPUT_MODE)); if(lastCard) render(lastCard); return; }
    if(el0.closest('#tc_editbtn')){ toggleEdit(); return; }
    const tg=el0.closest('.tgt[data-tgt]'); if(tg){ if(editMode) editTarget(+tg.getAttribute('data-tgt')); return; }
  });

  /* ===== LIBRERIA (elenco tabelle salvate + editor) ===== */
  function showLib(){ persist(); curIdx=null; const ed=$('tc_editor'); if(ed) ed.style.display='none'; const lb=$('tc_lib'); if(lb) lb.style.display='block'; renderLib(); }
  function showEditor(){ const lb=$('tc_lib'); if(lb) lb.style.display='none'; const ed=$('tc_editor'); if(ed) ed.style.display='block'; }

  function folderById(id){ return (cfg.tcfolders||[]).find(f=>f.id===id); }

  function tableRow(e,i){
    const n=(e.card&&e.card.legs&&e.card.legs.length)||0;
    /* BLOCCATO: niente campanella qui. Le sveglie si accendono sui singoli
       controlli dentro la tabella e ogni tabella salvata e' sempre attiva.
       Non reintrodurre un interruttore per tabella. */
    const nAl=(e.sched&&e.sched.length)||0;
    const sub=(e.card&&e.card.rally? esc(e.card.rally)+' \u00b7 ':'')+n+' TC'+(nAl?' \u00b7 \uD83D\uDD14 '+nAl:'');
    return '<div class="tdm-row"><div class="tdm-name" data-open="'+i+'">'+esc(e.name||t('tcNoName'))+'<small>'+sub+'</small></div>'
      +'<button class="tc-libmove" data-move="'+i+'" title="'+esc(t('tcMove'))+'">\uD83D\uDCC1</button>'
      +'<button class="del" data-del="'+i+'">\uD83D\uDDD1</button></div>';
  }

  function renderLib(){
    const list=$('tc_list'); if(!list) return;
    if(!Array.isArray(cfg.tcfolders)) cfg.tcfolders=[];
    if(curFolder!=null && !folderById(curFolder)) curFolder=null;
    const btns=$('tc_libbtns');

    if(curFolder!=null){
      if(btns) btns.style.display='none';
      const f=folderById(curFolder);
      let h='<div class="tc-folderbar"><button class="tdm-back" id="tc_folderback">\u2190</button>'
        +'<input class="tdm-tabname" id="tc_foldername" value="'+esc(f.name||'')+'">'
        +'<button class="tc-del" id="tc_folderdel" title="'+esc(t('ssDelete'))+'">\uD83D\uDDD1</button></div>'
        +'<button class="tdm-new" id="tc_newin">'+esc(t('tcNewTable'))+'</button>';   /* 19 nov 2026: si aggiunge anche da dentro la cartella */
      const inside=[]; cfg.tcards.forEach((e,i)=>{ if(e.folder===curFolder) inside.push(tableRow(e,i)); });
      h+= inside.length? inside.join('') : '<div class="tdm-empty">'+t('tcFolderEmpty')+'</div>';
      list.innerHTML=h;
      return;
    }

    if(btns) btns.style.display='';
    let h='';
    (cfg.tcfolders||[]).forEach(f=>{
      const n=cfg.tcards.filter(t=>t.folder===f.id).length;
      h+='<div class="tdm-row folderrow"><div class="tdm-name" data-openf="'+esc(f.id)+'">\uD83D\uDCC1 '+esc(f.name||'')+'<small>'+n+' '+t('tcTablesN')+'</small></div>'
        +'<button class="del" data-delf="'+esc(f.id)+'">\uD83D\uDDD1</button></div>';
    });
    const loose=[]; cfg.tcards.forEach((e,i)=>{ if(!e.folder || !folderById(e.folder)) loose.push(tableRow(e,i)); });
    h+=loose.join('');
    if(!(cfg.tcfolders||[]).length && !loose.length){
      h='<div class="tdm-empty">'+t('tcEmptyLib')+'</div>';
    }
    list.innerHTML=h;
  }

  function newFolder(){ askName('', function(name){ if(!Array.isArray(cfg.tcfolders)) cfg.tcfolders=[]; cfg.tcfolders.push({ id:'f'+Date.now(), name:name }); saveCfg(); renderLib(); }, 'askFolderName'); }

  function deleteFolder(id){
    const f=folderById(id); if(!f) return;
    showConfirm(t('tcDelFolder')+' \u201C'+(f.name||'')+'\u201D? '+t('tcDelFolderNote'), function(){
      cfg.tcards.forEach(t=>{ if(t.folder===id) t.folder=null; });
      cfg.tcfolders=cfg.tcfolders.filter(x=>x.id!==id);
      if(curFolder===id) curFolder=null;
      saveCfg(); renderLib();
    });
  }

  function moveTable(i){
    const e=cfg.tcards[i]; if(!e) return;
    const ov=document.createElement('div'); ov.className='tc-emodal';
    let opts='<button class="tc-mvopt" data-f="">'+t('tcMoveLoose')+'</button>';
    (cfg.tcfolders||[]).forEach(f=>{ opts+='<button class="tc-mvopt" data-f="'+esc(f.id)+'">\uD83D\uDCC1 '+esc(f.name||'')+'</button>'; });
    opts+='<button class="tc-mvopt newf" data-f="__new">'+t('tcMoveNew')+'</button>';
    ov.innerHTML='<div class="tc-ebox"><div class="tc-etitle">'+t('tcMove')+' \u201C'+esc(e.name||'')+'\u201D</div><div class="tc-mvlist">'+opts+'</div><div class="tc-ebtns"><button class="tc-ecancel">'+t('tcCancel')+'</button></div></div>';
    document.body.appendChild(ov);
    function close(){ try{ document.body.removeChild(ov); }catch(_){} }
    ov.addEventListener('click', ev=>{ if(ev.target===ov) close(); });
    ov.querySelector('.tc-ecancel').addEventListener('click', close);
    ov.querySelectorAll('.tc-mvopt').forEach(btn=> btn.addEventListener('click', ()=>{
      const f=btn.getAttribute('data-f');
      if(f==='__new'){ close(); askName('', function(name){ if(!Array.isArray(cfg.tcfolders)) cfg.tcfolders=[]; const id='f'+Date.now(); cfg.tcfolders.push({id:id,name:name}); e.folder=id; saveCfg(); renderLib(); }, 'askFolderName'); return; }
      e.folder = f||null; saveCfg(); close(); renderLib();
    }));
  }

  function newCard(folder){
    askName('', function(name){
      const e={ name:name, card:{rally:'',section:'',date:'',legs:[]}, vals:{}, alarms:{}, min:5, off:3 };
      if(folder) e.folder=folder;   /* creata da dentro una cartella: resta in quella cartella */
      cfg.tcards.push(e);
      saveCfg();
      openCard(cfg.tcards.length-1);
      setTxt(t('tcScanFirst'));
      /* piu' semplice: con Pro si apre subito la scelta della pagina (fotocamera o libreria),
         nello stesso tocco di OK, cosi' iOS la lascia aprire */
      if(window.__rallyPro && window.__rallyPro.isPro()){ const f=$('tc_file'); if(f) f.click(); }
    });
  }

  function openCard(idx){
    const e=cfg.tcards[idx]; if(!e) return;
    curIdx=idx;
    if(!e.card||typeof e.card!=='object') e.card={rally:'',section:'',date:'',legs:[]};
    if(!Array.isArray(e.card.legs)) e.card.legs=[];
    for(const k in manualVals) delete manualVals[k];
    for(const k in alarmOn) delete alarmOn[k];
    Object.assign(manualVals, e.vals||{});
    Object.assign(alarmOn, e.alarms||{});
    tcMin=e.min||5; tcOff=(e.off==null?3:e.off);
    editMode=false;
    lastCard=e.card;
    const nmEl=$('tc_name'); if(nmEl) nmEl.value=e.name||'';
    setTxt('');
    showEditor();
    render(lastCard);
  }

  function deleteCur(){
    if(curIdx==null) return;
    const nm=(cfg.tcards[curIdx]&&cfg.tcards[curIdx].name)||'';
    showConfirm(t('tcDelTable')+' \u201C'+nm+'\u201D?', function(){ cfg.tcards.splice(curIdx,1); saveCfg(); showLib(); scheduleAll(); });
  }

  function persist(){
    if(curIdx==null) return; const e=cfg.tcards[curIdx]; if(!e) return;
    e.card=lastCard||e.card; e.vals=Object.assign({},manualVals); e.alarms=Object.assign({},alarmOn); e.min=tcMin; e.off=tcOff;
    saveCfg();
  }
  function persistSoon(){ clearTimeout(persistTimer); persistTimer=setTimeout(persist, 350); }

  function sig(L){ return (L.from||'')+'|'+(L.to||'')+'|'+(L.target||'')+'|'+(L.ss||''); }
  /* UN TIMBRO = UN RIQUADRO (14 nov 2026, tabella Due Valli sez. 3). Regola generale, vale per
     tutte le tabelle. Dove la PS ha una riga sua, l'AI la legge come due tratte ("CO 4 -> PS 4"
     e "PS 4 -> CO 5"): l'app mostrava due timbri dove sulla carta ce n'e' uno solo, e il tempo
     imposto finiva ora sull'una ora sull'altra (con l'altra a 00). Le due tratte diventano UNA,
     nella stessa forma delle tabelle dove la PS sta gia' nella riga del controllo (RST
     "SETTORE 21", Targa Florio "T.C. 3"): codice e timbro del controllo DOPO la PS, nome e km
     della PS, il tempo imposto che c'e' ("00:00" = assente). Il calcolo BLOCCATO non cambia. */
  function codeKey(c){ return String(c||'').replace(/[\s.]/g,'').toUpperCase(); }
  function isPsCode(c){ return /^[PS]S\d+[A-Z]?$/.test(codeKey(c)); }
  function hasTgt(v){ const m=String(v||'').match(/(\d{1,2})\D+(\d{1,2})/); return !!m && (+m[1]>0 || +m[2]>0); }
  function joinSplitPS(legs){
    const out=[];
    for(let i=0;i<legs.length;i++){
      const L=legs[i], N=legs[i+1];
      if(N && isPsCode(L.to) && !isPsCode(N.to) && !N.ss && (!N.from || codeKey(N.from)===codeKey(L.to))){
        out.push(Object.assign({}, N, {
          from: L.from, to: N.to,
          target: hasTgt(N.target) ? N.target : (hasTgt(L.target) ? L.target : ''),
          ss: L.ss || String(L.to).trim(), sscode: L.sscode || String(L.to).trim(),
          km: L.km || N.km || ''
        }));
        i++;
      } else out.push(L);
    }
    /* foto sovrapposte: se la stessa PS c'e' sia unita sia ancora da sola, resta quella unita */
    return out.filter(L => !(isPsCode(L.to) && out.some(M => M!==L && !isPsCode(M.to) && M.ss && codeKey(M.from)===codeKey(L.from) && codeKey(M.sscode)===codeKey(L.sscode||L.to))));
  }
  function mergeCard(nc){
    if(!lastCard) lastCard={rally:'',section:'',date:'',legs:[]};
    if(!Array.isArray(lastCard.legs)) lastCard.legs=[];
    if(!lastCard.rally && nc.rally) lastCard.rally=nc.rally;
    if(!lastCard.section && nc.section) lastCard.section=nc.section;
    if(!lastCard.date && nc.date) lastCard.date=nc.date;
    /* nome della partenza (worker tabella v4): vale solo quello della PRIMA pagina letta,
       la seconda pagina comincia da un controllo intermedio */
    if(!lastCard.legs.length && !lastCard.start && nc.start) lastCard.start=String(nc.start).trim();
    const before=lastCard.legs.length;
    /* doppioni di una pagina riletta: come prima, stessa firma. In piu', con la PS unita, il pezzo
       "PS 4 -> CO 5" di una rilettura ha un'altra firma ma un CO 5 che c'e' gia': non e' un timbro nuovo */
    const haveSig={}, haveTo={};
    lastCard.legs.forEach(L=>{ haveSig[sig(L)]=1; const k=codeKey(L.to); if(k) haveTo[k]=1; });
    joinSplitPS(Array.isArray(nc.legs)?nc.legs:[]).forEach(L=>{
      const s=sig(L), k=codeKey(L.to);
      if(haveSig[s] || (k && haveTo[k] && isPsCode(L.from))) return;
      lastCard.legs.push(L); haveSig[s]=1; if(k) haveTo[k]=1;
    });
    /* un timbro = un riquadro anche quando la PS e' in fondo a una foto e il controllo dopo
       e' in cima alla seguente */
    lastCard.legs=joinSplitPS(lastCard.legs);
    return Math.max(0, lastCard.legs.length-before);
  }
  /* ===== SCANNER TABELLA DISATTIVATO (versione di prova): mostra la rotella, poi "non riuscito", non legge mai =====
     Per riattivarlo mettere TC_SCAN_OFF = false. */
  const TC_SCAN_OFF = false;
  $('tc_file').addEventListener('change', async e=>{
    const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
    if(TC_SCAN_OFF){
      if(window.__scanBusy) window.__scanBusy(true);
      setTimeout(function(){ if(window.__scanBusy) window.__scanBusy(false); setTxt('\u26A0\uFE0F '+t('scanConnErr')); }, 9000);
      return;
    }
    setTxt('\u23F3 '+t('tcLoadPhoto')); try{ const src=await loadImage(f); await scan(src); }catch(err){ setTxt('\u26A0\uFE0F '+t('tcPhotoBad')+' '+err); }
  });
  root().querySelectorAll('.tc-mbtn').forEach(b=> b.addEventListener('click', ()=>{ INPUT_MODE=b.dataset.mode; root().querySelectorAll('.tc-mbtn').forEach(x=>x.classList.toggle('on', x.dataset.mode===INPUT_MODE)); if(lastCard) render(lastCard); }));

  async function loadImage(f){ if(window.createImageBitmap){ try{ return await createImageBitmap(f); }catch(e){} } return await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej('decodifica'); im.src=r.result; }; r.onerror=()=>rej('lettura'); r.readAsDataURL(f); }); }
  function toB64(src,max){ const w=src.width,h=src.height,s=Math.min(1,max/Math.max(w,h)); const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w*s)); c.height=Math.max(1,Math.round(h*s)); const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(src,0,0,c.width,c.height); return c.toDataURL('image/jpeg',0.72).split(',')[1]; }

  async function scan(src){
    if(curIdx==null) return;
    setTxt(t('tcReading'));
    try{
      const b64=toB64(src,1800);
      if(window.__scanBusy) window.__scanBusy(true);
      /* tempo massimo di attesa: senza, se la risposta non arriva la rotella
         gira all'infinito invece di dire cosa e' successo. Il worker si ferma
         da solo entro ~40 s, quindi 75 s e' abbondante. */
      const TC_TIMEOUT = 25000;   /* normale ~5 s; il worker si arrende da solo entro ~15 s */
      const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      const tmo = setTimeout(function(){ try{ ctrl && ctrl.abort(); }catch(_){} }, TC_TIMEOUT);
      let res;
      try{
        res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','X-App-Key':window.__rallyAuth.key},body:JSON.stringify({image:b64,mode:'timecard',device:window.__rallyAuth.device}),signal: ctrl?ctrl.signal:undefined});
      } catch(e){
        throw new Error(e && e.name==='AbortError' ? t('scanWhyTime') + ' (25 s)' : t('scanWhyNet'));
      } finally {
        clearTimeout(tmo);
        if(window.__scanBusy) window.__scanBusy(false);
      }
      const data=await res.json();
      if(data && data.limited){ setTxt('\u26A0\uFE0F '+t('scanLimit')); return; }   /* 23 nov 2026: limite di oggi, tradotto */
      if(data.error){ setTxt('\u26A0\uFE0F '+data.error); return; }
      if(!data.card){ setTxt(t('tcNoData')); return; }
      const added=mergeCard(data.card);
      persist();
      const tot=(lastCard.legs&&lastCard.legs.length)||0;
      setTxt(t('tcPageRead')+' +'+added+' TC ('+t('tcTot')+' '+tot+').');
      render(lastCard);
    }catch(err){ setTxt(t('tcConnErr')+((err&&err.message)||err)); }
  }

    function descOf(code){ const L=legs.find(x=>x.to===code); return (L && !L.ss)?(L.desc||''):''; }
    /* PROVE SPECIALI (11 nov 2026, scelto da Simone): titolo "Nome (PS 8)". Il nome viene da "ss",
       la sigla da "sscode" (worker tabella v4); coi worker di prima la sigla si prende da dentro "ss"
       ('PS 4 "Cappella Fasani 2"') o dal codice del controllo quando e' una PS ("PS 4"). */
    function ssCode(c){ const m=String(c||'').match(/^\s*([PS])\.?\s*S\.?\s*(\d+[A-Za-z]?)\s*$/i); return m ? (m[1].toUpperCase()==='P'?'PS ':'SS ')+m[2].toUpperCase() : ''; }
    function ssTitle(L){
