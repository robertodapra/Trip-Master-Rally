function ssRow(ss,i){
  const row=document.createElement('div'); row.className='ss-row';
  if(ssSel){   /* selezione multipla: tutta la riga spunta o toglie */
    const on = ssSel.has(ss);
    row.classList.add('ss-selrow'); if(on) row.classList.add('ss-on');
    const ck = document.createElement('span'); ck.className = 'ss-selck'; ck.textContent = on ? '✓' : ''; row.appendChild(ck);
    const nm = document.createElement('span'); nm.className = 'ss-name'; nm.textContent = ss.name; row.appendChild(nm);
    row.addEventListener('click', ()=>ssSelToggle(ss));
    return row;
  }
  if(ssIsActive(ss)) row.style.borderColor='var(--green)';
  const name=document.createElement('span'); name.className='ss-name'; name.style.cursor='pointer';
  name.textContent=ss.name+(ssIsActive(ss)?' \u2713':'');
  name.addEventListener('click',()=>showStageDetail(i));
  const loadBtn=document.createElement('button'); loadBtn.textContent=t('ssLoad'); loadBtn.addEventListener('click',()=>loadStage(i));
  const moreBtn=document.createElement('button'); moreBtn.textContent='\u22EF'; moreBtn.title=t('ssMore');
  moreBtn.style.cssText='font-size:18px;font-weight:800;letter-spacing:1px';
  moreBtn.addEventListener('click',()=>ssMenu(i));
  row.appendChild(name); row.appendChild(loadBtn); row.appendChild(moreBtn);
  ssLongPress(row, ss);
  return row;
}
function buildSsList(){
  const list=$('ssList'); list.innerHTML='';
  const folders=ssFolders();
  const inFolder = ssCurFolder ? folders.find(f=>f.id===ssCurFolder) : null;
  if(ssCurFolder && !inFolder) ssCurFolder=null;
  let shown=0;
  if(inFolder){
    const hd=document.createElement('div'); hd.className='ss-row'; hd.style.cursor='pointer';
    hd.innerHTML='<span class="ss-name">\u2039 \uD83D\uDCC1 '+ssEsc(inFolder.name)+'</span>';
    const delF=document.createElement('button'); delF.className='del'; delF.textContent='\u2715';
    delF.addEventListener('click',(e)=>{ e.stopPropagation(); showConfirm(t('tcDelFolder')+' \u201C'+inFolder.name+'\u201D?',()=>{
      cfg.ssLib.forEach(x=>{ if(x.folder===inFolder.id) delete x.folder; });
      cfg.ssFolders=folders.filter(f=>f.id!==inFolder.id); ssCurFolder=null; saveCfg(); buildSsList();
    }); });
    if(ssSel){ hd.style.opacity='.4'; hd.style.pointerEvents='none'; }
    else { hd.appendChild(delF); hd.addEventListener('click',()=>{ ssCurFolder=null; buildSsList(); }); }
    list.appendChild(hd);
    /* 23 nov 2026: dentro la cartella le prove sono in ordine alfabetico (PS 2 prima di PS 10) */
    const inF=[]; cfg.ssLib.forEach((ss,i)=>{ if(ss.folder===inFolder.id) inF.push([ss,i]); });
    inF.sort((a,b)=>ssNameCmp(a[0],b[0]));
    inF.forEach(p=>{ list.appendChild(ssRow(p[0],p[1])); shown++; });
  } else {
    folders.forEach(f=>{
      const n=cfg.ssLib.filter(x=>x.folder===f.id).length;
      const row=document.createElement('div'); row.className='ss-row'; row.style.cursor='pointer';
      row.innerHTML='<span class="ss-name">\uD83D\uDCC1 '+ssEsc(f.name)+' <span style="color:var(--muted);font-weight:400">\u00B7 '+n+'</span></span><span style="color:var(--muted)">\u203A</span>';
      if(ssSel){ row.style.opacity='.4'; row.style.pointerEvents='none'; }
      else {
        /* 23 nov 2026: ⋯ sulla cartella, come sulle prove: Rinomina / Elimina cartella */
        const mb=document.createElement('button'); mb.type='button'; mb.className='ss-fmore'; mb.textContent='⋯'; mb.title=t('ssMore');
        mb.style.cssText='font-size:18px;font-weight:800;letter-spacing:1px';
        mb.addEventListener('click',e=>{ e.stopPropagation(); ssFolderMenu(f); });
        row.insertBefore(mb, row.lastChild);
        row.addEventListener('click',()=>{ ssCurFolder=f.id; buildSsList(); });
      }
      list.appendChild(row); shown++;
    });

/* Un file ricevuto da un amico si AGGIUNGE alle tue prove; un tuo backup puo' sostituire tutto. */
function applyIncoming(parsed){
  if(!parsed || typeof parsed !== 'object' || Array.isArray(parsed)){ showMsg(t('impBad')); return; }
  const arr = k => Array.isArray(parsed[k]) ? parsed[k] : [];
  const share = !!parsed.irallyShare;   /* file con una scelta: si puo' solo aggiungere */
  const nSt = arr('ssLib').length;
  const nTab = arr('tcards').length + arr('tdm').length;   /* 22 nov 2026: contava solo le tabelle manuali */
  const {ov,box}=uiBox();
  const h=document.createElement('div'); h.style.cssText='font-weight:800;color:var(--amber);margin-bottom:6px'; h.textContent=t('impTitle'); box.appendChild(h);
  const p1=document.createElement('div'); p1.style.cssText='font-size:14px;line-height:1.5;margin-bottom:10px;color:var(--text)';
  p1.textContent=t('impBody').replace('{s}', nSt).replace('{t}', nTab); box.appendChild(p1);
  const lst = impListEl(parsed); if(lst) box.appendChild(lst);
  if(share){ const p2=document.createElement('div'); p2.style.cssText='font-size:13px;line-height:1.45;margin:0 0 12px;color:var(--muted)'; p2.textContent=t('impShare'); box.appendChild(p2); }
  const mk=(txt,bg,fn)=>{ const b=document.createElement('button'); b.textContent=txt;
    b.style.cssText='width:100%;padding:13px;border-radius:10px;font-weight:800;margin-bottom:8px;border:'+(bg?'none':'1px solid var(--line,#333)')+';background:'+(bg||'var(--btnbg,#222)')+';color:'+(bg?'#000':'var(--text,#eee)');
    b.addEventListener('click', fn); box.appendChild(b); return b; };
  mk(t('impAdd'), 'var(--green,#39d353)', ()=>{ uiClose(ov); doImport(parsed, true); }).id='impAddBtn';
  if(!share) mk(t('impReplace'), 'var(--amber)', ()=>{ uiClose(ov); doImport(parsed, false); }).id='impReplaceBtn';
  mk(t('tcCancel'), '', ()=>uiClose(ov));
}

function impListEl(o){
  const arr = k => Array.isArray(o[k]) ? o[k] : [];
  const secs = [[t('exRadar'), arr('ssLib'), arr('ssFolders')], [t('navTimecard'), arr('tcards'), arr('tcfolders')], [t('navTdm'), arr('tdm'), []]];
  if(!secs.some(x => x[1].length)) return null;
  const w = document.createElement('div'); w.className = 'imp-list';
  secs.forEach(x => {
    const title = x[0], items = x[1].filter(Boolean), folders = x[2];
    if(!items.length) return;
    const hd = document.createElement('div'); hd.className = 'imp-sec'; hd.textContent = title + ' (' + items.length + ')'; w.appendChild(hd);
    const used = new Set();
    folders.forEach(f => {
      if(!f) return;
      const kids = items.filter(it => it.folder === f.id); if(!kids.length) return;
      kids.forEach(it => used.add(it));
      const ln = document.createElement('div'); ln.className = 'imp-line';
      ln.textContent = '📁 ' + (f.name||'') + ': ' + kids.map(it => it.name || t('tcNoName')).join(', ');
      w.appendChild(ln);
    });
    const loose = items.filter(it => !used.has(it));
    if(loose.length){ const ln = document.createElement('div'); ln.className = 'imp-line'; ln.textContent = loose.map(it => it.name || t('tcNoName')).join(', '); w.appendChild(ln); }
  });
  return w;
}
async function doImport(parsed, merge){
  try{
    if(!IMG_STORE.ready) await imgInit();
    imgAdopt(parsed.rb);
    if(Array.isArray(parsed.ssLib)) parsed.ssLib.forEach(ss=>imgAdopt(ss.rb));
    let out;
    if(merge){
      out = JSON.parse(localStorage.getItem('rallytrip_cfg') || JSON.stringify(cfg));
      if(!Array.isArray(out.ssLib)) out.ssLib = [];
      if(!Array.isArray(out.ssFolders)) out.ssFolders = [];
      const names = new Set(out.ssLib.map(x=>x.name));
      (parsed.ssFolders||[]).forEach(f=>{ if(!out.ssFolders.some(g=>g.id===f.id)) out.ssFolders.push(f); });
      (parsed.ssLib||[]).forEach(ss=>{
        let nm = ss.name || 'prova';
        if(names.has(nm)){ let k=2; while(names.has(nm+' ('+k+')')) k++; nm = nm+' ('+k+')'; }
        names.add(nm); out.ssLib.push(Object.assign({}, ss, {name:nm, id:undefined}));   /* codice nuovo all'avvio: lo stesso file importato due volte non deve dare due prove con lo stesso codice */
      });
      if(Array.isArray(parsed.tdm)){
        if(!Array.isArray(out.tdm)) out.tdm=[];
        const dn = new Set(out.tdm.map(x=>x && x.name));
        parsed.tdm.forEach(x=>{ if(!x) return; let nm = x.name || ''; if(nm && dn.has(nm)){ let k=2; while(dn.has(nm+' ('+k+')')) k++; nm = nm+' ('+k+')'; } dn.add(nm); out.tdm.push(Object.assign({}, x, {name:nm})); });
      }
      /* 22 nov 2026: "Aggiungi" porta anche le tabelle dello scanner (prima restavano fuori).
         Le sveglie sono di chi le ha accese: le tabelle arrivano con le campanelle spente e
         senza il codice notifica (nid), che il telefono assegna di nuovo. */
      if(Array.isArray(parsed.tcards) && parsed.tcards.length){
        if(!Array.isArray(out.tcards)) out.tcards = [];
        if(!Array.isArray(out.tcfolders)) out.tcfolders = [];
        (parsed.tcfolders||[]).forEach(f=>{ if(f && !out.tcfolders.some(g=>g && g.id===f.id)) out.tcfolders.push(f); });
        const tn = new Set(out.tcards.map(x=>x && x.name));
        parsed.tcards.forEach(e=>{
          if(!e) return;
          const c = Object.assign({}, e);
          let nm = c.name || '';
          if(nm && tn.has(nm)){ let k=2; while(tn.has(nm+' ('+k+')')) k++; nm = nm+' ('+k+')'; }
          tn.add(nm); c.name = nm;
          c.alarms = {}; c.sched = []; delete c.nid;
          out.tcards.push(c);
        });
      }
    } else {
      out = parsed;
    }
    localStorage.setItem('rallytrip_cfg', JSON.stringify(out));
    location.reload();
  }catch(err){ showMsg(t('impErr')+' '+err); }
}
/* file aperto da WhatsApp, Mail, File... ("Apri in iRally") */
(function(){
  function handleUrl(url){
    if(!url) return;
    const P = (window.Capacitor && window.Capacitor.Plugins) || {};
    if(!P.Filesystem){ showMsg(t('impErr')); return; }
    P.Filesystem.readFile({ path: url, encoding: 'utf8' })
      .then(r=>{ try{ applyIncoming(JSON.parse(r.data)); }catch(e){ showMsg(t('impBad')); } })
      .catch(()=>{ showMsg(t('impBad')); });
  }
  function hook(tries){
    const P = (window.Capacitor && window.Capacitor.Plugins) || {};
    if(!P.App){ if(tries<20) setTimeout(()=>hook(tries+1), 500); return; }
    try{ P.App.addListener('appUrlOpen', d => handleUrl(d && d.url)); }catch(e){}
    try{ P.App.getLaunchUrl().then(d => { if(d && d.url) handleUrl(d.url); }).catch(()=>{}); }catch(e){}
  }
  hook(0);
})();

/* ===== ESPORTA (22 nov 2026): si sceglie cosa mettere nel file =====
   Tutto spuntato = il backup completo di sempre, impostazioni comprese.
   Togliendo qualcosa = file da condividere con solo le prove e le tabelle scelte, senza
   impostazioni (irallyShare): chi lo riceve puo' solo aggiungerlo, mai "Sostituisci tutto".
   Il nome del file dice cosa contiene. Gli Intermedi non ci sono mai (archivio a parte). */
function withImgs(list){ if(Array.isArray(list)) list.forEach(r=>{ if(r && typeof r.img==='string' && r.img.indexOf('idb:')===0) r.img = imgGet(r.img); }); }
function fileStamp(){ const d=new Date(), p=n=>(n<10?'0':'')+n; return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes()); }
function fileSafe(x){
  let v = String(x==null?'':x);
  try{ v = v.normalize('NFD').replace(/[̀-ͯ]/g,'').normalize('NFC'); }catch(e){}
  try{ v = v.replace(/[^\p{L}\p{N}]+/gu,'-'); }catch(e){ v = v.replace(/[^A-Za-z0-9]+/g,'-'); }
  return v.replace(/^-+|-+$/g,'').slice(0,40);
}
function shareBaseName(o){
  const names = [], seen = new Set();
  const add = n => { const k = fileSafe(n); if(k && !seen.has(k.toLowerCase())){ seen.add(k.toLowerCase()); names.push(k); } };
  const fold = (fs, id) => { const f = (fs||[]).find(x => x && x.id === id); return f ? f.name : ''; };
  o.ssLib.forEach(x => add((x.folder && fold(o.ssFolders, x.folder)) || x.name));
  o.tcards.forEach(x => add((x.folder && fold(o.tcfolders, x.folder)) || x.name));
  o.tdm.forEach(x => add(x.name));
  if(!names.length) return '';
  return names[0] + (names.length > 1 ? '+' + (names.length - 1) : '');
}
function exportDownload(data, fname){
  try{
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ if(a.parentNode) a.parentNode.removeChild(a); URL.revokeObjectURL(url); }, 1500);
    showToast(t('bkExported'));
  }catch(e){ showMsg(t('bkExportErr')+' '+e); }
}
/* chiamata nel tocco del tasto: la condivisione di iOS vuole il gesto dell'utente */
function exportData(sel){
  let data, fname;
  if(!sel){
    data = JSON.stringify(cfgWithImages());
    fname = 'iRally-backup-' + fileStamp() + '.irally';
  } else {
    const pick = (arr, idx) => idx.map(i => arr[i]).filter(Boolean).map(x => JSON.parse(JSON.stringify(x)));
    const ssLib = pick(cfg.ssLib||[], sel.ss); ssLib.forEach(x => withImgs(x.rb));
    const tcards = pick(cfg.tcards||[], sel.tc);
    const tdm = pick(cfg.tdm||[], sel.td);
    const ids = a => new Set(a.map(x => x && x.folder).filter(Boolean));
    const sf = ids(ssLib), tf = ids(tcards);
    const out = { irallyShare: 1, ssLib: ssLib, ssFolders: (cfg.ssFolders||[]).filter(f => f && sf.has(f.id)),
                  tcards: tcards, tcfolders: (cfg.tcfolders||[]).filter(f => f && tf.has(f.id)), tdm: tdm };
    data = JSON.stringify(out);
    fname = 'iRally-' + (shareBaseName(out) || fileStamp()) + '.irally';
  }
  try{
    const file = new File([data], fname, {type:'application/octet-stream'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:'iRally'}).catch(err=>{ if(err && err.name==='AbortError') return; exportDownload(data, fname); });
      return;
    }
  }catch(e){ /* condivisione non disponibile: uso il download */ }
  exportDownload(data, fname);
}
function exportPick(){
  const ss = cfg.ssLib||[], tc = cfg.tcards||[], td = cfg.tdm||[];
  const secs = [];
  if(ss.length) secs.push({ key:'ss', title:t('exRadar'), items: ss.map((x,i)=>({ i:i, name:(x&&x.name)||'', folder:(x&&x.folder)||null })), folders: cfg.ssFolders||[] });
  if(tc.length) secs.push({ key:'tc', title:t('navTimecard'), items: tc.map((x,i)=>({ i:i, name:(x&&x.name)||t('tcNoName'), folder:(x&&x.folder)||null })), folders: cfg.tcfolders||[] });
  if(td.length) secs.push({ key:'td', title:t('navTdm'), items: td.map((x,i)=>({ i:i, name:(x&&x.name)||'', folder:null })), folders: [] });
  if(!secs.length){ exportData(); return; }   /* niente da scegliere: backup completo */
  const {ov,box} = uiBox();
  box.classList.add('ex-box');
  const h = document.createElement('div'); h.className = 'ex-title'; h.textContent = t('bkExport'); box.appendChild(h);
  const p = document.createElement('div'); p.className = 'ex-hint'; p.textContent = t('exHint'); box.appendChild(p);
  const list = document.createElement('div'); list.className = 'ex-list'; box.appendChild(list);
  const all = [], syncs = [];
  const row = (txt, cls) => {
    const l = document.createElement('label'); l.className = 'ex-row' + (cls ? ' ' + cls : '');
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = true;
    const sp = document.createElement('span'); sp.textContent = txt;
    l.appendChild(cb); l.appendChild(sp); list.appendChild(l); return cb;
  };
  secs.forEach(sec => {
    const sh = document.createElement('div'); sh.className = 'ex-sec';
    const st = document.createElement('span'); st.textContent = sec.title; sh.appendChild(st);
    const tg = document.createElement('span'); tg.className = 'ex-tog';
    const bAll = document.createElement('button'); bAll.type = 'button'; bAll.textContent = t('exAll');
    const bNone = document.createElement('button'); bNone.type = 'button'; bNone.textContent = t('exNone');
    tg.appendChild(bAll); tg.appendChild(bNone); sh.appendChild(tg); list.appendChild(sh);
    const mine = [], used = new Set();
    sec.folders.forEach(f => {
      if(!f) return;
      const kids = sec.items.filter(it => it.folder === f.id);
      if(!kids.length) return;
      const fcb = row('📁 ' + (f.name||''), 'ex-folder');
      const kcbs = kids.map(it => { used.add(it.i); const cb = row(it.name, 'ex-kid'); const o = { cb:cb, key:sec.key, i:it.i }; all.push(o); mine.push(o); return cb; });
      const sync = () => { const n = kcbs.filter(c => c.checked).length; fcb.checked = (n === kcbs.length); fcb.indeterminate = (n > 0 && n < kcbs.length); };
      fcb.addEventListener('change', () => { kcbs.forEach(c => { c.checked = fcb.checked; }); fcb.indeterminate = false; upd(); });
      kcbs.forEach(c => c.addEventListener('change', () => { sync(); upd(); }));
      syncs.push(sync);
    });
    sec.items.forEach(it => { if(used.has(it.i)) return; const cb = row(it.name); const o = { cb:cb, key:sec.key, i:it.i }; all.push(o); mine.push(o); cb.addEventListener('change', upd); });
    bAll.addEventListener('click', () => { mine.forEach(o => { o.cb.checked = true; }); syncs.forEach(f => f()); upd(); });
    bNone.addEventListener('click', () => { mine.forEach(o => { o.cb.checked = false; }); syncs.forEach(f => f()); upd(); });
  });
  const stEl = document.createElement('div'); stEl.className = 'ex-state'; box.appendChild(stEl);
  const bw = document.createElement('div'); bw.className = 'ex-btns';
  const no = document.createElement('button'); no.type = 'button'; no.className = 'ex-no'; no.textContent = t('tcCancel'); no.addEventListener('click', () => uiClose(ov));
  const go = document.createElement('button'); go.type = 'button'; go.className = 'ex-go'; go.id = 'exGo'; go.textContent = t('exGo');
  bw.appendChild(no); bw.appendChild(go); box.appendChild(bw);
  function upd(){
    const n = all.filter(o => o.cb.checked).length;
    go.disabled = (n === 0);
    stEl.textContent = (n === all.length) ? t('exFull') : (n ? t('exPart') : '');
  }
  go.addEventListener('click', () => {
    const on = all.filter(o => o.cb.checked);
    if(!on.length) return;
    uiClose(ov);
    if(on.length === all.length){ exportData(); return; }   /* tutto spuntato: backup completo */
    const sel = { ss:[], tc:[], td:[] };
    on.forEach(o => sel[o.key].push(o.i));
    exportData(sel);
  });

function td_esc(x){ return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function td_att(x){ return td_esc(x).replace(/"/g,'&quot;'); }
function td_hm(x){ x=String(x==null?'':x).trim(); var m=x.match(/^(\d{1,2})[:.\s]+(\d{1,2})$/); var h,mi; if(m){ h=+m[1]; mi=+m[2]; } else { var d=x.replace(/\D/g,''); if(d.length===4){ h=+d.slice(0,2); mi=+d.slice(2); } else if(d.length===3){ h=+d.slice(0,1); mi=+d.slice(1); } else if(d.length>0&&d.length<=2){ h=+d; mi=0; } else return NaN; } if(isNaN(h)||isNaN(mi)||h>23||mi>59) return NaN; return h*60+mi; }
function td_mh(m){ m=((Math.round(m)%1440)+1440)%1440; const h=Math.floor(m/60), mi=m%60; return (h<10?'0':'')+h+':'+(mi<10?'0':'')+mi; }
function td_norm(x){ x=((x%1440)+1440)%1440; if(x>720)x-=1440; return x; }
function impMin(x){ x=String(x==null?'':x).trim(); if(!x) return 0; if(/[:.]/.test(x)){ var v=td_hm(x); return isNaN(v)?0:v; } var n=parseInt(x.replace(/\D/g,'')); return isNaN(n)?0:n; }
function impHM(x){ return td_mh(impMin(x)); }
function td_mark(n){ if(!n) return ''; return '<span class="b-late">'+(n>0?'+':'\u2212')+Math.abs(n)+'\u2032</span>'; }
function td_calc(tab){ const out=[]; let ideal=td_hm(tab.start); if(isNaN(ideal)) ideal=0; let D=0; const OFF=(tab.offset==null||isNaN(parseInt(tab.offset)))?3:parseInt(tab.offset);
  (tab.rows||[]).forEach(r=>{ ideal+=impMin(r.imp);
    if(r.tipo==='SS'){ const idT=ideal, idP=idT+OFF; const teoT=idT+D, teoP=idP+D; const tr=td_hm(r.real); const tmark=isNaN(tr)?null:td_norm(tr-teoT); const pr=td_hm(r.rstart); if(!isNaN(pr)){ const extra=td_norm(pr-teoP); if(extra>0) D+=extra; } out.push({isPS:true,teoT:td_mh(teoT),teoP:td_mh(teoP),tmark:tmark}); ideal=idP; }
    else if(r.tipo==='RGO'){ const teo=ideal+D; const rm=td_hm(r.real); if(!isNaN(rm)){ D=td_norm(rm-ideal); } out.push({isPS:false,teo:td_mh(teo)}); }
    else { const teo=ideal+D; const rm=td_hm(r.real); const mark=isNaN(rm)?null:td_norm(rm-teo); out.push({isPS:false,teo:td_mh(teo),mark:mark}); }
  }); return out; }

let calc={acc:null,op:null,entry:'',exprDone:''};
function calcFmt(min){ const neg=min<0; min=Math.abs(min); const h=Math.floor(min/60), m=min%60; return (neg?'-':'')+(h<10?'0':'')+h+':'+(m<10?'0':'')+m; }
function calcSym(o){ return o==='plus'?'+':'\u2212'; }
function calcEntryMin(){ if(!calc.entry) return 0; const s=calc.entry; const mm=parseInt(s.slice(-2),10)||0; const hh=parseInt(s.slice(0,-2),10)||0; return hh*60+mm; }
function calcShow(){
  const d=$('calcDisp'), e=$('calcExpr');
  if(calc.entry!==''){ d.textContent=calcFmt(calcEntryMin()); }
  else if(calc.acc!=null){ d.textContent=calcFmt(calc.acc); }
  else { d.textContent='00:00'; }
  let ex='';
  if(calc.op!=null){ ex=calcFmt(calc.acc)+' '+calcSym(calc.op); if(calc.entry!=='') ex+=' '+calcFmt(calcEntryMin()); }
  else if(calc.exprDone){ ex=calc.exprDone; }
  e.textContent=ex;
}
function calcKey(k){
  if(k==='clear'){ calc={acc:null,op:null,entry:'',exprDone:''}; }
  else if(k==='back'){ calc.entry=calc.entry.slice(0,-1); }
  else if(k==='plus'||k==='minus'){ calc.exprDone=''; const v=(calc.entry!=='')?calcEntryMin():(calc.acc!=null?calc.acc:0); if(calc.acc==null){ calc.acc=v; } else if(calc.op){ calc.acc=calc.op==='plus'?calc.acc+v:calc.acc-v; } calc.op=k; calc.entry=''; }
  else if(k==='eq'){ if(calc.op!=null){ const a=calc.acc; const v=(calc.entry!=='')?calcEntryMin():0; const r=calc.op==='plus'?a+v:a-v; calc.exprDone=calcFmt(a)+' '+calcSym(calc.op)+' '+calcFmt(v)+' ='; calc.acc=r; calc.op=null; calc.entry=''; } }
  else { if(calc.op==null && calc.exprDone){ calc.acc=null; calc.exprDone=''; } const dd=(k==='00')?'00':k; if((calc.entry.length+dd.length)<=4){ calc.entry=(calc.entry==='0'?'':calc.entry)+dd; } }
  calcShow();
}

const SCAN_API = 'https://rally-scan.roberto-dapra5858.workers.dev';

function aiCrop(img, box){
  let ymin=box[0], xmin=box[1], ymax=box[2], xmax=box[3];
  const W=img.width, H=img.height;
  let x0=Math.max(0,Math.min(W, xmin/1000*W));
  let y0=Math.max(0,Math.min(H, ymin/1000*H));
  let x1=Math.max(0,Math.min(W, xmax/1000*W));
  let y1=Math.max(0,Math.min(H, ymax/1000*H));
  let w=Math.max(4, x1-x0), h=Math.max(4, y1-y0);
  const OUT_W=520, sc=Math.min(1, OUT_W/w);
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w*sc));
  c.height=Math.max(1,Math.round(h*sc));
  const g=c.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
  g.drawImage(img, x0,y0,w,h, 0,0,c.width,c.height);
  return c.toDataURL('image/jpeg', 0.72);
}
function imgToB64(img, maxDim){
  const s = Math.min(1, maxDim / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(img.width * s));
  c.height = Math.max(1, Math.round(img.height * s));
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height);
  g.drawImage(img, 0, 0, c.width, c.height);
  const url = c.toDataURL('image/jpeg', 0.72);
  c.width = c.height = 0;   /* libera subito la memoria: su iOS e' la risorsa critica */
  const b64 = (url || '').split(',')[1] || '';
  /* se iOS ha svuotato il canvas per pressione di memoria, toDataURL torna vuoto:
     meglio un errore chiaro che spedire un'immagine vuota (il modello la rifiuta) */
  if(b64.length < 2000) throw new Error('immagine vuota');
  return b64;
}
/* trova le linee della tabella sui pixel: righe (bande) e colonne, in px di un canvas 900 di larghezza */
function detectTable(img, hint){   /* hint: {y:[...], photo:bool} — posizioni AI e origine dell'immagine */
  try{
    /* LINEE SOTTILISSIME (Schio PS 3, 4 nov 2026): le pagine da PDF si guardano alla loro
       risoluzione vera (max 1800), non rimpicciolite a 900. A 900 una linea finissima
       diventava grigio chiaro e, se cadeva a cavallo di due pixel, spariva: a pagina 58
       se ne vedevano 2 su 6 e le strisce prendevano due righe, il pie' di pagina, o niente.
       Le foto restano a 900 con la maschera di prima. */
    const photo = !!(hint && hint.photo);
    const nW = img.naturalWidth || img.width, nH = img.naturalHeight || img.height;
    const W = photo ? 900 : Math.min(1800, Math.max(900, nW)), sc=W/nW, H=Math.max(1, Math.round(nH*sc));
    const R = W/900;   /* le distanze fisse in pixel erano tarate a 900 di larghezza */
    const c=document.createElement('canvas'); c.width=W; c.height=H;
    const cx=c.getContext('2d'); cx.drawImage(img,0,0,W,H);
    const d=cx.getImageData(0,0,W,H).data;
    const dark=new Uint8Array(W*H);
    const ink=new Uint8Array(W*H);
    for(let y=0;y<H;y++){ for(let x=0;x<W;x++){ const i=(y*W+x)*4; const l=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000; if(l<165) dark[y*W+x]=1; ink[y*W+x]=255-Math.round(l); } }
    /* Una linea sottile che cade fra due pixel si divide in due grigi chiari, nessuno
       dei due sotto la soglia. Si somma l'inchiostro di due pixel vicini: la linea conta
       uguale dovunque cada. darkH serve alle linee orizzontali, darkV alle verticali.
       Contengono tutto il nero di prima: possono solo AGGIUNGERE le linee sfumate.
       La carta sopra e sotto una linea si misura con la stessa maschera: con quella di
       prima il bordo alto di una foto (Sanremo p.16 e p.51) passava per una linea. */
    let darkH=dark, darkV=dark;
    if(!photo){
      darkH=new Uint8Array(W*H); darkV=new Uint8Array(W*H);
      for(let y=0;y<H;y++){ const o=y*W; for(let x=0;x<W;x++){ const p=o+x, v=ink[p];
        if(dark[p] || (y<H-1 && v+ink[p+W]>=90)) darkH[p]=1;
        if(dark[p] || (x<W-1 && v+ink[p+1]>=90)) darkV[p]=1; } }
    }
    const med=a=>{ const t=Array.from(a).sort((p,q)=>p-q); return t.length? t[Math.floor(t.length/2)] : 0; };
    const runs=(mask, n, mind)=>{
      const ls=[]; let inl=false, st=0;
      for(let i=0;i<=n;i++){ const on=i<n && mask(i); if(on&&!inl){ inl=true; st=i; } if(!on&&inl){ inl=false; ls.push((st+i-1)/2); } }
      const cl=[]; ls.forEach(v=>{ if(cl.length && v-cl[cl.length-1]<mind) cl[cl.length-1]=(cl[cl.length-1]+v)/2; else cl.push(v); });
      return cl;
    };
    /* --- 1) linee orizzontali su tutta la larghezza --- */
    const rowr=new Float32Array(H);
    /* tolleranza verticale SOLO per le foto (hint.photo): una linea fotografata deriva
       di qualche pixel da sinistra a destra. Sulle pagine da PDF si usa il calcolo
       originale, identico a prima, cosi' il PDF non puo' cambiare comportamento. */
    const tolY = (hint && hint.photo) ? 2 : 0;
    if(tolY){ for(let y=0;y<H;y++){ let n=0; for(let x=0;x<W;x++){ let on=0; for(let k=-tolY;k<=tolY;k++){ const yy=y+k; if(yy>=0&&yy<H&&dark[yy*W+x]){ on=1; break; } } n+=on; } rowr[y]=n/W; } }
    else { for(let y=0;y<H;y++){ let n=0; const o=y*W; for(let x=0;x<W;x++) n+=darkH[o+x]; rowr[y]=n/W; } }
    /* LINEE SOTTILI (Sanremo p.53, 13 ott 2026): sulla pagina del fine prova la riga
       del "Finish" ha la foto, la linguetta rossa della prova e i box Finish/Stop: e'
       cosi' piena di scuro che la riga di testo dei numeri superava la soglia e veniva
       presa per una separatrice. La riga si spezzava in tre pezzi, veniva scartata, e
       tutti i riferimenti dopo scivolavano di una riga.
       Una separatrice vera e' SOTTILE: scura, con carta chiara 4 px sopra e 4 px sotto.
       Una foto o un testo sono scuri anche sopra e sotto. Quindi, sul percorso PDF, una
       linea vale solo se una buona parte dei suoi pixel scuri e' fatta cosi'.
       Puo' solo TOGLIERE linee false: le linee vere passano come prima. */
    const thrR = Math.max(0.42, med(rowr)+0.3);
    let isLine = y => rowr[y] > thrR;
    if(!tolY){
      const K = Math.max(4, Math.round(4*R)), KN = Math.max(2, Math.round(2*R)), thin = new Float32Array(H);
      /* LINEE SOTTILI: carta K pixel sopra e sotto il pixel (come prima). */
      const cnt = new Uint32Array(H);
      const thinPx = (y, p) => darkH[p] && y-K >= 0 && y+K+1 < H && !darkH[p-K*W] && !darkH[p+(K+1)*W];
      for(let y=K;y<H-K-1;y++){ let n=0; const o=y*W; for(let x=0;x<W;x++){ if(thinPx(y, o+x)) n++; } cnt[y]=n; }
      /* LINEE GROSSE (4 nov 2026): un tratto scuro verticale piu' alto di K ma entro LMAX
         (circa 10 punti), con carta K pixel sopra e sotto il tratto, e' una linea anche lui.
         Si AGGIUNGE soltanto: le linee sottili restano trovate esattamente come prima. */
      const LMAX = Math.max(K+1, Math.round(H*0.012)), st0 = new Int32Array(W).fill(-1);
      for(let y=0;y<=H;y++){ const o=y*W;
        for(let x=0;x<W;x++){
          if(y<H && darkH[o+x]){ if(st0[x]<0) st0[x]=y; }
          else if(st0[x]>=0){ const a=st0[x], b=y-1; st0[x]=-1; const len=b-a+1;
            if(len>K && len<=LMAX && a-K>=0 && b+K+1<H && !darkH[(a-K)*W+x] && !darkH[(b+K+1)*W+x])
              for(let yy=a;yy<=b;yy++){ if(!thinPx(yy, yy*W+x)) cnt[yy]++; } }
        }
      }
      for(let y=0;y<H;y++) thin[y]=cnt[y]/W;
      const thinNear = y => { let m=0; for(let k=-KN;k<=KN;k++){ const yy=y+k; if(yy>=0 && yy<H && thin[yy]>m) m=thin[yy]; } return m; };
      isLine = y => rowr[y] > thrR && thinNear(y) >= rowr[y]*0.30;
    }
    const hAll=runs(isLine, H, H*0.010);
    if(hAll.length<2) return null;
    let bands=[]; for(let i=0;i<hAll.length-1;i++) bands.push([hAll[i], hAll[i+1]]);

    /* --- 2) SOLO le righe dei riferimenti: hanno tutte la stessa altezza ---
       Cerco l'altezza piu' rappresentata (per estensione totale) e tengo quelle. */
    const hs=bands.map(b=>b[1]-b[0]).filter(h=>h>H*0.02);
    if(!hs.length) return null;
    let modeH=0, bestCov=0;
    hs.forEach(h=>{ let cov=0; hs.forEach(k=>{ if(Math.abs(k-h)<=h*0.10) cov+=k; });
      if(cov>bestCov || (cov===bestCov && h>modeH)){ bestCov=cov; modeH=h; } });
    const keep=[];
    const hintRaw = Array.isArray(hint) ? hint : (hint && Array.isArray(hint.y) ? hint.y : []);
    const hintY = hintRaw.filter(v=>typeof v==='number' && !isNaN(v)).map(v=>v*H/1000).sort((a,b)=>a-b);
    /* CELLE UNITE (Noale, 11 set 2026): quando i riferimenti sono vicini fra loro l'organizzatore
       non stampa il separatore e 2, 3, 4 righe risultano una sola. Su alcune pagine NON esiste
       nessuna riga singola da usare come misura. Stima dell'altezza di UNA riga, in ordine:
         a) con l'AI: fra le altezze reali delle fasce vince quella che spiega tutte le
            fasce coi riferimenti come multipli interi; la distanza mediana fra i
            riferimenti decide solo i pareggi (le linee restano la misura esatta)
         b) senza AI: l'altezza piu' ricorrente (metodo classico)
       Poi ogni fascia alta k volte quella misura viene divisa in k parti uguali. */
    const tolH = H*0.015;
    const cntIn = b => hintY.filter(y=> y>=b[0]-tolH && y<=b[1]+tolH).length;
    let h0 = modeH;
    if(hintY.length >= 2){
      /* La distanza mediana fra un riferimento e il successivo (g) e' una stima grezza
         dell'altezza di riga, rumorosa quanto l'AI. Non la uso come misura: le CANDIDATE
         sono le altezze reali delle fasce (piu' g stessa); vince quella che spiega tutte
         le fasce coi riferimenti come multipli interi; g decide solo i pareggi. */
      const gaps=[]; for(let i=1;i<hintY.length;i++) gaps.push(hintY[i]-hintY[i-1]);
      gaps.sort((a,b)=>a-b); const g = gaps[Math.floor(gaps.length/2)];
      if(g > H*0.02){
        const grid = bands.filter(b => (b[1]-b[0]) > H*0.02);
        const withHint = grid.filter(b => cntIn(b) >= 1);
        const cands = Array.from(new Set(grid.map(b=>Math.round(b[1]-b[0])).concat([Math.round(g)]))).filter(h => h >= g*0.5);
        let best=null;
        cands.forEach(c=>{
          let score=0;
          withHint.forEach(b=>{ const h=b[1]-b[0]; const k=Math.round(h/c); if(k>=1 && Math.abs(h-k*c)<=c*0.15) score+=h; });
          const d=Math.abs(c-g);
          if(best===null || score>best.score || (score===best.score && d<best.d)) best={c, score, d};
        });
        if(best && best.score>0){
          h0 = best.c;
          /* LE LINEE VINCONO (Sardegna p.84, 28 set 2026): se ci sono fasce alte UNA riga
             secondo questa misura, l'altezza di riga e' quella MISURATA su di loro (mediana),
             non la stima dell'AI. Prima, con le posizioni dell'AI sfasate del 12-17%, la sua
             stima vinceva il pareggio, poi nessuna riga vera passava il controllo: tutte
             scartate e ritaglio con le coordinate dell'AI, sempre piu' sfalsato verso il fondo
             (47 sforava, 48 partiva a meta', 49 prendeva due righe, 50 il pie' di pagina). */
          const ones = withHint.map(b=>b[1]-b[0]).filter(h=> Math.round(h/h0)===1 && Math.abs(h-h0)<=h0*0.15).sort((a,b)=>a-b);
          if(ones.length) h0 = ones[Math.floor(ones.length/2)];
        } else if(!photo){
          /* NESSUNA misura spiega le fasce (Schio p.66: due righe con una foto aerea in mezzo,
             per l'AI lontanissime fra loro): l'altezza di riga si misura sulle fasce che
             contengono UN solo riferimento, se sono almeno due e concordano. */
          const one = grid.filter(b => hintY.filter(y => y >= b[0] && y < b[1]).length === 1).map(b => b[1]-b[0]).sort((a,b)=>a-b);
          if(one.length >= 2 && one[one.length-1] <= one[0]*1.3) h0 = one[Math.floor(one.length/2)];
        }
      }
    }
    if(!photo && hintY.length === 1){
      /* UN SOLO riferimento (Sardegna p.29-37: una riga e sotto una mappa grande): la riga e' la
         fascia che lo contiene, non la fascia piu' grande della pagina */
      const own = bands.find(b => (b[1]-b[0]) > H*0.02 && hintY[0] >= b[0] && hintY[0] < b[1]);
      if(own) h0 = own[1]-own[0];
    }
    /* bordi orizzontali lunghi dentro una zona (foto, mappe): li' finisce una riga e comincia la foto */
    const edgesIn = (a, b) => {
      const ys = [];
      const y0 = Math.max(3, Math.ceil(a + H*0.02)), y1 = Math.min(H-4, Math.floor(b - H*0.02));
      const minRun = W*0.30, gapMax = Math.max(2, Math.round(W*0.01));
      for(let y=y0; y<=y1; y++){
        const o1=(y-2)*W, o2=(y+2)*W; let best=0, run=0, gap=0;
        for(let x=0;x<W;x++){
          const dl = ink[o1+x] - ink[o2+x];
          if(dl >= 45 || dl <= -45){ run += 1 + gap; gap = 0; if(run > best) best = run; }
          else if(run > 0){ if(++gap > gapMax){ run = 0; gap = 0; } }
        }
        if(best >= minRun) ys.push(y);
      }
      const out = []; let s = -1, p = -1;
      ys.forEach(y => { if(s < 0){ s = p = y; } else if(y - p <= 2){ p = y; } else { out.push((s+p)/2); s = p = y; } });
      if(s >= 0) out.push((s+p)/2);
      return out;
    };
    /* divide una zona in tante righe quanti riferimenti ci vede l'AI: prima sui bordi di foto e
       mappe (le parti senza riferimenti, cioe' la foto, restano fuori), altrimenti in parti uguali */
    const splitZone = (b, hy) => {
      const n = hy.length, h = b[1]-b[0];
      const eq = () => Array.from({length:n}, (_,j) => [b[0]+h*j/n, b[0]+h*(j+1)/n]);
      const E = edgesIn(b[0], b[1]);
      if(!E.length) return eq();
      const cuts = [b[0]].concat(E, [b[1]]), out = [];
      for(let i=0;i<cuts.length-1;i++){
        const s0 = cuts[i], s1 = cuts[i+1], m = hy.filter(y => y >= s0 && y < s1).length;
        if(m === 1) out.push([s0, s1]);
        else if(m >= 2) for(let j=0;j<m;j++) out.push([s0+(s1-s0)*j/m, s0+(s1-s0)*(j+1)/m]);
      }
      if(out.length !== n) return eq();
      const hs = out.map(q => q[1]-q[0]), mx = Math.max(...hs), mn = Math.min(...hs);
      return (mn > 0 && mx/mn <= 1.6) ? out : eq();
    };
    /* lunghezza della linea orizzontale piu' lunga all'altezza y (dice dove sono i bordi della tabella) */
    const lineExtent=(y)=>{
      const yy=Math.round(y); let best=null, st=-1;
      for(let x=0;x<=W;x++){
        let on=false;
        if(x<W){ for(let k=-1;k<=1;k++){ const yk=yy+k; if(yk>=0 && yk<H && darkH[yk*W+x]){ on=true; break; } } }
        if(on && st<0) st=x;
        if(!on && st>=0){ if(!best || (x-st)>(best[1]-best[0])) best=[st, x-1]; st=-1; }
      }
      return best;
    };
    const inB = b => hintY.filter(y => y >= b[0] && y < b[1]);
    /* RIGHE CONTATE SULLA PAGINA (Ticino, 5 nov 2026): nel road book del Ticino (e di Schio) le
       righe hanno una linea di separazione solo ogni tanto. Una zona senza linee veniva divisa in
       tante parti quanti riferimenti vedeva l'AI: un riferimento letto in piu' o in meno spostava
       TUTTE le strisce della zona. Ora il numero di righe si legge sulla pagina: nella prima
       colonna (Totali) ogni riga ha il suo numero stampato, sempre nello stesso punto della riga.
       n e' giusto se la zona divisa in n parti uguali ha un testo nello stesso punto di ogni parte.
       Se la pagina non risponde chiaramente (foto nella colonna, niente linee verticali) torna 0
       e resta il conto dell'AI. Se l'AI e' d'accordo con la pagina vince l'AI (anche quando a una
       riga manca il Totale stampato). */
    const textRows = (b, nAi) => {
      const a0 = b[0], b0 = b[1], h = b0 - a0;
      if(h < H*0.06) return 0;
      const e = lineExtent(a0) || lineExtent(b0);
      if(!e || (e[1]-e[0]) < W*0.4) return 0;
      const KT = Math.max(4, Math.round(4*R));
      const y0 = Math.ceil(a0 + KT), y1 = Math.floor(b0 - KT);
      if(y1 - y0 < H*0.04) return 0;
      /* linee verticali nella parte sinistra della tabella, misurate dentro questa zona */
      const L = e[0], xs = [];
      for(let x = Math.max(0, L-3); x <= Math.min(W-2, L + Math.round((e[1]-e[0])*0.4)); x++){
        let n = 0, c = 0;
        for(let y = y0; y < y1; y += 2){ c++; const o = y*W + x; if(darkV[o] || (x > 0 && darkV[o-1]) || darkV[o+1]) n++; }
        if(c && n/c >= 0.92) xs.push(x);
      }
      const vl = []; xs.forEach(x => { if(vl.length && x - vl[vl.length-1][1] <= 2) vl[vl.length-1][1] = x; else vl.push([x, x]); });
      if(vl.length < 2 || vl[0][0] > L + W*0.02) return 0;
      const nx = vl.find(v => v[0] - vl[0][1] >= W*0.03);
      if(!nx) return 0;
      const c0 = vl[0][1] + 3, c1 = nx[0] - 3;
      if(c1 - c0 < W*0.02) return 0;
      /* i testi della colonna: fasce orizzontali con inchiostro */
      const gapMax = Math.max(2, Math.round(H*0.002)), blobs = [];
      let s = -1, last = -1;
      for(let y = y0; y <= y1; y++){
        let on = false;
        if(y < y1){ const o = y*W; for(let x = c0; x <= c1; x++){ if(dark[o+x]){ on = true; break; } } }
        if(on){ if(s < 0) s = y; last = y; }
        else if(s >= 0 && (y === y1 || y - last > gapMax)){ blobs.push([s, last]); s = -1; }
      }
      if(blobs.some(q => q[1]-q[0] > H*0.05)) return 0;   /* foto o disegno nella colonna: non e' una colonna di numeri */
      const cs = blobs.filter(q => q[1]-q[0] >= Math.max(3, H*0.003)).map(q => (q[0]+q[1])/2);
      if(cs.length < 2) return 0;
      /* in quante delle n parti c'e' un testo nello stesso punto */
      const match = n => {
        const P = h/n, rel = Array.from({length:n}, () => []);
        cs.forEach(c => { const u = (c - a0)/P, j = Math.min(n-1, Math.max(0, Math.floor(u))); rel[j].push(u - j); });
        const near = (v, r0) => { const d = Math.abs(v - r0); return Math.min(d, 1 - d) <= 0.08; };
        let best = 0;
        rel.forEach(r => r.forEach(r0 => { let m = 0; rel.forEach(q => { if(q.some(v => near(v, r0))) m++; }); if(m > best) best = m; }));
        return best;
      };
      if(nAi >= 2 && nAi <= 12){
        const mA = match(nAi);
        if(mA === nAi || (nAi >= 3 && mA === nAi - 1)) return nAi;
      }
      for(let n = Math.min(12, cs.length); n >= 2; n--) if(match(n) === n) return n;
      return 0;
    };
    /* altezza di UNA riga misurata su fasce pulite con un solo riferimento, se ce ne sono */
    const singles = photo ? [] : bands.filter(b => inB(b).length === 1 && Math.abs((b[1]-b[0]) - h0) <= h0*0.12).map(b => b[1]-b[0]);
    bands.forEach(b=>{
      const h=b[1]-b[0];
      const kr = Math.round(h/h0);
      const clean = kr>=1 && Math.abs(h-kr*h0) <= h0*(kr===1 ? 0.12 : 0.25);
      let k = clean ? kr : 0;
      /* ZONE SENZA LINEE (Schio, 4 nov 2026): l'AI vede n riferimenti in una fascia che per
         altezza sarebbe UNA riga (celle unite senza separatrici, foto aerea fra due righe).
         Come nello scanner delle foto, il numero di righe lo decide l'AI. Solo pagine non-foto. */
      /* senza righe singole sulla pagina l'altezza di riga e' una stima: le righe di una zona
         con piu' riferimenti si contano sulla pagina, se la pagina risponde */
      if(!photo && hintY.length && !singles.length && (k >= 1 || h >= h0*1.5)){
        const n = inB(b).length;
        if(n >= 2){ const nt = textRows(b, n); if(nt >= 2){ for(let j=0;j<nt;j++) keep.push([b[0]+h*j/nt, b[0]+h*(j+1)/nt]); return; } }
      }
      if(!photo && hintY.length && k === 1 && !singles.length){
        /* la fascia e' l'unica misura della pagina (nessuna riga singola con cui confrontarla):
           se l'AI ci vede piu' riferimenti ben distribuiti, sono righe unite senza linee */
        const hy = inB(b), n = hy.length;
        if(n >= 2 && n <= 12 && (hy[n-1] - hy[0]) >= h*0.3){ splitZone(b, hy).forEach(q => keep.push(q)); return; }
      }
      if(!k && hintY.length){ const n=cntIn(b); if(n>=2 && h >= h0*1.5){ const nt = photo ? 0 : textRows(b, n); k = nt >= 2 ? nt : n; } }   /* altezza sporca: conta la pagina, se no l'AI */
      if(k===1) keep.push(b);
      else if(k>=2 && k<=12){ for(let j=0;j<k;j++) keep.push([b[0]+h*j/k, b[0]+h*(j+1)/k]); }
    });
    /* RIFERIMENTI SENZA RIGA (Ticino p.92, 5 nov 2026): l'AI vede riferimenti in una zona che
       nessuna fascia contiene, perche' non e' chiusa da due linee (righe unite che finiscono
       contro una foto aerea, riga con altezza "sporca"). La zona va dalla linea sopra al primo
       confine sotto, linea o bordo della foto, e si divide come le zone unite. */
    if(!photo && hintY.length){
      const orphans = hintY.filter(y => !keep.some(b => y >= b[0] && y < b[1]));
      if(orphans.length){
        const tolL = Math.max(3, H*0.004);   /* un bordo attaccato a una linea e' quella linea */
        const bounds = Array.from(new Set(hAll.concat(edgesIn(-H, 2*H).filter(e => !hAll.some(v => Math.abs(v - e) <= tolL))))).sort((p,q)=>p-q);
        for(let i=0; i<orphans.length; ){
          const y = orphans[i];
          const above = bounds.filter(v => v <= y), below = bounds.filter(v => v > y);
          if(!above.length || !below.length){ i++; continue; }
          const top = above[above.length-1], bot = below[0];
          const grp = orphans.filter(v => v >= top && v < bot);
          i += Math.max(1, grp.length);
          if((bot - top) >= H*0.03*grp.length && !keep.some(b => b[0] < bot && b[1] > top)){
            /* con l'altezza di riga misurata sulle linee (ci sono righe singole) la zona ha tante
               righe quante ne entrano: due posizioni dell'AI a cavallo fra due righe non la
               dividono a meta' (Galles p.126 e p.176 con le posizioni spostate di mezza riga) */
            const zh = bot - top, nh = Math.round(zh / h0);
            if(singles.length && nh >= 1 && nh <= 12 && Math.abs(zh - nh*h0) <= h0*0.25){
              for(let j=0;j<nh;j++) keep.push([top+zh*j/nh, top+zh*(j+1)/nh]);
            } else {
              const nt = grp.length >= 2 ? textRows([top, bot], grp.length) : 0;
              if(nt >= 2){ for(let j=0;j<nt;j++) keep.push([top+zh*j/nt, top+zh*(j+1)/nt]); }
              else splitZone([top, bot], grp).forEach(q => keep.push(q));
            }
          }
        }
      }
    }
    if(!keep.length) return null;
    keep.sort((p,q)=>p[0]-q[0]);
    const yTop=keep[0][0], yBot=keep[keep.length-1][1];

    /* --- 3) bordi della tabella = lunghezza delle linee di separazione fra le righe (lineExtent).
       E' la misura piu' diretta: i bordi dello screenshot non c'entrano. */
    const st=[], en=[];
    /* con le posizioni dell'AI, i bordi si misurano sulle righe che contengono un riferimento:
       le fasce dell'intestazione (box C.O./T.C.) sono piu' strette della tabella */
    const backed = (!photo && hintY.length) ? keep.filter(b => hintY.some(y => y >= b[0] && y < b[1])) : [];
    /* solo sui confini che sono LINEE vere: il bordo di una foto non dice dove finisce la tabella */
    const realLine = y => hAll.some(v => Math.abs(v - y) <= Math.max(3, H*0.004));
    /* LINEE CON UN BUCO (Casciana Terme, 16 nov 2026): fra DIREZIONE e INFORMAZIONI c'e' la
       colonnina "A/T" e li' la linea della riga non e' stampata. Il tratto piu' lungo finiva a
       DIREZIONE e la striscia perdeva tutta la colonna INFORMAZIONI. Come sulle foto
       (PhotoTable.extendCurves), un buco fino al 3% della pagina non interrompe la linea: la
       tabella arriva fino al bordo vero, poi si toglie la colonna KM REGR. come sempre. */
    const lineExtentJ=(y)=>{
      const yy=Math.round(y), gapMax=Math.round(W*0.03); let best=null, st=-1, last=-1;
      for(let x=0;x<=W;x++){
        let on=false;
        if(x<W){ for(let k=-1;k<=1;k++){ const yk=yy+k; if(yk>=0 && yk<H && darkH[yk*W+x]){ on=true; break; } } }
        if(on){ if(st<0) st=x; last=x; }
        else if(st>=0 && (x-last>gapMax || x===W)){ if(!best || (last-st)>(best[1]-best[0])) best=[st, last]; st=-1; }
      }
      return best;
    };
    (backed.length ? backed : keep).forEach(b=>{ [b[0], b[1]].forEach(y=>{ if(!realLine(y)) return; const e=lineExtentJ(y); if(e && (e[1]-e[0])>W*0.4){ st.push(e[0]); en.push(e[1]); } }); });
    if(!st.length) return null;
    const pick=(arr)=>{ const t=arr.slice().sort((p,q)=>p-q); return t[Math.floor(t.length/2)]; };
    const tabL=pick(st), tabR=pick(en);

    /* --- 4) scarto le bande che non sono righe della tabella:
       una riga vera ha il bordo verticale sinistro nero per quasi tutta la sua altezza --- */
    const KX = Math.max(2, Math.round(2*R));
    const colDark=(x, y0, y1)=>{ let n=0,c=0; for(let y=Math.round(y0)+KX;y<Math.round(y1)-KX;y++){ let on=0; for(let k=-KX;k<=KX;k++){ const xx=Math.round(x)+k; if(xx>=0&&xx<W&&darkV[y*W+xx]){ on=1; break; } } n+=on; c++; } return c? n/c : 0; };
    const rows2=keep.filter(b => colDark(tabL, b[0], b[1])>0.7 && colDark(tabR, b[0], b[1])>0.7);
    const finalRows = rows2.length ? rows2 : keep;

    /* --- 5) colonne dentro la tabella: tolgo l'ultima stretta (distanza regressiva) --- */
    const yA=finalRows[0][0], yB=finalRows[finalRows.length-1][1];
    const colc=new Float32Array(W); const hSpan=Math.max(1, Math.round(yB-yA));
    for(let x=0;x<W;x++){ let n=0; for(let y=Math.round(yA);y<Math.round(yB);y++) n+=darkV[y*W+x]; colc[x]=n/hSpan; }
    const vc=runs(x=>colc[x]>0.82 && x>=tabL-2 && x<=tabR+2, W, W*0.015);
    let x0=tabL, x1=tabR;
    if(vc.length>=3){
      const tw=tabR-tabL, lw=(tabR-vc[vc.length-2])/tw;
      if(lw>=0.05 && lw<=0.22) x1=vc[vc.length-2];
    }
    return { W, H, bands: finalRows, x0, x1 };
  }catch(e){ return null; }
}

/* legge UNA pagina e restituisce i riferimenti trovati (o lancia un errore) */

/* ============ PREPARAZIONE DELLE FOTO (16 set 2026) ============
   Le foto del road book cartaceo fatte in abitacolo sono scure/bluastre e
   leggermente ruotate: lo scanner, tarato sulle scansioni, le vedeva come
   mezza pagina nera e non trovava le linee (strisce nere, ritagli sfasati).
   1) contrasto: carta -> bianco, inchiostro -> nero
   2) raddrizzamento: misuro l'inclinazione delle linee e ruoto
   Sulle pagine da PDF e' quasi un'identita'. La prospettiva forte (pagina piu'
   larga in basso) NON si corregge qui: in quel caso lo scanner non trova le
   righe e si ritaglia con le posizioni dell'AI (vedi scanOnePage).
   ================================================================ */
/* porta la carta al bianco e l'inchiostro al nero: le foto in abitacolo sono scure e
   bluastre, e la soglia fissa dello scanner (fatta per le scansioni) le legge come
   mezza pagina nera. Percentili: 3% -> 0, 80% -> 255 (l'80% dei pixel e' carta). */
function normalizeContrast(img){
  const W = img.naturalWidth || img.width, H = img.naturalHeight || img.height;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0, W, H);
  const id = g.getImageData(0, 0, W, H), d = id.data;
  const hist = new Uint32Array(256);
  for(let i = 0; i < d.length; i += 4){ hist[(d[i]*299 + d[i+1]*587 + d[i+2]*114) / 1000 | 0]++; }
  const total = W * H; let acc = 0, lo = 0, hi = 255;
  for(let v = 0; v < 256; v++){ acc += hist[v]; if(acc >= total*0.03){ lo = v; break; } }
  acc = 0; for(let v = 0; v < 256; v++){ acc += hist[v]; if(acc >= total*0.80){ hi = v; break; } }
  if(hi - lo < 40) return c;                       /* immagine gia' piatta/contrastata: nulla da fare */
  const k = 255 / (hi - lo);
  const lut = new Uint8ClampedArray(256);
  for(let v = 0; v < 256; v++) lut[v] = Math.max(0, Math.min(255, (v - lo) * k));
  for(let i = 0; i < d.length; i += 4){ d[i] = lut[d[i]]; d[i+1] = lut[d[i+1]]; d[i+2] = lut[d[i+2]]; }
  g.putImageData(id, 0, 0);
  c.naturalWidth = W; c.naturalHeight = H;
  return c;
}

/* stima l'angolo di rotazione della griglia e restituisce un canvas raddrizzato */
function deskewCanvas(img){
  const W0 = img.naturalWidth || img.width, H0 = img.naturalHeight || img.height;
  const sw = 450, sh = Math.round(H0 * sw / W0);
  const sc = document.createElement('canvas'); sc.width = sw; sc.height = sh;
  const sg = sc.getContext('2d'); sg.drawImage(img, 0, 0, sw, sh);
  const d = sg.getImageData(0, 0, sw, sh).data;
  const lum = new Uint8Array(sw * sh);
  for(let i = 0, p = 0; i < d.length; i += 4, p++){ lum[p] = (d[i]*299 + d[i+1]*587 + d[i+2]*114) / 1000; }
  /* solo LINEE SOTTILI: scuro con chiaro 5 px sopra e sotto. Cosi' lo sfondo scuro
     intorno alla pagina (abitacolo, spirale) non pesa: e' scuro ovunque, non e' una linea */
  const dark = new Uint8Array(sw * sh);
  for(let y = 5; y < sh - 5; y++) for(let x = 0; x < sw; x++){
    const p = y * sw + x;
    if(lum[p] < 120 && lum[p - 5*sw] > 170 && lum[p + 5*sw] > 170) dark[p] = 1;
  }
  let best = 0, bestScore = -1;
  for(let deg = -8; deg <= 8; deg += 0.5){
    const t = Math.tan(deg * Math.PI / 180); let score = 0;
    for(let y = 0; y < sh; y++){
      let cnt = 0;
      for(let x = Math.round(sw*0.15); x < sw*0.85; x += 2){
        const yy = Math.round(y + (x - sw/2) * t);
        if(yy < 0 || yy >= sh) continue;
        if(dark[yy * sw + x]) cnt++;
      }
      score += cnt * cnt;   /* premia le righe dove il nero si allinea */
    }
    if(score > bestScore){ bestScore = score; best = deg; }
  }
  const c = document.createElement('canvas'); c.width = W0; c.height = H0;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, W0, H0);
  g.translate(W0/2, H0/2); g.rotate(-best * Math.PI / 180); g.translate(-W0/2, -H0/2);
  g.drawImage(img, 0, 0, W0, H0);
  c.naturalWidth = W0; c.naturalHeight = H0;
  return { canvas: c, angle: best };
}


/* L'immagine e' gia' pulita (pagina resa da PDF, screenshot di un PDF) oppure
   e' una foto vera? Si misura, non si indovina: nelle immagini pulite la carta
   e' bianco puro (picco a 255), nelle foto in abitacolo sta fra 159 e 189.
   Serve perche' le foto caricate a mano dalla galleria possono benissimo essere
   screenshot di un PDF, e quelle non vanno toccate. */
function looksLikePhoto(img){
  try{
    const W = 400, H = Math.max(1, Math.round((img.naturalHeight || img.height) * 400 / (img.naturalWidth || img.width)));
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0, W, H);
    const d = g.getImageData(0, 0, W, H).data;
    const hist = new Uint32Array(256);
    for(let i = 0; i < d.length; i += 4) hist[(d[i]*299 + d[i+1]*587 + d[i+2]*114) / 1000 | 0]++;
    let peak = 128, best = 0;
    for(let v = 100; v < 256; v++) if(hist[v] > best){ best = hist[v]; peak = v; }
    c.width = c.height = 0;
    return peak < 240;      /* carta non bianca = foto */
  }catch(e){ return true; }
}

function prepPhoto(img){
  try{
    const n = normalizeContrast(img);
    const r = deskewCanvas(n);
    return r.canvas;
  }catch(e){ return img; }
}

/* =====================================================================================
   STRISCE DA FOTO FATTA A MANO (13 ott 2026)
   Solo per le foto della fotocamera: le pagine da PDF restano su detectTable().
   Il foglio tenuto in mano e' curvo e inclinato: le separatrici derivano di 17-39 px da
   un lato all'altro, quindi "la riga nera su tutta la larghezza" non esiste. Qui ogni
   separatrice si insegue a fette e diventa una curva; con le curve dei due bordi si
   ritaglia a maglia e la striscia esce dritta, come una scansione.
   Verificato su 13 foto di tre road book (Sardegna, Campagnolo, Roma): 59 riferimenti, 0 errori.
   ===================================================================================== */
const PhotoTable = (function(){
  /* ============================================================
     RILEVAMENTO TABELLA SU FOTO FATTA A MANO
     Il foglio e' curvo: le separatrici NON sono righe orizzontali
     (misurato: derivano da 17 a 39 px da sinistra a destra).
     Quindi la pagina si divide in FETTE verticali strette: dentro
     una fetta la linea e' quasi orizzontale e si vede benissimo.
     Poi le fette si collegano fra loro e ogni separatrice diventa
     una curva y(x).
     ============================================================ */

  const NS = 14;            /* fette verticali */
  const MINS = 0.70;        /* una separatrice deve attraversare almeno il 70% delle fette */

  /* luminanza a larghezza fissa */
  function lumOf(img, W){
    const H = Math.max(1, Math.round((img.naturalHeight||img.height) * W / (img.naturalWidth||img.width)));
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d', { willReadFrequently:true }); g.drawImage(img, 0, 0, W, H);
    const d = g.getImageData(0, 0, W, H).data;
    const L = new Uint8Array(W*H);
    for(let i=0,p=0;i<d.length;i+=4,p++) L[p] = (d[i]*299 + d[i+1]*587 + d[i+2]*114)/1000;
    return { L, W, H };
  }

  /* maschera delle LINEE SOTTILI: scuro con chiaro sopra e sotto.
     Lo sfondo scuro (abitacolo, spirale, gamba, ombre) e' scuro ovunque:
     non ha il chiaro sopra e sotto, quindi non passa. */
  function thinLines(L, W, H, k, drop){
    k = k || 4; drop = drop || 18;
    const m = new Uint8Array(W*H);
    for(let y=k;y<H-k;y++) for(let x=0;x<W;x++){
      const p = y*W+x, v = L[p];
      if(v + drop < L[p-k*W] && v + drop < L[p+k*W]) m[p] = 1;
    }
    return m;
  }

  /* La pagina e' anche INCLINATA, non solo curva. Dentro una fetta larga 30 px
     un'inclinazione di 8 grandi sposta la linea di 4 px: il picco si spalma e
     sparisce. Si stima quindi la pendenza media e si legge il profilo inclinato. */
  function bestSlope(m, W, H, win){
    const X0 = win ? win[0] : 0, X1 = win ? win[1] : W-1, xc = (X0+X1)/2;
    let best = 0, bestS = -1;
    for(let s=-0.30; s<=0.3001; s+=0.01){
      const prof = new Float32Array(H);
      for(let x=X0;x<=X1;x+=2){
        const dy = Math.round(s*(x-xc));
        for(let y=Math.max(0,-dy); y<H-Math.max(0,dy); y++) if(m[(y+dy)*W+x]) prof[y]++;
      }
      let sc = 0; for(let y=0;y<H;y++) sc += prof[y]*prof[y];
      if(sc > bestS){ bestS = sc; best = s; }
    }
    return best;
  }

  /* picchi di una fetta: dove la fetta e' quasi tutta nera su una riga */
  function peaksOf(m, W, H, x0, x1, thr, slope, xc){
    const n = Math.floor((x1-x0)/1)+1, prof = new Float32Array(H);
    const s = slope || 0, c0 = (xc === undefined) ? (x0+x1)/2 : xc;
    for(let x=x0;x<=x1;x++){
      const dy = Math.round(s*(x-c0));
      for(let y=Math.max(0,-dy); y<H-Math.max(0,dy); y++) if(m[(y+dy)*W+x]) prof[y]++;
    }
    for(let y=0;y<H;y++) prof[y] /= n;
    const out = [];
    let y = 1;
    while(y < H-1){
      if(prof[y] >= thr){
        let e = y; while(e+1 < H && prof[e+1] >= thr) e++;
        let bi = y, bv = prof[y];
        for(let k=y;k<=e;k++) if(prof[k] > bv){ bv = prof[k]; bi = k; }
        out.push({ y: (y+e)/2, v: bv });
        y = e+1;
      } else y++;
    }
    return out;
  }

  /* collega i picchi fra fette vicine: ogni catena e' una separatrice.
     win = [x0,x1] della tabella; minRun = quante fette consecutive servono */
  function chains(m, W, H, thr, win, minRun){
    const X0 = win ? win[0] : 0, X1 = win ? win[1] : W-1, WW = X1-X0+1;
    const xc = (X0+X1)/2;
    const slope = bestSlope(m, W, H, [X0, X1]);
    const cut = [];
    for(let s=0;s<NS;s++) cut.push([X0+Math.round(WW*s/NS), X0+Math.round(WW*(s+1)/NS)-1]);
    /* tutte le fette misurano la quota della linea nello STESSO punto (il centro
       della tabella): cosi' una linea dritta ma inclinata da lo stesso valore in
       tutte le fette, e collegarle diventa facile. */
    const pk = cut.map(c=>peaksOf(m, W, H, c[0], c[1], thr, slope, xc));
    const used = pk.map(p=>new Uint8Array(p.length));
    const tol = Math.max(6, H*0.012);
    const out = [];
    for(let s0=0;s0<NS;s0++){
      for(let i=0;i<pk[s0].length;i++){
        if(used[s0][i]) continue;
        const ys = new Array(NS).fill(null);
        ys[s0] = pk[s0][i].y; used[s0][i] = 1;
        const vs0 = [pk[s0][i].v];
        /* una fetta puo' non vedere la linea (ci passa sopra un disegno, un
           cartello, l'ombra): si saltano fino a due fette prima di mollare */
        const walk = (dir)=>{
          let cy = ys[s0], miss = 0;
          for(let s=s0+dir; s>=0 && s<NS; s+=dir){
            let bj=-1, bd=tol+1;
            for(let j=0;j<pk[s].length;j++){
              if(used[s][j]) continue;
              const d = Math.abs(pk[s][j].y - cy);
              if(d < bd){ bd = d; bj = j; }
            }
            if(bj < 0){ miss++; if(miss > 2) break; continue; }
            miss = 0;
            ys[s] = pk[s][bj].y; used[s][bj] = 1; cy = ys[s]; vs0.push(pk[s][bj].v);
          }
        };
        walk(1); walk(-1);
        /* la catena vale se va da una parte all'altra con pochi buchi */
        let f = -1, l = -1, got = 0;
        for(let s=0;s<NS;s++) if(ys[s]!==null){ if(f<0) f = s; l = s; got++; }
        const span = (f<0) ? 0 : l-f+1;
        const str = vs0.reduce((a,b)=>a+b,0)/vs0.length;
        if(span >= (minRun || Math.round(NS*MINS)) && got >= span*0.6) out.push({ ys, s0: f, s1: l, str, got });
      }
    }
    /* y(x) per interpolazione fra i centri delle fette */
    const curves = out.map(o=>{
      const ys = o.ys, xs = [], vs = [];
      for(let s=o.s0;s<=o.s1;s++) if(ys[s]!==null){
        const cx = (cut[s][0]+cut[s][1])/2;
        xs.push(cx); vs.push(ys[s] + slope*(cx - xc));   /* dalla quota al centro alla quota vera */
      }
      const y = new Float32Array(W);
      for(let x=0;x<W;x++){
        if(x <= xs[0]) y[x] = vs[0] + slope*(x - xs[0]);
        else if(x >= xs[xs.length-1]) y[x] = vs[vs.length-1] + slope*(x - xs[xs.length-1]);
        else { let k=0; while(xs[k+1] < x) k++;
          const f = (x-xs[k])/(xs[k+1]-xs[k]); y[x] = vs[k] + (vs[k+1]-vs[k])*f; }
      }
      return { y, s0: o.s0, s1: o.s1, str: o.str, got: o.got, x0: cut[o.s0][0], x1: cut[o.s1][1], mid: y[Math.round((X0+X1)/2)] };
    });
    curves.sort((a,b)=>a.mid-b.mid);
    return mergeClose(curves, H*0.008, W);
  }

  /* Fonde le separatrici vicine in una sola, a meta' strada.
     Serve per le linee spesse e, soprattutto, per i road book dove fra una
     cella e l'altra c'e' uno stacco bianco: li' di linee ce ne sono due,
     il confine vero sta in mezzo. */
  function mergeClose(curves, tol, W){
    const out = [];
    let grp = [];
    const flush = ()=>{
      if(!grp.length) return;
      if(grp.length === 1){ out.push(grp[0]); grp = []; return; }
      const y = new Float32Array(W);
      for(let x=0;x<W;x++){ let s=0; for(const c of grp) s += c.y[x]; y[x] = s/grp.length; }
      let x0 = Infinity, x1 = -Infinity;
      for(const c of grp){ x0 = Math.min(x0, c.x0); x1 = Math.max(x1, c.x1); }
      out.push({ y, x0, x1, mid: (grp[0].mid + grp[grp.length-1].mid)/2 });
      grp = [];
    };
    for(const c of curves){
      if(grp.length && c.mid - grp[grp.length-1].mid >= tol) flush();
      grp.push(c);
    }
    flush();
    return out;
  }

  /* bande fra separatrici, poi solo le righe dei riferimenti:
     hanno tutte la stessa altezza. Una banda alta il doppio o il triplo
     e' una cella unita (separatore non stampato): si divide in parti uguali. */
  function dataRows(curves, W, H, want){
    const bands = [];
    for(let i=0;i<curves.length-1;i++) bands.push({ top: curves[i], bot: curves[i+1], h: curves[i+1].mid - curves[i].mid });
    const hs = bands.map(b=>b.h).filter(h=>h > H*0.025);
    if(!hs.length) return { rows: [], modeH: 0, bands };
    /* altezza della riga dati: quella che spiega piu' tabella, contando anche
       le bande alte il doppio o il triplo (celle unite, separatore non stampato).
       Senza questo, una banda alta da sola batte due righe normali. */
    const cand = [];
    for(const h of hs){ for(let d=1; d<=5; d++) if(h/d > H*0.025) cand.push(h/d); }
    const fit = h=>{
      let cov = 0;
      for(const k of hs){ const n = Math.round(k/h);
        if(n >= 1 && n <= 5 && Math.abs(k - n*h) <= h*0.25) cov += n*h; }
      return cov;
    };
    const build = h=>{
      /* quali bande sono righe dati (altezza = 1, 2, ... 5 volte h) */
      const n = bands.map(b=>{
        const k = Math.round(b.h/h);
        return (k >= 1 && k <= 5 && Math.abs(b.h - k*h) <= h*0.25) ? k : 0;
      });
      /* solo il tratto CONTINUO piu' lungo: intestazione, fascia del rally e
         piede pagina stanno fuori dalla tabella, non in mezzo alle righe */
      let bs=-1, be=-2, cs=-1;
      for(let i=0;i<=n.length;i++){
        if(i < n.length && n[i]){ if(cs < 0) cs = i; }
        else if(cs >= 0){ if(i-1-cs > be-bs){ bs = cs; be = i-1; } cs = -1; }
      }
      const out = [];
      let sc = 0;
      for(let i=bs;i<=be;i++){
        const b = bands[i];
        for(let k=0;k<n[i];k++) out.push({ top: b.top, bot: b.bot, f0: k/n[i], f1: (k+1)/n[i] });
        /* punteggio: quanta tabella spiega, pesata da quanto bene combacia
           (una banda che entra col 25% di scarto non conta quasi niente) */
        const rel = Math.abs(b.h - n[i]*h)/(n[i]*h);
        /* una banda divisa in k pezzi vale meno: dividere va fatto solo se
           serve (cella unita), non per far tornare i conti con un'altezza piccola */
        sc += b.h * Math.max(0, 1 - 4*rel) / Math.sqrt(n[i]);
      }
      out.sc = sc;
      return out;
    };
    /* Quando un separatore non e' stampato (celle unite) le linee da sole non
       possono dire se la banda alta vale 3 righe o 4. Quel numero lo sa il
       modello, che ha letto i riferimenti: se ce lo passa, si sceglie l'altezza
       che fa tornare il conto. Le linee restano le padrone del DOVE tagliare. */
    if(want > 0){
      /* fra le altezze che danno il numero giusto di righe vince quella che
         spiega piu' tabella combaciando bene. Non la piu' grande (Roma p.19,
         13 ott 2026: un'altezza troppo grande si mangiava l'intestazione come
         mezza riga) e nemmeno quella con lo scarto minimo (dividere una sola
         banda in 5 combacia benissimo, ma lascia fuori mezza tabella). */
      /* valgono anche le altezze che danno PIU' righe del conteggio: le righe vuote
         stanno in fondo e si tolgono (Roma p.17: 4 riferimenti, 5 caselle). Senza,
         l'unico modo di fare 4 righe era prendere l'intestazione. */
      let pick = 0, ps = -1, pex = false;
      for(const h of cand){
        const r = build(h);
        if(r.length < want) continue;
        const ex = r.length === want;
        const better = r.sc > ps*1.02 || (r.sc >= ps*0.98 && ((ex && !pex) || (ex === pex && h > pick)));
        if(better){ ps = Math.max(ps, r.sc); pick = h; pex = ex; }
      }
      if(pick){ let r = build(pick); const sc = r.sc; r = r.slice(0, want); r.sc = sc; return { rows: r, modeH: pick, bands, score: sc }; }
    }
    /* senza conteggio: vince l'altezza che spiega piu' tabella combaciando bene.
       A pari merito (entro il 2%) la PIU' GRANDE: dividere una riga in pezzi va
       fatto solo se serve. Prima vinceva la piu' piccola, e ogni riga poteva
       finire tagliata in 4 (Roma p.17: 20 strisce invece di 4). */
    let modeH = 0, best = -1;
    for(const h of cand){ const c = build(h).sc;
      if(c > best*1.02 || (c >= best*0.98 && h > modeH)){ if(c > best) best = c; modeH = h; } }
    let rr = build(modeH);
    /* il modello ha letto MENO riferimenti delle righe trovate: le righe vuote
       stanno sempre in fondo (fine settore, l'ultima casella resta bianca),
       un road book non lascia mai un buco in mezzo. Si tengono le prime. */
    if(want > 0 && rr.length > want){ const sc = rr.sc; rr = rr.slice(0, want); rr.sc = sc; }
    return { rows: rr, modeH, bands, score: rr.sc };
  }

  /* Primo giro: catene anche corte, per capire DOVE sta la tabella.
     La tabella e' la fascia di x coperta dal maggior numero di separatrici. */
  function findWindow(m, W, H, thr){
    const c = chains(m, W, H, thr, null, 5);
    if(c.length < 3) return null;
    const cov = new Int32Array(W);
    for(const t of c) for(let x=t.x0;x<=t.x1;x++) cov[x]++;
    let mx = 0; for(let x=0;x<W;x++) if(cov[x] > mx) mx = cov[x];
    const lim = Math.max(2, Math.round(mx*0.45));
    let x0 = -1, x1 = -1;
    for(let x=0;x<W;x++) if(cov[x] >= lim){ if(x0 < 0) x0 = x; x1 = x; }
    return (x1-x0 > W*0.25) ? [x0, x1] : null;
  }

  /* I bordi della tabella sono la LUNGHEZZA delle separatrici, non le linee
     verticali (il bordo del foglio e la spirale verrebbero scambiati per colonne).
     Ogni curva si prolunga a destra e a sinistra finche' c'e' inchiostro. */
  function extendCurves(curves, m, W, H, win){
    /* Per ogni colonna x: quante separatrici hanno davvero inchiostro li'?
       Dentro la tabella ce l'hanno quasi tutte; sulla spirale e sulla pagina
       a fianco nessuna. Non si insegue una linea sola, che puo' fermarsi su un
       disegno o sulla barra nera: si contano tutte insieme. */
    const hit = new Int32Array(W);
    for(const c of curves){
      for(let x=0;x<W;x++){
        const cy = Math.round(c.y[x]);
        for(let r=0;r<=2;r++){
          if((cy-r >= 0 && m[(cy-r)*W+x]) || (cy+r < H && m[(cy+r)*W+x])){ hit[x]++; break; }
        }
      }
    }
    /* lisciatura su 9 px: un pixel mancante non deve contare */
    const sm = new Float32Array(W);
    for(let x=0;x<W;x++){
      let s=0, n=0;
      for(let k=-4;k<=4;k++){ const xx=x+k; if(xx>=0&&xx<W){ s+=hit[xx]; n++; } }
      sm[x] = s/n;
    }
    let mx = 0; for(let x=0;x<W;x++) if(sm[x] > mx) mx = sm[x];
    const lim = mx*0.45, gapMax = Math.round(W*0.03);
    const xc = Math.round((win[0]+win[1])/2);
    const walk = dir=>{
      let x = xc, last = xc, gap = 0;
      while(x+dir >= 0 && x+dir < W){
        x += dir;
        if(sm[x] >= lim){ last = x; gap = 0; }
        else { gap++; if(gap > gapMax) break; }
      }
      return last;
    };
    return [ walk(-1), walk(1) ];
  }

  /* la stessa macchina girata di 90 gradi: serve per le linee VERTICALI */
  function transpose(L, W, H){
    const T = new Uint8Array(W*H);
    for(let y=0;y<H;y++) for(let x=0;x<W;x++) T[x*H+y] = L[y*W+x];
    return { L: T, W: H, H: W };
  }

  /* Le colonne della tabella. Servono a due cose:
     - confermare che quella e' davvero una tabella (una pagina di sola mappa
       non ha colonne, e senza questo controllo verrebbe tagliata a fette)
     - dare i bordi sinistro e destro esatti */
  function columns(L, W, H, yTop, yBot){
    const t = transpose(L, W, H);
    const m = thinLines(t.L, t.W, t.H, 4, 18);
    /* limita alla fascia delle righe dati */
    const y0 = Math.max(0, Math.round(yTop)), y1 = Math.min(t.H-1, Math.round(yBot));
    const cv = chains(m, t.W, t.H, 0.45, [y0, y1]);
    return cv.map(c=>({ x: c.mid, y: c.y }));
  }



  /* Alcuni road book non stampano la riga di separazione nella colonna delle
     INFORMAZIONI (celle unite): li' la separatrice esiste solo nella meta'
     sinistra. Quindi si cercano le righe DUE volte — su tutta la tabella e solo
     sulla parte sinistra, dove la griglia e' sempre completa — e si tiene il
     risultato che spiega piu' tabella. */
  function attempt(cv, W, H, want){
    if(cv.length < 3) return null;
    const dr = dataRows(cv, W, H, want);
    const out = [{ cv, dr }];
    /* secondo giro: con l'altezza della riga in mano si rifondono le separatrici
       doppie (lo stacco bianco fra una cella e l'altra conta come due linee) */
    if(dr.modeH > 0){
      const cv2 = mergeClose(cv, Math.min(H*0.04, dr.modeH*0.30), W);
      if(cv2.length !== cv.length) out.push({ cv: cv2, dr: dataRows(cv2, W, H, want) });
    }
    const good = out.filter(o=>o.dr.rows.length);
    if(!good.length) return null;
    const ok = o=> (want > 0 && o.dr.rows.length === want) ? 1 : 0;
    good.sort((p,q)=> (ok(q)-ok(p)) || (q.dr.rows.length - p.dr.rows.length) || ((q.dr.score||0) - (p.dr.score||0)));
    return good[0];
  }

  function rowsOf(m, W, H, thr, win, want){
    const a = chains(m, W, H, thr, win);
    const half = [win[0], Math.round(win[0] + (win[1]-win[0])*0.55)];
    const b = chains(m, W, H, thr, half);
    const un = mergeClose(a.concat(b).sort((p,q)=>p.mid-q.mid), H*0.012, W);
    const cands = [attempt(a, W, H, want), attempt(un, W, H, want), attempt(b, W, H, want)]
      .map((c,i)=> c ? (c.ord = i, c) : null).filter(Boolean);
    if(!cands.length) return null;
    /* vince chi fa tornare il numero di riferimenti; a parita', chi copre
       piu' tabella. L'ordine iniziale (intera, unione, sinistra) decide i pari. */
    const ok = c=> (want > 0 && c.dr.rows.length === want) ? 1 : 0;
    cands.sort((p,q)=> (ok(q)-ok(p))
                    || (q.dr.rows.length - p.dr.rows.length)
                    || ((q.dr.score||0) - (p.dr.score||0) > 1 ? 1 : (p.dr.score||0) - (q.dr.score||0) > 1 ? -1 : 0)
                    || (p.ord - q.ord));   /* a parita' vince la tabella intera */
    return cands[0];
  }

  /* ============================================================
     detectTablePhoto — rilevamento tabella su FOTO FATTA A MANO
     Il foglio e' curvo: misurato, ogni separatrice deriva da 17 a 39 px
     da sinistra a destra. Cercare "la riga nera su tutta la larghezza"
     (quello che funziona sui PDF) qui non trova niente.
     Qui la pagina si divide in fette verticali strette: dentro una fetta
     la linea e' quasi orizzontale. Poi le fette si collegano e ogni
     separatrice diventa una curva y(x).
     Le stesse curve, piu' quelle dei due bordi verticali, servono a
     RADDRIZZARE la striscia quando la si ritaglia.
     ============================================================ */

  function detectTablePhoto(img, want){
    const W = 900;
    const { L, H } = lumOf(img, W);
    const m = thinLines(L, W, H);

    const win = findWindow(m, W, H, 0.45);
    if(!win) return null;

    const r = rowsOf(m, W, H, 0.45, win, want);
    if(!r) return null;
    const curves = r.cv, dr = r.dr;
    if(!dr.rows.length) return null;

    /* fin dove arrivano davvero le separatrici: e' quella la larghezza della
       tabella. Le linee verticali da sole ingannano, perche' la pagina a fianco
       e la spirale ne hanno anche loro. */
    /* sulle separatrici GREZZE, non su quelle fuse: una curva fusa e' la media di
       due linee e non sta piu' sull'inchiostro, quindi farebbe sembrare la tabella
       piu' stretta (Roma p.19: spariva la colonna Information) */
    const raw = chains(m, W, H, 0.45, win);
    const ext = extendCurves(raw.length >= 3 ? raw : curves, m, W, H, win);

    /* colonne: confermano che e' una tabella e danno i bordi esatti.
       Si tiene la CURVA, non solo la posizione: anche i bordi verticali
       sono storti, e serviranno per raddrizzare. */
    const all = columns(L, W, H, curves[0].mid, curves[curves.length-1].mid);
    const pad = W*0.025;
    const cols = all.filter(c=> c.x > ext[0]-pad && c.x < ext[1]+pad).sort((a,b)=>a.x-b.x);
    /* una pagina di sola mappa non ha colonne: senza questo controllo
       verrebbe tagliata a fette come se fosse una tabella */
    if(cols.length < 4) return null;

    let cL = cols[0], cR = cols[cols.length-1];
    /* via l'ultima colonna stretta (distanza dal C.O.), come sul percorso PDF */
    const lastW = cR.x - cols[cols.length-2].x;
    if(cols.length >= 5 && lastW < (cR.x-cL.x)*0.18) cR = cols[cols.length-2];
    const bleed = (cR.x-cL.x)*0.015;

    return {
      W, H, scale: W/(img.naturalWidth||img.width),
      x0: cL.x-bleed, x1: cR.x+bleed, left: cL.y, right: cR.y, bleed,
      rows: dr.rows, rowH: dr.modeH, cols: cols.map(c=>c.x), curves
    };
  }

  /* ------------------------------------------------------------
     LUCE: non si prova a inseguire l'ombra (un bordo netto non si toglie
     senza lasciare aloni). Si fa la cosa semplice e sicura: si misurano il
     nero e il bianco della PAGINA INTERA e si allarga la scala fra quei due.
     La carta va al bianco, l'inchiostro al nero, e tutte le strisce della
     stessa pagina restano dello stesso tono.
     ------------------------------------------------------------ */
  function lightField(src){
    const sW = src.width, sH = src.height, d = src.data;
    const h = new Uint32Array(256);
    for(let y=0;y<sH;y+=3) for(let x=0;x<sW;x+=3){
      const i = (y*sW+x)*4;
      h[(d[i]*299 + d[i+1]*587 + d[i+2]*114)/1000 | 0]++;
    }
    let tot = 0; for(let v=0;v<256;v++) tot += h[v];
    let acc = 0, lo = 0, hi = 255;
    for(let v=0;v<256;v++){ acc += h[v]; if(acc >= tot*0.02){ lo = v; break; } }
    acc = 0; for(let v=0;v<256;v++){ acc += h[v]; if(acc >= tot*0.88){ hi = v; break; } }
    if(hi - lo < 40) return null;
    const lut = new Uint8Array(256);
    for(let v=0;v<256;v++) lut[v] = Math.max(0, Math.min(255, Math.round((v-lo)*255/(hi-lo))));
    return { lut };
  }

  /* ------------------------------------------------------------
     TAGLIO A MAGLIA
     Ogni punto della striscia si trova incrociando due famiglie di curve:
     le due separatrici (sopra e sotto) e i due bordi verticali (sinistro e
     destro). Si parte da una stima e si itera tre volte: converge subito.
     Cosi' la striscia esce con le righe orizzontali E le colonne verticali,
     come se fosse una scansione, non una foto scattata di sbieco.
     ------------------------------------------------------------ */
  function cutRow(src, t, row, OUTW, OUTH, lf){
    const out = new Uint8ClampedArray(OUTW*OUTH*4).fill(255);
    const sW = src.width, sH = src.height, sd = src.data, sc = t.scale;
    const H = t.H, W = t.W;
    const xL = y=> t.left[Math.max(0, Math.min(H-1, Math.round(y)))] - t.bleed;
    const xR = y=> t.right[Math.max(0, Math.min(H-1, Math.round(y)))] + t.bleed;
    const yTop = x=> row.top.y[Math.max(0, Math.min(W-1, Math.round(x)))];
    const yBot = x=> row.bot.y[Math.max(0, Math.min(W-1, Math.round(x)))];
    /* un filo in fondo: in certi road book il quadratino del numero sta a
       cavallo della linea e senza questo resta tagliato a meta' */
    const f0 = row.f0, f1 = row.f1 + (row.f1-row.f0)*0.03;

    /* campionamento bilineare: la striscia resta nitida */
    const sample = (fx, fy, di)=>{
      const x0 = Math.floor(fx), y0 = Math.floor(fy);
      const ax = fx-x0, ay = fy-y0;
      for(let c=0;c<3;c++){
        let v = 0;
        for(let j=0;j<2;j++) for(let i=0;i<2;i++){
          const xx = Math.max(0, Math.min(sW-1, x0+i)), yy = Math.max(0, Math.min(sH-1, y0+j));
          v += sd[(yy*sW+xx)*4+c] * (i?ax:1-ax) * (j?ay:1-ay);
        }
        const q = Math.max(0, Math.min(255, Math.round(v)));
        out[di+c] = lf ? lf.lut[q] : q;
      }
      out[di+3] = 255;
    };

    const yMid = (yTop((t.x0+t.x1)/2) + yBot((t.x0+t.x1)/2))/2;
    for(let oy=0; oy<OUTH; oy++){
      const v = f0 + (f1-f0)*oy/(OUTH-1);
      for(let ox=0; ox<OUTW; ox++){
        const u = ox/(OUTW-1);
        let gy = yMid, gx = 0;
        for(let k=0;k<3;k++){
          const a = xL(gy), b = xR(gy);
          gx = a + (b-a)*u;
          const yt = yTop(gx), yb = yBot(gx);
          gy = yt + (yb-yt)*v;
        }
        sample(gx/sc, gy/sc, (oy*OUTW+ox)*4);
      }
    }
    return out;
  }


  /* Dalla foto alle strisce pronte. want = quanti riferimenti ha letto l'AI su
     questa pagina. Restituisce null se il conto non torna: chi chiama allora
     ripiega sul metodo di prima, cosi' una foto difficile non va mai peggio. */
  function strips(img, want){
    const t = detectTablePhoto(img, want);
    if(!t || !want || t.rows.length !== want) return null;
    const W0 = img.naturalWidth || img.width, H0 = img.naturalHeight || img.height;
    const c = document.createElement('canvas'); c.width = W0; c.height = H0;
    const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0, W0, H0);
    const src = { width: W0, height: H0, data: g.getImageData(0, 0, W0, H0).data };
    c.width = c.height = 0;
    const lf = lightField(src);
    /* stessa larghezza delle strisce di sempre; l'altezza segue le proporzioni
       vere della riga, uguale per tutte le strisce della pagina */
    const OUTW = 520, OUTH = Math.max(40, Math.round(OUTW * t.rowH / Math.max(1, t.x1 - t.x0)));
    const oc = document.createElement('canvas'); oc.width = OUTW; oc.height = OUTH;
    const og = oc.getContext('2d');
    const out = [];
    for(const r of t.rows){
      const px = cutRow(src, t, r, OUTW, OUTH, lf);
      const id = og.createImageData(OUTW, OUTH); id.data.set(px); og.putImageData(id, 0, 0);
      out.push(oc.toDataURL('image/jpeg', 0.8));
    }
    oc.width = oc.height = 0;
    return out;
  }

  return { strips: strips, detect: detectTablePhoto };
})();

/* RIFERIMENTI E RIGHE ABBINATI PER POSIZIONE (Ticino, 5 nov 2026). Prima, con tante righe quanti
   riferimenti (o meno), i riferimenti andavano alle righe in ordine: se l'AI ne leggeva uno in piu'
   tutte le strisce dopo scivolavano di una riga (prova sul Ticino: 41 strisce giuste su 100).
   Qui ogni riferimento va alla riga dove l'AI lo vede, sempre in ordine; un riferimento puo' restare
   senza riga (costa mezza riga) e una riga senza riferimento (non costa niente). Chi resta senza
   riga prende una riga aggiunta sopra la prima o sotto l'ultima, oppure, in mezzo, la riga vicina.
   Torna { pick, free } (free = riferimenti rimasti senza una riga loro) oppure null. */
function matchPick(bands, cys){
  const M = cys.length, B = bands.length, INF = 1e18, ctr = r => (r[0]+r[1])/2;
  if(!B || !M) return null;
  const hs = bands.map(r => r[1]-r[0]).sort((p,q)=>p-q), pen = hs[Math.floor(hs.length/2)] * 0.5;
  const dp = [], mv = [];
  for(let k=0;k<=M;k++){ dp.push(new Array(B+1).fill(INF)); mv.push(new Array(B+1).fill(0)); }
  for(let j=0;j<=B;j++) dp[0][j] = 0;
  for(let k=1;k<=M;k++) for(let j=0;j<=B;j++){
    let v = dp[k-1][j] + pen, m = 1;                                   /* riferimento senza riga */
    if(j > 0){
      if(dp[k][j-1] < v){ v = dp[k][j-1]; m = 2; }                      /* riga senza riferimento */
      const w = dp[k-1][j-1] + Math.abs(cys[k-1] - ctr(bands[j-1]));    /* riferimento nella riga */
      if(w < v){ v = w; m = 3; }
    }
    dp[k][j] = v; mv[k][j] = m;
  }
  const at = new Array(M).fill(-1);
  for(let k=M, j=B; k>0; ){ const m = mv[k][j]; if(m === 3){ at[k-1] = j-1; k--; j--; } else if(m === 2) j--; else k--; }
  const first = at.findIndex(v => v >= 0); if(first < 0) return null;
  let lastI = first; at.forEach((v,i)=>{ if(v >= 0) lastI = i; });
  const out = at.map(v => v >= 0 ? bands[v] : null);
  const f = bands[at[first]], hf = f[1]-f[0];
