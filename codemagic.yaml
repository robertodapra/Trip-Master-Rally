workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: rallytrip
    environment:
      ios_signing:
        provisioning_profiles:
          - RallyTrip AppStore
        certificates:
          - rallytrip-dist
      vars:
        BUNDLE_ID: "com.dapra.rallytrip"
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
    scripts:
      - name: Installa dipendenze npm
        script: |
          npm install
      - name: Plugin RevenueCat (acquisti in-app)
        script: |
          npm install @revenuecat/purchases-capacitor --save
      - name: Sincronizza Capacitor iOS
        script: |
          npx cap sync ios
      - name: Prepara la firma
        script: |
          xcode-project use-profiles
      - name: Numero build
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Nome app "iRally"
        script: |
          cd "$CM_BUILD_DIR/ios/App/App"
          plutil -replace CFBundleDisplayName -string "iRally" Info.plist
      - name: Suoni notifica nel bundle iOS
        script: |
          cd "$CM_BUILD_DIR"
          for w in *.wav; do [ -f "$w" ] && cp "$w" "ios/App/App/$w"; done
          cd ios/App
          gem list xcodeproj -i >/dev/null 2>&1 || gem install xcodeproj --no-document
          ruby -e "require 'xcodeproj'; p=Xcodeproj::Project.open('App.xcodeproj'); t=p.targets.find{|x| x.name=='App'}; g=p.main_group.find_subpath('App',true); Dir.glob('App/*.wav').map{|f| File.basename(f)}.each{|s| r=g.files.find{|f| f.path==s}||g.new_file(s); t.add_resources([r]) unless t.resources_build_phase.files.any?{|b| b.file_ref==r}}; p.save; puts 'suoni notifica aggiunti al progetto'"
      - name: Compila IPA
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "App"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
