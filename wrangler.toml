name = "rally-scan"
main = "worker.js"
compatibility_date = "2026-09-07"

# Le variabili aggiunte a mano nel pannello Cloudflare NON vengono
# piu' cancellate dai deploy automatici (prima si', ad ogni push).
keep_vars = true

# La chiave GEMINI_KEY resta un "secret" nel pannello: non va scritta qui.

# Variabili versionate nel repo: sopravvivono a ogni deploy.
# Il modello del RADAR si cambia qui.
[vars]
MODEL = "gemini-3.1-flash-lite"
